<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Legion: Rise of the Rustbound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0b16;
    --bg2: #12132a;
    --panel: #181933;
    --panel-hi: #22244a;
    --border: #3d3f74;
    --text: #f2efe4;
    --dim: #9a9bc4;
    --fire: #ff6b4a;
    --water: #4ac8ff;
    --nature: #6ee7a0;
    --earth: #c99a5b;
    --volt: #ffe14d;
    --wind: #c9b8ff;
    --danger: #ff4a6b;
    --gold: #ffd166;
    --rust: #d97a3c;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 20px;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 14px 10px 40px;
  }
  .heading{ font-family:'Press Start 2P', monospace; }
  #app{ width: 100%; max-width: 640px; }
  .panel{
    background: var(--panel);
    border: 3px solid var(--border);
    box-shadow: 6px 6px 0 rgba(0,0,0,0.45);
    padding: 16px;
    margin-bottom: 14px;
  }
  h1.title{ font-size: 22px; line-height:1.6; color: var(--gold); text-shadow: 3px 3px 0 #000; margin: 6px 0 4px; }
  h2.section{ font-size: 14px; color: var(--wind); margin: 0 0 12px; letter-spacing: 1px; }
  p{ line-height:1.5; color: var(--text); }
  .dim{ color: var(--dim); }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{
    font-family:'VT323', monospace; font-size: 20px; background: var(--panel-hi); color: var(--text);
    border: 3px solid var(--border); padding: 10px 16px; cursor:pointer;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.45); transition: transform 0.05s;
  }
  .btn:hover{ background:#2a2c58; }
  .btn:active{ transform: translate(3px,3px); box-shadow: 1px 1px 0 rgba(0,0,0,0.45); }
  .btn.primary{ background: #3a2f6e; border-color: var(--gold); color: var(--gold); }
  .btn.danger{ border-color: var(--danger); color: var(--danger); }
  .btn.rust{ border-color: var(--rust); color: var(--rust); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn.small{ font-size:16px; padding:6px 10px; }
  .cost{ font-size:14px; opacity:0.75; }
  .trait-tag{ font-size:11px; color:var(--volt); border:1px solid var(--volt); padding:0 3px; margin-top:3px; line-height:1.3; }
  .tier3tag{ position:absolute; top:2px; right:2px; font-size:11px; color:var(--fire); }
  .elite-banner{ font-size:16px; color:var(--danger); border:1px dashed var(--danger); padding:8px; margin-bottom:10px; line-height:1.4; }
  .slotcard{ background:var(--bg2); border:2px solid var(--border); padding:10px; width:190px; }
  .slotname{ font-size:19px; color:var(--gold); }
  .tinput{
    font-family:'VT323', monospace; font-size:18px; width:100%; background:#000; color:var(--text);
    border:2px solid var(--border); padding:6px 8px; margin-top:4px;
  }
  .finale{ border-color: var(--gold); box-shadow: 0 0 18px 2px rgba(255,209,102,0.25), 6px 6px 0 rgba(0,0,0,0.45); }

  .mcard{
    background: var(--bg2); border: 2px solid var(--border); padding: 8px; width: 96px; text-align:center; cursor:pointer; position:relative;
  }
  .mcard.selected{ border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  .mcard .emoji{ font-size: 30px; line-height:1; }
  .mcard .name{ font-size:14px; margin-top:4px; height: 32px; overflow:hidden; }
  .mcard .lvl{ font-size:13px; color:var(--gold); }
  .mcard .tier2tag{ position:absolute; top:2px; right:2px; font-size:11px; color:var(--gold); }
  .elem-tag{ display:inline-block; font-size:11px; padding:1px 5px; margin-top:3px; border:1px solid; }
  .elem-fire{ color:var(--fire); border-color:var(--fire); }
  .elem-water{ color:var(--water); border-color:var(--water); }
  .elem-nature{ color:var(--nature); border-color:var(--nature); }
  .elem-earth{ color:var(--earth); border-color:var(--earth); }
  .elem-volt{ color:var(--volt); border-color:var(--volt); }
  .elem-wind{ color:var(--wind); border-color:var(--wind); }

  .formation{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .frow{ display:flex; gap:8px; align-items:center; }
  .frow .label{ width:56px; font-size:14px; color:var(--dim); align-self:center; }
  .slot{
    width: 78px; height: 78px; border: 2px dashed var(--border); background: var(--bg2);
    display:flex; align-items:center; justify-content:center; flex-direction:column; cursor:pointer; font-size:28px; text-align:center;
  }
  .slot.filled{ border-style:solid; }
  .slot .slvl{ font-size:12px; color:var(--gold); }
  .synergy-tag{ font-size:12px; color:var(--gold); margin-left:64px; margin-top:-4px; margin-bottom:2px; }

  .battlefield{ display:flex; flex-direction:column; gap:10px; }
  .side-label{ font-size:14px; color:var(--dim); text-align:center; margin:2px 0; }
  .rowsyn{ font-size:12px; color:var(--gold); text-align:center; min-height:14px; }
  .unit-row{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .unit{
    width: 86px; background: var(--bg2); border:2px solid var(--border); padding:6px 4px; text-align:center; position:relative;
  }
  .unit.fainted{ opacity:0.25; }
  .unit.active{ border-color: var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .unit.targetable{ border-color: var(--danger); cursor:pointer; }
  .unit.allytarget{ border-color: var(--water); cursor:pointer; }
  .unit .emoji{ font-size:26px; }
  .unit .uname{ font-size:12px; height:28px; overflow:hidden; }
  .hpbar-bg{ height:8px; background:#000; border:1px solid var(--border); margin-top:3px; }
  .hpbar-fill{ height:100%; background: var(--nature); }
  .hpbar-fill.low{ background: var(--danger); }
  .cd-tag{ font-size:10px; color:var(--dim); }
  .status-tag{ font-size:12px; margin-top:2px; min-height:14px; }
  .plate-tag{ position:absolute; top:1px; left:2px; font-size:11px; color:var(--water); }
  .rust-tag{ position:absolute; top:1px; right:2px; font-size:11px; color:var(--rust); }

  #log{
    background:#000; border:2px solid var(--border); height:110px; overflow-y:auto; padding:8px;
    font-size:16px; margin-bottom:12px; display:flex; flex-direction:column-reverse;
  }
  #log div{ margin-bottom:2px; }

  .actionbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .hidden{ display:none !important; }
  .storytext{ font-size:19px; color:var(--dim); border-left:3px solid var(--gold); padding-left:10px; margin:10px 0; }
  .terrain-banner{ font-size:15px; color:var(--wind); border:1px dashed var(--border); padding:6px 8px; margin-bottom:10px; }
  .intel-banner{ font-size:16px; color:var(--rust); border:1px dashed var(--rust); padding:8px; margin-bottom:10px; line-height:1.4; }
  .gauge-wrap{ margin-bottom:12px; }
  .gauge-label{ font-size:14px; color:var(--gold); margin-bottom:3px; }
  .gauge-bg{ height:14px; background:#000; border:2px solid var(--border); position:relative; }
  .gauge-tick{ position:absolute; top:0; bottom:0; width:2px; background:var(--border); }
  .gauge-fill{ height:100%; background: linear-gradient(90deg, #ff8c42, var(--gold)); transition: width 0.3s; }
  .gauge-fill.full{ box-shadow: 0 0 10px 2px var(--gold); }
  .footer-nav{ display:flex; justify-content:space-between; gap:10px; margin-top:4px; }

  .corr-bg{ height:6px; background:#000; border:1px solid var(--border); margin-top:4px; }
  .corr-fill{ height:100%; }
  .corr-label{ font-size:11px; margin-top:2px; }
  .pcard{
    background:var(--bg2); border:2px solid var(--rust); padding:8px; width:132px; cursor:pointer; font-size:15px; line-height:1.3;
  }
  .pcard.selected{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .pcard .pname{ color:var(--rust); font-size:16px; }
  .slotchip{
    display:inline-block; border:1px dashed var(--border); font-size:12px; padding:1px 4px; margin:2px 2px 0 0; color:var(--dim); cursor:pointer;
  }
  .slotchip.used{ border-style:solid; border-color:var(--rust); color:var(--rust); }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ DATA ============ */
const ELEM_BEATS = { fire:'nature', nature:'water', water:'fire', earth:'volt', volt:'wind', wind:'earth' };

const SPECIES = {
  emberling: { name:'Emberling', element:'fire', emoji:'🔥', base:{hp:32, atk:11, def:6, spd:9}, skill:'Cinder Burst' },
  aqualing:  { name:'Aqualing',  element:'water', emoji:'💧', base:{hp:34, atk:9,  def:8, spd:8}, skill:'Tide Slam' },
  mossling:  { name:'Mossling',  element:'nature', emoji:'🌿', base:{hp:36, atk:8,  def:9, spd:7}, skill:'Thorn Whip' },
  terrafang: { name:'Terrafang', element:'earth', emoji:'🪨', base:{hp:40, atk:10, def:10, spd:5}, skill:'Boulder Crush' },
  galekit:   { name:'Galekit',   element:'wind', emoji:'🌪️', base:{hp:28, atk:10, def:5, spd:12}, skill:'Cyclone Slash' },
  voltcub:   { name:'Voltcub',   element:'volt', emoji:'⚡', base:{hp:26, atk:12, def:5, spd:11}, skill:'Static Fang' },
};
const SPECIES_IDS = Object.keys(SPECIES);

const ENEMY_SPECIES = {
  scraphound: { name:'Scraphound', element:'earth', emoji:'🤖', base:{hp:34, atk:9, def:9, spd:6}, skill:'Scrap Slam' },
  sparkdrone: { name:'Sparkdrone', element:'volt', emoji:'🛸', base:{hp:26, atk:11, def:5, spd:11}, skill:'Overload' },
  cinderjaw:  { name:'Cinderjaw',  element:'fire', emoji:'👾', base:{hp:30, atk:11, def:6, spd:9}, skill:'Napalm Bite' },
  frostcoil:  { name:'Frostcoil',  element:'water', emoji:'🦾', base:{hp:32, atk:9, def:8, spd:8}, skill:'Cryo Lash' },
  thornbot:   { name:'Thornbot',   element:'nature', emoji:'🕷️', base:{hp:34, atk:8, def:9, spd:7}, skill:'Rust Vines' },
  galekite:   { name:'Galekite',   element:'wind', emoji:'🛩️', base:{hp:24, atk:10, def:5, spd:13}, skill:'Shear Gust' },
};
const ENEMY_IDS = Object.keys(ENEMY_SPECIES);

/* ---- Salvageable Rustbound parts (one per enemy chassis) ---- */
const PARTS = {
  scraphound: { name:'Scrap Plating', emoji:'🛡️', element:'earth',  stat:'def', pct:0.30, corruption:20, desc:'Welded slabs of enemy hull.' },
  sparkdrone: { name:'Static Coil',   emoji:'🔌', element:'volt',   stat:'spd', pct:0.28, corruption:24, desc:'Hums with stolen current.' },
  cinderjaw:  { name:'Napalm Jets',   emoji:'🔥', element:'fire',   stat:'atk', pct:0.30, corruption:28, desc:'Leaks accelerant. Constantly.' },
  frostcoil:  { name:'Cryo Cell',     emoji:'❄️', element:'water',  stat:'def', pct:0.26, corruption:20, desc:'Frost-rimed coolant core.' },
  thornbot:   { name:'Rustvine Spool',emoji:'🌱', element:'nature', stat:'hp',  pct:0.32, corruption:18, desc:'Self-repairing metal creeper.' },
  galekite:   { name:'Shear Rotor',   emoji:'🌀', element:'wind',   stat:'spd', pct:0.32, corruption:22, desc:'Screams above 4000 RPM.' },
};
const STAT_LABEL = { hp:'HP', atk:'ATK', def:'DEF', spd:'SPD' };

/* ---- Cross-species fusion: every element pair has a named hybrid ---- */
const HYBRIDS = {
  'fire+water':   { name:'Steamling',    emoji:'♨️', skill:'Scald Burst' },
  'fire+nature':  { name:'Cinderbloom',  emoji:'🍂', skill:'Wildfire Bloom' },
  'earth+fire':   { name:'Magmaw',       emoji:'🌋', skill:'Magma Maul' },
  'fire+volt':    { name:'Arcflare',     emoji:'☄️', skill:'Arc Detonation' },
  'fire+wind':    { name:'Firestorm',    emoji:'🎆', skill:'Firestorm Rush' },
  'nature+water': { name:'Bogling',      emoji:'🐸', skill:'Mire Drag' },
  'earth+water':  { name:'Siltback',     emoji:'🐢', skill:'Silt Crush' },
  'volt+water':   { name:'Voltide',      emoji:'🌊', skill:'Chain Surge' },
  'water+wind':   { name:'Mistral',      emoji:'🌫️', skill:'Mist Lash' },
  'earth+nature': { name:'Grovewarden',  emoji:'🌳', skill:'Root Bind' },
  'nature+volt':  { name:'Sporesurge',   emoji:'🍄', skill:'Spore Discharge' },
  'nature+wind':  { name:'Pollenwing',   emoji:'🦋', skill:'Pollen Cyclone' },
  'earth+volt':   { name:'Magnetite',    emoji:'🧲', skill:'Magnetic Slam' },
  'earth+wind':   { name:'Sandwyrm',     emoji:'🦂', skill:'Sand Shear' },
  'volt+wind':    { name:'Stormkite',    emoji:'🪁', skill:'Thunder Dive' },
};
/* Innate traits a hybrid inherits from each of its two elements. */
const ELEM_TRAIT = {
  fire:   { burnImmune:true },
  water:  { slowImmune:true },
  volt:   { stunImmune:true },
  nature: { regen:0.03 },
  earth:  { bulwark:true },
  wind:   { dodge:0.10 },
};
function hybridKey(a,b){ return [a,b].sort().join('+'); }
function hybridIdFor(a,b){ return 'hyb_' + [a,b].sort().join('_'); }

const HYBRID_SPECIES = {};
Object.keys(HYBRIDS).forEach(key=>{
  const els = key.split('+');
  const parents = els.map(e=>SPECIES_IDS.find(id=>SPECIES[id].element===e)).map(id=>SPECIES[id]);
  const blend = k => Math.round((parents[0].base[k] + parents[1].base[k]) / 2 * 1.25);
  HYBRID_SPECIES[hybridIdFor(els[0],els[1])] = {
    name: HYBRIDS[key].name, emoji: HYBRIDS[key].emoji, skill: HYBRIDS[key].skill,
    element: els[0], elements: els.slice(), hybrid: true,
    base: { hp:blend('hp'), atk:blend('atk'), def:blend('def'), spd:blend('spd') },
  };
});
function isHybridId(id){ return !!HYBRID_SPECIES[id]; }

const STAGE_STORY = [
  "The border watchtowers go dark. Rustbound scouts probe the eastern fields.",
  "A scavenger unit strips a grove bare. The tribes look to you for a line of defense.",
  "Sparkdrones jam the old signal fires. Word must travel by messenger now.",
  "The Rustbound dig in at the Ashen Crossing, cutting the tribes' only trade route.",
  "A Cinderjaw pack torches the lowland farms. Refugees stream toward the capital.",
  "Deep radar picks up something large moving under the Thornwood.",
  "The tribes' elders call for a counter-offensive. Morale is fragile.",
  "Rustbound war-drones mass at the river fork, three columns strong.",
  "The enemy brings forward a command unit, shielded by its strongest guard.",
  "This is the gate to the Rustbound's forward base. Break it, and Texel breathes again.",
];

/* ---- Past stage 10 the campaign gives way to the Deep Run ---- */
const CAMPAIGN_LENGTH = 10;
const DEEP_STORY = [
  "Past the broken gate the ground turns to slag. The Rustbound built something down here.",
  "Assembly lines stretch into the dark, still running, still printing new war-frames.",
  "The tribes' scouts refuse to go further. Your legion goes anyway.",
  "Signal towers thicken overhead. Every step deeper is a step further from rescue.",
  "Something vast turns over in the foundry below, and the walls hum with it.",
  "The Rustbound stop scavenging and start manufacturing. The waves come faster now.",
  "Old tribe-bones lie welded into the machinery. You are not the first legion down here.",
  "The air tastes of iron filings. Your beasts' grafts twitch toward the sound.",
];
function isDeep(stage){ return stage > CAMPAIGN_LENGTH; }
function deepDepth(stage){ return stage - CAMPAIGN_LENGTH; }
function isEliteStage(stage){ return isDeep(stage) && deepDepth(stage) % 5 === 0; }
function storyForStage(stage){
  if(!isDeep(stage)) return STAGE_STORY[Math.min(stage-1, STAGE_STORY.length-1)];
  return DEEP_STORY[(deepDepth(stage)-1) % DEEP_STORY.length];
}

/* ---- Formation synergy table ---- */
const SYNERGY_TABLE = {
  fire:   { statKey:'atk', 2:0.05, 3:0.12, flavor3:{type:'burnOnHit', val:0.15} },
  water:  { statKey:'def', 2:0.05, 3:0.12, flavor3:{type:'firstHitReduction'} },
  nature: { statKey:'hp',  2:0.05, 3:0.12, flavor3:{type:'regen', val:0.03} },
  earth:  { statKey:'def', 2:0.05, 3:0.12, flavor3:{type:'slowImmune'} },
  volt:   { statKey:'spd', 2:0.05, 3:0.12, flavor3:{type:'stunOnHit', val:0.15} },
  wind:   { statKey:'spd', 2:0.05, 3:0.12, flavor3:{type:'dodge', val:0.10} },
};

/* ---- Terrain table ---- */
const TERRAINS = {
  clear:     { name:'Clear Skies', desc:'No modifiers — a straight fight.', mods:{} },
  sandstorm: { name:'Sandstorm', desc:'Wind +15% SPD. Fire units risk missing (15%).', mods:{ buffElem:'wind', buffStat:'spd', buffPct:0.15, missElem:'fire', missChance:0.15 } },
  flood:     { name:'Flooded Fields', desc:'Water +15% ATK. Volt skills may short-circuit onto an ally.', mods:{ buffElem:'water', buffStat:'atk', buffPct:0.15, backfireElem:'volt', backfireChance:0.3 } },
  ashen:     { name:'Ashen Wasteland', desc:'Fire is immune to Burn. Nature -15% DEF.', mods:{ immuneElem:'fire', immuneStatus:'burn', debuffElem:'nature', debuffStat:'def', debuffPct:0.15 } },
  ironbound: { name:'Ironbound Ridge', desc:'Earth +15% DEF. All skill cooldowns +1 turn.', mods:{ buffElem:'earth', buffStat:'def', buffPct:0.15, cdPenalty:1 } },
};
function terrainForStage(stage){
  const cycle = ['clear','clear','sandstorm','flood','clear','ashen','ironbound','clear','sandstorm','flood'];
  return TERRAINS[cycle[(stage-1) % cycle.length]];
}

/* ---- Innate traits: every monster you catch rolls one ---- */
const TRAITS = {
  keen:      { name:'Keen',       emoji:'🎯', desc:'+8% critical chance' },
  savage:    { name:'Savage',     emoji:'⚔',  desc:'+8% ATK' },
  stalwart:  { name:'Stalwart',   emoji:'🪨', desc:'+10% DEF' },
  hardy:     { name:'Hardy',      emoji:'❤',  desc:'+10% max HP' },
  swift:     { name:'Swift',      emoji:'💨', desc:'+10% SPD' },
  quickstart:{ name:'Quickstart', emoji:'⏩', desc:'skills come off cooldown a turn sooner' },
  resilient: { name:'Resilient',  emoji:'✨', desc:'afflictions wear off 25% faster' },
  scavenger: { name:'Scavenger',  emoji:'⚙',  desc:'carries 10 rust before it bites' },
  bane:      { name:'Bane',       emoji:'☠',  desc:'+15% damage against one element' },
};
const TRAIT_IDS = Object.keys(TRAITS);
function rollTrait(){
  const key = TRAIT_IDS[Math.floor(Math.random()*TRAIT_IDS.length)];
  const t = { key };
  if(key==='bane'){
    const els = Object.keys(ELEM_BEATS);
    t.elem = els[Math.floor(Math.random()*els.length)];
  }
  return t;
}
function traitName(t){
  if(!t) return null;
  const d = TRAITS[t.key];
  return t.key==='bane' ? (t.elem.charAt(0).toUpperCase()+t.elem.slice(1)+'bane') : d.name;
}
function traitDesc(t){
  if(!t) return '';
  return t.key==='bane' ? `+15% damage against ${t.elem}` : TRAITS[t.key].desc;
}
function traitTag(t){
  if(!t) return '';
  return `<div class="trait-tag" title="${traitDesc(t)}">${TRAITS[t.key].emoji} ${traitName(t)}</div>`;
}

/* ---- Legion Gauge spend tiers ---- */
const GAUGE_COST = { purge:33, rally:66, overdrive:100, alpha:100 };

/* ---- Corruption tiers ---- */
function corrTier(c){
  if(c>=75) return { name:'CRITICAL', glitch:0.28, defect:0.45, color:'var(--danger)' };
  if(c>=50) return { name:'VOLATILE', glitch:0.18, defect:0.25, color:'#ff8c42' };
  if(c>=25) return { name:'UNSTABLE', glitch:0.10, defect:0.00, color:'var(--volt)' };
  return { name:'STABLE', glitch:0, defect:0, color:'var(--nature)' };
}

/* ================================================================
   CLOUD ACCOUNTS  —  fill these two in to switch cloud saves on.
   Leave them blank and the game runs exactly as before: local
   legions + transfer codes, no network calls, no dependencies.
   See SETUP-BACKEND.md for the 5-minute Supabase walkthrough.
   The anon key is a PUBLISHABLE key and is meant to ship in client
   code — your data is protected by the row-level-security policy in
   the setup guide, NOT by hiding this string. Do not paste the
   service_role key here; that one bypasses all security.
   ================================================================ */
const CLOUD = {
  url:     '',   // e.g. 'https://abcdefghijk.supabase.co'
  anonKey: '',   // e.g. 'eyJhbGciOiJIUzI1NiIsInR5cCI6...'
};
const SESSION_KEY = 'gridlegion.v1.session';
const CLOUD_TABLE = 'legions';

function cloudConfigured(){ return !!(CLOUD.url && CLOUD.anonKey); }
function signedIn(){ return !!(cloud.session && cloud.session.access_token); }

const cloud = {
  session: null,      // { access_token, refresh_token, expires_at, user:{id,email} }
  status: 'off',      // off | signed-out | ready | syncing | offline | error
  message: '',
  busy: false,
  pushTimer: null,
  pendingPush: false,
};

function saveSession(sess){
  cloud.session = sess;
  if(!hasStorage()) return;
  try{
    if(sess) window.localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
    else window.localStorage.removeItem(SESSION_KEY);
  }catch(e){ /* a browser that refuses storage just means signing in again next visit */ }
}
function loadStoredSession(){
  if(!hasStorage()) return null;
  try{
    const raw = window.localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return (d && d.access_token && d.refresh_token) ? d : null;
  }catch(e){ return null; }
}

/* --- minimal Supabase REST client (no SDK: these are plain HTTPS endpoints) --- */
function cloudFetch(path, opts, auth){
  opts = opts || {};
  const headers = Object.assign({
    'apikey': CLOUD.anonKey,
    'Content-Type': 'application/json',
  }, opts.headers || {});
  if(auth && cloud.session) headers['Authorization'] = 'Bearer ' + cloud.session.access_token;
  return fetch(CLOUD.url + path, Object.assign({}, opts, { headers }))
    .then(res => res.text().then(text => {
      let body = null;
      if(text){ try{ body = JSON.parse(text); }catch(e){ body = text; } }
      return { ok: res.ok, status: res.status, body };
    }));
}
function authErrorText(r){
  const b = r.body;
  if(b && typeof b==='object'){
    if(b.error_description) return b.error_description;
    if(b.msg) return b.msg;
    if(b.message) return b.message;
    if(b.error) return String(b.error);
  }
  if(r.status===0) return 'Could not reach the server.';
  return 'Request failed (' + r.status + ').';
}
function adoptSession(body){
  if(!body || !body.access_token) return null;
  const sess = {
    access_token: body.access_token,
    refresh_token: body.refresh_token,
    expires_at: Date.now() + ((body.expires_in || 3600) * 1000),
    user: { id: body.user ? body.user.id : (body.id||null), email: body.user ? body.user.email : null },
  };
  saveSession(sess);
  return sess;
}

function cloudSignUp(email, password){
  return cloudFetch('/auth/v1/signup', { method:'POST', body: JSON.stringify({ email, password }) })
    .then(r => {
      if(!r.ok) return { ok:false, error: authErrorText(r) };
      const sess = adoptSession(r.body);
      if(!sess) return { ok:true, needsConfirm:true };   // project has email confirmation on
      return { ok:true, session: sess };
    })
    .catch(() => ({ ok:false, error:'Could not reach the server — check your connection.' }));
}
function cloudSignIn(email, password){
  return cloudFetch('/auth/v1/token?grant_type=password', { method:'POST', body: JSON.stringify({ email, password }) })
    .then(r => {
      if(!r.ok) return { ok:false, error: authErrorText(r) };
      const sess = adoptSession(r.body);
      return sess ? { ok:true, session: sess } : { ok:false, error:'The server returned no session.' };
    })
    .catch(() => ({ ok:false, error:'Could not reach the server — check your connection.' }));
}
function cloudRefresh(){
  if(!cloud.session || !cloud.session.refresh_token) return Promise.resolve(false);
  return cloudFetch('/auth/v1/token?grant_type=refresh_token',
      { method:'POST', body: JSON.stringify({ refresh_token: cloud.session.refresh_token }) })
    .then(r => {
      if(!r.ok){ saveSession(null); return false; }
      return !!adoptSession(r.body);
    })
    .catch(() => false);
}
function cloudSignOut(){
  const done = () => { saveSession(null); cloud.status='signed-out'; cloud.message=''; };
  if(!signedIn()){ done(); return Promise.resolve(); }
  return cloudFetch('/auth/v1/logout', { method:'POST' }, true).then(done).catch(done);
}

/* Any authed call: refresh once on 401 rather than dumping the player at the login screen. */
function authed(path, opts){
  const attempt = () => cloudFetch(path, opts, true);
  const expired = cloud.session && cloud.session.expires_at && Date.now() > cloud.session.expires_at - 30000;
  const pre = expired ? cloudRefresh() : Promise.resolve(true);
  return pre.then(() => attempt()).then(r => {
    if(r.status !== 401) return r;
    return cloudRefresh().then(okRefresh => okRefresh ? attempt() : r);
  });
}

function cloudPullSlots(){
  if(!signedIn()) return Promise.resolve(null);
  return authed('/rest/v1/' + CLOUD_TABLE + '?select=slot,data,updated_at', { method:'GET' })
    .then(r => (r.ok && Array.isArray(r.body)) ? r.body : null)
    .catch(() => null);
}
function cloudPutSlot(slot, data){
  if(!signedIn()) return Promise.resolve(false);
  const row = { user_id: cloud.session.user.id, slot: slot, data: data, updated_at: new Date().toISOString() };
  return authed('/rest/v1/' + CLOUD_TABLE + '?on_conflict=user_id,slot', {
      method:'POST',
      headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(row),
    })
    .then(r => r.ok)
    .catch(() => false);
}
function cloudDeleteSlot(slot){
  if(!signedIn()) return Promise.resolve(false);
  return authed('/rest/v1/' + CLOUD_TABLE + '?slot=eq.' + slot, { method:'DELETE' })
    .then(r => r.ok).catch(() => false);
}

/* ============ PERSISTENCE ============ */
const SAVE_VERSION = 1;
const SAVE_PREFIX = 'gridlegion.v1.slot';
const SLOT_COUNT = 3;

/* localStorage is unavailable in some embedded previews and private windows —
   every access is guarded and the game stays fully playable without it. */
let _storageOK = null;
function hasStorage(){
  if(_storageOK!==null) return _storageOK;
  try{
    const k = '__gl_probe';
    window.localStorage.setItem(k,'1');
    window.localStorage.removeItem(k);
    _storageOK = true;
  }catch(e){ _storageOK = false; }
  return _storageOK;
}

function serializeSave(){
  return {
    v: SAVE_VERSION,
    name: state.profileName || 'Legion',
    savedAt: Date.now(),
    stage: state.stage,
    bestDepth: state.bestDepth || 0,
    roster: state.roster,
    parts: state.parts,
    intel: state.intel,
    formation: state.formation,
    discovered: state.discovered,
  };
}
function validateSave(d){
  if(!d || typeof d!=='object') return false;
  if(typeof d.stage!=='number' || !isFinite(d.stage) || d.stage<1) return false;
  if(!Array.isArray(d.roster)) return false;
  if(!d.formation || !Array.isArray(d.formation.front) || !Array.isArray(d.formation.back)) return false;
  return true;
}
/* Rebuilds a monster from saved data, discarding anything this build no longer knows about. */
function reviveMonster(m){
  if(!m || typeof m!=='object') return null;
  if(!SPECIES[m.speciesId] && !HYBRID_SPECIES[m.speciesId]) return null;
  const tier = (m.tier===2||m.tier===3) ? m.tier : 1;
  return {
    uid: typeof m.uid==='string' ? m.uid : uid(),
    speciesId: m.speciesId,
    level: (typeof m.level==='number' && m.level>=1) ? Math.floor(m.level) : 1,
    exp: (typeof m.exp==='number' && m.exp>=0) ? m.exp : 0,
    tier,
    parts: Array.isArray(m.parts) ? m.parts.filter(k=>PARTS[k]).slice(0, tier>=3?4:(tier>=2?3:2)) : [],
    trait: (m.trait && TRAITS[m.trait.key]) ? m.trait : rollTrait(),
  };
}
function applySave(d, slot){
  const roster = d.roster.map(reviveMonster).filter(Boolean);
  const live = roster.map(m=>m.uid);
  const fixRow = r => [0,1,2].map(i => (typeof r[i]==='string' && live.indexOf(r[i])>=0) ? r[i] : null);
  state.slot = (typeof slot==='number') ? slot : null;
  state.profileName = (typeof d.name==='string' && d.name.trim()) ? d.name.trim().slice(0,18) : 'Legion';
  state.stage = Math.max(1, Math.floor(d.stage));
  state.bestDepth = (typeof d.bestDepth==='number' && d.bestDepth>=0) ? Math.floor(d.bestDepth) : 0;
  state.roster = roster;
  state.parts = Array.isArray(d.parts) ? d.parts.filter(p=>p && PARTS[p.key]).map(p=>({uid:p.uid||uid(), key:p.key})) : [];
  state.intel = (d.intel && Array.isArray(d.intel.history))
    ? { history: d.intel.history.filter(e=>ELEM_BEATS[e]).slice(-5), wins: (typeof d.intel.wins==='number'?d.intel.wins:0) }
    : { history: [], wins: 0 };
  state.formation = { front: fixRow(d.formation.front), back: fixRow(d.formation.back) };
  state.discovered = {};
  if(d.discovered && typeof d.discovered==='object'){
    Object.keys(d.discovered).forEach(k=>{ if(HYBRID_SPECIES[k]) state.discovered[k]=true; });
  }
  state.battle = null; state.lastResult = null; state.lastFusion = null;
  state.formSelected = null; state.selectedPart = null;
  fuseSelection = [];
  return true;
}

function readSlot(slot){
  if(!hasStorage()) return null;
  try{
    const raw = window.localStorage.getItem(SAVE_PREFIX+slot);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return validateSave(d) ? d : null;
  }catch(e){ return null; }
}
function writeSlot(slot, data){
  if(!hasStorage()) return false;
  try{ window.localStorage.setItem(SAVE_PREFIX+slot, JSON.stringify(data)); return true; }
  catch(e){ return false; }
}
function deleteSlot(slot){
  if(!hasStorage()) return false;
  try{ window.localStorage.removeItem(SAVE_PREFIX+slot); return true; }catch(e){ return false; }
}
/* Called after anything worth not losing. Silent no-op when there is nowhere to write. */
function autosaveLater(){ autosave(); }
function autosave(){
  if(state.slot===null || state.slot===undefined) return false;
  const okWrite = writeSlot(state.slot, serializeSave());
  state.saveState = okWrite ? 'saved' : 'unsaved';
  cloudPushSoon();
  return okWrite;
}

/* --- cloud sync: local write is instant and authoritative; the push is best-effort --- */
function cloudPushSoon(){
  if(!signedIn() || state.slot===null) return;
  cloud.pendingPush = true;
  if(cloud.pushTimer) return;
  cloud.pushTimer = setTimeout(()=>{
    cloud.pushTimer = null;
    if(!cloud.pendingPush) return;
    cloud.pendingPush = false;
    const slot = state.slot, payload = serializeSave();
    cloud.status = 'syncing';
    cloudPutSlot(slot, payload).then(okPush=>{
      cloud.status = okPush ? 'ready' : 'offline';
      cloud.message = okPush ? '' : 'Saved on this device — cloud unreachable, will retry.';
      if(!okPush) cloud.pendingPush = true;
      if(state.screen==='hub' || state.screen==='profiles' || state.screen==='account') render();
    });
  }, 1500);
}
/* Pull cloud slots and merge with local ones. Newest savedAt wins; nothing is silently discarded. */
function cloudSyncDown(){
  if(!signedIn()) return Promise.resolve({ pulled:0, restored:0, kept:0 });
  cloud.status = 'syncing';
  return cloudPullSlots().then(rows=>{
    if(rows===null){
      cloud.status='offline';
      cloud.message='Could not reach the cloud — playing from this device.';
      return { pulled:0, restored:0, kept:0, offline:true };
    }
    let restored=0, kept=0;
    rows.forEach(row=>{
      const slot = row.slot;
      if(typeof slot!=='number' || slot<0 || slot>=SLOT_COUNT) return;
      const remote = row.data;
      if(!validateSave(remote)) return;
      const local = readSlot(slot);
      if(!local || (remote.savedAt||0) > (local.savedAt||0)){ writeSlot(slot, remote); restored++; }
      else kept++;
    });
    cloud.status='ready';
    cloud.message = restored ? `${restored} legion${restored===1?'':'s'} restored from your account.`
                  : (rows.length ? 'Your device already had the newest saves.' : 'No cloud legions yet — this device\'s saves will upload as you play.');
    return { pulled: rows.length, restored, kept };
  });
}
/* Push every local slot up — used right after signing in on a device that has been playing offline. */
function cloudSyncUp(){
  if(!signedIn()) return Promise.resolve(0);
  const jobs = [];
  for(let i=0;i<SLOT_COUNT;i++){
    const d = readSlot(i);
    if(d) jobs.push(cloudPutSlot(i, d));
  }
  return Promise.all(jobs).then(rs=>rs.filter(Boolean).length);
}
function cloudInit(){
  if(!cloudConfigured()){ cloud.status='off'; return Promise.resolve(); }
  const stored = loadStoredSession();
  if(!stored){ cloud.status='signed-out'; return Promise.resolve(); }
  cloud.session = stored;
  cloud.status = 'syncing';
  const fresh = (stored.expires_at && Date.now() < stored.expires_at - 30000)
    ? Promise.resolve(true) : cloudRefresh();
  return fresh.then(okSession=>{
    if(!okSession){ saveSession(null); cloud.status='signed-out'; return; }
    return cloudSyncDown().then(()=>{ if(state.screen==='profiles'||state.screen==='title') render(); });
  });
}
function cloudStatusText(){
  if(!cloudConfigured()) return '';
  if(!signedIn()) return 'Not signed in — legions stay on this device.';
  const who = cloud.session.user.email || 'your account';
  if(cloud.status==='syncing') return `${escapeHtml(who)} · syncing…`;
  if(cloud.status==='offline') return `${escapeHtml(who)} · offline, will retry`;
  return `${escapeHtml(who)} · synced`;
}

/* Transfer codes: a save as text, so a legion can move between browsers without a server. */
function exportCode(){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(serializeSave())))); }
  catch(e){ return null; }
}
function decodeCode(str){
  try{
    const d = JSON.parse(decodeURIComponent(escape(atob(String(str).replace(/\s+/g,'')))));
    return validateSave(d) ? d : null;
  }catch(e){ return null; }
}

/* ============ STATE ============ */
function uid(){ return 'm' + Math.random().toString(36).slice(2,10); }

let state = {
  screen: 'title',
  stage: 1,
  roster: [],
  parts: [],
  intel: { history: [], wins: 0 },
  formation: { front:[null,null,null], back:[null,null,null] },
  formSelected: null,
  selectedPart: null,
  discovered: {},
  lastFusion: null,
  confirmWipe: null,
  slot: null,
  profileName: 'Legion',
  bestDepth: 0,
  saveState: 'none',
  transfer: null,
  battle: null,
  lastResult: null,
};

function newMonster(speciesId, level=1, tier=1, trait){
  return { uid: uid(), speciesId, level, exp:0, tier, parts:[], trait: trait || rollTrait() };
}

function initGame(){
  const starters = ['emberling','aqualing','terrafang'].map(id=>newMonster(id,1,1));
  state.roster = starters;
  state.parts = [];
  state.intel = { history: [], wins: 0 };
  state.formation.front = starters.map(m=>m.uid);
  state.formation.back = [null,null,null];
  state.selectedPart = null;
  state.discovered = {};
  state.lastFusion = null;
  state.bestDepth = 0;
  state.confirmWipe = null;
  state.transfer = null;
  state.stage = 1;
}

function getSpeciesData(speciesId, tier){
  const base = SPECIES[speciesId] || HYBRID_SPECIES[speciesId];
  if(tier>=3){
    return {
      name: 'Ascended ' + base.name, element: base.element,
      elements: base.elements ? base.elements.slice() : null,
      hybrid: !!base.hybrid, emoji: base.emoji + '👑',
      base: { hp: Math.round(base.base.hp*2.3), atk: Math.round(base.base.atk*2.3), def: Math.round(base.base.def*2.3), spd: Math.round(base.base.spd*1.3) },
      skill: base.skill + '++',
    };
  }
  if(tier>=2){
    return {
      name: 'Prime ' + base.name, element: base.element,
      elements: base.elements ? base.elements.slice() : null,
      hybrid: !!base.hybrid, emoji: base.emoji + '✨',
      base: { hp: Math.round(base.base.hp*1.6), atk: Math.round(base.base.atk*1.6), def: Math.round(base.base.def*1.6), spd: Math.round(base.base.spd*1.15) },
      skill: base.skill + '+',
    };
  }
  return base;
}

function partSlots(m){ return m.tier>=3 ? 4 : (m.tier>=2 ? 3 : 2); }
function monsterCorruption(m){
  const ps = (m.parts||[]).map(k=>PARTS[k]).filter(Boolean);
  if(ps.length===0) return 0;
  let c = ps.reduce((s,p)=>s+p.corruption,0) + (ps.length-1)*8;
  if(m.trait && m.trait.key==='scavenger') c = Math.max(0, c-10);
  return c;
}

function computeStats(monster){
  const sd = getSpeciesData(monster.speciesId, monster.tier);
  const mult = 1 + (monster.level-1)*0.12;
  let hp = Math.round(sd.base.hp*mult), atk = Math.round(sd.base.atk*mult),
      def = Math.round(sd.base.def*mult), spd = Math.round(sd.base.spd*mult);
  const innate = sd.elements ? sd.elements.slice() : [sd.element];
  const elements = innate.slice();
  (monster.parts||[]).forEach(k=>{
    const p = PARTS[k]; if(!p) return;
    if(p.stat==='hp')  hp  = Math.round(hp *(1+p.pct));
    if(p.stat==='atk') atk = Math.round(atk*(1+p.pct));
    if(p.stat==='def') def = Math.round(def*(1+p.pct));
    if(p.stat==='spd') spd = Math.round(spd*(1+p.pct));
    if(!elements.includes(p.element)) elements.push(p.element);
  });
  const tr = monster.trait;
  if(tr){
    if(tr.key==='savage')   atk = Math.round(atk*1.08);
    if(tr.key==='stalwart') def = Math.round(def*1.10);
    if(tr.key==='hardy')    hp  = Math.round(hp *1.10);
    if(tr.key==='swift')    spd = Math.round(spd*1.10);
  }
  const corruption = monsterCorruption(monster);
  return {
    name: sd.name, emoji: sd.emoji + ((monster.parts||[]).length?'⚙':''),
    element: sd.element, elements, innate, hybrid: !!sd.hybrid, skill: sd.skill,
    trait: tr || null, tier: monster.tier,
    hp, atk, def, spd, corruption,
  };
}

function findMonster(uidStr){ return state.roster.find(m=>m.uid===uidStr); }

function elementMultiplier(atkElem, defElem){
  if(ELEM_BEATS[atkElem]===defElem) return 1.4;
  if(ELEM_BEATS[defElem]===atkElem) return 0.75;
  return 1.0;
}
/* Defence: bolted-on plating protects, so a dual-element unit takes the most favourable multiplier.
   Offence: only INNATE elements (species/fusion, never parts) can be struck with — a hybrid
   picks whichever of its two natures the target is weakest to. Returns {mult, elem}. */
function multiplierVs(attacker, defender){
  const dl = (defender.elements && defender.elements.length) ? defender.elements : [defender.element];
  const al = (attacker.attackElements && attacker.attackElements.length) ? attacker.attackElements : [attacker.element];
  let best = -Infinity, bestElem = al[0];
  al.forEach(ae=>{
    const m = Math.min.apply(null, dl.map(de=>elementMultiplier(ae, de)));
    if(m > best){ best = m; bestElem = ae; }
  });
  return { mult: best, elem: bestElem };
}

/* elementLists = array of (array of elements) or null.
   A dual-element unit counts toward EVERY element it carries, and a row grants
   every synergy that reaches its threshold — so one hybrid can complete two lines. */
function computeRowSynergies(elementLists){
  const counts = {};
  elementLists.forEach(list=>{
    if(!list) return;
    const seen = [];
    list.forEach(e=>{ if(e && !seen.includes(e)){ seen.push(e); counts[e]=(counts[e]||0)+1; } });
  });
  return Object.keys(counts)
    .filter(e=>counts[e]>=2)
    .map(e=>({ element:e, count: Math.min(counts[e],3) }))
    .sort((a,b)=> b.count-a.count || a.element.localeCompare(b.element));
}
/* single-best helper, kept for anything that wants just the headline */
function computeRowSynergy(elementLists){
  const all = computeRowSynergies(elementLists);
  return all.length ? all[0] : null;
}
function synergyInfo(syn){
  if(!syn) return null;
  const t = SYNERGY_TABLE[syn.element];
  return { element:syn.element, count:syn.count, statKey:t.statKey, bonus:t[syn.count], flavor: syn.count>=3 ? t.flavor3 : null };
}
function synergyLabelText(info){
  if(!info) return null;
  return `${info.element.toUpperCase()} ${info.count===3?'TRIO':'DUO'} +${Math.round(info.bonus*100)}% ${STAT_LABEL[info.statKey]}`;
}
function formationRowSynergyLabel(row){
  const lists = state.formation[row].map(u=> u ? computeStats(findMonster(u)).elements : null);
  const infos = computeRowSynergies(lists).map(synergyInfo);
  return infos.length ? infos.map(synergyLabelText).join(' · ') : null;
}

/* ============ PROFILES ============ */
function renderProfiles(){
  const slots = [];
  for(let i=0;i<SLOT_COUNT;i++){
    const d = readSlot(i);
    if(d){
      const depth = isDeep(d.stage) ? `Depth ${deepDepth(d.stage)}` : `Stage ${d.stage}`;
      const when = new Date(d.savedAt||Date.now());
      slots.push(`
      <div class="slotcard">
        <div class="slotname">${escapeHtml(d.name||'Legion')}</div>
        <div class="dim">${depth} · ${d.roster.length} monster${d.roster.length===1?'':'s'}${d.bestDepth?` · deepest ${d.bestDepth}`:''}</div>
        <div class="dim" style="font-size:14px;">saved ${when.toLocaleDateString()} ${when.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
        <div class="row" style="margin-top:8px;">
          <button class="btn small primary" onclick="continueSlot(${i})">▶ Continue</button>
          <button class="btn small danger" onclick="wipeSlot(${i})">${state.confirmWipe===i?'Really delete?':'Delete'}</button>
        </div>
      </div>`);
    } else {
      slots.push(`
      <div class="slotcard">
        <div class="slotname dim">Empty slot ${i+1}</div>
        <div class="dim" style="font-size:15px;">No legion recorded here.</div>
        <div class="row" style="margin-top:8px;">
          <button class="btn small primary" onclick="newSlot(${i})">+ New Legion</button>
        </div>
      </div>`);
    }
  }
  const warn = hasStorage() ? '' : `<div class="elite-banner">⚠ This browser is not letting the game store anything — private windows and some embedded previews block it. You can still play, and you can still carry a legion out with a <b>transfer code</b> below. Open the file directly in your browser to get automatic saving.</div>`;

function readInput(id){ const el=document.getElementById(id); return el ? el.value : ''; }

function newSlot(i){

function wipeSlot(i){

function importIntoSlot(){
  const d = decodeCode(readInput('impcode'));
  if(!d){ state.transfer = { ok:false, msg:'That code could not be read — check it copied in full.' }; render(); return; }
  let target = null;
  for(let i=0;i<SLOT_COUNT;i++){ if(!readSlot(i)){ target=i; break; } }
  applySave(d, target);
  if(target!==null) autosave();
  state.transfer = { ok:true, msg:'Legion restored.' };
  state.saveState = target!==null ? 'saved' : 'unsaved';
  state.screen = 'hub';
  render();
}

/* ============ RUSTBOUND ADAPTATION ============ */
function currentAdaptation(){
  const h = state.intel.history.slice(-3);
  if(h.length===0) return null;
  const counts = {};
  h.forEach(e=>counts[e]=(counts[e]||0)+1);
  let best=null, bc=0;
  Object.entries(counts).forEach(([e,c])=>{ if(c>bc){ bc=c; best=e; } });
  return best;
}
function platingActive(){ return state.stage>=3 && !!currentAdaptation(); }
function platingPct(){ return Math.min(0.35, 0.15 + 0.03*state.intel.wins); }

function deployedElementCounts(){
  const counts = {};
  ['front','back'].forEach(row=>{
    state.formation[row].forEach(u=>{
      if(!u) return;
      const m = findMonster(u); if(!m) return;
      computeStats(m).elements.forEach(e=> counts[e]=(counts[e]||0)+1 );
    });
  });
  return counts;
}
function deployedDominantElement(){
  const counts = deployedElementCounts();
  let best=null, bc=0;
  Object.entries(counts).forEach(([e,c])=>{ if(c>bc){ bc=c; best=e; } });
  return best;
}

function doSignIn(){

function corruptionBar(c){
  if(c<=0) return '';
  const t = corrTier(c);
  return `<div class="corr-bg"><div class="corr-fill" style="width:${Math.min(100,c)}%; background:${t.color}"></div></div>

function elemTags(elements){

/* ============ ROSTER / FUSION ============ */
let fuseSelection = [];

const TRAIT_LABEL = {
  fire:'burn immunity', water:'slow immunity', volt:'stun immunity',
  nature:'regeneration', earth:'a bulwark shield', wind:'evasion',
};
/* Works out what the two selected monsters would make, or null if they can't fuse. */
function inheritTrait(parents){
  const pool = parents.map(m=>m.trait).filter(Boolean);
  if(!pool.length) return rollTrait();
  return pool[Math.floor(Math.random()*pool.length)];
}
function fusionPlan(){
  const picks = fuseSelection.map(findMonster).filter(Boolean);
  if(picks.length!==fuseSelection.length) return null;
  if(picks.some(m=>m.level<3)) return null;

  /* three matching Primes ascend */
  if(picks.length===3){
    const same = picks.every(m=>m.speciesId===picks[0].speciesId);
    if(!same || !picks.every(m=>m.tier===2)) return null;
    return { kind:'ascend', parents:picks, speciesId:picks[0].speciesId,
             parentName:getSpeciesData(picks[0].speciesId,2).name,
             resultName:'Ascended '+getSpeciesData(picks[0].speciesId,1).name };
  }
  if(fuseSelection.length!==2) return null;
  const a = picks[0], b = picks[1];
  if(a.speciesId===b.speciesId){
    if(a.tier!==b.tier || a.tier>=2) return null;
    return { kind:'prime', parents:picks, parentName:getSpeciesData(a.speciesId,a.tier).name,
             resultName:'Prime '+getSpeciesData(a.speciesId,1).name };
  }
  if(a.tier>=2 || b.tier>=2) return null;
  if(isHybridId(a.speciesId) || isHybridId(b.speciesId)) return null;
  const ea = SPECIES[a.speciesId].element, eb = SPECIES[b.speciesId].element;
  if(ea===eb) return null;
  const id = hybridIdFor(ea, eb);
  if(!HYBRID_SPECIES[id]) return null;
  return { kind:'hybrid', parents:picks, resultId:id, resultName:HYBRID_SPECIES[id].name,
           traits:[ea,eb].sort().map(e=>TRAIT_LABEL[e]) };
}
function fusionBlockReason(){
  const picks = fuseSelection.map(findMonster).filter(Boolean);
  if(picks.length<2) return 'Select two monsters.';
  if(picks.some(m=>m.level<3)) return 'Every monster in the forge must be Lv.3 or higher.';
  if(picks.length===3){
    if(!picks.every(m=>m.speciesId===picks[0].speciesId)) return 'Ascension needs three of the <b>same</b> Prime form.';
    if(!picks.every(m=>m.tier===2)) return 'Ascension needs three <b>Prime</b> forms — evolve them first.';
    return 'These three cannot ascend.';
  }
  const a = picks[0], b = picks[1];
  if(a.tier>=3 || b.tier>=3) return 'Ascended forms are the end of the line.';
  if(a.speciesId===b.speciesId && a.tier===2) return 'Two Primes are not enough — ascension takes <b>three</b>.';
  if(a.tier>=2 || b.tier>=2) return 'Prime forms can only be combined with matching Primes.';
  if(isHybridId(a.speciesId) || isHybridId(b.speciesId)) return 'A hybrid can only be evolved with an identical hybrid, not spliced again.';
  return 'These two share an element — splicing needs two different elements.';
}
function renderRoster(){
  fuseSelection = fuseSelection.filter(u=>findMonster(u));
  let cards = state.roster.map(m=>{
    const st = computeStats(m);
    const sel = fuseSelection.includes(m.uid);
    return `
    <div class="mcard ${sel?'selected':''}" onclick="toggleFuseSelect('${m.uid}')">
      ${m.tier>=3?'<div class="tier3tag">👑</div>':(m.tier>=2?'<div class="tier2tag">★</div>':'')}${isHybridId(m.speciesId)?'<div class="tier2tag" style="left:2px; right:auto; color:var(--wind)">✦</div>':''}
      <div class="emoji">${st.emoji}</div>
      <div class="name">${st.name}</div>
      <div class="lvl">Lv.${m.level}</div>
      ${elemTags(st.elements)}
      ${traitTag(st.trait)}
      ${corruptionBar(st.corruption)}
    </div>`;
  }).join('');

  const plan = fusionPlan();
  const canFuse = !!plan;
  let fuseInfo;
  if(fuseSelection.length!==2){
    fuseInfo = 'Select from the roster above. <b>Two of a kind</b> evolve into a Prime; <b>two different elements</b> splice into a hybrid; <b>three matching Primes</b> ascend. The result inherits one parent\'s trait.';
  } else if(plan && plan.kind==='ascend'){
    fuseInfo = `Ascend three ${plan.parentName} into a single <b>${plan.resultName}</b> 👑 — 2.3× base stats, a fourth part slot, and an empowered skill. All three are consumed.`;
  } else if(plan && plan.kind==='prime'){
    fuseInfo = `Evolve two ${plan.parentName} into one <b>${plan.resultName}</b>. Installed parts are lost in the forge.`;
  } else if(plan && plan.kind==='hybrid'){
    const sd = HYBRID_SPECIES[plan.resultId];
    fuseInfo = `Splice into <b>${sd.emoji} ${sd.name}</b> — ${elemTags(sd.elements)} — inheriting <b>${plan.traits.join(' + ')}</b>.
      It counts toward <b>both</b> element lines in whichever row it stands. Parents and their parts are consumed.`;
  } else {
    fuseInfo = fusionBlockReason();
  }

  return `
  <div class="panel">
    <h2 class="section">ROSTER</h2>
    <div class="row">${cards || '<p class="dim">No monsters yet.</p>'}</div>
  </div>
  <div class="panel">
    <h2 class="section">FUSION LAB</h2>
    ${state.lastFusion ? `<p style="color:var(--gold)">✦ Forged: <b>${state.lastFusion.emoji} ${state.lastFusion.name}</b> ${elemTags(state.lastFusion.elements)} ${state.lastFusion.trait?`<span style="color:var(--volt)">${TRAITS[state.lastFusion.trait.key].emoji} ${traitName(state.lastFusion.trait)}</span>`:''}</p>` : ''}
    <p class="dim">${fuseInfo}</p>
    <button class="btn primary" ${canFuse?'':'disabled'} onclick="doFuse()">🔥 FUSE SELECTED</button>
  </div>
  <div class="panel">
    <h2 class="section">SPLICE INDEX ${discoveredCount()}/${Object.keys(HYBRID_SPECIES).length}</h2>
    <p class="dim">Every pair of elements makes something. Discovered hybrids stay listed.</p>
    <div class="row">${hybridIndexHtml()}</div>
  </div>
  <div class="panel footer-nav">
    <button class="btn" onclick="fuseSelection=[]; state.lastFusion=null; state.screen='hub'; render();">← Back to Hub</button>
  </div>`;
}
function discoveredCount(){ return Object.keys(state.discovered||{}).length; }
function hybridIndexHtml(){
  return Object.keys(HYBRID_SPECIES).map(id=>{
    const sd = HYBRID_SPECIES[id];
    const known = state.discovered && state.discovered[id];
    return `<div class="mcard" style="width:96px; cursor:default; ${known?'':'opacity:0.35'}">
      <div class="emoji">${known?sd.emoji:'❓'}</div>
      <div class="name">${known?sd.name:'???'}</div>
      ${elemTags(sd.elements)}
    </div>`;
  }).join('');
}

function toggleFuseSelect(u){
  const i = fuseSelection.indexOf(u);
  if(i>=0) fuseSelection.splice(i,1);
  else {
    if(fuseSelection.length>=3) fuseSelection.shift();
    fuseSelection.push(u);
  }
  render();
}
function doFuse(){
  const plan = fusionPlan();
  if(!plan) return;
  const parents = plan.parents;
  const eaten = parents.map(m=>m.uid);
  const trait = inheritTrait(parents);
  state.roster = state.roster.filter(m=>eaten.indexOf(m.uid)<0);
  ['front','back'].forEach(row=>{
    state.formation[row] = state.formation[row].map(u=> eaten.indexOf(u)>=0 ? null : u);
  });
  const made = (plan.kind==='prime')  ? newMonster(parents[0].speciesId, 1, 2, trait)
             : (plan.kind==='ascend') ? newMonster(plan.speciesId, 1, 3, trait)
             : newMonster(plan.resultId, 1, 1, trait);
  state.roster.push(made);
  autosaveLater();
  if(plan.kind==='hybrid'){ state.discovered = state.discovered||{}; state.discovered[plan.resultId] = true; }
  state.lastFusion = computeStats(made);
  fuseSelection = [];
  render();
}

/* ============ SALVAGE BAY ============ */

  const monCards = state.roster.map(m=>{
