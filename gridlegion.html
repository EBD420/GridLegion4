  </div>
  <div class="panel footer-nav"><button class="btn" onclick="state.screen='hub'; render();">← Back to Hub</button></div>`;
}

/* ============ LEGION HQ ============
   A home-base screen decorated with things this legion has actually
   earned — trophies, banners, a defeated commander's own wreckage — sitting
   right alongside Trophy Case and Legion Identity. Deliberately just a
   diorama: every prop's unlock condition reads an existing permanent record
   (trophyAce/trophyVanguard/bestDepth/bestStreak/badgesUnlocked/the Archive/
   gauntletBest) rather than tracking anything new to earn, and arranging
   the display changes nothing about how a fight plays out — same "mostly
   cosmetic flex" spirit as the emblem/badge pickers on Legion Identity,
   whose toggle-with-a-cap pattern (see toggleEmblemPart) hqDisplay below
   copies wholesale. A natural place to eventually hang small passive perks,
   but this pass is display-only. */
const HQ_SLOT_COUNT = 6;
const HQ_PROPS = {
  ace_trophy:        { emoji:'⭐', name:"The Ace's Head",       desc:'Mounted the day this legion felled its first Rustbound Ace.',
                       unlocked: ()=>!!state.trophyAce },
  vanguard_trophy:    { emoji:'🛡️', name:"The Vanguard's Shield", desc:"Salvaged whole off an Elite Wave's escort leader.",
                       unlocked: ()=>!!state.trophyVanguard },
  deep_banner:        { emoji:'🗺️', name:'Deep Survey Banner',    desc:'Marks the deepest this legion has ever pushed into the Deep.',
                       unlocked: ()=>(state.bestDepth||0)>0 },
  streak_flag:        { emoji:'🔥', name:'Win Streak Flag',       desc:'Flown for a run of at least 5 wins in a row.',
                       unlocked: ()=>(state.bestStreak||0)>=5 },
  commander5_skull:   { emoji:'💀', name:'Commander Skull — Stage 5',  desc:'A trophy from the first scripted commander fight.',
                       unlocked: ()=>!!state.cleared[5] },
  commander9_skull:   { emoji:'💀', name:'Commander Skull — Stage 9',  desc:'A trophy from the second scripted commander fight.',
                       unlocked: ()=>!!state.cleared[9] },
  gate_relic:         { emoji:'🏛️', name:'A Piece of the Gate',   desc:'Salvaged from the gate itself, the day the campaign was won.',
                       unlocked: ()=>!!state.cleared[CAMPAIGN_LENGTH] },
  archive_shelf:      { emoji:'📜', name:'Archive Shelf',         desc:'Every Archive fragment this legion has ever recovered, shelved in one place.',
                       unlocked: ()=>archiveFoundCount()>=ARCHIVE_FRAGMENTS.length },
  badge_case:         { emoji:'🎖️', name:'Badge Case',            desc:'Every Legion Banner this legion has ever earned, mounted together.',
                       unlocked: ()=>(state.badgesUnlocked||[]).length>0 },
  gauntlet_marker:    { emoji:'☠️', name:'Gauntlet Marker',        desc:'Notched for the deepest wave ever cleared in the Gauntlet.',
                       unlocked: ()=>(state.gauntletBest||0)>0 },
};
function toggleHqProp(k){
  if(!HQ_PROPS[k] || !HQ_PROPS[k].unlocked()) return;
  const cur = Array.isArray(state.hqDisplay) ? state.hqDisplay.slice() : [];
  const i = cur.indexOf(k);
  if(i>=0) cur.splice(i,1);
  else if(cur.length<HQ_SLOT_COUNT) cur.push(k);
  else { sfx('click'); return; }
  state.hqDisplay = cur;
  autosave();
  sfx('click');
  render();
}
function goLegionHQ(){ state.screen='legionhq'; sfx('click'); render(); }
function renderLegionHQ(){
  const cur = Array.isArray(state.hqDisplay) ? state.hqDisplay : [];
  const slots = Array.from({length:HQ_SLOT_COUNT}, (_,i)=>{
    const k = cur[i], P = k ? HQ_PROPS[k] : null;
    return P
      ? `<div class="pcard selected" style="width:140px; text-align:center; cursor:pointer;" onclick="toggleHqProp('${k}')">
           <div class="pname">${P.emoji} ${escapeHtml(P.name)}</div>
           <div class="dim" style="font-size:12px; margin-top:2px;">tap to put away</div>
         </div>`
      : `<div class="pcard" style="width:140px; text-align:center; opacity:0.35; cursor:default;">
           <div class="pname">— empty —</div>
         </div>`;
  }).join('');
  const chips = Object.keys(HQ_PROPS).map(k=>{
    const P = HQ_PROPS[k], has = P.unlocked(), on = cur.indexOf(k)>=0;
    return `<div class="pcard ${on?'selected':''}" style="width:190px; ${has?'cursor:pointer;':'cursor:default; opacity:0.35;'}" ${has?`onclick="toggleHqProp('${k}')"`:''}>
      <div class="pname">${has?P.emoji+' '+escapeHtml(P.name):'🔒 ???'}</div>
      <div class="dim" style="font-size:13px;">${has?(on?'on display — tap to put away':'tap to display'):escapeHtml(P.desc)}</div>
    </div>`;
  }).join('');
  return `
  <div class="panel">
    <h2 class="section">LEGION HQ</h2>
    <p class="dim">A home base decorated with what this legion has actually earned. Purely for show — nothing here changes how a fight plays out.</p>
    <div class="row" style="margin-top:8px;">${slots}</div>
  </div>
  <div class="panel">
    <h2 class="section">EARNED PROPS — ${cur.length}/${HQ_SLOT_COUNT} on display</h2>
    <div class="row" style="margin-top:6px;">${chips}</div>
  </div>
  <div class="panel footer-nav"><button class="btn" onclick="state.screen='hub'; render();">← Back to Hub</button></div>`;
}

/* ============ ATTENDANCE STREAK ============
   A calendar-day counter, deliberately separate from state.streak (the
   battle win streak above) — this one only cares whether you opened THIS
   legion on consecutive UTC calendar days, not what happened once you did.
   Like bestDepth/bestStreak/trophyAce, it lives per-legion and is reset by
   initGame() for a brand-new legion but left untouched by Rebirth (Rebirth
   already preserves every other "this legion's history" record). Checked
   lazily from renderHub() — the same pattern ensureDailies() already uses —
   rather than from a dedicated boot hook, so both a fresh legion and a
   continued one pick it up the moment they land on the hub. */
const ATTENDANCE_MS = 24*60*60*1000;
function ensureAttendance(){
  const today = todayKey();
  if(state.lastLoginDay === today) return;
  if(state.lastLoginDay){
    const yesterday = dateKeyFor(new Date(Date.now() - ATTENDANCE_MS));
    state.loginStreak = (state.lastLoginDay === yesterday) ? (state.loginStreak||0)+1 : 1;
  } else {
    state.loginStreak = 1;
  }
  state.lastLoginDay = today;
  if(state.loginStreak > (state.bestLoginStreak||0)) state.bestLoginStreak = state.loginStreak;
  checkBadgeUnlocks();
  autosave();
}

/* ============ LEGION BANNERS (BADGES) ============
   A second, achievement-gated glyph shown alongside the existing salvage-part
   emblem — legionBanner() prepends it, so it travels through the exact same
   shared display-name field into the guild roster, raid board, ladder and
   Online Now with no new network surface at all. Unlike the emblem (up to 3
   parts, freely toggled the moment a part is unlocked), a badge is a single
   slot and permanent once earned: qualifying conditions are point-in-time
   snapshots (bestLoginStreak, bestStreak, trophyAce/trophyVanguard) except
   the ladder rank one, which is why that one is "ever cracked the top 10",
   checked and locked in the moment it's observed, not "currently ranked". */
const BADGES = {
  streak3:     { emoji:'🔥',   name:'Regular',       desc:'Reach a 3-day login streak.' },
  streak7:     { emoji:'🔥🔥',  name:'Dedicated',     desc:'Reach a 7-day login streak.' },
  streak30:    { emoji:'🌟',   name:'Veteran',       desc:'Reach a 30-day login streak.' },
  warstreak10: { emoji:'⚔',   name:'Hot Streak',    desc:'Win 10 stages in a row.' },
  slayer:      { emoji:'🏆',   name:'Monster Slayer', desc:'Fell both a Rustbound Ace and a Vanguard.' },
  ranked10:    { emoji:'👑',   name:'Ranked',        desc:'Crack the top 10 on the Ladder.' },
};
function checkBadgeUnlocks(){
  const have = Array.isArray(state.badgesUnlocked) ? state.badgesUnlocked : (state.badgesUnlocked=[]);
  const grant = k => { if(have.indexOf(k)<0) have.push(k); };
  if((state.bestLoginStreak||0)>=3) grant('streak3');
  if((state.bestLoginStreak||0)>=7) grant('streak7');
  if((state.bestLoginStreak||0)>=30) grant('streak30');
  if((state.bestStreak||0)>=10) grant('warstreak10');
  if(state.trophyAce && state.trophyVanguard) grant('slayer');
  if(typeof social.rank==='number' && social.rank>=1 && social.rank<=10) grant('ranked10');
}
function toggleBadge(k){
  if(!BADGES[k] || (state.badgesUnlocked||[]).indexOf(k)<0) return;
  state.badge = (state.badge===k) ? null : k;
  autosave();
  sfx('click');
  render();
}

/* ============ BATTLE REPLAYS ============
   A structured recap, not real video — "nothing fancy." Every field here
   was already computed for something else: the formation snapshot and
   power score are exactly what the Ladder already publishes (ladderSnapshot/
   formationPower above), and the highlight lines are pulled straight out of
   the War Journal entry endBattle() just wrote for this same fight, rather
   than a new turn-by-turn recorder.

   Captured automatically, at most one per battle, the same "permanent
   high-water mark" way Trophy Case works (see noteTrophy) — a boss kill, a
   new best win streak, or a new deepest reach, checked in that priority
   order in endBattle()'s shared tail. Local replays are always visible,
   signed in or not, same as the War Journal; only "Share" (pushing a copy
   to the replays table below) needs an account, and so does browsing what
   anyone else has shared — the same "every social surface needs sign-in"
   rule Guild/Ladder/Online Now already follow (needAccountPanel). Like
   bestStreak/bestDepth/badgesUnlocked, this is a permanent record: reset by
   initGame() for a brand-new legion, left untouched by Rebirth. */
const REPLAY_CAP = 10;
const REPLAY_KINDS = ['boss','streak','depth'];
function replayEmoji(kind){ return kind==='boss' ? '💀' : (kind==='streak' ? '🔥' : '🗺️'); }
/* Trims one live battle unit down to exactly what Replay Playback needs to
   redraw it later (renderUnit()/unitSpriteHtml()/statusIconLine() — see
   REPLAY PLAYBACK below) — not the full battle-only fields (bAtk/skillCd/
   status/etc.) a live fight also carries, which playback never touches. */
function snapshotReplayUnit(u){
  return {
    id: u.id, side: u.side, row: u.row,
    name: u.name, emoji: u.emoji||'', sprite: u.sprite||null,
    element: u.element||null, elements: Array.isArray(u.elements) ? u.elements.slice(0,2) : [],
    maxHp: u.maxHp,
    isBoss: !!u.isBoss, isGenerator: !!u.isGenerator, isAce: !!u.isAce,
    isVanguard: !!u.isVanguard, isReinforcement: !!u.isReinforcement,
    plating: u.plating || null, corruption: u.corruption || 0,
    trait: u.trait ? { key:u.trait.key, elem:u.trait.elem } : null,
  };
}
function snapshotReplayRoster(b){
  return {
    player: (b.playerUnits||[]).map(snapshotReplayUnit),
    enemy: (b.enemyUnits||[]).map(snapshotReplayUnit),
  };
}
function captureReplay(kind, label){
  if(!state.battle) return;
  const entry = state.journal && state.journal[0];
  const highlights = (entry && typeof entry.text==='string')
    ? entry.text.split(/(?<=[.!?])\s+/).filter(Boolean).slice(0,6) : [];
  const rep = {
    id: uid(), kind, label: String(label).slice(0,60), win: true,
    stage: state.stage, deep: isDeep(state.stage),
    boss: bossForStage(state.stage) ? bossForStage(state.stage).name : null,
    power: formationPower(), formation: ladderSnapshot(),
    highlights, at: Date.now(), shared: false,
    log: (state.battle.actionLog||[]).slice(0, REPLAY_LOG_CAP),
    roster: snapshotReplayRoster(state.battle),
  };
  state.replays = Array.isArray(state.replays) ? state.replays : [];
  state.replays.unshift(rep);
  if(state.replays.length > REPLAY_CAP) state.replays.length = REPLAY_CAP;
}
/* Defensive revival, same treatment as reviveJournal above — this
   round-trips through localStorage like everything else in a save file. */
function reviveReplayFormation(f){
  if(!f || typeof f!=='object' || !Array.isArray(f.units)) return { units:[], blessing:null, stage:1 };
  const units = f.units.filter(u=>u && typeof u==='object' && typeof u.name==='string' && typeof u.level==='number')
    .map(u=>({ row: (u.row==='front'||u.row==='back') ? u.row : 'front',
               speciesId: typeof u.speciesId==='string' ? u.speciesId : null,
               level: Math.max(1, Math.floor(u.level)||1),
               tier: (u.tier===2||u.tier===3) ? u.tier : 1,
               parts: Array.isArray(u.parts) ? u.parts.filter(k=>!!partInfo(k)) : [],
               trait: (u.trait && TRAITS[u.trait.key]) ? u.trait : null,
               name: String(u.name).slice(0,40) }))
    .slice(0,6);
  return { units, blessing: (typeof f.blessing==='string') ? f.blessing.slice(0,20) : null,
           stage: (typeof f.stage==='number' && f.stage>=1) ? Math.floor(f.stage) : 1 };
}
/* ---- Replay Playback revival: same "never trust stored data" treatment
   as reviveReplayFormation above, applied to both local saves AND — since
   a shared community replay's `data` column is any signed-in player's own
   insert, never actually validated server-side beyond RLS ownership — the
   remote case too. Every field is re-checked against the live tables
   (SPRITE_SHAPES/TRAITS/PARTICLE_ELEMS) exactly the way a sprite pulled out
   of localStorage already is via reviveSpriteRecipe(). An unrecognized
   attacker/defender id later at playback time is simply skipped, not
   trusted to exist — see advanceReplayStep() below. */
function reviveReplayUnit(u){
  if(!u || typeof u!=='object' || typeof u.id!=='string' || (u.side!=='player' && u.side!=='enemy')) return null;
  return {
    id: u.id, side: u.side, row: (u.row==='back') ? 'back' : 'front',
    name: typeof u.name==='string' ? u.name.slice(0,40) : '???',
    emoji: typeof u.emoji==='string' ? u.emoji.slice(0,8) : '',
    sprite: reviveSpriteRecipe(u.sprite),
    element: (typeof u.element==='string' && PARTICLE_ELEMS.indexOf(u.element)>=0) ? u.element : null,
    elements: Array.isArray(u.elements) ? u.elements.filter(e=>PARTICLE_ELEMS.indexOf(e)>=0).slice(0,2) : [],
    maxHp: (typeof u.maxHp==='number' && isFinite(u.maxHp) && u.maxHp>0) ? Math.floor(u.maxHp) : 1,
    isBoss: u.isBoss===true, isGenerator: u.isGenerator===true, isAce: u.isAce===true,
    isVanguard: u.isVanguard===true, isReinforcement: u.isReinforcement===true,
    plating: (typeof u.plating==='string' && PARTICLE_ELEMS.indexOf(u.plating)>=0) ? u.plating : null,
    corruption: (typeof u.corruption==='number' && isFinite(u.corruption) && u.corruption>=0) ? Math.floor(u.corruption) : 0,
    trait: (u.trait && typeof u.trait==='object' && TRAITS[u.trait.key])
      ? { key:u.trait.key, elem: typeof u.trait.elem==='string' ? u.trait.elem : undefined } : null,
  };
}
function reviveReplayRoster(roster){
  if(!roster || typeof roster!=='object') return { player:[], enemy:[] };
  return {
    player: Array.isArray(roster.player) ? roster.player.map(reviveReplayUnit).filter(u=>u && u.side==='player').slice(0,6) : [],
    enemy: Array.isArray(roster.enemy) ? roster.enemy.map(reviveReplayUnit).filter(u=>u && u.side==='enemy').slice(0,8) : [],
  };
}
function reviveReplayLog(log){
  if(!Array.isArray(log)) return [];
  return log.filter(e => e && typeof e==='object' && typeof e.a==='string' && typeof e.d==='string')
    .map(e => ({
      a: e.a, d: e.d,
      dmg: (typeof e.dmg==='number' && isFinite(e.dmg) && e.dmg>=0) ? Math.floor(e.dmg) : 0,
      crit: e.crit===true, faint: e.faint===true, miss: e.miss===true, dodge: e.dodge===true, cascade: e.cascade===true,
      elem: (typeof e.elem==='string' && PARTICLE_ELEMS.indexOf(e.elem)>=0) ? e.elem : null,
      msg: typeof e.msg==='string' ? e.msg.slice(0,200) : '',
    }))
    .slice(0, REPLAY_LOG_CAP);
}
function reviveReplays(list){
  if(!Array.isArray(list)) return [];
  return list.filter(r => r && typeof r==='object'
      && REPLAY_KINDS.indexOf(r.kind)>=0
      && typeof r.label==='string' && r.label
      && typeof r.stage==='number' && isFinite(r.stage) && r.stage>=1)
    .map(r => ({
      id: typeof r.id==='string' ? r.id : uid(),
      kind: r.kind,
      label: r.label.slice(0,60),
      win: r.win !== false,
      stage: Math.max(1, Math.floor(r.stage)),
      deep: r.deep === true,
      boss: typeof r.boss==='string' ? r.boss.slice(0,40) : null,
      power: (typeof r.power==='number' && isFinite(r.power) && r.power>=0) ? Math.floor(r.power) : 0,
      formation: reviveReplayFormation(r.formation),
      highlights: Array.isArray(r.highlights) ? r.highlights.filter(h=>typeof h==='string').map(h=>h.slice(0,200)).slice(0,6) : [],
      at: (typeof r.at==='number' && isFinite(r.at)) ? r.at : Date.now(),
      shared: r.shared === true,
      log: reviveReplayLog(r.log),
      roster: reviveReplayRoster(r.roster),
    }))
    .slice(0, REPLAY_CAP);
}
function goReplays(){
  state.screen = 'replays';
  social.replayStatus = '';
  sfx('click');
  render();
  if(signedIn()) communityReplaysFetch().then(()=>render());
}
function doShareReplay(id){
  const rep = (state.replays||[]).find(r=>r.id===id);
  if(!rep || rep.shared || social.replayBusy) return Promise.resolve();
  social.replayBusy = true;
  social.replayStatus = 'Sharing…';
  render();
  return shareReplay(id).then(r=>{
    social.replayBusy = false;
    if(r.ok){
      rep.shared = true;
      autosave();
      social.replayStatus = 'Shared with the community.';
      return communityReplaysFetch().then(()=>render());
    } else {
      social.replayStatus = 'Not shared: ' + (r.error || 'unknown error');
      render();
    }
  });
}
/* Normalizes a local replay object (fields at the top level) or a remote
   community row ({display_name, data, created_at}, data holding the same
   shape) into one shape Replay Playback can consume regardless of origin. */
function replayPlaybackSource(rep, remote){
  const d = remote ? (rep.data||{}) : rep;
  return {
    label: (typeof d.label==='string' && d.label) || 'Battle',
    kind: REPLAY_KINDS.indexOf(d.kind)>=0 ? d.kind : 'boss',
    log: Array.isArray(d.log) ? d.log : [],
    roster: (d.roster && typeof d.roster==='object') ? d.roster : null,
    by: remote ? (rep.display_name || 'Commander') : null,
  };
}
function canWatchReplay(rep, remote){
  const src = replayPlaybackSource(rep, remote);
  return !!(src.roster && Array.isArray(src.roster.player) && src.roster.player.length
    && Array.isArray(src.roster.enemy) && src.roster.enemy.length && src.log.length);
}
function renderReplayCard(rep, remote, idx){
  const label = remote ? ((rep.data && rep.data.label) || 'Battle') : rep.label;
  const kind = remote ? (rep.data && rep.data.kind) : rep.kind;
  const stage = remote ? ((rep.data && rep.data.stage) || 1) : rep.stage;
  const deep = remote ? !!(rep.data && rep.data.deep) : rep.deep;
  const power = remote ? ((rep.data && rep.data.power) || 0) : rep.power;
  const formation = remote ? (rep.data && rep.data.formation) : rep.formation;
  const highlights = (remote ? (rep.data && rep.data.highlights) : rep.highlights) || [];
  const units = (formation && Array.isArray(formation.units)) ? formation.units : [];
  const unitLine = units.map(u=>escapeHtml(u.name)+' Lv'+u.level).join(', ') || '—';
  const stageLabel = deep ? ('Depth '+deepDepth(stage)) : ('Stage '+stage);
  const shareBtn = remote ? '' : (rep.shared
      ? `<span class="dim">✓ shared</span>`
      : (signedIn()
          ? `<button class="btn small" ${social.replayBusy?'disabled':''} onclick="doShareReplay('${rep.id}')">📤 Share</button>`
          : `<span class="dim">sign in to share</span>`));
  const watchBtn = canWatchReplay(rep, remote)
      ? `<button class="btn small" onclick="${remote?'goWatchRemoteReplay('+idx+')':'goWatchLocalReplay(\''+rep.id+'\')'}">▶ Watch</button>`
      : `<span class="dim" style="font-size:13px;">no full playback recorded</span>`;
  return `
  <div class="testbox" style="margin-bottom:8px;">
    <div style="color:var(--gold)">${replayEmoji(kind)} ${escapeHtml(label)}${remote?(' — '+escapeHtml(rep.display_name||'Commander')):''}</div>
    <div class="dim" style="font-size:14px;">${escapeHtml(stageLabel)} · power ${power} · ${unitLine}</div>
    ${highlights.map(h=>`<div class="dim" style="font-size:13px; margin-top:2px;">${escapeHtml(h)}</div>`).join('')}
    <div class="row" style="margin-top:6px; align-items:center;">${watchBtn}${shareBtn}</div>
  </div>`;
}
function renderReplays(){
  const list = Array.isArray(state.replays) ? state.replays : [];
  const cards = list.length ? list.map(r=>renderReplayCard(r,false)).join('')
      : '<p class="dim">No notable battles captured yet. A boss kill, a new best win streak, or a new deepest reach saves one here automatically.</p>';
  const statusMsg = social.replayStatus ? `<p style="color:var(--gold)">${escapeHtml(social.replayStatus)}</p>` : '';
  const community = signedIn()
    ? (social.replaysError
        ? `<p style="color:var(--danger)">⚠ ${escapeHtml(social.replaysError)}</p>`
        : ((social.replays||[]).length
            ? social.replays.map((r,i)=>renderReplayCard(r,true,i)).join('')
            : '<p class="dim">Nobody has shared a replay yet.</p>'))
    : `<p class="dim">Sign in to browse replays other commanders have shared.</p><button class="btn" onclick="goAccount()">👤 Sign in</button>`;
  return `
  <div class="panel">
    <h2 class="section">BATTLE REPLAYS</h2>
    <p class="dim">Your legion's best moments, saved automatically — nothing fancy, just the formation, the power score, and how it went.</p>
    ${statusMsg}
    ${cards}
  </div>
  <div class="panel">
    <h2 class="section">COMMUNITY REPLAYS</h2>
    ${community}
  </div>
  <div class="panel footer-nav"><button class="btn" onclick="state.screen='hub'; render();">← Back to Hub</button></div>`;
}

/* ============ REPLAY PLAYBACK ============
   A sequel to the capture side above: instead of just the formation/power/
   highlights snapshot, actually re-enact the fight action by action on the
   same two-lane battlefield the live game uses. state.playback holds its
   own small working copies of both rosters (hp/fainted mutated forward as
   the log plays) plus the log and a step cursor — deliberately not
   state.battle itself, since nothing here is a real, interactive fight:
   no queue, no gauge, no player input. Reuses renderUnit()/unitSpriteHtml()
   unmodified (activeId=null and an empty target list mean nothing is ever
   selectable, so none of their live-battle-only branches ever fire) and
   the exact same fx()/fxMotion()/spawnParticles() queues applyDamage()
   itself queues from, since those only ever look up DOM nodes by
   data-unit id — they don't care whether the id belongs to a real
   in-progress battle or a replay being stepped through by hand.
   First-N capped (REPLAY_LOG_CAP, set where the log is recorded), never a
   rolling window, so playback always starts from a real full-HP opening —
   an unusually long fight just stops partway through rather than ever
   showing an inconsistent starting HP. */
function playbackUnitById(id){
  const pb = state.playback; if(!pb) return null;
  return pb.player.find(u=>u.id===id) || pb.enemy.find(u=>u.id===id) || null;
}
function advanceReplayStep(){
  const pb = state.playback;
  if(!pb || pb.step >= pb.log.length) return false;
  const e = pb.log[pb.step];
  const a = playbackUnitById(e.a), d = playbackUnitById(e.d);
  if(a && d){
    if(!e.miss && !e.dodge){
      d.hp = Math.max(0, d.hp - (e.dmg||0));
      if(e.faint || d.hp<=0) d.fainted = true;
    }
    if(!e.cascade) fxMotion(a, d, e.elem, !e.miss && !e.dodge && (e.dmg||0)>0);
    if(e.miss) fx(d.id, 'MISS', 'miss');
    else if(e.dodge) fx(d.id, 'DODGE', 'miss');
    else if(e.cascade) fx(d.id, '⚡-'+e.dmg, 'crit');
    else if((e.dmg||0) > 0) fx(d.id, '-'+e.dmg+(e.crit?'!':''), e.crit ? 'crit' : (d.side==='player'?'hurt':'dmg'));
    else fx(d.id, 'BLOCK', 'miss');
    sfx(e.miss || e.dodge ? 'miss' : (e.crit ? 'crit' : ((e.dmg||0)>0 ? 'hit' : 'shield')));
    if(d.fainted) sfx('faint');
  }
  pb.step++;
  return true;
}
function resetReplayPlaybackUnits(pb){
  pb.player.forEach(u=>{ u.hp=u.maxHp; u.fainted=false; });
  pb.enemy.forEach(u=>{ u.hp=u.maxHp; u.fainted=false; });
}
function replayStepForward(){
  const pb = state.playback; if(!pb) return;
  pb.playing = false;
  advanceReplayStep();
  render();
}
function toggleReplayPlay(){
  const pb = state.playback; if(!pb) return;
  if(pb.step >= pb.log.length){ resetReplayPlaybackUnits(pb); pb.step = 0; }
  pb.playing = !pb.playing;
  if(pb.playing) schedulePlaybackTick();
  render();
}
function schedulePlaybackTick(){
  const pb = state.playback;
  if(!pb || !pb.playing) return;
  setTimeout(()=>{
    const live = state.playback;
    if(!live || !live.playing) return;
    if(!advanceReplayStep()){ live.playing = false; render(); return; }
    render();
    schedulePlaybackTick();
  }, pb.speed===2 ? 450 : 900);
}
function restartReplayPlayback(){
  const pb = state.playback; if(!pb) return;
  resetReplayPlaybackUnits(pb);
  pb.step = 0; pb.playing = false;
  render();
}
function cycleReplaySpeed(){
  const pb = state.playback; if(!pb) return;
  pb.speed = pb.speed===2 ? 1 : 2;
  render();
}
function stopReplayPlayback(){
  state.playback = null;
  state.screen = 'replays';
  render();
}
function startReplayPlayback(src){
  const roster = reviveReplayRoster(src.roster);
  const log = reviveReplayLog(src.log);
  if(!roster.player.length || !roster.enemy.length || !log.length) return false;
  state.playback = {
    label: src.label, kind: src.kind, by: src.by,
    player: roster.player.map(u=>Object.assign({}, u, { hp:u.maxHp, fainted:false })),
    enemy: roster.enemy.map(u=>Object.assign({}, u, { hp:u.maxHp, fainted:false })),
    log, step: 0, playing: false, speed: 1,
  };
  state.screen = 'replaywatch';
  sfx('click');
  render();
  return true;
}
function goWatchLocalReplay(id){
  const rep = (state.replays||[]).find(r=>r.id===id);
  if(!rep) return;
  startReplayPlayback(replayPlaybackSource(rep, false));
}
function goWatchRemoteReplay(idx){
  const rep = (social.replays||[])[idx];
  if(!rep) return;
  startReplayPlayback(replayPlaybackSource(rep, true));
}
function renderReplayPlayback(){
  const pb = state.playback;
  if(!pb){
    return `
    <div class="panel"><h2 class="section">REPLAY</h2><p class="dim">No replay loaded.</p></div>
    <div class="panel footer-nav"><button class="btn" onclick="state.screen='replays'; render();">← Back to Replays</button></div>`;
  }
  const uHtml = (list)=>list.map(u=>renderUnit(u, null, [])).join('');
  const enemySide = `
    <div class="bf-side enemy">
      <div class="bf-side-head">🤖 RUSTBOUND FORCES</div>
      <div class="bf-cols">
        <div class="unit-row">${uHtml(pb.enemy.filter(u=>u.row==='front'))}</div>
        <div class="unit-row">${uHtml(pb.enemy.filter(u=>u.row==='back'))}</div>
      </div>
    </div>`;
  const playerSide = `
    <div class="bf-side player">
      <div class="bf-side-head">🛡 ${pb.by?escapeHtml(pb.by)+"'S LEGION":'YOUR LEGION'}</div>
      <div class="bf-cols">
        <div class="unit-row">${uHtml(pb.player.filter(u=>u.row==='back'))}</div>
        <div class="unit-row">${uHtml(pb.player.filter(u=>u.row==='front'))}</div>
      </div>
    </div>`;
  const done = pb.step >= pb.log.length;
  const feed = pb.log.slice(0, pb.step).slice(-6).reverse()
    .map(e=>`<div>${escapeHtml(e.msg||'')}</div>`).join('') || '<div class="dim">Press Play to begin.</div>';
  return `
  <div class="panel">
    <h2 class="section">${replayEmoji(pb.kind)} REPLAY — ${escapeHtml(pb.label)}</h2>
    <p class="dim">${pb.log.length>=REPLAY_LOG_CAP
        ? 'This fight ran long — showing the first '+REPLAY_LOG_CAP+' actions.'
        : 'Watching exactly what happened, action by action.'}</p>
  </div>
  <div class="panel">
    ${enemySide}
    ${playerSide}
  </div>
  <div class="panel">
    <div id="log">${feed}</div>
    <div class="dim" style="margin-top:8px;">${done ? 'Replay finished.' : 'Action '+(pb.step+1)+' / '+pb.log.length}</div>
    <div class="row" style="margin-top:8px;">
      <button class="btn primary" onclick="toggleReplayPlay()">${pb.playing?'⏸ Pause':(done?'▶ Play again':'▶ Play')}</button>
      <button class="btn" ${done?'disabled':''} onclick="replayStepForward()">⏭ Step</button>
      <button class="btn small" onclick="cycleReplaySpeed()">${pb.speed}×</button>
      <button class="btn small" onclick="restartReplayPlayback()">↺ Restart</button>
    </div>
  </div>
  <div class="panel footer-nav"><button class="btn" onclick="stopReplayPlayback()">← Back to Replays</button></div>`;
}

/* ============ MONSTER NICKNAMES ============
   Rename any monster in your roster; the game quietly remembers a few
   milestones for it — kills, times fielded, a near-death survival — as a
   line or two of flavor on its Salvage Bay card. All three counters live on
   the monster object itself (see newMonster/reviveMonster), so they evolve
   and reset exactly the way parts and levels already do: fusion consumes the
   parent and its history along with it, Rebirth wipes the roster and starts
   everyone at zero, same as it always has. Kills are credited off the same
   killsByUnit tally applyDamage/applyCascadeOverflow already build (right
   alongside the existing killsBySpecies), and times-fielded/close-calls are
   read off b.playerUnits in endBattle()'s tail — the same shared ending
   state.streak and the Caravan already hook, so duels/raids/trials/the
   tutorial never touch a monster's personal record either. */
const CLOSE_CALL_HP_FRAC = 0.15;   // ended the fight alive at or below this fraction of max HP
function monsterFlavorLines(m){
  const lines = [];
  const fielded = m.timesFielded||0, kills = m.kills||0, close = m.closeCalls||0;
  if(fielded===0) return lines;   // nothing to say about a monster that has never deployed
  if(kills===0) lines.push(`Fielded ${fielded} time${fielded===1?'':'s'}, no confirmed kills yet.`);
  else if(kills===1) lines.push(`Drew first blood — one confirmed kill in ${fielded} deployment${fielded===1?'':'s'}.`);
  else if(kills<10) lines.push(`${kills} confirmed kills across ${fielded} deployment${fielded===1?'':'s'}.`);
  else lines.push(`${kills} confirmed kills. The Rustbound have started keeping a file on this one.`);
  if(close===1) lines.push(`Walked away from one fight it had no business surviving.`);
  else if(close>1) lines.push(`${close} near-misses now — it still doesn't know how to stay down.`);
  return lines;
}
/* Nicknames flow straight into computeStats().name, which dozens of
   pre-existing, unescaped `${...}` templates across the whole file already
   trust as plain text (battle log lines, War Journal prose, card names —
   all previously safe only because a species name could never contain
   markup). Rather than retrofit escaping onto every one of those sites,
   the nickname is sanitized once, right here at its only entry point, so
   it is just as safe as a species name everywhere it goes from here on. */
function sanitizeNickname(raw){ return String(raw||'').replace(/[<>&"']/g,'').replace(/\s+/g,' ').trim().slice(0,16); }
function beginRename(uid){ if(!findMonster(uid)) return; state.renamingUid = uid; render(); }
function cancelRename(){ state.renamingUid = null; render(); }
function doRenameMonster(uid){
  const m = findMonster(uid); if(!m) return;
  const name = sanitizeNickname(readInput('nick_'+uid));
  m.nickname = name || null;
  state.renamingUid = null;
  autosave();
  render();
}

/* The commander sits in the back, untouchable, while any pylon still stands.
   Pylons are fragile but the commander reboots one every few turns — so the
   fight is a race to drop them all inside a single window, not a war of attrition. */
function buildBossUnits(stage, terrain, adapted, usePlating, boss, platingElem){
  if(boss.parts) return buildSplitBossUnits(stage, terrain, adapted, usePlating, boss, platingElem);
  platingElem = platingElem || adapted;
  const mult = 1 + (stage-1)*0.14;
  const units = [];
  const REF = { hp:32, atk:10, def:8, spd:9 };

  for(let i=0;i<boss.gens;i++){
    const hp = Math.round(REF.hp*mult*0.55);
    const g = Object.assign(baseUnitDefaults(), {
      id:'e_gen'+i, side:'enemy', row:'front', speciesKey:null, isGenerator:true,
      name:boss.genName, emoji:boss.genEmoji, sprite:boss.genSprite||GEN_SPRITE, element:boss.genElement, elements:[boss.genElement],
      attackElements:[boss.genElement], skillName:'Overcharge',
      bHp:hp, bAtk:Math.round(REF.atk*mult*0.7), bDef:Math.round(REF.def*mult*1.1), bSpd:Math.round(REF.spd*mult*0.9),
      maxHp:hp, hp:hp, atk:Math.round(REF.atk*mult*0.7), def:Math.round(REF.def*mult*1.1), spd:Math.round(REF.spd*mult*0.9),
      skillCd:0, skillMaxCd:3, fainted:false,
    });
    if(usePlating && platingElem){ g.plating = platingElem; g.platingPct = platingPct(); }
    applyTerrainToUnit(g, terrain);
    if(hasMod('blitz')) g.bSpd = Math.round(g.bSpd*2);
    g.atk=g.bAtk; g.def=g.bDef; g.spd=g.bSpd; g.maxHp=g.bHp; g.hp=g.bHp;
    units.push(g);
  }

  const hp = Math.round(REF.hp*mult*boss.mult.hp);
  const b = Object.assign(baseUnitDefaults(), {
    id:'e_boss', side:'enemy', row:'back', speciesKey:null, isBoss:true, shielded:boss.gens>0,
    name:boss.name, emoji:boss.emoji, sprite:boss.sprite, element:boss.element, elements:[boss.element],
    attackElements:[boss.element], skillName:boss.skill,
    bHp:hp, bAtk:Math.round(REF.atk*mult*boss.mult.atk), bDef:Math.round(REF.def*mult*boss.mult.def), bSpd:Math.round(REF.spd*mult*boss.mult.spd),
    maxHp:hp, hp:hp,
    atk:Math.round(REF.atk*mult*boss.mult.atk), def:Math.round(REF.def*mult*boss.mult.def), spd:Math.round(REF.spd*mult*boss.mult.spd),
    skillCd:0, skillMaxCd:2, fainted:false, repairCd:BOSS_REPAIR_EVERY,
  });
  if(usePlating && platingElem){ b.plating = platingElem; b.platingPct = platingPct(); }
  applyTerrainToUnit(b, terrain);
  if(hasMod('blitz')) b.bSpd = Math.round(b.bSpd*2);
  b.atk=b.bAtk; b.def=b.bDef; b.spd=b.bSpd; b.maxHp=b.bHp; b.hp=b.bHp;
  units.push(b);
  return units;
}
/* A split-phase boss's units, both fully exposed from turn one — no shield,
   no pylons, no repairCd. Row is 'back' for both: getValidTargets() falls
   back to the back row whenever a side has no front-row unit, so this
   naturally puts BOTH parts in reach of every player unit regardless of
   which row they're deployed in, with zero changes needed to targeting. */
function buildSplitBossUnits(stage, terrain, adapted, usePlating, boss, platingElem){
  platingElem = platingElem || adapted;
  const mult = 1 + (stage-1)*0.14;
  const REF = { hp:32, atk:10, def:8, spd:9 };
  return boss.parts.map((p,i)=>{
    const hp = Math.round(REF.hp*mult*p.mult.hp);
    const unit = Object.assign(baseUnitDefaults(), {
      id:'e_part'+i, side:'enemy', row:'back', speciesKey:null, isBoss:true, bossCodexName:boss.name,
      name:p.name, emoji:p.emoji, sprite:p.sprite, element:p.element, elements:[p.element],
      attackElements:[p.element], skillName:p.skill,
      bHp:hp, bAtk:Math.round(REF.atk*mult*p.mult.atk), bDef:Math.round(REF.def*mult*p.mult.def), bSpd:Math.round(REF.spd*mult*p.mult.spd),
      maxHp:hp, hp:hp,
      atk:Math.round(REF.atk*mult*p.mult.atk), def:Math.round(REF.def*mult*p.mult.def), spd:Math.round(REF.spd*mult*p.mult.spd),
      skillCd:0, skillMaxCd:2, fainted:false,
    });
    if(usePlating && platingElem){ unit.plating = platingElem; unit.platingPct = platingPct(); }
    applyTerrainToUnit(unit, terrain);
    if(hasMod('blitz')) unit.bSpd = Math.round(unit.bSpd*2);
    unit.atk=unit.bAtk; unit.def=unit.bDef; unit.spd=unit.bSpd; unit.maxHp=unit.bHp; unit.hp=unit.bHp;
    return unit;
  });
}
/* Called whenever an enemy falls: the shield holds while any pylon lives, and
   once they are all down together it collapses for good. */
function updateBossShield(){
  const b = state.battle; if(!b) return;
  const boss = b.enemyUnits.find(u=>u.isBoss);
  if(!boss || boss.fainted || !boss.shielded) return;
  const gens = b.enemyUnits.filter(u=>u.isGenerator);
  if(gens.length && gens.every(g=>g.fainted)){
    boss.shielded = false;
    boss.shieldBroken = true;
    logMsg(`💥 The last ${gens[0].name} bursts — ${boss.emoji} ${boss.name}'s shield collapses! It is exposed.`);
  }
}

function activeMods(){ return (state.trial && state.trial.mods) ? state.trial.mods : []; }
function hasMod(id){ return activeMods().indexOf(id)>=0; }

/* Rebuild an opponent's published legion as the enemy side. Same engine, same
   rules — their monsters simply run on the enemy AI. */
function buildDuelUnits(snapshot, terrain){
  const units = [];
  (snapshot.units||[]).slice(0,6).forEach((u,i)=>{
    const m = reviveMonster({ speciesId:u.speciesId, level:u.level, tier:u.tier, parts:u.parts, trait:u.trait, uid:'d'+i });
    if(!m) return;
    const st = computeStats(m);
    const tier = corrTier(st.corruption);
    const unit = Object.assign(baseUnitDefaults(), {
      id:'e_duel'+i, side:'enemy', row:(u.row==='back'?'back':'front'), speciesKey:null,
      name:st.name, emoji:st.emoji, sprite:st.sprite, element:st.element, elements:st.elements.slice(),
      attackElements:st.innate.slice(), hybrid:st.hybrid, skillName:st.skill,
      bHp:st.hp, bAtk:st.atk, bDef:st.def, bSpd:st.spd,
      maxHp:st.hp, hp:st.hp, atk:st.atk, def:st.def, spd:st.spd,
      skillCd:0, skillMaxCd:3, fainted:false,
      corruption:st.corruption, glitchChance:0, defectChance:0, trait:st.trait,
    });
    if(st.trait){
      if(st.trait.key==='keen') unit.critBonus = 0.08;
      if(st.trait.key==='bane') unit.baneElem = st.trait.elem;
      if(st.trait.key==='quickstart') unit.skillMaxCd = Math.max(1, unit.skillMaxCd-1);
    }
    applyTerrainToUnit(unit, terrain);
    unit.atk=unit.bAtk; unit.def=unit.bDef; unit.spd=unit.bSpd; unit.maxHp=unit.bHp; unit.hp=unit.bHp;
    units.push(unit);
  });
  return units;
}

/* Two soft targets: enough to demonstrate every verb, not enough to lose to. */
function buildTutorialEnemies(terrain){

/* ---- Loadout Gambit ----
   Before a genuinely hard fight (a Warlord, Foundry Core, the Fracture
   Engine, or an Elite Wave — anywhere else this would just be fatigue),
   offer three blind, one-time modifiers drawn from the pool below; picking
   one applies it for that single battle only, never longer. Deliberately
   excluded from duels, raids and trials — each of those already has its own
   separate difficulty/reward layer, and stacking a fourth on top would just
   be noise. Every modifier is a genuine trade, not a pure upside. */
const GAMBITS = {
  opening_strike: { name:'Opening Strike', desc:"Your front row's very first hit each battle lands as a guaranteed critical." },
  overclock:      { name:'Overclock', desc:'Legion Gauge charges 25% faster this fight — but every hit you land deals 8% less damage.' },
  bulwark:        { name:'Bulwark Doctrine', desc:"Your whole legion's DEF is up 10% this fight — but Legion Gauge charges 15% slower." },
  adrenaline:     { name:'Adrenaline Rush', desc:"Your whole legion's SPD is up 15% this fight — but you're 5 points more likely to be critically hit." },
  focused_fire:   { name:'Focused Fire', desc:'Your hits deal 10% more to anything already below half HP — but 6% less to anything still at full.' },
};
const GAMBIT_IDS = Object.keys(GAMBITS);
function isHardFight(stage){
  if(state.duel || state.raidRun || state.worldBossRun || state.guildWarRun || state.trial || state.redeploy) return false;
  return !!bossForStage(stage) || isEliteStage(stage);
}
function rollGambitChoices(){
  const pool = GAMBIT_IDS.slice();
  const choices = [];
  while(choices.length<3 && pool.length){
    const i = Math.floor(Math.random()*pool.length);
    choices.push(pool.splice(i,1)[0]);
  }
  state.gambit = { stage: state.stage, choices, picked: null };
}
function goGambitOrBattle(){
  if(!hasEnergyFor(ENERGY_COST_PER_BATTLE)) return;
  if(augmentOfferPending()){
    rollAugmentChoices();
    state.screen = 'augment';
    render();
    return;
  }
  if(isHardFight(state.stage)){
    rollGambitChoices();
    state.screen = 'gambit';
    render();
  } else {
    beginBattle();
  }
}
function pickGambit(id){
  if(!state.gambit || state.gambit.picked || state.gambit.choices.indexOf(id)<0) return;
  state.gambit.picked = id;
  beginBattle();
}
function cancelGambit(){ state.gambit = null; state.screen = 'hub'; render(); }
function renderGambit(){
  const g = state.gambit;
  if(!g){ state.screen = 'hub'; return renderHub(); }
  const cards = g.choices.map(id=>{
    const gm = GAMBITS[id];
    return `<button class="btn" style="text-align:left; padding:14px; margin-bottom:8px; width:100%; height:auto;" onclick="pickGambit('${id}')">
      <div style="font-weight:bold; color:var(--gold);">${gm.name}</div>
      <div class="dim" style="font-size:13px; margin-top:4px; white-space:normal;">${gm.desc}</div>
    </button>`;
  }).join('');
  return `
  <div class="panel">
    <h2 class="section">LOADOUT GAMBIT</h2>
    <p class="dim">This one's a hard fight. Pick one edge to carry into it — every choice cuts both ways, and it only lasts this battle.</p>
  </div>
  <div class="panel">${cards}</div>
  <div class="panel footer-nav"><button class="btn" onclick="cancelGambit()">← Back to Hub</button></div>`;
}

/* ================= DRAFT AUGMENTS =================
   Every legion pauses three times across the surface campaign — entering
   Stage 3, 6 and 8, all ordinary (non-boss, non-warlord) stages, chosen to
   miss the surface bosses at 5/7/9/10 entirely — to draft one permanent,
   legion-shaping perk from a pool of five. Different from both existing
   "pick something" systems on purpose: Loadout Gambit is blind, one battle
   only, and only ever appears before a hard fight; Commander Rank is
   automatic, fixed by level, and account-wide forever. This is a seen,
   deliberate, per-legion choice that compounds for the rest of the run —
   and, like the roster and formation it's chosen alongside, it does not
   survive a Rebirth (see doRebirth).
   Every augment hooks into an existing, already-tested per-unit modifier
   point in buildPlayerUnits (or the rosterCap chain) — nothing here is a
   new battle mechanic, just another quiet, permanent multiplier alongside
   the ones already there (traits, blessings, Gambit, Rebirth's own bonus). */
const AUGMENTS = {
  first_strike:    { name:'First Strike',     desc:"Every unit's very first hit each battle lands as a guaranteed critical." },
  pre_charged:     { name:'Pre-Charged Cores', desc:'Every skill comes off cooldown one turn sooner, all battle, every battle.' },
  extended_muster: { name:'Extended Muster',   desc:'+1 roster slot cap for this legion.' },
  hardened_line:   { name:'Hardened Line',     desc:"+8% DEF to your whole legion." },
  keen_edge:       { name:'Keen Edge',         desc:'+6% critical hit chance for your whole legion.' },
};
const AUGMENT_IDS = Object.keys(AUGMENTS);
const DRAFT_AUGMENT_STAGES = [3, 6, 8];
function hasAugment(key){ return !!(state.augments && state.augments[key]); }
function augmentStageClaimed(stage){ return !!(state.augmentStagesOffered && state.augmentStagesOffered[stage]); }
function augmentOfferPending(){
  return DRAFT_AUGMENT_STAGES.indexOf(state.stage)>=0 && !augmentStageClaimed(state.stage);
}
function rollAugmentChoices(){
  const pool = AUGMENT_IDS.filter(id=>!hasAugment(id));
  const choices = [];
  while(choices.length<3 && pool.length){
    const i = Math.floor(Math.random()*pool.length);
    choices.push(pool.splice(i,1)[0]);
  }
  state.augmentDraft = { stage: state.stage, choices };
}
function pickAugment(id){
  const d = state.augmentDraft;
  if(!d || d.choices.indexOf(id)<0) return;
  state.augments = state.augments || {};
  state.augments[id] = true;
  state.augmentStagesOffered = state.augmentStagesOffered || {};
  state.augmentStagesOffered[d.stage] = true;
  state.augmentDraft = null;
  autosave();
  beginBattle();
}
function cancelAugmentDraft(){ state.augmentDraft = null; state.screen = 'hub'; render(); }
function renderAugmentDraft(){
  const d = state.augmentDraft;
  if(!d){ state.screen = 'hub'; return renderHub(); }
  const cards = d.choices.map(id=>{
    const a = AUGMENTS[id];
    return `<button class="btn" style="text-align:left; padding:14px; margin-bottom:8px; width:100%; height:auto;" onclick="pickAugment('${id}')">
      <div style="font-weight:bold; color:var(--gold);">${a.name}</div>
      <div class="dim" style="font-size:13px; margin-top:4px; white-space:normal;">${a.desc}</div>
    </button>`;
  }).join('');
  return `
  <div class="panel">
    <h2 class="section">🎴 DRAFT AN AUGMENT</h2>
    <p class="dim">Pick one permanent, legion-shaping perk. It stays with this legion for the rest of the run — until it's reborn.</p>
  </div>
  <div class="panel">${cards}</div>
  <div class="panel footer-nav"><button class="btn" onclick="cancelAugmentDraft()">← Back to Hub</button></div>`;
}

function beginBattle(){
  // Energy: charged the instant a campaign battle actually begins. Every
  // caller already refused before reaching this point if energy fell
  // short (see goGambitOrBattle/beginRedeploy/beginDetour/beginUndercroft),
  // so this is expected to always succeed in practice.
  if(isCampaignBattle()) spendEnergy(ENERGY_COST_PER_BATTLE);
  const terrain = terrainForStage(state.stage);
  const adapted = currentAdaptation();
  // Hardened Steel plates against your strongest element even before the
  // Rustbound have any intel on you — otherwise the handicap does nothing early.
  const platingElem = adapted || (hasMod('hardened') ? deployedDominantElement() : null);
  const usePlating = (platingActive() || hasMod('hardened')) && !!platingElem;
  const playerUnits = buildPlayerUnits(terrain);   // reads state.gambit.picked internally, if set
  let mercenaryFielded = null;
  if(state.mercenary && mercenaryEligibleBattle()){
    const mercUnit = buildMercenaryUnit(terrain);
    if(mercUnit){
      playerUnits.push(mercUnit);
      mercenaryFielded = { speciesId: mercUnit.speciesId, name: mercUnit.name, emoji: mercUnit.emoji };
      refreshSynergies(playerUnits, true);   // recompute now that the mercenary has joined the line
    }
    state.mercenary = null;   // spent the instant it's fielded — one deployment, win or lose
  }
  const duel = state.duel;
  const gambitId = (state.gambit && state.gambit.picked) || null;
  state.gambit = null;   // one-time: already folded into playerUnits above and state.battle.gambit below
  state.battle = {
    playerUnits,
    enemyUnits: duel ? buildDuelUnits(duel.formation, terrain)
                     : buildEnemyUnits(state.stage, terrain, adapted, usePlating, platingElem),
    terrain, adapted, plating: usePlating ? platingElem : null,
    queue: [], qIndex: 0, gauge: 0,
    log: [], actionLog: [], pendingAction: null, result: null,
    elemDamage: {},
    totalDamage: 0,
    terrainShifts: 0,
    awaitingInput: false,
    synLabels: { front:null, back:null },
    dmgByUnitId: {},
    killsBySpecies: {},
    lastKillId: null,
    lowestSurvivorPct: null,
    lowestSurvivorId: null,
    gambit: gambitId,
    reinforced: false,
    mercenary: mercenaryFielded,
    benchAtStart: benchRoster().map(m=>m.uid),
  };
  state.battle.synLabels = {
    front: (playerUnits.find(u=>u.row==='front')||{}).synergyLabel || null,
    back:  (playerUnits.find(u=>u.row==='back') ||{}).synergyLabel || null,
  };
  const bossDef = bossForStage(state.stage);
  if(tutorialActive()){ state.battle.gauge = 30; logMsg('Training deployment: a scouting pair, lightly armed.'); }
  logMsg(bossDef ? `${bossDef.intro} (${terrain.name})`
                 : `${isEliteStage(state.stage)?'An ELITE wave':'Wave '+state.stage} approaches under ${terrain.name}!`);
  playerUnits.filter(u=>u.mentorVeteran).forEach(vet=>{
    const rookie = playerUnits.find(x=>x.id===vet.mentorPartnerId);
    if(rookie) logMsg(`🎓 ${vet.emoji} ${vet.name} mentors ${rookie.emoji} ${rookie.name} — bonus EXP for the rookie, a sharper edge for the veteran.`);
  });
  if(bossDef && bossDef.parts) logMsg(`⚔ No shield this time: ${bossDef.parts.map(p=>p.name).join(' and ')} are both exposed and both targetable from the start.`);
  else if(bossDef) logMsg(`🛡 ${bossDef.name} is shielded while any ${bossDef.genName} stands.`);
  if(!adapted && usePlating && platingElem){
    logMsg(`▣ Hardened Steel: every Rustbound unit is plated against ${platingElem} (−${Math.round(platingPct()*100)}%).`);
  }
  if(adapted){
    const dom = deployedDominantElement();
    if(usePlating) logMsg(`📡 Rustbound units deploy ${platingElem}-counter plating (−${Math.round(platingPct()*100)}% ${platingElem} damage).`);
    if(dom && dom!==adapted){
      state.battle.gauge = 30;
      logMsg(`🎭 AMBUSH! They braced for a ${adapted} assault — your ${dom} legion catches them cold. Gauge +30%!`);
    } else {
      logMsg(`📡 The Rustbound anticipated your ${adapted} legion.`);
    }
  }
  if(codexBonusActive('terrains') && state.battle.gauge<100){
    state.battle.gauge = Math.min(100, state.battle.gauge + 10);
    logMsg(`🗺 Terrain Mastery: every battlefield charted — Legion Gauge starts +10%.`);
  }
  if(gambitId){
    const gm = GAMBITS[gambitId];
    logMsg(`🎲 Loadout Gambit — ${gm.name}: ${gm.desc}`);
  }
  codexRecordBattle();
  state.screen = 'battle';
  audioResume();
  if(audio.music) musicStart();
  startRound();
}

function logMsg(msg){
  state.battle.log.unshift(msg);
  if(state.battle.log.length>40) state.battle.log.pop();
}
/* ---- Replay Playback: a compact structured record of every attack, kept
   alongside the prose log above for Battle Replays to actually re-enact
   turn-by-turn later (see REPLAY PLAYBACK below). Capped generously but
   firmly — first-N, not a rolling window — so a fight that runs unusually
   long (a dragged-out Reinforcement Wave, a long Foundry Core siege) simply
   stops recording past the cap rather than growing the save file forever;
   the replay is honest about showing only the opening portion when that
   happens, same "capped, never crashes" restraint as everything else here. */
const REPLAY_LOG_CAP = 120;
function recordReplayAction(rec){
  if(!state.battle) return;
  if(!Array.isArray(state.battle.actionLog)) state.battle.actionLog = [];
  if(state.battle.actionLog.length >= REPLAY_LOG_CAP) return;
  state.battle.actionLog.push(rec);
}
function aliveUnits(){ return state.battle.playerUnits.concat(state.battle.enemyUnits).filter(u=>!u.fainted); }
function effectiveSpd(u){ return (u.status && u.status.type==='slow') ? Math.round(u.spd*0.7) : u.spd; }

/* ---- Reinforcement Wave: a fight that drags on too long risks a second,
   smaller Rustbound squad rushing in from the enemy's back row — a
   mechanical consequence of taking too long, not a telegraphed choice, so
   unlike Trials/Redeployment there's no pre-battle banner for it. Fires at
   most once per battle, and only in an ordinary campaign or Deep wave:
   never against a shielded commander (already its own kind of long fight,
   with pylons and a reboot to manage), never in a duel (would break the
   fairness of a formation-vs-formation fight), and never in a raid or
   Trial, each of which already runs its own separate difficulty layer. A
   Redeployment is still eligible — it's a real fight in every other sense,
   so dragging it out should still carry the same risk. */
const REINFORCE_MIN_ROUND = 6;
const REINFORCE_CHANCE = 0.3;
const REINFORCE_STAT_MULT = 0.6;   // "smaller" — noticeably weaker than the wave itself, not a full-strength pile-on
function reinforcementsEligible(){
  if(state.duel || state.raidRun || state.worldBossRun || state.guildWarRun || state.trial || tutorialActive()) return false;
  return !bossForStage(state.stage);
}
function maybeSpawnReinforcements(){
  const b = state.battle;
  if(!b || b.reinforced || b.rounds < REINFORCE_MIN_ROUND) return;
  if(!reinforcementsEligible()){ b.reinforced = true; return; }   // never eligible this battle; stop re-checking every round
  if(Math.random() >= REINFORCE_CHANCE) return;
  b.reinforced = true;
  const stage = state.stage;
  let mult = 1 + (stage-1)*0.14;
  if(isEliteStage(stage)) mult *= 1.25;
  mult *= REINFORCE_STAT_MULT;
  const count = 1 + (Math.random()<0.35 ? 1 : 0);
  const names = [];
  for(let n=0;n<count;n++){
    const id = pickEnemySpecies(b.adapted);
    const sd = ENEMY_SPECIES[id];
    const hp = Math.max(1, Math.round(sd.base.hp*mult));
    const unit = Object.assign(baseUnitDefaults(), {
      id:'e_r'+n+'_'+id, side:'enemy', row:'back', speciesKey:id, isReinforcement:true,
      name:sd.name, emoji:sd.emoji, sprite:sd.sprite, element:sd.element, elements:[sd.element],
      attackElements:[sd.element], skillName:sd.skill,
      bHp:hp, bAtk:Math.max(1,Math.round(sd.base.atk*mult)), bDef:Math.max(1,Math.round(sd.base.def*mult)), bSpd:Math.max(1,Math.round(sd.base.spd*mult)),
      maxHp:hp, hp:hp,
      atk:Math.max(1,Math.round(sd.base.atk*mult)), def:Math.max(1,Math.round(sd.base.def*mult)), spd:Math.max(1,Math.round(sd.base.spd*mult)),
      skillCd:0, skillMaxCd:3, fainted:false,
    });
    if(b.plating){ unit.plating = b.plating; unit.platingPct = platingPct(); }
    applyTerrainToUnit(unit, b.terrain);
    unit.atk = unit.bAtk; unit.def = unit.bDef; unit.spd = unit.bSpd;
    unit.maxHp = unit.bHp; unit.hp = unit.bHp;
    b.enemyUnits.push(unit);
    names.push(unit.name);
  }
  logMsg(`🚨 REINFORCEMENTS! The fight's dragged on too long — ${names.join(' and ')} rush${count>1?'':'es'} in from the Rustbound's back row!`);
}

function startRound(){
  const b = state.battle;
  if(!b || b.result) return;
  b.rounds = (b.rounds||0) + 1;
  maybeSpawnReinforcements();
  b.focusId = null;
  if(tacticalOn()){ beginPlanning(); }
  b.queue = aliveUnits().sort((a,c)=> effectiveSpd(c) - effectiveSpd(a) + (Math.random()-0.5));
  b.qIndex = 0;
  if(b.planning){ render(); return; }   // wait for the player to write orders
  nextTurn();
}
function battleActive(b){ return state.battle && state.battle===b && !b.result; }
function checkBattleEnd(){
  const b = state.battle;
  if(!b || b.result) return true;
  if(b.enemyUnits.every(u=>u.fainted)){ endBattle('win'); return true; }
  if(b.playerUnits.every(u=>u.fainted)){ endBattle('lose'); return true; }
  return false;
}

function setStatus(unit, type, turns){
  if(type==='burn' && unit.burnImmune){ logMsg(`${unit.emoji} ${unit.name} is immune to burn!`); return; }
  if(type==='slow' && unit.slowImmune){ logMsg(`${unit.emoji} ${unit.name} resists the slow!`); return; }
  if(type==='stun' && unit.stunImmune){ logMsg(`${unit.emoji} ${unit.name} shrugs off the shock!`); return; }
  if(unit.resilient && turns>1) turns = Math.max(1, Math.round(turns*0.75));
  unit.status = { type, turnsLeft: turns };
  const icon = type==='burn'?'🔥':type==='slow'?'🐌':'💫';
  logMsg(`${icon} ${unit.emoji} ${unit.name} is afflicted with ${type}!`);
}

function tickStatusStart(unit){
  let skip = false;
  if(unit.regen && !unit.fainted){
    const heal = Math.max(1, Math.round(unit.maxHp*unit.regen));
    unit.hp = Math.min(unit.maxHp, unit.hp+heal);
    fx(unit.id, '+' + heal, 'heal');
    logMsg(`🌿 ${unit.emoji} ${unit.name} regenerates ${heal} HP.`);
  }
  if(unit.status){
    if(unit.status.type==='burn'){
      const dmg = Math.max(1, Math.round(unit.maxHp*0.05));
      unit.hp = Math.max(0, unit.hp-dmg);
      logMsg(`🔥 ${unit.emoji} ${unit.name} takes ${dmg} burn damage.`);
      if(unit.hp<=0){ unit.fainted=true; logMsg(`${unit.emoji} ${unit.name} succumbs to its burns!`); if(unit.side==='enemy') onEnemyFainted(unit); }
    } else if(unit.status.type==='stun'){
      logMsg(`💫 ${unit.emoji} ${unit.name} is stunned and can't act!`);
      skip = true;
    }
    unit.status.turnsLeft--;
    if(unit.status.turnsLeft<=0) unit.status=null;
  }
  if(!skip && !unit.fainted && unit.glitchChance && Math.random()<unit.glitchChance){
    skip = true;
    const allies = state.battle.playerUnits.filter(u=>!u.fainted && u.id!==unit.id);
    if(unit.defectChance && allies.length>0 && Math.random()<unit.defectChance){
      const victim = allies[Math.floor(Math.random()*allies.length)];
      logMsg(`☢️ RUST DEFECTION! ${unit.emoji} ${unit.name}'s grafts seize control!`);
      sfx('glitch'); shake(true);
      applyDamage(unit, victim, false);
    } else {
      logMsg(`⚙️ RUST GLITCH! ${unit.emoji} ${unit.name} locks up and loses its turn.`);
      sfx('glitch'); fx(unit.id, 'SEIZED', 'miss');
    }
  }
  if(unit.taunt>0) unit.taunt--;
  return skip;
}

function nextTurn(){
  const b = state.battle;
  if(!b || b.result) return;
  b.awaitingInput = false;
  applySynergyRefresh();
  if(checkBattleEnd()) return;
  if(b.qIndex >= b.queue.length){ startRound(); return; }
  const unit = b.queue[b.qIndex];
  if(unit.fainted){ b.qIndex++; nextTurn(); return; }
  const stunned = tickStatusStart(unit);
  render();
  if(checkBattleEnd()) return;
  if(unit.fainted){ b.qIndex++; setTimeout(nextTurn, 300); return; }
  if(stunned){ setTimeout(()=>{ if(!battleActive(b)) return; b.qIndex++; render(); nextTurn(); }, 600); return; }
  if(unit.side==='enemy'){
    setTimeout(()=>{
      if(!battleActive(b)) return;
      enemyAct(unit); b.qIndex++; render();
      if(!checkBattleEnd()) setTimeout(nextTurn, 550);
    }, 500);
    return;
  }
  // player's turn
  if(tacticalOn() && b.orders && b.orders[unit.id]){
    setTimeout(()=>{
      if(!battleActive(b)) return;
      runOrder(unit);
      b.qIndex++;
      render();
      if(!checkBattleEnd()) setTimeout(nextTurn, 420);
    }, 380);
    return;
  }
  b.awaitingInput = true;
  render();
}

function getValidTargets(unit){
  const b = state.battle;
  let opponents = (unit.side==='player' ? b.enemyUnits : b.playerUnits).filter(u=>!u.fainted);
  const reachable = opponents.filter(u=>!u.shielded);
  if(reachable.length) opponents = reachable;   // never leave a side with nothing to hit
  const taunters = opponents.filter(u=>u.taunt>0);
  if(unit.row==='front' && taunters.length>0) return taunters;
  const front = opponents.filter(u=>u.row==='front');
  const back = opponents.filter(u=>u.row==='back');
  if(unit.row==='front') return front.length>0 ? front : back;
  return front.concat(back);
}

function computeDamage(attacker, defender, isSkill, forceCrit){
  const baseAtk = isSkill ? attacker.atk*1.6 : attacker.atk;
  let dmg = Math.max(1, Math.round(baseAtk - defender.def*0.5));
  const m = multiplierVs(attacker, defender);
  const strikeElem = m.elem;
  dmg = Math.round(dmg * m.mult);
  let plated = false;
  if(defender.plating && strikeElem===defender.plating){
    dmg = Math.max(1, Math.round(dmg*(1-defender.platingPct)));
    plated = true;
  }
  if(attacker.baneElem){
    const dl2 = (defender.elements && defender.elements.length) ? defender.elements : [defender.element];
    if(dl2.indexOf(attacker.baneElem)>=0) dmg = Math.round(dmg*1.15);
  }
  if(hasMod('glass')) dmg = Math.round(dmg*1.5);
  /* Loadout Gambit: a one-battle, self-chosen edge (see beginBattle/rollGambitChoices). */
  const gambit = state.battle && state.battle.gambit;
  if(gambit==='overclock' && attacker.side==='player') dmg = Math.round(dmg*0.92);
  if(gambit==='focused_fire' && attacker.side==='player'){
    dmg = Math.round(dmg * (defender.hp < defender.maxHp*0.5 ? 1.10 : 0.94));
  }
  let crit = false;
  if(forceCrit || Math.random() < 0.12 + (attacker.critBonus||0) + (defender.critVulnerability||0)){ dmg = Math.round(dmg*1.5); crit = true; }
  return { dmg, crit, plated, strikeElem };
}

function spendGauge(cost){
  const b = state.battle;
  b.gauge = Math.max(0, b.gauge - cost);
}
/* Shifts a unit's rust up or down and re-derives its glitch behaviour. */
function applyRust(unit, delta){
  unit.corruption = Math.max(0, unit.corruption + delta);
  const t = corrTier(unit.corruption);
  unit.glitchChance = t.glitch;
  unit.defectChance = t.defect;
}

/* Reactive terrain: enough of one element and the battlefield takes on its character. */
function checkTerrainShift(){
  const b = state.battle;
  if(!b || b.result) return;
  b.terrainShifts = b.terrainShifts || 0;
  if(b.terrainShifts >= MAX_TERRAIN_SHIFTS) return;
  let best = null, bestDmg = 0;
  Object.keys(b.elemDamage).forEach(e=>{
    if(b.elemDamage[e] > bestDmg){ bestDmg = b.elemDamage[e]; best = e; }
  });
  if(!best || bestDmg < TERRAIN_SHIFT_AT * (b.terrainShifts + 1)) return;
  const key = ELEM_TERRAIN[best];
  if(!key || !TERRAINS[key] || b.terrain === TERRAINS[key]) return;
  b.terrain = TERRAINS[key];
  b.terrainShifts++;
  b.playerUnits.concat(b.enemyUnits).forEach(u=>reapplyTerrain(u, b.terrain));
  refreshSynergies(b.playerUnits, false);
  b.enemyUnits.forEach(u=>{ u.atk=u.bAtk; u.def=u.bDef; u.spd=u.bSpd; u.maxHp=u.bHp; u.hp=Math.min(u.hp,u.maxHp); });
  sfx('gauge'); shake(false);
  logMsg(`🌎 The field turns — sustained ${best.toUpperCase()} has made this ${b.terrain.name}. ${b.terrain.desc}`);
}

/* ================= WIN STREAKS =================
   Reads state.streak (a signed counter The Camp already maintains from real
   stage results — see endBattle's fall-through tail) rather than keeping a
   second one: winStreakLevel() just clamps it to "consecutive wins, 0 if
   the legion is mid-loss-streak or hasn't fought yet" for mechanical use, so
   Camp's flavour text and this bonus can never drift apart. Two quiet, small
   effects that build with a clean run and vanish the instant a single loss
   resets state.streak back to -1 — nothing that swings a fight on its own,
   just real momentum for the back half of a good run. */
const WIN_STREAK_CAP = 5;              // consecutive wins beyond this add nothing more
const WIN_STREAK_GAUGE_PER = 0.02;     // +2% Legion Gauge gain per streak level (max +10%)
const WIN_STREAK_SALVAGE_PER = 0.02;   // +2% chance at the ordinary ungated salvage roll, per level (max +10%)
function winStreakLevel(){ return Math.max(0, Math.min(WIN_STREAK_CAP, state.streak||0)); }
function chargeGauge(amount){
  const b = state.battle;
  if(activeBlessing()==='volt') amount *= 1.25;
  if(hasPerk('gauge')) amount *= 1.15;
  if(b.gambit==='overclock') amount *= 1.25;
  if(b.gambit==='bulwark') amount *= 0.85;
  amount *= 1 + WIN_STREAK_GAUGE_PER*winStreakLevel();
  const totalHp = b.playerUnits.reduce((s,u)=>s+u.maxHp,0);
  const curHp = b.playerUnits.reduce((s,u)=>s+(u.fainted?0:u.hp),0);
  const desperate = totalHp>0 && (curHp/totalHp) < 0.4;
  b.gauge = Math.min(100, b.gauge + amount*(desperate?1.5:1));
}

function applyDamage(attacker, defender, isSkill){
  if(attacker.missChance && Math.random()<attacker.missChance){
    const missMsg = `🌫️ ${attacker.emoji} ${attacker.name}'s attack is swallowed by the storm and misses!`;
    logMsg(missMsg);
    sfx('miss'); fx(defender.id, 'MISS', 'miss');
    fxMotion(attacker, defender, null, false);
    recordReplayAction({ a:attacker.id, d:defender.id, miss:true, msg:missMsg });
    return;
  }
  if(defender.dodge && Math.random()<defender.dodge){
    const dodgeMsg = `💨 ${defender.emoji} ${defender.name} dodges the attack!`;
    logMsg(dodgeMsg);
    sfx('miss'); fx(defender.id, 'DODGE', 'miss');
    fxMotion(attacker, defender, null, false);
    recordReplayAction({ a:attacker.id, d:defender.id, dodge:true, msg:dodgeMsg });
    return;
  }
  const forceCrit = !!(attacker.gambitFirstCrit && !attacker.gambitFirstCritUsed);
  const {dmg, crit, plated, strikeElem} = computeDamage(attacker, defender, isSkill, forceCrit);
  if(forceCrit) attacker.gambitFirstCritUsed = true;
  let finalDmg = dmg, note = '';
  if(plated) note += ' (counter-plating holds)';
  if(defender.shield){ defender.shield=false; finalDmg=0; note=' — shield absorbs it!'; }
  else if(defender.firstHitReduction && !defender.firstHitUsed){ defender.firstHitUsed=true; finalDmg=Math.round(finalDmg*0.5); note += ' (tide ward halves the blow)'; }
  const defenderHpBeforeHit = defender.hp;
  defender.hp = Math.max(0, defender.hp-finalDmg);
  if(defender.hp<=0) defender.fainted = true;
  fxMotion(attacker, defender, strikeElem, finalDmg>0);
  if(finalDmg > 0){
    fx(defender.id, '-' + finalDmg + (crit ? '!' : ''), crit ? 'crit' : (defender.side==='player' ? 'hurt' : 'dmg'));
    sfx(crit ? 'crit' : (isSkill ? 'skill' : 'hit'));
    if(crit || (defender.side==='player' && finalDmg > defender.maxHp*0.25)) shake(crit);
  } else {
    fx(defender.id, 'BLOCK', 'miss'); sfx('shield');
  }
  if(defender.fainted) sfx('faint');
  const verb = isSkill ? attacker.skillName : 'attacks';
  const dual = (attacker.attackElements && attacker.attackElements.length>1) ? ` [${strikeElem}]` : '';
  const hitMsg = `${attacker.emoji} ${attacker.name} ${isSkill?'uses '+verb+' on':verb} ${defender.emoji} ${defender.name}${dual} for ${finalDmg}${crit?' (CRIT!)':''}${note}${defender.fainted?' — defeated!':''}`;
  logMsg(hitMsg);
  recordReplayAction({ a:attacker.id, d:defender.id, dmg:finalDmg, crit:!!crit, faint:!!defender.fainted, elem:strikeElem, msg:hitMsg });

  if(attacker.side==='player' && defender.side==='enemy' && finalDmg>0){
    const b = state.battle;
    b.elemDamage[strikeElem] = (b.elemDamage[strikeElem]||0) + finalDmg;
    b.totalDamage = (b.totalDamage||0) + finalDmg;
    b.dmgByUnitId[attacker.id] = (b.dmgByUnitId[attacker.id]||0) + finalDmg;
    checkTerrainShift();
  }
  if(attacker.side==='player' && finalDmg>0) chargeGauge(finalDmg/3);
  if(defender.side==='player' && finalDmg>0) chargeGauge(finalDmg/5);
  /* War Journal: the closest a player unit came to fainting this battle. */
  if(defender.side==='player' && finalDmg>0 && defender.hp>0){
    const b = state.battle;
    const pct = defender.hp / defender.maxHp;
    if(b.lowestSurvivorPct===null || pct < b.lowestSurvivorPct){
      b.lowestSurvivorPct = pct; b.lowestSurvivorId = defender.id;
    }
  }

  if(defender.fainted && defender.side==='enemy'){
    onEnemyFainted(defender);
    if(attacker.side==='player'){
      state.battle.lastKillId = attacker.id;
      if(attacker.speciesId && !attacker.isMercenary){
        const kb = state.battle.killsBySpecies || (state.battle.killsBySpecies = {});
        kb[attacker.speciesId] = (kb[attacker.speciesId]||0) + 1;
      }
      if(attacker.monsterUid){
        const ku = state.battle.killsByUnit || (state.battle.killsByUnit = {});
        ku[attacker.monsterUid] = (ku[attacker.monsterUid]||0) + 1;
      }
    }
  }
  /* Cascade Overkill: a killing blow that did more than it needed to splashes
     the leftover damage into the next living unit in that same row (either
     side — this isn't a player-only perk). One hop only, no further chaining
     even if the splash also overkills, and it bypasses the normal to-hit
     rules entirely (no dodge/miss/crit roll of its own) since it's the same
     blow's own overflow, not a fresh attack. */
  if(defender.fainted && finalDmg > defenderHpBeforeHit){
    const overflow = finalDmg - defenderHpBeforeHit;
    const splash = cascadeTarget(defender);
    if(splash) applyCascadeOverflow(attacker, splash, overflow, strikeElem);
  }
  if(!defender.fainted && finalDmg>0){
    if(attacker.burnOnHit && Math.random()<attacker.burnOnHit) setStatus(defender,'burn',3);
    if(attacker.stunOnHit && Math.random()<attacker.stunOnHit) setStatus(defender,'stun',1);
    if(isSkill){
      if(strikeElem==='fire' && Math.random()<0.4) setStatus(defender,'burn',3);
      else if(strikeElem==='water' && Math.random()<0.4) setStatus(defender,'slow',2);
      else if(strikeElem==='volt' && Math.random()<0.45) setStatus(defender,'stun',1);
    }
  }
  if(isSkill){
    if(strikeElem==='earth'){ attacker.taunt=2; logMsg(`🪨 ${attacker.emoji} ${attacker.name} braces and draws the enemy's aim!`); }
    else if(strikeElem==='nature'){ attacker.shield=true; logMsg(`🌿 ${attacker.emoji} ${attacker.name} wraps itself in thorns!`); }
    else if(strikeElem==='wind' && Math.random()<0.4){ attacker.shield=true; logMsg(`🌪️ ${attacker.emoji} ${attacker.name} whips up an evasive gust!`); }
    if(attacker.backfireChance && Math.random()<attacker.backfireChance){
      const allies = (attacker.side==='player'? state.battle.playerUnits : state.battle.enemyUnits).filter(u=>!u.fainted && u.id!==attacker.id);
      if(allies.length>0){
        const ally = allies[Math.floor(Math.random()*allies.length)];
        const backDmg = Math.max(1, Math.round(dmg*0.3));
        ally.hp = Math.max(0, ally.hp-backDmg);
        if(ally.hp<=0){ ally.fainted = true; if(ally.side==='enemy') onEnemyFainted(ally); }
        logMsg(`⚡ Short circuit! ${ally.emoji} ${ally.name} also takes ${backDmg} damage.`);
      }
    }
  }
}

/* ---- Cascade Overkill ----
   Finds the next living unit in the same row as a just-defeated unit, using
   the row-mate's position in the battle's own side array (which preserves
   front-then-back, slot-then-slot build order for both buildPlayerUnits and
   buildEnemyUnits) — so "next" means "the next slot over," not a random
   pick. Returns null if the defeated unit was the last of its row still
   standing, in which case the overflow simply vanishes as it always did. */
function cascadeTarget(defender){
  const b = state.battle; if(!b) return null;
  const side = defender.side==='player' ? b.playerUnits : b.enemyUnits;
  const idx = side.indexOf(defender);
  if(idx<0) return null;
  for(let i=idx+1; i<side.length; i++){
    const u = side[i];
    if(u.row===defender.row && !u.fainted) return u;
  }
  return null;
}
/* The overflow is already-resolved damage from the original hit, so it skips
   the normal to-hit pipeline entirely (no miss/dodge/plating/crit roll of
   its own) and never chains further, even if it also overkills its target —
   a two-for-one, not a domino run down the whole row. */
function applyCascadeOverflow(attacker, target, overflow, strikeElem){
  if(!target || target.fainted || overflow<1) return;
  const dmg = overflow;
  target.hp = Math.max(0, target.hp - dmg);
  if(target.hp<=0) target.fainted = true;
  fx(target.id, '⚡-' + dmg, 'crit');
  sfx('crit');
  const cascadeMsg = `💥 The blow cascades — ${target.emoji} ${target.name} takes ${dmg} overflow damage${target.fainted?' — defeated!':''}!`;
  logMsg(cascadeMsg);
  recordReplayAction({ a:attacker.id, d:target.id, dmg, crit:false, faint:!!target.fainted, elem:strikeElem, cascade:true, msg:cascadeMsg });
  if(attacker.side==='player' && target.side==='enemy'){
    const b = state.battle;
    b.elemDamage[strikeElem] = (b.elemDamage[strikeElem]||0) + dmg;
    b.totalDamage = (b.totalDamage||0) + dmg;
    b.dmgByUnitId[attacker.id] = (b.dmgByUnitId[attacker.id]||0) + dmg;
  }
  if(attacker.side==='player' && target.side==='enemy') chargeGauge(dmg/3);
  if(target.side==='player') chargeGauge(dmg/5);
  if(target.side==='player' && target.hp>0){
    const b = state.battle;
    const pct = target.hp / target.maxHp;
    if(b.lowestSurvivorPct===null || pct < b.lowestSurvivorPct){
      b.lowestSurvivorPct = pct; b.lowestSurvivorId = target.id;
    }
  }
  if(target.fainted && target.side==='enemy'){
    onEnemyFainted(target);
    if(attacker.side==='player'){
      state.battle.lastKillId = attacker.id;
      if(attacker.speciesId && !attacker.isMercenary){
        const kb = state.battle.killsBySpecies || (state.battle.killsBySpecies = {});
        kb[attacker.speciesId] = (kb[attacker.speciesId]||0) + 1;
      }
      if(attacker.monsterUid){
        const ku = state.battle.killsByUnit || (state.battle.killsByUnit = {});
        ku[attacker.monsterUid] = (ku[attacker.monsterUid]||0) + 1;
      }
    }
  }
}

/* ================= RUSTBOUND TACTICS =================
   The machines get the player's own verbs. Intelligence is tiered by stage so
   the opening hours keep the balance they were tuned at, and the Deep fights back.
   ===================================================== */
const AI_BASIC = 0, AI_TACTICAL = 1, AI_COORDINATED = 2;
function aiTier(){
  if(state.duel) return AI_COORDINATED;            // a real player's formation deserves a real fight
  const st = state.stage;
  if(bossForStage(st) || isDeep(st)) return AI_COORDINATED;
  if(st >= 4) return AI_TACTICAL;
  return AI_BASIC;
}
/* Pure: no RNG, no mutation. Used for deciding, never for resolving. */
function estimateDamage(attacker, defender, isSkill){
  const baseAtk = isSkill ? attacker.atk*1.6 : attacker.atk;
  let dmg = Math.max(1, Math.round(baseAtk - defender.def*0.5));
  const m = multiplierVs(attacker, defender);
  dmg = Math.round(dmg * m.mult);
  if(defender.plating && m.elem===defender.plating) dmg = Math.max(1, Math.round(dmg*(1-defender.platingPct)));
  if(attacker.baneElem){
    const dl = (defender.elements&&defender.elements.length)?defender.elements:[defender.element];
    if(dl.indexOf(attacker.baneElem)>=0) dmg = Math.round(dmg*1.15);
  }
  return dmg;
}
function scoreTarget(attacker, target, tier){
  if(target.shielded) return -Infinity;              // untouchable while its pylons stand
  const dmg = estimateDamage(attacker, target, false);
  let s = dmg;
  if(dmg >= target.hp) s += 500;                     // secure the kill
  if(tier >= AI_TACTICAL){
    s += target.atk * 2;                             // silence the dangerous one
    if(target.synergyLabel) s += 30;                 // breaking a line is worth more than raw damage
    s += (1 - target.hp/Math.max(1,target.maxHp)) * 40;
    if(target.shield) s -= 25;                       // a blow into a shield is wasted
    if(target.dodge) s -= target.dodge * 60;
  }
  if(tier >= AI_COORDINATED && state.battle && state.battle.focusId===target.id) s += 60;  // pile on
  return s;
}
function decideSkill(unit, target, tier){
  if(unit.skillCd > 0) return false;
  if(tier === AI_BASIC) return Math.random() < 0.5;
  const basic = estimateDamage(unit, target, false);
  const skill = estimateDamage(unit, target, true);
  if(basic >= target.hp) return false;               // a basic finishes it — hold the skill
  if(skill >= target.hp) return true;                // the skill closes it — spend now
  if(target.shield) return false;                    // it would be absorbed
  return Math.random() < 0.75;
}
/* A wounded machine falls back behind its own line — once, and never leaving the front empty. */
function enemyTryShift(unit){
  const b = state.battle;
  if(!b || unit.isBoss || unit.isGenerator) return false;
  if(unit.row !== 'front' || unit.shiftedOnce) return false;
  if(unit.hp / Math.max(1,unit.maxHp) > 0.3) return false;
  const back = b.enemyUnits.filter(u=>u.row==='back' && !u.fainted);
  const frontOthers = b.enemyUnits.filter(u=>u.row==='front' && !u.fainted && u.id!==unit.id);
  if(frontOthers.length === 0) return false;          // never abandon the line

  if(back.length >= 3){
    // Back row full: trade with its healthiest reserve, the way the player must.
    const relief = back.filter(u=>!u.isBoss && !u.isGenerator)
                       .sort((a,c)=>(c.hp/Math.max(1,c.maxHp)) - (a.hp/Math.max(1,a.maxHp)))[0];
    if(!relief) return false;
    if(relief.hp / Math.max(1,relief.maxHp) < 0.5) return false;   // no point swapping in another cripple
    unit.shiftedOnce = true;
    relief.row = 'front';
    unit.row = 'back';
    sfx('shift');
    logMsg(`🔀 ${unit.emoji} ${unit.name} falls back; ${relief.emoji} ${relief.name} steps up to hold the line.`);
    return true;
  }

  unit.shiftedOnce = true;
  unit.row = 'back';
  sfx('shift');
  logMsg(`🔀 ${unit.emoji} ${unit.name} pulls back behind the line.`);
  return true;
}

function enemyAct(unit){
  if(unit.isBoss && unit.shielded){
    unit.repairCd--;
    if(unit.repairCd<=0){
      unit.repairCd = BOSS_REPAIR_EVERY;
      const downed = state.battle.enemyUnits.filter(u=>u.isGenerator && u.fainted);
      if(downed.length){
        const g = downed[Math.floor(Math.random()*downed.length)];
        g.fainted = false;
        g.hp = Math.max(1, Math.round(g.maxHp*0.5));
        g.status = null;
        logMsg(`🔧 ${unit.emoji} ${unit.name} reboots a ${g.name} at half power!`);
        render();
        return;
      }
    }
  }
  const tier = aiTier();
  if(tier >= AI_COORDINATED && enemyTryShift(unit)){ render(); return; }

  if(unit.skillCd>0) unit.skillCd--;
  const targets = getValidTargets(unit);
  if(targets.length===0) return;

  let target = targets[0], best = -Infinity;
  targets.forEach(t=>{
    const sc = scoreTarget(unit, t, tier);
    if(sc > best){ best = sc; target = t; }
  });
  if(tier >= AI_COORDINATED && state.battle) state.battle.focusId = target.id;

  const useSkill = decideSkill(unit, target, tier);
  if(useSkill) unit.skillCd = unit.skillMaxCd;
  applyDamage(unit, target, useSkill);
}

/* ================= TACTICAL MODE =================
   Optional. Instead of acting when each unit's turn arrives, you write orders for
   the whole legion at the start of the round and watch it play out. Orders survive
   their target dying — the unit retargets rather than wasting its turn.
   ================================================= */
function tacticalOn(){ return state.tactical === true && !tutorialActive(); }
function toggleTactical(){
  state.tactical = !state.tactical;
  sfx('click'); autosave(); render();
}
function planningOpen(){
  const b = state.battle;
  return !!(b && !b.result && tacticalOn() && b.planning);
}
function livingPlayerUnits(){
  const b = state.battle;
  return b ? b.playerUnits.filter(u=>!u.fainted) : [];
}
function beginPlanning(){
  const b = state.battle;
  if(!b || b.result || !tacticalOn()) return;
  b.planning = true;
  b.orders = {};
  b.planUnit = null;
  b.awaitingInput = false;
}
function planSelectUnit(id){
  const b = state.battle; if(!b || !b.planning) return;
  b.planUnit = (b.planUnit===id) ? null : id;
  b.planAction = null;
  sfx('click'); render();
}
function planChooseAction(kind){
  const b = state.battle; if(!b || !b.planning || !b.planUnit) return;
  const unit = b.playerUnits.find(u=>u.id===b.planUnit);
  if(!unit) return;
  if(kind==='shift'){
    b.orders[b.planUnit] = { kind:'shift' };
    b.planUnit = null; b.planAction = null;
    sfx('click'); render(); return;
  }
  b.planAction = kind;
  sfx('click'); render();
}
function planChooseTarget(targetId){
  const b = state.battle; if(!b || !b.planning || !b.planUnit || !b.planAction) return;
  b.orders[b.planUnit] = { kind:b.planAction, targetId };
  b.planUnit = null; b.planAction = null;
  sfx('click'); render();
}
function planClear(id){
  const b = state.battle; if(!b || !b.planning) return;
  delete b.orders[id];
  sfx('click'); render();
}
function planReady(){
  const b = state.battle; if(!b) return false;
  return livingPlayerUnits().every(u=>!!b.orders[u.id]);
}
function executePlan(){
  const b = state.battle;
  if(!b || !b.planning || !planReady()) return;
  b.planning = false;
  b.planUnit = null; b.planAction = null;
  sfx('gauge');
  render();
  nextTurn();
}
/* Carry out a standing order when the unit's turn comes round. */
function runOrder(unit){
  const b = state.battle;
  const order = b.orders ? b.orders[unit.id] : null;
  if(!order) return false;
  delete b.orders[unit.id];

  if(order.kind==='shift'){ doShiftAuto(unit); return true; }

  let target = b.enemyUnits.concat(b.playerUnits).find(u=>u.id===order.targetId);
  if(!target || target.fainted || target.shielded){
    const fallback = getValidTargets(unit);
    if(!fallback.length) return false;
    target = fallback.sort((a,c)=>a.hp-c.hp)[0];
    logMsg(`↷ ${unit.emoji} ${unit.name}'s mark is gone — it switches to ${target.emoji} ${target.name}.`);
  }
  const isSkill = order.kind==='skill' && unit.skillCd<=0;
  if(isSkill) unit.skillCd = unit.skillMaxCd;
  else if(unit.skillCd>0) unit.skillCd--;
  applyDamage(unit, target, isSkill);
  return true;
}
function doShiftAuto(unit){
