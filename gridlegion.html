<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Legion: Rise of the Rustbound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0b16;
    --bg2: #12132a;
    --panel: #181933;
    --panel-hi: #22244a;
    --border: #3d3f74;
    --text: #f2efe4;
    --dim: #9a9bc4;
    --fire: #ff6b4a;
    --water: #4ac8ff;
    --nature: #6ee7a0;
    --earth: #c99a5b;
    --volt: #ffe14d;
    --wind: #c9b8ff;
    --danger: #ff4a6b;
    --gold: #ffd166;
    --rust: #d97a3c;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 20px;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 14px 10px 40px;
  }
  .heading{ font-family:'Press Start 2P', monospace; }
  #app{ width: 100%; max-width: 640px; }
  .panel{
    background: var(--panel);
    border: 3px solid var(--border);
    box-shadow: 6px 6px 0 rgba(0,0,0,0.45);
    padding: 16px;
    margin-bottom: 14px;
  }
  h1.title{ font-size: 22px; line-height:1.6; color: var(--gold); text-shadow: 3px 3px 0 #000; margin: 6px 0 4px; }
  h2.section{ font-size: 14px; color: var(--wind); margin: 0 0 12px; letter-spacing: 1px; }
  p{ line-height:1.5; color: var(--text); }
  .dim{ color: var(--dim); }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{
    font-family:'VT323', monospace; font-size: 20px; background: var(--panel-hi); color: var(--text);
    border: 3px solid var(--border); padding: 10px 16px; cursor:pointer;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.45); transition: transform 0.05s;
  }
  .btn:hover{ background:#2a2c58; }
  .btn:active{ transform: translate(3px,3px); box-shadow: 1px 1px 0 rgba(0,0,0,0.45); }
  .btn.primary{ background: #3a2f6e; border-color: var(--gold); color: var(--gold); }
  .btn.danger{ border-color: var(--danger); color: var(--danger); }
  .btn.rust{ border-color: var(--rust); color: var(--rust); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn.small{ font-size:16px; padding:6px 10px; }
  .cost{ font-size:14px; opacity:0.75; }
  .trait-tag{ font-size:11px; color:var(--volt); border:1px solid var(--volt); padding:0 3px; margin-top:3px; line-height:1.3; }
  .tier3tag{ position:absolute; top:2px; right:2px; font-size:11px; color:var(--fire); }
  .elite-banner{ font-size:16px; color:var(--danger); border:1px dashed var(--danger); padding:8px; margin-bottom:10px; line-height:1.4; }
  .slotcard{ background:var(--bg2); border:2px solid var(--border); padding:10px; width:190px; }
  .slotname{ font-size:19px; color:var(--gold); }
  .testbox{ background:#000; border:2px solid var(--border); padding:8px; margin-top:10px; font-size:16px; line-height:1.5; }
  .tinput{
    font-family:'VT323', monospace; font-size:18px; width:100%; background:#000; color:var(--text);
    border:2px solid var(--border); padding:6px 8px; margin-top:4px;
  }
  .finale{ border-color: var(--gold); box-shadow: 0 0 18px 2px rgba(255,209,102,0.25), 6px 6px 0 rgba(0,0,0,0.45); }

  .mcard{
    background: var(--bg2); border: 2px solid var(--border); padding: 8px; width: 96px; text-align:center; cursor:pointer; position:relative;
  }
  .mcard.selected{ border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  .mcard .emoji{ font-size: 30px; line-height:1; }
  .mcard .name{ font-size:14px; margin-top:4px; height: 32px; overflow:hidden; }
  .mcard .lvl{ font-size:13px; color:var(--gold); }
  .mcard .tier2tag{ position:absolute; top:2px; right:2px; font-size:11px; color:var(--gold); }
  .elem-tag{ display:inline-block; font-size:11px; padding:1px 5px; margin-top:3px; border:1px solid; }
  .elem-fire{ color:var(--fire); border-color:var(--fire); }
  .elem-water{ color:var(--water); border-color:var(--water); }
  .elem-nature{ color:var(--nature); border-color:var(--nature); }
  .elem-earth{ color:var(--earth); border-color:var(--earth); }
  .elem-volt{ color:var(--volt); border-color:var(--volt); }
  .elem-wind{ color:var(--wind); border-color:var(--wind); }

  .formation{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .frow{ display:flex; gap:8px; align-items:center; }
  .frow .label{ width:56px; font-size:14px; color:var(--dim); align-self:center; }
  .slot{
    width: 78px; height: 78px; border: 2px dashed var(--border); background: var(--bg2);
    display:flex; align-items:center; justify-content:center; flex-direction:column; cursor:pointer; font-size:28px; text-align:center;
  }
  .slot.filled{ border-style:solid; }
  .slot .slvl{ font-size:12px; color:var(--gold); }
  .synergy-tag{ font-size:12px; color:var(--gold); margin-left:64px; margin-top:-4px; margin-bottom:2px; }

  .battlefield{ display:flex; flex-direction:column; gap:10px; }
  .side-label{ font-size:14px; color:var(--dim); text-align:center; margin:2px 0; }
  .rowsyn{ font-size:12px; color:var(--gold); text-align:center; min-height:14px; }
  .unit-row{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .unit{
    width: 86px; background: var(--bg2); border:2px solid var(--border); padding:6px 4px; text-align:center; position:relative;
  }
  .unit.fainted{ opacity:0.25; }
  .unit.active{ border-color: var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .unit.targetable{ border-color: var(--danger); cursor:pointer; }
  .unit.allytarget{ border-color: var(--water); cursor:pointer; }
  .unit .emoji{ font-size:26px; }
  .unit .uname{ font-size:12px; height:28px; overflow:hidden; }
  .hpbar-bg{ height:8px; background:#000; border:1px solid var(--border); margin-top:3px; }
  .hpbar-fill{ height:100%; background: var(--nature); }
  .hpbar-fill.low{ background: var(--danger); }
  .cd-tag{ font-size:10px; color:var(--dim); }
  .status-tag{ font-size:12px; margin-top:2px; min-height:14px; }
  .plate-tag{ position:absolute; top:1px; left:2px; font-size:11px; color:var(--water); }
  .unit.boss{ width:124px; border-color:var(--danger); box-shadow:0 0 10px rgba(255,74,107,0.35); }
  .unit.boss .emoji{ font-size:34px; }
  .unit.gen{ width:74px; border-color:var(--water); }
  .shield-tag{ position:absolute; top:-9px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--water); background:var(--bg2); border:1px solid var(--water); padding:0 3px; white-space:nowrap; }
  .misscard{ background:var(--bg2); border:2px solid var(--border); padding:10px; width:280px; }
  .misscard.done{ border-color:var(--nature); }
  .planbox{ background:#000; border:2px solid var(--border); padding:8px; margin-bottom:8px; font-size:17px; line-height:1.6; }
  .planrow{ padding:2px 0; }
  .planrow.sel{ background:#2a2c58; }
  .coach{
    background: #1b2440; border:3px solid var(--water); border-left-width:8px;
    padding:12px 14px; margin-bottom:14px; font-size:19px; line-height:1.45;
    box-shadow:6px 6px 0 rgba(0,0,0,0.45);
  }
  .coach-title{ font-size:14px; color:var(--water); letter-spacing:1px; margin-bottom:6px; }
  #fx{ position:fixed; inset:0; pointer-events:none; z-index:50; }
  .floater{
    position:absolute; transform:translate(-50%,0); font-family:'VT323',monospace;
    font-size:26px; font-weight:bold; text-shadow:2px 2px 0 #000; white-space:nowrap;
    animation: floatup 0.9s ease-out forwards;
  }
  .floater.dmg{ color: var(--gold); }
  .floater.hurt{ color: var(--danger); }
  .floater.crit{ color: #fff; font-size:34px; text-shadow:0 0 8px var(--danger), 2px 2px 0 #000; }
  .floater.heal{ color: var(--nature); }
  .floater.miss{ color: var(--dim); font-size:20px; }
  @keyframes floatup{
    0%   { opacity:0; transform:translate(-50%,6px) scale(0.7); }
    18%  { opacity:1; transform:translate(-50%,-6px) scale(1.15); }
    100% { opacity:0; transform:translate(-50%,-42px) scale(1); }
  }
  .unit.flash-hit{ animation: flashhit 0.22s steps(2,end) 2; }
  .unit.flash-heal{ animation: flashheal 0.22s ease-out 1; }
  @keyframes flashhit{ 0%,100%{ filter:none; } 50%{ filter:brightness(2.4) saturate(0.2); } }
  @keyframes flashheal{ 0%,100%{ filter:none; } 50%{ filter:brightness(1.5) hue-rotate(40deg); } }
  #app.shake{ animation: shk 0.18s linear 1; }
  #app.shake-hard{ animation: shkh 0.32s linear 1; }
  @keyframes shk{ 0%,100%{transform:translate(0,0);} 25%{transform:translate(-3px,2px);} 75%{transform:translate(3px,-2px);} }
  @keyframes shkh{ 0%,100%{transform:translate(0,0);} 15%{transform:translate(-7px,3px);} 35%{transform:translate(6px,-4px);} 55%{transform:translate(-5px,-2px);} 80%{transform:translate(4px,3px);} }
  .unit.active{ animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 2px var(--gold) inset; } 50%{ box-shadow:0 0 0 2px var(--gold) inset, 0 0 10px rgba(255,209,102,0.45); } }
  .hpbar-fill{ transition: width 0.35s ease-out; }
  .audio-btn{ font-size:16px; padding:4px 8px; }
  @media (prefers-reduced-motion: reduce){
    .floater, .unit.flash-hit, .unit.flash-heal, #app.shake, #app.shake-hard, .unit.active{ animation:none !important; }
    .hpbar-fill{ transition:none; }
  }
  .membercard{ background:var(--bg2); border:2px solid var(--border); padding:10px; width:190px; }
  .membercard.me{ border-color:var(--gold); }
  .tribecard{ background:var(--bg2); border:2px solid var(--border); padding:10px; width:200px; }
  .favor-bg{ height:8px; background:#000; border:1px solid var(--border); margin-top:6px; }
  .favor-fill{ height:100%; }
  .elem-bg-fire{ background:var(--fire); } .elem-bg-water{ background:var(--water); }
  .elem-bg-nature{ background:var(--nature); } .elem-bg-earth{ background:var(--earth); }
  .elem-bg-volt{ background:var(--volt); } .elem-bg-wind{ background:var(--wind); }
  .boss-banner{ font-size:16px; color:var(--danger); border:1px dashed var(--danger); padding:8px; margin-bottom:10px; line-height:1.4; }
  .rust-tag{ position:absolute; top:1px; right:2px; font-size:11px; color:var(--rust); }

  #log{
    background:#000; border:2px solid var(--border); height:110px; overflow-y:auto; padding:8px;
    font-size:16px; margin-bottom:12px; display:flex; flex-direction:column-reverse;
  }
  #log div{ margin-bottom:2px; }

  .actionbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .hidden{ display:none !important; }
  .storytext{ font-size:19px; color:var(--dim); border-left:3px solid var(--gold); padding-left:10px; margin:10px 0; }
  .terrain-banner{ font-size:15px; color:var(--wind); border:1px dashed var(--border); padding:6px 8px; margin-bottom:10px; }
  .intel-banner{ font-size:16px; color:var(--rust); border:1px dashed var(--rust); padding:8px; margin-bottom:10px; line-height:1.4; }
  .gauge-wrap{ margin-bottom:12px; }
  .gauge-label{ font-size:14px; color:var(--gold); margin-bottom:3px; }
  .gauge-bg{ height:14px; background:#000; border:2px solid var(--border); position:relative; }
  .gauge-tick{ position:absolute; top:0; bottom:0; width:2px; background:var(--border); }
  .gauge-fill{ height:100%; background: linear-gradient(90deg, #ff8c42, var(--gold)); transition: width 0.3s; }
  .gauge-fill.full{ box-shadow: 0 0 10px 2px var(--gold); }
  .footer-nav{ display:flex; justify-content:space-between; gap:10px; margin-top:4px; }

  .corr-bg{ height:6px; background:#000; border:1px solid var(--border); margin-top:4px; }
  .corr-fill{ height:100%; }
  .corr-label{ font-size:11px; margin-top:2px; }
  .pcard{
    background:var(--bg2); border:2px solid var(--rust); padding:8px; width:132px; cursor:pointer; font-size:15px; line-height:1.3;
  }
  .pcard.selected{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .pcard .pname{ color:var(--rust); font-size:16px; }
  .slotchip{
    display:inline-block; border:1px dashed var(--border); font-size:12px; padding:1px 4px; margin:2px 2px 0 0; color:var(--dim); cursor:pointer;
  }
  .slotchip.used{ border-style:solid; border-color:var(--rust); color:var(--rust); }
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>

<script>
/* ============ DATA ============ */
const ELEM_BEATS = { fire:'nature', nature:'water', water:'fire', earth:'volt', volt:'wind', wind:'earth' };

const SPECIES = {
  emberling: { name:'Emberling', element:'fire', emoji:'🔥', base:{hp:32, atk:11, def:6, spd:9}, skill:'Cinder Burst' },
  aqualing:  { name:'Aqualing',  element:'water', emoji:'💧', base:{hp:34, atk:9,  def:8, spd:8}, skill:'Tide Slam' },
  mossling:  { name:'Mossling',  element:'nature', emoji:'🌿', base:{hp:36, atk:8,  def:9, spd:7}, skill:'Thorn Whip' },
  terrafang: { name:'Terrafang', element:'earth', emoji:'🪨', base:{hp:40, atk:10, def:10, spd:5}, skill:'Boulder Crush' },
  galekit:   { name:'Galekit',   element:'wind', emoji:'🌪️', base:{hp:28, atk:10, def:5, spd:12}, skill:'Cyclone Slash' },
  voltcub:   { name:'Voltcub',   element:'volt', emoji:'⚡', base:{hp:26, atk:12, def:5, spd:11}, skill:'Static Fang' },
};
const SPECIES_IDS = Object.keys(SPECIES);

const ENEMY_SPECIES = {
  scraphound: { name:'Scraphound', element:'earth', emoji:'🤖', base:{hp:34, atk:9, def:9, spd:6}, skill:'Scrap Slam' },
  sparkdrone: { name:'Sparkdrone', element:'volt', emoji:'🛸', base:{hp:26, atk:11, def:5, spd:11}, skill:'Overload' },
  cinderjaw:  { name:'Cinderjaw',  element:'fire', emoji:'👾', base:{hp:30, atk:11, def:6, spd:9}, skill:'Napalm Bite' },
  frostcoil:  { name:'Frostcoil',  element:'water', emoji:'🦾', base:{hp:32, atk:9, def:8, spd:8}, skill:'Cryo Lash' },
  thornbot:   { name:'Thornbot',   element:'nature', emoji:'🕷️', base:{hp:34, atk:8, def:9, spd:7}, skill:'Rust Vines' },
  galekite:   { name:'Galekite',   element:'wind', emoji:'🛩️', base:{hp:24, atk:10, def:5, spd:13}, skill:'Shear Gust' },
};
const ENEMY_IDS = Object.keys(ENEMY_SPECIES);

/* ---- Salvageable Rustbound parts (one per enemy chassis) ---- */
const PARTS = {
  scraphound: { name:'Scrap Plating', emoji:'🛡️', element:'earth',  stat:'def', pct:0.30, corruption:20, desc:'Welded slabs of enemy hull.' },
  sparkdrone: { name:'Static Coil',   emoji:'🔌', element:'volt',   stat:'spd', pct:0.28, corruption:24, desc:'Hums with stolen current.' },
  cinderjaw:  { name:'Napalm Jets',   emoji:'🔥', element:'fire',   stat:'atk', pct:0.30, corruption:28, desc:'Leaks accelerant. Constantly.' },
  frostcoil:  { name:'Cryo Cell',     emoji:'❄️', element:'water',  stat:'def', pct:0.26, corruption:20, desc:'Frost-rimed coolant core.' },
  thornbot:   { name:'Rustvine Spool',emoji:'🌱', element:'nature', stat:'hp',  pct:0.32, corruption:18, desc:'Self-repairing metal creeper.' },
  galekite:   { name:'Shear Rotor',   emoji:'🌀', element:'wind',   stat:'spd', pct:0.32, corruption:22, desc:'Screams above 4000 RPM.' },
};
const STAT_LABEL = { hp:'HP', atk:'ATK', def:'DEF', spd:'SPD' };

/* ---- Cross-species fusion: every element pair has a named hybrid ---- */
const HYBRIDS = {
  'fire+water':   { name:'Steamling',    emoji:'♨️', skill:'Scald Burst' },
  'fire+nature':  { name:'Cinderbloom',  emoji:'🍂', skill:'Wildfire Bloom' },
  'earth+fire':   { name:'Magmaw',       emoji:'🌋', skill:'Magma Maul' },
  'fire+volt':    { name:'Arcflare',     emoji:'☄️', skill:'Arc Detonation' },
  'fire+wind':    { name:'Firestorm',    emoji:'🎆', skill:'Firestorm Rush' },
  'nature+water': { name:'Bogling',      emoji:'🐸', skill:'Mire Drag' },
  'earth+water':  { name:'Siltback',     emoji:'🐢', skill:'Silt Crush' },
  'volt+water':   { name:'Voltide',      emoji:'🌊', skill:'Chain Surge' },
  'water+wind':   { name:'Mistral',      emoji:'🌫️', skill:'Mist Lash' },
  'earth+nature': { name:'Grovewarden',  emoji:'🌳', skill:'Root Bind' },
  'nature+volt':  { name:'Sporesurge',   emoji:'🍄', skill:'Spore Discharge' },
  'nature+wind':  { name:'Pollenwing',   emoji:'🦋', skill:'Pollen Cyclone' },
  'earth+volt':   { name:'Magnetite',    emoji:'🧲', skill:'Magnetic Slam' },
  'earth+wind':   { name:'Sandwyrm',     emoji:'🦂', skill:'Sand Shear' },
  'volt+wind':    { name:'Stormkite',    emoji:'🪁', skill:'Thunder Dive' },
};
/* Innate traits a hybrid inherits from each of its two elements. */
const ELEM_TRAIT = {
  fire:   { burnImmune:true },
  water:  { slowImmune:true },
  volt:   { stunImmune:true },
  nature: { regen:0.03 },
  earth:  { bulwark:true },
  wind:   { dodge:0.10 },
};
function hybridKey(a,b){ return [a,b].sort().join('+'); }
function hybridIdFor(a,b){ return 'hyb_' + [a,b].sort().join('_'); }

const HYBRID_SPECIES = {};
Object.keys(HYBRIDS).forEach(key=>{
  const els = key.split('+');
  const parents = els.map(e=>SPECIES_IDS.find(id=>SPECIES[id].element===e)).map(id=>SPECIES[id]);
  const blend = k => Math.round((parents[0].base[k] + parents[1].base[k]) / 2 * 1.25);
  HYBRID_SPECIES[hybridIdFor(els[0],els[1])] = {
    name: HYBRIDS[key].name, emoji: HYBRIDS[key].emoji, skill: HYBRIDS[key].skill,
    element: els[0], elements: els.slice(), hybrid: true,
    base: { hp:blend('hp'), atk:blend('atk'), def:blend('def'), spd:blend('spd') },
  };
});
function isHybridId(id){ return !!HYBRID_SPECIES[id]; }

const STAGE_STORY = [
  "The border watchtowers go dark. Rustbound scouts probe the eastern fields.",
  "A scavenger unit strips a grove bare. The tribes look to you for a line of defense.",
  "Sparkdrones jam the old signal fires. Word must travel by messenger now.",
  "The Rustbound dig in at the Ashen Crossing, cutting the tribes' only trade route.",
  "A Cinderjaw pack torches the lowland farms. Refugees stream toward the capital.",
  "Deep radar picks up something large moving under the Thornwood.",
  "The tribes' elders call for a counter-offensive. Morale is fragile.",
  "Rustbound war-drones mass at the river fork, three columns strong.",
  "The enemy brings forward a command unit, shielded by its strongest guard.",
  "This is the gate to the Rustbound's forward base. Break it, and Texel breathes again.",
];

/* ---- Daily scavenger missions. Purely local: date-seeded, so every
       player on a given day gets the same three, with no server needed. ---- */
const MISSION_POOL = [
  { id:'mono',      make:r=>({ elem: TRIBE_IDS[r(6)] }),
    text:m=>`Win a battle where only ${m.elem.toUpperCase()} strikes land`,
    check:(m,st)=>st.win && st.elemsUsed.length===1 && st.elemsUsed[0]===m.elem },
  { id:'flawless',  make:()=>({}),
    text:()=>'Win without losing a single monster',
    check:(m,st)=>st.win && st.losses===0 },
  { id:'swift',     make:r=>({ rounds: 4 + r(3) }),
    text:m=>`Win a battle within ${m.rounds} rounds`,
    check:(m,st)=>st.win && st.rounds<=m.rounds },
  { id:'splicer',   make:()=>({}),
    text:()=>'Win with a spliced hybrid in your formation',
    check:(m,st)=>st.win && st.hybrids>0 },
  { id:'heavy',     make:r=>({ elem: TRIBE_IDS[r(6)], amount: 120 + r(5)*40 }),
    text:m=>`Deal ${m.amount} damage with ${m.elem.toUpperCase()} in one battle`,
    check:(m,st)=>(st.elemDamage[m.elem]||0) >= m.amount },
  { id:'commander', make:()=>({}),
    text:()=>'Bring down a Rustbound commander',
    check:(m,st)=>st.win && st.boss },
  { id:'trial',     make:r=>({ mods: 1 + r(2) }),
    text:m=>`Clear a trial with at least ${m.mods} handicap${m.mods>1?'s':''} stacked`,
    check:(m,st)=>st.win && st.trial && st.mods>=m.mods },
  { id:'rusty',     make:()=>({}),
    text:()=>'Win with a rust-loaded monster (25+) in your line',
    check:(m,st)=>st.win && st.maxRust>=25 },
];
const MISSION_COUNT = 3;
const MISSION_REWARD = 1;   // salvage parts per mission

function todayKey(){
  const d = new Date();
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}
/* Small deterministic PRNG so a given day yields the same missions everywhere. */
function seedRandom(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(n){
    h ^= h<<13; h>>>=0; h ^= h>>17; h ^= h<<5; h>>>=0;
    return n ? (h % n) : h;
  };
}
function buildDailies(key){
  const r = seedRandom(key);
  const idx = [];
  while(idx.length < MISSION_COUNT){
    const i = r(MISSION_POOL.length);
    if(idx.indexOf(i)<0) idx.push(i);
  }
  return {
    date: key,
    missions: idx.map(i=>{
      const def = MISSION_POOL[i];
      return { id: def.id, params: def.make(r), done:false, claimed:false };
    }),
  };
}
function missionDef(id){ return MISSION_POOL.find(m=>m.id===id); }
function ensureDailies(){
  const key = todayKey();
  if(!state.daily || state.daily.date !== key) state.daily = buildDailies(key);
  return state.daily;
}
function dailyProgress(){
  const d = ensureDailies();
  return { done: d.missions.filter(m=>m.done).length, total: d.missions.length,
           unclaimed: d.missions.filter(m=>m.done && !m.claimed).length };
}
/* Called once per finished battle with a summary of what happened. */
function scoreDailies(stats){
  const d = ensureDailies();
  const newly = [];
  d.missions.forEach(m=>{
    if(m.done) return;
    const def = missionDef(m.id);
    if(def && def.check(m.params, stats)){ m.done = true; newly.push(def.text(m.params)); }
  });
  return newly;
}
function claimMission(i){
  const d = ensureDailies();
  const m = d.missions[i];
  if(!m || !m.done || m.claimed) return;
  m.claimed = true;
  for(let k=0;k<MISSION_REWARD && state.parts.length<14;k++){
    state.parts.push({ uid: uid(), key: ENEMY_IDS[Math.floor(Math.random()*ENEMY_IDS.length)] });
  }
  autosave();
  render();
}

function saveSession(sess){
  cloud.session = sess;
  if(!hasStorage()) return;
  try{
    if(sess) window.localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
    else window.localStorage.removeItem(SESSION_KEY);
  }catch(e){ /* a browser that refuses storage just means signing in again next visit */ }
}
function loadStoredSession(){
  if(!hasStorage()) return null;
  try{
    const raw = window.localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return (d && d.access_token && d.refresh_token) ? d : null;
  }catch(e){ return null; }
}

/* --- minimal Supabase REST client (no SDK: these are plain HTTPS endpoints) --- */
function cloudFetch(path, opts, auth){
  opts = opts || {};
  const headers = Object.assign({
    'apikey': CLOUD.anonKey,
    'Content-Type': 'application/json',
  }, opts.headers || {});
  if(auth && cloud.session) headers['Authorization'] = 'Bearer ' + cloud.session.access_token;
  return fetch(CLOUD.url + path, Object.assign({}, opts, { headers }))
    .then(res => res.text().then(text => {
      let body = null;
      if(text){ try{ body = JSON.parse(text); }catch(e){ body = text; } }
      return { ok: res.ok, status: res.status, body };
    }));
}
function authErrorText(r){
  const b = r.body;
  if(b && typeof b==='object'){
    if(b.error_description) return b.error_description;
    if(b.msg) return b.msg;
    if(b.message) return b.message;
    if(b.error) return String(b.error);
  }
  if(r.status===0) return 'Could not reach the server.';
  return 'Request failed (' + r.status + ').';
}
function adoptSession(body){
  if(!body || !body.access_token) return null;
  const sess = {
    access_token: body.access_token,
    refresh_token: body.refresh_token,
    expires_at: Date.now() + ((body.expires_in || 3600) * 1000),
    user: { id: body.user ? body.user.id : (body.id||null), email: body.user ? body.user.email : null },
  };
  saveSession(sess);
  return sess;
}

function cloudSignUp(email, password){
  return cloudFetch('/auth/v1/signup', { method:'POST', body: JSON.stringify({ email, password }) })
    .then(r => {
      if(!r.ok) return { ok:false, error: authErrorText(r) };
      const sess = adoptSession(r.body);
      if(!sess) return { ok:true, needsConfirm:true };   // project has email confirmation on
      return { ok:true, session: sess };
    })
    .catch(() => ({ ok:false, error:'Could not reach the server — check your connection.' }));
}
function cloudSignIn(email, password){
  return cloudFetch('/auth/v1/token?grant_type=password', { method:'POST', body: JSON.stringify({ email, password }) })
    .then(r => {
      if(!r.ok) return { ok:false, error: authErrorText(r) };
      const sess = adoptSession(r.body);
      return sess ? { ok:true, session: sess } : { ok:false, error:'The server returned no session.' };
    })
    .catch(() => ({ ok:false, error:'Could not reach the server — check your connection.' }));
}
function cloudRefresh(){
  if(!cloud.session || !cloud.session.refresh_token) return Promise.resolve(false);
  return cloudFetch('/auth/v1/token?grant_type=refresh_token',
      { method:'POST', body: JSON.stringify({ refresh_token: cloud.session.refresh_token }) })
    .then(r => {
      if(!r.ok){ saveSession(null); return false; }
      return !!adoptSession(r.body);
    })
    .catch(() => false);
}
function cloudSignOut(){
  const done = () => { saveSession(null); cloud.status='signed-out'; cloud.message=''; };
  if(!signedIn()){ done(); return Promise.resolve(); }
  return cloudFetch('/auth/v1/logout', { method:'POST' }, true).then(done).catch(done);
}

/* Any authed call: refresh once on 401 rather than dumping the player at the login screen. */
function authed(path, opts){
  const attempt = () => cloudFetch(path, opts, true);
  const expired = cloud.session && cloud.session.expires_at && Date.now() > cloud.session.expires_at - 30000;
  const pre = expired ? cloudRefresh() : Promise.resolve(true);
  return pre.then(() => attempt()).then(r => {
    if(r.status !== 401) return r;
    return cloudRefresh().then(okRefresh => okRefresh ? attempt() : r);
  });
}

/* --- self-test: turns "it doesn't work" into a specific diagnosis --- */
function cloudSelfTest(){
  const out = [];
  const add = (okFlag, text) => out.push({ ok: okFlag, text });
  if(!cloudConfigured()){
    add(false, 'No project URL or key set in the CLOUD block.');
    return Promise.resolve({ lines: out, fatal: true });
  }
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(CLOUD.url.trim())){
    add(false, 'Project URL looks wrong — expected https://<project-ref>.supabase.co');
  }
  if(/^sb_secret_/i.test(CLOUD.anonKey) || /service_role/i.test(CLOUD.anonKey)){
    add(false, '⚠ THAT IS A SECRET KEY. Replace it with the publishable key immediately — a secret key here exposes every player\'s saves.');
    return Promise.resolve({ lines: out, fatal: true });
  }

  // 1. can we reach auth at all, and does the key pass?
  return cloudFetch('/auth/v1/health', { method:'GET' })
    .then(r => {
      if(r.status===401 || r.status===403){ add(false, 'Reached the project, but the key was rejected — check the publishable key.'); return false; }
      if(!r.ok && r.status!==404){ add(false, 'Auth responded with status ' + r.status + '.'); return true; }
      add(true, 'Auth endpoint reachable and the key is accepted.');
      return true;
    })
    .catch(() => { add(false, 'Could not reach ' + CLOUD.url + ' — wrong URL, no connection, or the page is on file:// where the browser blocks it.'); return false; })
    // 2. does the legions table exist, and is RLS actually on?
    .then(reachable => {
      if(!reachable) return { lines: out, fatal: true };
      return cloudFetch('/rest/v1/' + CLOUD_TABLE + '?select=slot&limit=2', { method:'GET' })
        .then(r => {
          const msg = (r.body && (r.body.message || r.body.hint)) || '';
          if(r.status===404 || /could not find the table|does not exist/i.test(String(msg))){
            add(false, 'The "' + CLOUD_TABLE + '" table is missing — run the SQL from step 2 of SETUP-BACKEND.md.');
          } else if(r.status===401 || r.status===403){
            add(true, 'Table exists and is locked down to signed-in players.');
          } else if(r.ok && Array.isArray(r.body) && r.body.length>0){
            add(false, '⚠ Row-level security is NOT protecting this table — a signed-out request read ' + r.body.length + ' row(s). Run the RLS policy from step 2 before letting anyone play.');
          } else if(r.ok){
            add(true, 'Table exists and returns nothing to a signed-out request (RLS looks correct).');
          } else {
            add(false, 'Table check returned status ' + r.status + (msg ? ' — ' + msg : '') + '.');
          }
          return null;
        })
        .then(()=>{
          // Probe with find_opponent: it takes no arguments and only reads, so the
          // diagnostic cannot create or change anything. A missing function 404s;
          // one that exists answers with something else.
          return cloudFetch('/rest/v1/rpc/find_opponent', { method:'POST', body: JSON.stringify({}) }, true)
            .then(r2=>{
              const m2 = (r2.body && (r2.body.message||r2.body.hint)) || '';
              if(r2.status===404 || /could not find the function/i.test(String(m2))){
                add(false, 'Multiplayer functions are NOT installed — guilds, raids and the ladder will not work. Run step 2 of SETUP-MULTIPLAYER.md.');
              } else {
                add(true, 'Multiplayer functions are installed.');
              }
              return { lines: out, fatal:false };
            })
            .catch(()=>({ lines: out, fatal:false }));
        })
        .catch(() => { add(false, 'Could not reach the database endpoint.'); return { lines: out, fatal: true }; });
    });
}

/* ================= GUILDS · RAIDS · LADDER =================
   All of this needs an account. Everything below degrades to a
   "sign in first" prompt when signed out, and the single-player
   game never depends on any of it. See SETUP-MULTIPLAYER.md.
   ============================================================ */
const social = { guild:null, members:[], raid:null, board:[], ladder:[], rank:null, opponent:null,
                 status:'', busy:false, lastDuel:null };

/* ---- guild progression ----
   Thresholds are cumulative XP. Perks are read from the server-held level and
   applied client-side, same trust model as everything else here. */
const GUILD_XP = [0, 2000, 6000, 14000, 30000, 60000];   // index = level-1
const MAX_GUILD_LEVEL = GUILD_XP.length;
const GUILD_PERKS = {
  2: { key:'exp',    name:'Quartermasters',  desc:'+10% EXP from every battle' },
  3: { key:'salvage',name:'Foundry Ties',    desc:'+15% chance of salvage from a victory' },
  4: { key:'gauge',  name:'War Drums',       desc:'Legion Gauge charges 15% faster' },
  5: { key:'might',  name:'Iron Discipline', desc:'+6% ATK and DEF for your whole legion' },
  6: { key:'raid',   name:'Siege Doctrine',  desc:'Your raid damage counts for 25% more' },
};
function guildLevel(){ return (social.guild && social.guild.level) ? Math.min(MAX_GUILD_LEVEL, social.guild.level) : 0; }
function guildXp(){ return (social.guild && social.guild.xp) ? Number(social.guild.xp) : 0; }
function guildXpFloor(){ return GUILD_XP[Math.max(0, guildLevel()-1)] || 0; }
function guildXpNext(){ return (guildLevel() >= MAX_GUILD_LEVEL) ? null : GUILD_XP[guildLevel()]; }
function guildXpPct(){
  const next = guildXpNext();
  if(next===null) return 100;
  const floor = guildXpFloor();
  return Math.max(0, Math.min(100, Math.round(((guildXp()-floor) / (next-floor)) * 100)));
}
function hasPerk(key){
  const lvl = guildLevel();
  for(let l=2; l<=lvl; l++){ if(GUILD_PERKS[l] && GUILD_PERKS[l].key===key) return true; }
  return false;
}
function myMembership(){
  if(!cloud.session) return null;
  return social.members.find(m=>m.user_id===cloud.session.user.id) || null;
}
function isGuildLeader(){ const m = myMembership(); return !!(m && m.role==='leader'); }

function rpcErrorText(r){
  const msg = (r.body && (r.body.message || r.body.hint)) || ('status ' + r.status);
  // PostgREST says this when a function is absent OR when its cache is stale.
  if(r.status===404 || /could not find the function|schema cache/i.test(String(msg))){
    return 'The multiplayer functions are not installed on your project yet — run the FUNCTIONS block (step 2) from SETUP-MULTIPLAYER.md, then reload the schema.';
  }
  if(/permission denied|not signed in/i.test(String(msg))) return 'Your session was not accepted — try signing out and back in.';
  return msg;
}
function rpc(fn, args){
  return authed('/rest/v1/rpc/' + fn, { method:'POST', body: JSON.stringify(args||{}) })
    .then(r => r.ok ? { ok:true, body:r.body } : { ok:false, error: rpcErrorText(r), status:r.status })
    .catch(() => ({ ok:false, error:'Could not reach the server.' }));
}
function restGet(path){
  return authed('/rest/v1/' + path, { method:'GET' })
    .then(r => (r.ok && Array.isArray(r.body)) ? r.body : null)
    .catch(() => null);
}

/* ---- ladder ---- */
function ladderSnapshot(){
  const units = [];

    state.formation[row].forEach(u=>{

      const st = computeStats(m);

                   parts:(m.parts||[]).slice(), trait:m.trait||null, name:st.name });
    });

  return { units, blessing: activeBlessing(), stage: state.stage };

function formationPower(){
  let p = 0;
  ['front','back'].forEach(row=>state.formation[row].forEach(u=>{
    if(!u) return; const m=findMonster(u); if(!m) return;
    const st=computeStats(m);
    p += st.hp + st.atk*3 + st.def*2 + st.spd*2;
  }));
  return Math.round(p);
}

/* ============ PERSISTENCE ============ */
const SAVE_VERSION = 1;
const SAVE_PREFIX = 'gridlegion.v1.slot';
const SLOT_COUNT = 3;

/* localStorage is unavailable in some embedded previews and private windows —
   every access is guarded and the game stays fully playable without it. */
let _storageOK = null;
function hasStorage(){
  if(_storageOK!==null) return _storageOK;
  try{
    const k = '__gl_probe';
    window.localStorage.setItem(k,'1');
    window.localStorage.removeItem(k);
    _storageOK = true;
  }catch(e){ _storageOK = false; }
  return _storageOK;
}

function serializeSave(){
  return {
    v: SAVE_VERSION,
    name: state.profileName || 'Legion',
    savedAt: Date.now(),
    stage: state.stage,
    bestDepth: state.bestDepth || 0,
    roster: state.roster,
    parts: state.parts,
    intel: state.intel,
    formation: state.formation,
    discovered: state.discovered,
    cleared: state.cleared,
    favor: state.favor,
    blessing: state.blessing,
    recruited: state.recruited,
    daily: state.daily,
    audio: { sfx: audio.sfx, music: audio.music },
    codex: state.codex,
    tactical: state.tactical,
  };
}
function validateSave(d){
  if(!d || typeof d!=='object') return false;
  if(typeof d.stage!=='number' || !isFinite(d.stage) || d.stage<1) return false;
  if(!Array.isArray(d.roster)) return false;
  if(!d.formation || !Array.isArray(d.formation.front) || !Array.isArray(d.formation.back)) return false;
  return true;
}
/* Rebuilds a monster from saved data, discarding anything this build no longer knows about. */
function reviveMonster(m){
  if(!m || typeof m!=='object') return null;
  if(!SPECIES[m.speciesId] && !HYBRID_SPECIES[m.speciesId]) return null;
  const tier = (m.tier===2||m.tier===3) ? m.tier : 1;
  const grafts = reviveGrafts(m.grafts);
  const slotCap = (tier>=3?4:(tier>=2?3:2)) + ((grafts && grafts.slot) ? grafts.slot : 0);
  return {
    uid: typeof m.uid==='string' ? m.uid : uid(),
    speciesId: m.speciesId,
    level: (typeof m.level==='number' && m.level>=1) ? Math.floor(m.level) : 1,
    exp: (typeof m.exp==='number' && m.exp>=0) ? m.exp : 0,
    tier,
    parts: Array.isArray(m.parts) ? m.parts.filter(k=>PARTS[k]).slice(0, slotCap) : [],
    trait: (m.trait && TRAITS[m.trait.key]) ? m.trait : rollTrait(),
    grafts,
  };
}
function reviveGrafts(g){
  if(!g || typeof g!=='object') return null;
  const out = {};
  Object.keys(GRAFT_KINDS).forEach(k=>{
    const v = g[k];
    if(typeof v==='number' && v>0) out[k] = Math.min(k==='slot' ? 1 : 5, Math.floor(v));
  });
  return Object.keys(out).length ? out : null;
}
function applySave(d, slot){
  const roster = d.roster.map(reviveMonster).filter(Boolean);
  const live = roster.map(m=>m.uid);
  const fixRow = r => [0,1,2].map(i => (typeof r[i]==='string' && live.indexOf(r[i])>=0) ? r[i] : null);
  state.slot = (typeof slot==='number') ? slot : null;
  state.profileName = (typeof d.name==='string' && d.name.trim()) ? d.name.trim().slice(0,18) : 'Legion';
  state.stage = Math.max(1, Math.floor(d.stage));
  state.bestDepth = (typeof d.bestDepth==='number' && d.bestDepth>=0) ? Math.floor(d.bestDepth) : 0;
  state.roster = roster;
  state.parts = Array.isArray(d.parts) ? d.parts.filter(p=>p && PARTS[p.key]).map(p=>({uid:p.uid||uid(), key:p.key})) : [];
  state.intel = (d.intel && Array.isArray(d.intel.history))
    ? { history: d.intel.history.filter(e=>ELEM_BEATS[e]).slice(-5), wins: (typeof d.intel.wins==='number'?d.intel.wins:0) }
    : { history: [], wins: 0 };
  state.formation = { front: fixRow(d.formation.front), back: fixRow(d.formation.back) };
  state.discovered = {};
  if(d.discovered && typeof d.discovered==='object'){
    Object.keys(d.discovered).forEach(k=>{ if(HYBRID_SPECIES[k]) state.discovered[k]=true; });
  }
  state.cleared = {};
  if(d.cleared && typeof d.cleared==='object'){
    Object.keys(d.cleared).forEach(k=>{ const n=Number(k); if(n>=1 && n<=9999) state.cleared[n]=true; });
  }
  state.trial = null;
  state.codex = null;
  if(d.codex && typeof d.codex==='object'){
    const c = codex();
    ['species','enemies','hybrids','bosses','terrains','parts','traits'].forEach(cat=>{
      const src = d.codex[cat];
      if(src && typeof src==='object') Object.keys(src).forEach(k=>{ if(src[k]) c[cat][k]=true; });
    });
  }
  state.tactical = d.tactical === true;
  state.favor = {};
  if(d.favor && typeof d.favor==='object'){
    TRIBE_IDS.forEach(e=>{
      const v = d.favor[e];
      if(typeof v==='number' && isFinite(v) && v>0) state.favor[e] = Math.min(FAVOR_MAX, Math.floor(v));
    });
  }
  state.blessing = (typeof d.blessing==='string' && TRIBES[d.blessing]) ? d.blessing : null;
  if(d.audio && typeof d.audio==='object'){
    audio.sfx = d.audio.sfx !== false;
    audio.music = d.audio.music === true;
  }
  state.daily = null;
  if(d.daily && typeof d.daily==='object' && typeof d.daily.date==='string' && Array.isArray(d.daily.missions)){
    const kept = d.daily.missions.filter(m=>m && missionDef(m.id)).map(m=>({
      id:m.id, params:(m.params&&typeof m.params==='object')?m.params:{}, done:!!m.done, claimed:!!m.claimed }));
    if(kept.length) state.daily = { date:d.daily.date, missions:kept };
  }
  state.recruited = {};
  if(d.recruited && typeof d.recruited==='object'){
    TRIBE_IDS.forEach(e=>{ if(d.recruited[e]) state.recruited[e]=true; });
  }
  state.battle = null; state.lastResult = null; state.lastFusion = null;
  state.formSelected = null; state.selectedPart = null;
  fuseSelection = [];
  return true;
}

function readSlot(slot){
  if(!hasStorage()) return null;
  try{
    const raw = window.localStorage.getItem(SAVE_PREFIX+slot);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return validateSave(d) ? d : null;
  }catch(e){ return null; }
}
function writeSlot(slot, data){
  if(!hasStorage()) return false;
  try{ window.localStorage.setItem(SAVE_PREFIX+slot, JSON.stringify(data)); return true; }
  catch(e){ return false; }
}
function deleteSlot(slot){
  if(!hasStorage()) return false;
  try{ window.localStorage.removeItem(SAVE_PREFIX+slot); return true; }catch(e){ return false; }
}
/* Called after anything worth not losing. Silent no-op when there is nowhere to write. */
function autosaveLater(){ autosave(); }
function autosave(){
  if(state.slot===null || state.slot===undefined) return false;
  const okWrite = writeSlot(state.slot, serializeSave());
  state.saveState = okWrite ? 'saved' : 'unsaved';
  cloudPushSoon();
  return okWrite;
}

/* --- cloud sync: local write is instant and authoritative; the push is best-effort --- */
function cloudPushSoon(){
  if(!signedIn() || state.slot===null) return;
  cloud.pendingPush = true;
  if(cloud.pushTimer) return;
  cloud.pushTimer = setTimeout(()=>{
    cloud.pushTimer = null;
    if(!cloud.pendingPush) return;
    cloud.pendingPush = false;
    const slot = state.slot, payload = serializeSave();
    cloud.status = 'syncing';
    cloudPutSlot(slot, payload).then(okPush=>{
      cloud.status = okPush ? 'ready' : 'offline';
      cloud.message = okPush ? '' : 'Saved on this device — cloud unreachable, will retry.';
      if(!okPush) cloud.pendingPush = true;
      if(state.screen==='hub' || state.screen==='profiles' || state.screen==='account') render();
    });
  }, 1500);
}
/* Pull cloud slots and merge with local ones. Newest savedAt wins; nothing is silently discarded. */
function cloudSyncDown(){
  if(!signedIn()) return Promise.resolve({ pulled:0, restored:0, kept:0 });
  cloud.status = 'syncing';
  return cloudPullSlots().then(rows=>{
    if(rows===null){
      cloud.status='offline';
      cloud.message='Could not reach the cloud — playing from this device.';
      return { pulled:0, restored:0, kept:0, offline:true };
    }
    let restored=0, kept=0;
    rows.forEach(row=>{
      const slot = row.slot;
      if(typeof slot!=='number' || slot<0 || slot>=SLOT_COUNT) return;
      const remote = row.data;
      if(!validateSave(remote)) return;
      const local = readSlot(slot);
      if(!local || (remote.savedAt||0) > (local.savedAt||0)){ writeSlot(slot, remote); restored++; }
      else kept++;
    });
    cloud.status='ready';
    cloud.message = restored ? `${restored} legion${restored===1?'':'s'} restored from your account.`
                  : (rows.length ? 'Your device already had the newest saves.' : 'No cloud legions yet — this device\'s saves will upload as you play.');
    return { pulled: rows.length, restored, kept };
  });
}
/* Push every local slot up — used right after signing in on a device that has been playing offline. */
function cloudSyncUp(){
  if(!signedIn()) return Promise.resolve(0);
  const jobs = [];
  for(let i=0;i<SLOT_COUNT;i++){
    const d = readSlot(i);
    if(d) jobs.push(cloudPutSlot(i, d));
  }
  return Promise.all(jobs).then(rs=>rs.filter(Boolean).length);
}
function cloudInit(){
  if(!cloudConfigured()){ cloud.status='off'; return Promise.resolve(); }
  const stored = loadStoredSession();
  if(!stored){ cloud.status='signed-out'; return Promise.resolve(); }
  cloud.session = stored;
  cloud.status = 'syncing';
  const fresh = (stored.expires_at && Date.now() < stored.expires_at - 30000)
    ? Promise.resolve(true) : cloudRefresh();
  return fresh.then(okSession=>{
    if(!okSession){ saveSession(null); cloud.status='signed-out'; return; }
    return cloudSyncDown().then(()=>{ if(state.screen==='profiles'||state.screen==='title') render(); });
  });
}
function cloudStatusText(){
  if(!cloudConfigured()) return '';
  if(!signedIn()) return 'Not signed in — legions stay on this device.';
  const who = cloud.session.user.email || 'your account';
  if(cloud.status==='syncing') return `${escapeHtml(who)} · syncing…`;
  if(cloud.status==='offline') return `${escapeHtml(who)} · offline, will retry`;
  return `${escapeHtml(who)} · synced`;
}

/* Transfer codes: a save as text, so a legion can move between browsers without a server. */
function exportCode(){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(serializeSave())))); }
  catch(e){ return null; }
}
function decodeCode(str){
  try{
    const d = JSON.parse(decodeURIComponent(escape(atob(String(str).replace(/\s+/g,'')))));
    return validateSave(d) ? d : null;
  }catch(e){ return null; }
}

function newMonster(speciesId, level=1, tier=1, trait){
  return { uid: uid(), speciesId, level, exp:0, tier, parts:[], trait: trait || rollTrait(), grafts:null };
}
/* Grafts are permanent, harvested from a beast the rust already claimed. */
const GRAFT_KINDS = {
  slot: { name:'Bracing Frame', desc:'+1 part slot', emoji:'🔩' },
  atk:  { name:'Killcore',      desc:'+10% ATK',    emoji:'⚔' },
  def:  { name:'Hullplate',     desc:'+10% DEF',    emoji:'🛡' },
  hp:   { name:'Reservoir',     desc:'+10% max HP', emoji:'❤' },
  spd:  { name:'Servo Bundle',  desc:'+10% SPD',    emoji:'💨' },
};
const HARVEST_RUST = 50;                 // VOLATILE or worse
function canHarvest(m){ return !!m && monsterCorruption(m) >= HARVEST_RUST; }
function graftsOf(m){ return (m && m.grafts) ? m.grafts : null; }
function graftCount(m, kind){ const g = graftsOf(m); return (g && g[kind]) ? g[kind] : 0; }
function addGraft(m, kind){
  if(!GRAFT_KINDS[kind]) return false;
  m.grafts = m.grafts || {};
  if(kind==='slot' && graftCount(m,'slot') >= 1) return false;   // one extra slot, ever
  m.grafts[kind] = (m.grafts[kind]||0) + 1;
  return true;
}

function getSpeciesData(speciesId, tier){
  const base = SPECIES[speciesId] || HYBRID_SPECIES[speciesId];
  if(tier>=3){
    return {
      name: 'Ascended ' + base.name, element: base.element,
      elements: base.elements ? base.elements.slice() : null,
      hybrid: !!base.hybrid, emoji: base.emoji + '👑',
      base: { hp: Math.round(base.base.hp*2.3), atk: Math.round(base.base.atk*2.3), def: Math.round(base.base.def*2.3), spd: Math.round(base.base.spd*1.3) },
      skill: base.skill + '++',
    };
  }
  if(tier>=2){
    return {
      name: 'Prime ' + base.name, element: base.element,
      elements: base.elements ? base.elements.slice() : null,
      hybrid: !!base.hybrid, emoji: base.emoji + '✨',
      base: { hp: Math.round(base.base.hp*1.6), atk: Math.round(base.base.atk*1.6), def: Math.round(base.base.def*1.6), spd: Math.round(base.base.spd*1.15) },
      skill: base.skill + '+',
    };
  }
  return base;
}

function partSlots(m){
  const base = m.tier>=3 ? 4 : (m.tier>=2 ? 3 : 2);
  return base + graftCount(m,'slot');
}
function monsterCorruption(m){
  const ps = (m.parts||[]).map(k=>PARTS[k]).filter(Boolean);
  if(ps.length===0) return 0;
  let c = ps.reduce((s,p)=>s+p.corruption,0) + (ps.length-1)*8;
  if(m.trait && m.trait.key==='scavenger') c = Math.max(0, c-10);
  return c;
}

function computeStats(monster){
  const sd = getSpeciesData(monster.speciesId, monster.tier);
  const mult = 1 + (monster.level-1)*0.12;
  let hp = Math.round(sd.base.hp*mult), atk = Math.round(sd.base.atk*mult),
      def = Math.round(sd.base.def*mult), spd = Math.round(sd.base.spd*mult);
  const innate = sd.elements ? sd.elements.slice() : [sd.element];
  const elements = innate.slice();
  (monster.parts||[]).forEach(k=>{
    const p = PARTS[k]; if(!p) return;
    if(p.stat==='hp')  hp  = Math.round(hp *(1+p.pct));
    if(p.stat==='atk') atk = Math.round(atk*(1+p.pct));
    if(p.stat==='def') def = Math.round(def*(1+p.pct));
    if(p.stat==='spd') spd = Math.round(spd*(1+p.pct));
    if(!elements.includes(p.element)) elements.push(p.element);
  });
  const g = graftsOf(monster);
  if(g){
    if(g.atk) atk = Math.round(atk * Math.pow(1.10, g.atk));
    if(g.def) def = Math.round(def * Math.pow(1.10, g.def));
    if(g.hp)  hp  = Math.round(hp  * Math.pow(1.10, g.hp));
    if(g.spd) spd = Math.round(spd * Math.pow(1.10, g.spd));
  }
  const tr = monster.trait;
  if(tr){
    if(tr.key==='savage')   atk = Math.round(atk*1.08);
    if(tr.key==='stalwart') def = Math.round(def*1.10);
    if(tr.key==='hardy')    hp  = Math.round(hp *1.10);
    if(tr.key==='swift')    spd = Math.round(spd*1.10);
  }
  const corruption = monsterCorruption(monster);
  return {
    name: sd.name, emoji: sd.emoji + ((monster.parts||[]).length?'⚙':''),
    element: sd.element, elements, innate, hybrid: !!sd.hybrid, skill: sd.skill,
    trait: tr || null, tier: monster.tier, grafts: g,
    hp, atk, def, spd, corruption,
  };
}

function findMonster(uidStr){ return state.roster.find(m=>m.uid===uidStr); }

function elementMultiplier(atkElem, defElem){
  if(ELEM_BEATS[atkElem]===defElem) return 1.4;
  if(ELEM_BEATS[defElem]===atkElem) return 0.75;
  return 1.0;
}
/* Defence: bolted-on plating protects, so a dual-element unit takes the most favourable multiplier.
   Offence: only INNATE elements (species/fusion, never parts) can be struck with — a hybrid
   picks whichever of its two natures the target is weakest to. Returns {mult, elem}. */
function multiplierVs(attacker, defender){
  const dl = (defender.elements && defender.elements.length) ? defender.elements : [defender.element];
  const al = (attacker.attackElements && attacker.attackElements.length) ? attacker.attackElements : [attacker.element];
  let best = -Infinity, bestElem = al[0];
  al.forEach(ae=>{
    const m = Math.min.apply(null, dl.map(de=>elementMultiplier(ae, de)));
    if(m > best){ best = m; bestElem = ae; }
  });
  return { mult: best, elem: bestElem };
}

/* elementLists = array of (array of elements) or null.
   A dual-element unit counts toward EVERY element it carries, and a row grants
   every synergy that reaches its threshold — so one hybrid can complete two lines. */
function computeRowSynergies(elementLists){
  const counts = {};
  elementLists.forEach(list=>{
    if(!list) return;
    const seen = [];
    list.forEach(e=>{ if(e && !seen.includes(e)){ seen.push(e); counts[e]=(counts[e]||0)+1; } });
  });
  return Object.keys(counts)
    .filter(e=>counts[e]>=2)
    .map(e=>({ element:e, count: Math.min(counts[e],3) }))
    .sort((a,b)=> b.count-a.count || a.element.localeCompare(b.element));
}
/* single-best helper, kept for anything that wants just the headline */
function computeRowSynergy(elementLists){
  const all = computeRowSynergies(elementLists);
  return all.length ? all[0] : null;
}
function synergyInfo(syn){
  if(!syn) return null;
  const t = SYNERGY_TABLE[syn.element];
  return { element:syn.element, count:syn.count, statKey:t.statKey, bonus:t[syn.count], flavor: syn.count>=3 ? t.flavor3 : null };
}
function synergyLabelText(info){
  if(!info) return null;
  return `${info.element.toUpperCase()} ${info.count===3?'TRIO':'DUO'} +${Math.round(info.bonus*100)}% ${STAT_LABEL[info.statKey]}`;
}
function formationRowSynergyLabel(row){
  const lists = state.formation[row].map(u=> u ? computeStats(findMonster(u)).elements : null);
  const infos = computeRowSynergies(lists).map(synergyInfo);
  return infos.length ? infos.map(synergyLabelText).join(' · ') : null;
}

/* ================= SOUND =================
   Synthesised at runtime with the Web Audio API — no files, no CDN, the single
   file stays single. Every entry point is guarded so headless runs are silent
   no-ops rather than crashes.
   ========================================= */
const audio = { ctx:null, master:null, sfx:true, music:false, musicTimer:null, step:0, ready:false };

function audioAvailable(){
  return typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
}
/* Browsers refuse to start audio before a gesture, so this is called from clicks. */
function audioInit(){
  if(audio.ready || !audioAvailable()) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    audio.ctx = new AC();
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = 0.28;
    audio.master.connect(audio.ctx.destination);
    audio.ready = true;
  }catch(e){ audio.ready = false; }
}
function audioResume(){
  if(!audio.ready) audioInit();
  try{ if(audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume(); }catch(e){}
}
/* One voice: an oscillator through its own envelope. */
function tone(freq, dur, type, vol, slideTo){
  if(!audio.sfx || !audio.ready || !audio.ctx) return;
  try{
    const t = audio.ctx.currentTime;
    const osc = audio.ctx.createOscillator();
    const g = audio.ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(audio.master);
    osc.start(t); osc.stop(t + dur + 0.02);
  }catch(e){}
}
function noise(dur, vol){
  if(!audio.sfx || !audio.ready || !audio.ctx) return;
  try{
    const t = audio.ctx.currentTime;
    const n = Math.floor(audio.ctx.sampleRate * dur);
    const buf = audio.ctx.createBuffer(1, n, audio.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = audio.ctx.createBufferSource(); src.buffer = buf;
    const g = audio.ctx.createGain(); g.gain.value = vol || 0.15;
    src.connect(g); g.connect(audio.master); src.start(t);
  }catch(e){}
}
const SFX = {
  click:   ()=>tone(440, 0.05, 'square', 0.10),
  hit:     ()=>{ noise(0.09, 0.16); tone(180, 0.08, 'square', 0.14, 90); },
  crit:    ()=>{ noise(0.14, 0.22); tone(320, 0.16, 'sawtooth', 0.20, 120); },
  skill:   ()=>{ tone(520, 0.10, 'square', 0.16, 880); tone(660, 0.14, 'triangle', 0.12, 1100); },
  miss:    ()=>tone(300, 0.10, 'sine', 0.10, 180),
  shield:  ()=>tone(700, 0.14, 'triangle', 0.16, 900),
  faint:   ()=>tone(260, 0.35, 'sawtooth', 0.18, 60),
  shift:   ()=>{ tone(400, 0.07, 'triangle', 0.12, 620); tone(620, 0.07, 'triangle', 0.10, 400); },
  gauge:   ()=>{ tone(600, 0.09, 'square', 0.14); tone(900, 0.12, 'square', 0.14); },
  glitch:  ()=>{ noise(0.16, 0.20); tone(120, 0.18, 'sawtooth', 0.16, 60); },
  victory: ()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f, 0.18, 'square', 0.16), i*110)),
  defeat:  ()=>[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f, 0.26, 'triangle', 0.16), i*150)),
  levelup: ()=>[659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f, 0.14, 'square', 0.15), i*90)),
};
function sfx(name){ try{ if(SFX[name]) SFX[name](); }catch(e){} }

/* A slow minor arpeggio under the battle. Deliberately sparse. */
const MUSIC_STEPS = [110,131,165,196,165,131,110,98];
function musicStart(){
  if(!audio.music || !audio.ready || audio.musicTimer) return;
  audio.musicTimer = setInterval(()=>{
    if(!audio.music){ musicStop(); return; }
    const f = MUSIC_STEPS[audio.step % MUSIC_STEPS.length];
    audio.step++;
    const wasSfx = audio.sfx; audio.sfx = true;      // music ignores the SFX toggle
    tone(f, 0.42, 'triangle', 0.055);
    if(audio.step % 4 === 0) tone(f*2, 0.22, 'sine', 0.035);
    audio.sfx = wasSfx;
  }, 460);
}
function musicStop(){ if(audio.musicTimer){ clearInterval(audio.musicTimer); audio.musicTimer=null; } }
function toggleSfx(){ audio.sfx = !audio.sfx; audioResume(); sfx('click'); autosave(); render(); }
function toggleMusic(){
  audio.music = !audio.music; audioResume();
  if(audio.music) musicStart(); else musicStop();
  sfx('click'); autosave(); render();
}

/* ================= BATTLE FX =================
   render() replaces #app wholesale, so effects are queued during resolution and
   painted afterwards into a separate overlay that survives the re-render.
   ============================================= */
const fxQueue = [];
function fx(unitId, text, kind){ fxQueue.push({ unitId, text, kind }); }
function domReady(){
  return typeof document !== 'undefined' && typeof document.createElement === 'function'
      && typeof document.querySelector === 'function';
}
function flushFx(){
  if(!domReady()) { fxQueue.length = 0; return; }
  const layer = document.getElementById('fx');
  if(!layer){ fxQueue.length = 0; return; }
  const items = fxQueue.splice(0);
  items.forEach((it, i)=>{
    try{
      const host = document.querySelector('[data-unit="' + it.unitId + '"]');
      if(!host) return;
      const r = host.getBoundingClientRect();
      const el = document.createElement('div');
      el.className = 'floater ' + (it.kind || '');
      el.textContent = it.text;
      el.style.left = (r.left + r.width/2) + 'px';
      el.style.top  = (r.top + 8) + 'px';
      layer.appendChild(el);
      setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 900);
      host.classList.add(it.kind === 'heal' ? 'flash-heal' : 'flash-hit');
      setTimeout(()=>{ try{ host.classList.remove('flash-hit','flash-heal'); }catch(e){} }, 220);
    }catch(e){}
  });
}
function shake(strong){
  if(!domReady()) return;
  try{
    const app = document.getElementById('app');
    if(!app || !app.classList) return;
    const cls = strong ? 'shake-hard' : 'shake';
    app.classList.add(cls);
    setTimeout(()=>{ try{ app.classList.remove(cls); }catch(e){} }, strong ? 320 : 180);
  }catch(e){}
}

/* ================= BESTIARY =================
   Fills in as you meet things. Doubles as the reference the game needs now that
   it has this many systems.
   ============================================ */
function codex(){
  state.codex = state.codex || { species:{}, enemies:{}, hybrids:{}, bosses:{}, terrains:{}, parts:{}, traits:{} };
  return state.codex;
}
function codexSee(cat, key){
  if(!key) return;
  const c = codex();
  if(!c[cat]) c[cat] = {};
  if(!c[cat][key]){ c[cat][key] = true; return true; }
  return false;
}
function codexCount(cat){ return Object.keys(codex()[cat]||{}).length; }
function codexTotals(){
  return {
    species: Object.keys(SPECIES).length,
    enemies: ENEMY_IDS.length,
    hybrids: Object.keys(HYBRID_SPECIES).length,
    bosses: Object.keys(BOSSES).length + 1,
    terrains: Object.keys(TERRAINS).length,
    parts: Object.keys(PARTS).length,
    traits: TRAIT_IDS.length,
  };
}
function codexProgress(){
  const t = codexTotals();
  let seen = 0, total = 0;
  Object.keys(t).forEach(k=>{ seen += codexCount(k); total += t[k]; });
  return { seen, total, pct: total ? Math.round((seen/total)*100) : 0 };
}
/* Record everything a battle puts in front of the player. */
function codexRecordBattle(){
  const b = state.battle; if(!b) return;
  Object.keys(TERRAINS).forEach(k=>{ if(TERRAINS[k]===b.terrain) codexSee('terrains', k); });
  b.enemyUnits.forEach(u=>{
    if(u.speciesKey) codexSee('enemies', u.speciesKey);
    if(u.isBoss) codexSee('bosses', u.name);
  });
  b.playerUnits.forEach(u=>codexRecordMonsterUnit(u));
}
function codexRecordMonsterUnit(u){
  const m = findMonster(u.monsterUid);
  if(m) codexRecordMonster(m);
}
function codexRecordMonster(m){
  if(!m) return;
  if(isHybridId(m.speciesId)) codexSee('hybrids', m.speciesId);
  else codexSee('species', m.speciesId);
  (m.parts||[]).forEach(k=>codexSee('parts', k));
  if(m.trait) codexSee('traits', m.trait.key);
}

/* ============ PROFILES ============ */
function renderProfiles(){
  const slots = [];
  for(let i=0;i<SLOT_COUNT;i++){
    const d = readSlot(i);
    if(d){
      const depth = isDeep(d.stage) ? `Depth ${deepDepth(d.stage)}` : `Stage ${d.stage}`;

function escapeHtml(t){ return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function readInput(id){ const el=document.getElementById(id); return el ? el.value : ''; }

function newSlot(i){
  const typed = readInput('pname').trim().slice(0,18);
  initGame();
  state.slot = i;
  state.profileName = typed || ('Legion ' + (i+1));
  state.saveState = hasStorage() ? 'saved' : 'unsaved';
  autosave();
  state.screen = 'hub';
  render();
}
function continueSlot(i){
  const d = readSlot(i);
  if(!d){ render(); return; }
  applySave(d, i);

  state.screen = 'hub';

}
function wipeSlot(i){
  if(state.confirmWipe===i){ deleteSlot(i); if(signedIn()) cloudDeleteSlot(i); state.confirmWipe=null; }

}
function importIntoSlot(){
  const d = decodeCode(readInput('impcode'));
  if(!d){ state.transfer = { ok:false, msg:'That code could not be read — check it copied in full.' }; render(); return; }
  let target = null;
  for(let i=0;i<SLOT_COUNT;i++){ if(!readSlot(i)){ target=i; break; } }
  applySave(d, target);
  if(target!==null) autosave();
  state.transfer = { ok:true, msg:'Legion restored.' };
  state.saveState = target!==null ? 'saved' : 'unsaved';
  state.screen = 'hub';
  render();
}

/* ================= TRAINING DEPLOYMENT =================
   A scripted first battle. It does not lecture: each step waits for the player
   to do the thing, and the formation is rigged so the shift completes a trio.
   ======================================================= */
const TUTORIAL_STEPS = [
  { id:'attack',
    title:'Pick a target',
    body:'Your front line takes the hits so the back line can work. Tap <b>⚔ Attack</b>, then tap an enemy.' },
  { id:'skill',
    title:'Spend a skill',
    body:'Skills hit far harder and carry an elemental rider — burn, slow, stun — but then need a few turns to come back. Use yours.' },
  { id:'shift',
    title:'Reshape the line',
    body:'Your front line is <b>fire, fire, water</b>. Two fire beasts is a DUO. Send the water one back with <b>🔀 Shift</b> and the fire beast behind it steps up — turning the duo into a <b>FIRE TRIO</b>, mid-battle.' },
  { id:'gauge',
    title:'Spend the gauge',
    body:'The Legion Gauge fills as you deal and take damage. It spends in tiers: <b>🔧 Purge</b> at 33 clears afflictions and rust, <b>🛡 Rally</b> at 66 shields everyone, <b>⚡ Overdrive</b> at 100 has the whole legion strike at once. Spend it.' },
];
function tutorialActive(){ return !!state.tutorial && !state.tutorial.done; }
function tutorialStep(){
  if(!tutorialActive()) return null;
  return TUTORIAL_STEPS[state.tutorial.step] || null;
}
/* Called after the player does something; advances if it matches the current step. */
function tutorialSaw(what){
  if(!tutorialActive()) return;
  const t = state.tutorial;
  if(!TUTORIAL_STEPS.some(st=>st.id===what)) return;
  t.seen = t.seen || [];
  if(t.seen.indexOf(what) < 0) t.seen.push(what);
  // Skip over anything already done, so doing things out of order is rewarded
  // rather than ignored — the coach just moves on to what is still unlearned.
  const before = t.step;
  while(t.step < TUTORIAL_STEPS.length && t.seen.indexOf(TUTORIAL_STEPS[t.step].id) >= 0) t.step++;
  if(t.step !== before) sfx('levelup');
  if(t.step >= TUTORIAL_STEPS.length) t.done = true;
}
function tutorialPanelHtml(){
  const step = tutorialStep();
  if(!step) return '';
  return `<div class="coach">
    <div class="coach-title">TRAINING · ${state.tutorial.step+1}/${TUTORIAL_STEPS.length} — ${escapeHtml(step.title)}</div>
    <div>${step.body}</div>
    <div style="margin-top:6px;"><span class="dim" style="cursor:pointer;" onclick="skipTutorial()">[skip training]</span></div>
  </div>`;
}

/* ============ RUSTBOUND ADAPTATION ============ */
function currentAdaptation(){
  const h = state.intel.history.slice(-3);
  if(h.length===0) return null;
  const counts = {};
  h.forEach(e=>counts[e]=(counts[e]||0)+1);
  let best=null, bc=0;
  Object.entries(counts).forEach(([e,c])=>{ if(c>bc){ bc=c; best=e; } });
  return best;
}
function platingActive(){ return state.stage>=3 && !!currentAdaptation(); }
function platingPct(){ return Math.min(0.35, 0.15 + 0.03*state.intel.wins); }

function deployedElementCounts(){
  const counts = {};
  ['front','back'].forEach(row=>{
    state.formation[row].forEach(u=>{
      if(!u) return;
      const m = findMonster(u); if(!m) return;
      computeStats(m).elements.forEach(e=> counts[e]=(counts[e]||0)+1 );
    });
  });
  return counts;
}
function deployedDominantElement(){
  const counts = deployedElementCounts();
  let best=null, bc=0;
  Object.entries(counts).forEach(([e,c])=>{ if(c>bc){ bc=c; best=e; } });
  return best;
}

function validCredentials(email, password){
  if(!email || email.indexOf('@')<1 || email.length<5) return 'That does not look like an email address.';
  if(!password || password.length<6) return 'Password needs to be at least 6 characters.';
  return null;
}
function doSignIn(){
  const email = readInput('acc_email').trim(), password = readInput('acc_pass');
  const bad = validCredentials(email, password);
  if(bad){ cloud.status='error'; cloud.message=bad; render(); return; }
  cloud.busy = true; cloud.message = 'Signing in…'; render();
  cloudSignIn(email, password).then(r=>{
    cloud.busy = false;
    if(!r.ok){ cloud.status='error'; cloud.message=r.error; render(); return; }
    cloud.status='ready'; cloud.message='';
    cloudSyncDown().then(()=>cloudSyncUp()).then(()=>{ state.screen='profiles'; render(); });
    render();
  });
}
function doSignUp(){
  const email = readInput('acc_email').trim(), password = readInput('acc_pass');
  const bad = validCredentials(email, password);
  if(bad){ cloud.status='error'; cloud.message=bad; render(); return; }
  cloud.busy = true; cloud.message = 'Creating your account…'; render();
  cloudSignUp(email, password).then(r=>{
    cloud.busy = false;
    if(!r.ok){ cloud.status='error'; cloud.message=r.error; render(); return; }
    if(r.needsConfirm){
      cloud.status='signed-out';
      cloud.message='Account created — check your email to confirm it, then sign in.';
      render(); return;
    }
    cloud.status='ready'; cloud.message='Account created.';
    cloudSyncUp().then(()=>{ state.screen='profiles'; render(); });
    render();
  });
}

  cloud.busy = true; render();

function timeAgo(iso){
  const t = Date.parse(iso);
  if(!t) return 'recently';
  const mins = Math.max(0, Math.round((Date.now()-t)/60000));
  if(mins < 2) return 'just now';
  if(mins < 60) return mins+' min ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+' hr ago';
  const days = Math.round(hrs/24);
  return days+' day'+(days===1?'':'s')+' ago';
}

/* ============ ROSTER / FUSION ============ */
let fuseSelection = [];

const TRAIT_LABEL = {
  fire:'burn immunity', water:'slow immunity', volt:'stun immunity',
  nature:'regeneration', earth:'a bulwark shield', wind:'evasion',
};
/* Works out what the two selected monsters would make, or null if they can't fuse. */
function inheritTrait(parents){
  const pool = parents.map(m=>m.trait).filter(Boolean);
  if(!pool.length) return rollTrait();
  return pool[Math.floor(Math.random()*pool.length)];
}
function fusionPlan(){
  const picks = fuseSelection.map(findMonster).filter(Boolean);
  if(picks.length!==fuseSelection.length) return null;
  if(picks.some(m=>m.level<3)) return null;

  /* three matching Primes ascend */
  if(picks.length===3){
    const same = picks.every(m=>m.speciesId===picks[0].speciesId);
    if(!same || !picks.every(m=>m.tier===2)) return null;
    return { kind:'ascend', parents:picks, speciesId:picks[0].speciesId,
             parentName:getSpeciesData(picks[0].speciesId,2).name,
             resultName:'Ascended '+getSpeciesData(picks[0].speciesId,1).name };
  }
  if(fuseSelection.length!==2) return null;
  const a = picks[0], b = picks[1];
  if(a.speciesId===b.speciesId){
    if(a.tier!==b.tier || a.tier>=2) return null;
    return { kind:'prime', parents:picks, parentName:getSpeciesData(a.speciesId,a.tier).name,
             resultName:'Prime '+getSpeciesData(a.speciesId,1).name };
  }
  if(a.tier>=2 || b.tier>=2) return null;
  if(isHybridId(a.speciesId) || isHybridId(b.speciesId)) return null;
  const ea = SPECIES[a.speciesId].element, eb = SPECIES[b.speciesId].element;
  if(ea===eb) return null;
  const id = hybridIdFor(ea, eb);
  if(!HYBRID_SPECIES[id]) return null;
  return { kind:'hybrid', parents:picks, resultId:id, resultName:HYBRID_SPECIES[id].name,
           traits:[ea,eb].sort().map(e=>TRAIT_LABEL[e]) };
}
function fusionBlockReason(){
  const picks = fuseSelection.map(findMonster).filter(Boolean);
  if(picks.length<2) return 'Select two monsters.';
  if(picks.some(m=>m.level<3)) return 'Every monster in the forge must be Lv.3 or higher.';
  if(picks.length===3){
    if(!picks.every(m=>m.speciesId===picks[0].speciesId)) return 'Ascension needs three of the <b>same</b> Prime form.';
    if(!picks.every(m=>m.tier===2)) return 'Ascension needs three <b>Prime</b> forms — evolve them first.';
    return 'These three cannot ascend.';
  }
  const a = picks[0], b = picks[1];
  if(a.tier>=3 || b.tier>=3) return 'Ascended forms are the end of the line.';
  if(a.speciesId===b.speciesId && a.tier===2) return 'Two Primes are not enough — ascension takes <b>three</b>.';
  if(a.tier>=2 || b.tier>=2) return 'Prime forms can only be combined with matching Primes.';
  if(isHybridId(a.speciesId) || isHybridId(b.speciesId)) return 'A hybrid can only be evolved with an identical hybrid, not spliced again.';
  return 'These two share an element — splicing needs two different elements.';
}
function renderRoster(){
  fuseSelection = fuseSelection.filter(u=>findMonster(u));
  let cards = state.roster.map(m=>{
    const st = computeStats(m);
    const sel = fuseSelection.includes(m.uid);
    return `
    <div class="mcard ${sel?'selected':''}" onclick="toggleFuseSelect('${m.uid}')">
      ${m.tier>=3?'<div class="tier3tag">👑</div>':(m.tier>=2?'<div class="tier2tag">★</div>':'')}${isHybridId(m.speciesId)?'<div class="tier2tag" style="left:2px; right:auto; color:var(--wind)">✦</div>':''}
      <div class="emoji">${st.emoji}</div>
      <div class="name">${st.name}</div>
      <div class="lvl">Lv.${m.level}</div>
      ${elemTags(st.elements)}
      ${traitTag(st.trait)}
      ${corruptionBar(st.corruption)}
    </div>`;
  }).join('');

  const plan = fusionPlan();
  const canFuse = !!plan;
  let fuseInfo;
  if(fuseSelection.length!==2){
    fuseInfo = 'Select from the roster above. <b>Two of a kind</b> evolve into a Prime; <b>two different elements</b> splice into a hybrid; <b>three matching Primes</b> ascend. The result inherits one parent\'s trait.';
  } else if(plan && plan.kind==='ascend'){
    fuseInfo = `Ascend three ${plan.parentName} into a single <b>${plan.resultName}</b> 👑 — 2.3× base stats, a fourth part slot, and an empowered skill. All three are consumed.`;
  } else if(plan && plan.kind==='prime'){
    fuseInfo = `Evolve two ${plan.parentName} into one <b>${plan.resultName}</b>. Installed parts are lost in the forge.`;
  } else if(plan && plan.kind==='hybrid'){
    const sd = HYBRID_SPECIES[plan.resultId];
    fuseInfo = `Splice into <b>${sd.emoji} ${sd.name}</b> — ${elemTags(sd.elements)} — inheriting <b>${plan.traits.join(' + ')}</b>.
      It counts toward <b>both</b> element lines in whichever row it stands. Parents and their parts are consumed.`;
  } else {
    fuseInfo = fusionBlockReason();
  }

function toggleFuseSelect(u){
  const i = fuseSelection.indexOf(u);

    fuseSelection.push(u);

function doFuse(){
  const plan = fusionPlan();
  if(!plan) return;
  const parents = plan.parents;
  const eaten = parents.map(m=>m.uid);
  const trait = inheritTrait(parents);
  state.roster = state.roster.filter(m=>eaten.indexOf(m.uid)<0);
  ['front','back'].forEach(row=>{
    state.formation[row] = state.formation[row].map(u=> eaten.indexOf(u)>=0 ? null : u);
  });
  const made = (plan.kind==='prime')  ? newMonster(parents[0].speciesId, 1, 2, trait)
             : (plan.kind==='ascend') ? newMonster(plan.speciesId, 1, 3, trait)
             : newMonster(plan.resultId, 1, 1, trait);
  state.roster.push(made);
  autosaveLater();
  if(plan.kind==='hybrid'){ state.discovered = state.discovered||{}; state.discovered[plan.resultId] = true; }
  state.lastFusion = computeStats(made);
  fuseSelection = [];
  render();
}

/* --- harvest: the rust already took this one; take something back --- */
function beginHarvest(uidStr){
  const m = findMonster(uidStr);
  if(!canHarvest(m)) return;
  state.harvest = { donor: uidStr, kind: null };
  state.transfer = null;
  sfx('click'); render();
}
function pickGraft(kind){
  if(!state.harvest || !GRAFT_KINDS[kind]) return;
  state.harvest.kind = kind; sfx('click'); render();
}
function doHarvest(targetUid){
  const h = state.harvest;
  if(!h || !h.kind) return;
  const donor = findMonster(h.donor), target = findMonster(targetUid);
  if(!donor || !target || donor.uid===target.uid) return;
  if(!canHarvest(donor)) return;
  if(h.kind==='slot' && graftCount(target,'slot') >= 1){
    state.bayMsg = 'That beast already carries a Bracing Frame.'; render(); return;
  }
  if(!addGraft(target, h.kind)){ state.bayMsg = 'That graft will not take.'; render(); return; }
  // the donor is consumed, parts and all
  state.roster = state.roster.filter(x=>x.uid!==donor.uid);
  ['front','back'].forEach(r=>{ state.formation[r] = state.formation[r].map(u=> u===donor.uid ? null : u); });
  const st = computeStats(target);
  state.bayMsg = `${GRAFT_KINDS[h.kind].emoji} ${GRAFT_KINDS[h.kind].name} grafted onto ${st.name}. ${computeStats(donor).name} is gone.`;
  state.harvest = null;
  sfx('levelup'); autosave(); render();
}

/* --- trait transfer: move a good roll off a body you don't want --- */
function beginTransfer(uidStr){
  const m = findMonster(uidStr);
  if(!m || !m.trait || m.level < 3) return;
  state.transfer = { donor: uidStr };
  state.harvest = null;
  sfx('click'); render();
}
function doTransfer(targetUid){
  const t = state.transfer;
  if(!t) return;
  const donor = findMonster(t.donor), target = findMonster(targetUid);
  if(!donor || !target || donor.uid===target.uid) return;
  if(donor.level < 3){ state.bayMsg = 'The donor must be Lv.3 or higher.'; render(); return; }
  const moved = donor.trait;
  target.trait = moved;
  state.roster = state.roster.filter(x=>x.uid!==donor.uid);
  ['front','back'].forEach(r=>{ state.formation[r] = state.formation[r].map(u=> u===donor.uid ? null : u); });
  state.bayMsg = `${traitName(moved)} carried over to ${computeStats(target).name}. ${computeStats(donor).name} is gone.`;
  state.transfer = null;
  sfx('levelup'); autosave(); render();
}
function cancelBayAction(){ state.harvest=null; state.transfer=null; state.bayMsg=''; sfx('click'); render(); }
function installPart(monsterUid){
  if(!state.selectedPart) return;
  const m = findMonster(monsterUid); if(!m) return;
  if((m.parts||[]).length >= partSlots(m)) return;
  const idx = state.parts.findIndex(p=>p.uid===state.selectedPart);
  if(idx<0) return;
  const part = state.parts.splice(idx,1)[0];
  m.parts = (m.parts||[]).concat([part.key]);
  state.selectedPart = null;
  autosave();
  render();
}
function purgePart(monsterUid, slotIdx){
  const m = findMonster(monsterUid); if(!m) return;
  m.parts.splice(slotIdx,1);
  autosave();
  render();
}
