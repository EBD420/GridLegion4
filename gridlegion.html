  const b = state.battle;
  const dest = shiftDestination(unit);
  const occupants = b.playerUnits.filter(u=>u.row===dest && !u.fainted);
  let ally = null;
  if(occupants.length >= 3){
    ally = occupants.slice().sort((a,c)=>(c.hp/Math.max(1,c.maxHp))-(a.hp/Math.max(1,a.maxHp)))[0];
  }
  if(ally) ally.row = unit.row;
  unit.row = dest;
  sfx('shift');
  logMsg(`🔀 ${unit.emoji} ${unit.name} shifts to the ${dest.toUpperCase()} line${ally?`, trading with ${ally.emoji} ${ally.name}`:''}.`);
  applySynergyRefresh();
}

/* ============ PLAYER ACTIONS ============ */
function playerChooseAction(kind){
  const b = state.battle;
  if(!battleActive(b) || !b.awaitingInput) return;
  if(kind==='gauge_overdrive'){ useGaugeOverdrive(); return; }
  if(kind==='gauge_rally'){ useGaugeRally(); return; }
  if(kind==='shift'){ playerShift(); return; }
  b.pendingAction = kind;
  render();
}

function shiftDestination(unit){ return unit.row==='front' ? 'back' : 'front'; }
function playerShift(){
  const b = state.battle;
  const unit = b.queue[b.qIndex];
  if(!unit) return;
  const dest = shiftDestination(unit);
  const occupants = b.playerUnits.filter(u=>u.row===dest && !u.fainted);
  if(occupants.length < 3){ doShift(unit, null); return; }
  b.pendingAction = 'shift';
  render();
}
function doShift(unit, ally){
  const b = state.battle;
  b.awaitingInput = false;
  const dest = shiftDestination(unit);
  if(ally) ally.row = unit.row;
  unit.row = dest;
  sfx('shift');
  logMsg(`🔀 ${unit.emoji} ${unit.name} shifts to the ${dest.toUpperCase()} line${ally?`, trading places with ${ally.emoji} ${ally.name}`:''}.`);
  applySynergyRefresh();
  tutorialSaw('shift');
  b.pendingAction = null;
  b.qIndex++;
  render();
  if(checkBattleEnd()) return;
  setTimeout(nextTurn, 500);
}

function useGaugeOverdrive(){
  const b = state.battle;
  b.awaitingInput = false;
  tutorialSaw('gauge');
  spendGauge(GAUGE_COST.overdrive);
  sfx('gauge'); shake(true);
  logMsg('⚡⚡ LEGION OVERDRIVE! The whole legion strikes as one!');
  b.playerUnits.filter(u=>!u.fainted).forEach(u=>{
    const targets = b.enemyUnits.filter(t=>!t.fainted);
    if(targets.length===0) return;
    const target = targets[Math.floor(Math.random()*targets.length)];
    applyDamage(u, target, false);
  });
  b.qIndex++;
  render();
  if(checkBattleEnd()) return;
  setTimeout(nextTurn, 700);
}
function useGaugeRally(){
  const b = state.battle;
  b.awaitingInput = false;
  tutorialSaw('gauge');
  spendGauge(GAUGE_COST.rally);
  sfx('shield');
  logMsg('🛡✨ RALLY! The legion braces as one — shields up, afflictions burned off.');
  b.playerUnits.filter(u=>!u.fainted).forEach(u=>{
    u.shield=true; u.status=null;
    if(u.corruption>0) applyRust(u, -8);
  });
  b.qIndex++;
  render();
  setTimeout(nextTurn, 500);
}

function playerTarget(targetId){
  const b = state.battle;
  if(!battleActive(b) || !b.awaitingInput) return;
  const unit = b.queue[b.qIndex];
  const target = b.enemyUnits.concat(b.playerUnits).find(u=>u.id===targetId);
  if(!unit || !target) return;
  b.awaitingInput = false;

  if(b.pendingAction==='shift'){ doShift(unit, target); return; }

  if(b.pendingAction==='gauge_purge'){
    tutorialSaw('gauge');
    spendGauge(GAUGE_COST.purge);
    const hadStatus = !!target.status;
    target.status = null;
    const rustBefore = target.corruption;
    if(rustBefore>0) applyRust(target, -12);
    logMsg(`🔧 PURGE! ${target.emoji} ${target.name} is stripped down and reset${hadStatus?' — afflictions cleared':''}${rustBefore>0?` — rust ${rustBefore} → ${target.corruption}`:''}.`);
    b.pendingAction = null; b.qIndex++;
    render();
    if(checkBattleEnd()) return;
    setTimeout(nextTurn, 450);
    return;
  }

  if(b.pendingAction==='gauge_alpha'){
    tutorialSaw('gauge');
    spendGauge(GAUGE_COST.alpha);
    sfx('gauge'); shake(true);
    logMsg(`✨💥 ${unit.emoji} ${unit.name} unleashes an ALPHA STRIKE!`);
    const raw = Math.max(1, Math.round(unit.atk*2.5 - target.def*0.5));
    const am = multiplierVs(unit, target);
    let finalBig = Math.round(raw * am.mult);
    if(target.plating && am.elem===target.plating) finalBig = Math.max(1, Math.round(finalBig*(1-target.platingPct)));
    target.hp = Math.max(0, target.hp-finalBig);
    if(target.hp<=0) target.fainted = true;
    b.elemDamage[am.elem] = (b.elemDamage[am.elem]||0) + finalBig;
    logMsg(`${target.emoji} ${target.name} takes ${finalBig} damage!${target.fainted?' — defeated!':''}`);
    fx(target.id, '-' + finalBig + '!', 'crit');
    fxMotion(unit, target, am.elem, finalBig>0);
    recordReplayAction({ a:unit.id, d:target.id, dmg:finalBig, crit:true, faint:!!target.fainted, elem:am.elem,
      msg:`✨💥 ${unit.emoji} ${unit.name} unleashes an ALPHA STRIKE on ${target.emoji} ${target.name} for ${finalBig}${target.fainted?' — defeated!':''}` });
    b.pendingAction = null; b.qIndex++;
    render();
    if(checkBattleEnd()) return;
    setTimeout(nextTurn, 500);
    return;
  }

  const isSkill = b.pendingAction==='skill';
  if(isSkill) unit.skillCd = unit.skillMaxCd;
  else if(unit.skillCd>0) unit.skillCd--;
  applyDamage(unit, target, isSkill);
  tutorialSaw(isSkill ? 'skill' : 'attack');
  b.pendingAction = null; b.qIndex++;
  render();
  if(checkBattleEnd()) return;
  setTimeout(nextTurn, 450);
}

/* ============ END OF BATTLE ============ */
function dominantFromElemDamage(map){
  let best=null, bd=0;
  Object.entries(map).forEach(([e,d])=>{ if(d>bd){ bd=d; best=e; } });
  return best;
}

function stageExp(){ return 8 + state.stage*2; }
function awardExp(units, amount){
  const levelled = [];
  units.forEach(u=>{
    const m = findMonster(u.monsterUid);
    if(!m) return;
    const before = m.level;
    const gained = u.mentorRookie ? Math.round(amount * (1 + MENTOR_ROOKIE_EXP_BONUS)) : amount;
    m.exp += gained;
    let need = m.level*10;
    while(m.exp>=need){ m.exp-=need; m.level++; need=m.level*10; }
    if(m.level>before) levelled.push(computeStats(m).name+' Lv.'+m.level);
  });
  return levelled;
}

function battleStats(result){
  const b = state.battle;
  const elemsUsed = Object.keys(b.elemDamage).filter(e=>b.elemDamage[e]>0);
  return {
    win: result==='win',
    elemDamage: b.elemDamage,
    elemsUsed,
    losses: b.playerUnits.filter(u=>u.fainted).length,
    rounds: b.rounds || 1,
    hybrids: b.playerUnits.filter(u=>u.hybrid).length,
    maxRust: b.playerUnits.reduce((m,u)=>Math.max(m,u.corruption||0), 0),
    boss: !!bossForStage(state.stage),
    trial: !!state.trial,
    mods: state.trial ? state.trial.mods.length : 0,
  };
}

/* ================= WAR JOURNAL =================
   A short recap written after every stage battle from what actually
   happened in it: real numbers pulled off the fight that just ended, not a
   template with blanks filled in. Duels, raids, trials and the tutorial
   don't write entries — this is the campaign's own record.
   ================================================= */
const JOURNAL_CAP = 30;
function journalAdd(entry){
  if(!entry) return;
  state.journal = Array.isArray(state.journal) ? state.journal : [];
  state.journal.unshift(entry);
  if(state.journal.length > JOURNAL_CAP) state.journal.length = JOURNAL_CAP;
}
function pickText(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function battleUnitName(id){
  const b = state.battle;
  const u = b && id ? b.playerUnits.find(x=>x.id===id) : null;
  return u ? u.name : null;
}
function battleJournalEntry(result){
  const b = state.battle; if(!b) return null;
  const win = result==='win';
  const deep = isDeep(state.stage);
  const label = deep ? `Depth ${deepDepth(state.stage)}` : `Stage ${state.stage}`;
  const bossDef = bossForStage(state.stage);
  const losses = b.playerUnits.filter(u=>u.fainted).length;
  const rounds = b.rounds || 1;

  let mvpId = null, mvpDmg = 0;
  Object.keys(b.dmgByUnitId||{}).forEach(id=>{
    if(b.dmgByUnitId[id] > mvpDmg){ mvpDmg = b.dmgByUnitId[id]; mvpId = id; }
  });
  const mvpName = mvpId ? battleUnitName(mvpId) : null;
  const killerName = win ? battleUnitName(b.lastKillId) : null;

  const sentences = [];
  if(bossDef){
    sentences.push(win
      ? pickText([`${label} — ${bossDef.name} went down after ${rounds} round${rounds===1?'':'s'}.`,
                  `${label}. ${rounds} round${rounds===1?'':'s'} of trading blows, and ${bossDef.name} finally stopped moving.`])
      : pickText([`${label} — ${bossDef.name} broke the legion after ${rounds} round${rounds===1?'':'s'}.`,
                  `${label}. The legion couldn't put ${bossDef.name} down — ${rounds} round${rounds===1?'':'s'}, then the retreat.`]));
  } else {
    sentences.push(win
      ? pickText([`${label} cleared in ${rounds} round${rounds===1?'':'s'}.`,
                  `The legion took ${label} in ${rounds} round${rounds===1?'':'s'}.`])
      : pickText([`${label} ended in a rout after ${rounds} round${rounds===1?'':'s'}.`,
                  `${rounds} round${rounds===1?'':'s'}, and ${label} broke the legion.`]));
  }
  if(mvpName){
    sentences.push(pickText([
      `${mvpName} carried the fight, dealing ${mvpDmg} of the damage.`,
      `${mvpName} did the heaviest lifting — ${mvpDmg} damage on its own.`,
    ]));
  }
  if(killerName && killerName!==mvpName){
    sentences.push(pickText([
      `${killerName} landed the finishing blow.`,
      `It was ${killerName} that finished it.`,
    ]));
  }
  if(b.lowestSurvivorId && b.lowestSurvivorPct!==null && b.lowestSurvivorPct<=0.4){
    const survName = battleUnitName(b.lowestSurvivorId);
    const pct = Math.round(b.lowestSurvivorPct*100);
    if(survName){
      sentences.push(pickText([
        `${survName} came within an inch of fainting, dropping to ${pct}% HP.`,
        `The closest call was ${survName}, who dropped to ${pct}% HP.`,
      ]));
    }
  } else if(win && losses===0){
    sentences.push(pickText([`Nobody in the legion took a serious hit.`, `A clean fight — no close calls.`]));
  }
  if(losses>0){
    sentences.push(`${losses} beast${losses===1?'':'s'} fainted before it was over.`);
  }
  if(b.reinforced){
    sentences.push(win
      ? pickText([`Reinforcements rushed in partway through — the legion closed it out anyway.`, `A second wave piled on midway. Didn't matter.`])
      : pickText([`Reinforcements rushed in partway through and tipped it.`, `A second wave arrived midway and the legion couldn't recover.`]));
  }

  return {
    id: uid(), stage: state.stage, deep, win, boss: bossDef ? bossDef.name : null,
    text: sentences.join(' '), at: Date.now(), redeploy: !!state.redeploy,
  };
}

/* ---- Field Promotions: a bench monster that sat out this fight has a
   small, independent chance to pick something up anyway — a trait reroll,
   a sliver of EXP, or (rarely) a full level — "learning from the
   sideline." Applies to any real fight, win or lose, the same way a
   Redeployment does: duels, raids and Trials are excluded because each
   already runs outside the legion's normal progression, and the tutorial
   never reaches this code at all (endBattle returns before this point
   whenever state.tutorial is active).

   Eligibility is checked against state.battle.benchAtStart — the bench as
   it stood the moment this battle began, snapshotted in beginBattle() —
   rather than the live bench at endBattle() time. Winning a fight can add
   a freshly-captured recruit straight onto the bench a few lines above this
   one; that recruit never actually sat out THIS fight (it didn't exist yet
   when it started), so it isn't eligible for it. */
const FIELD_PROMO_CHANCE = 0.07;
function benchRoster(){
  const deployed = {};
  state.formation.front.concat(state.formation.back).forEach(uid=>{ if(uid) deployed[uid]=true; });
  return state.roster.filter(m=>!deployed[m.uid]);
}
function applyFieldPromotions(){
  if(state.duel || state.raidRun || state.worldBossRun || state.guildWarRun || state.trial) return [];
  const b = state.battle;
  const startBench = b && b.benchAtStart;
  const notes = [];
  benchRoster().filter(m=>!startBench || startBench.indexOf(m.uid)>=0).forEach(m=>{
    if(Math.random()>=FIELD_PROMO_CHANCE) return;
    const name = computeStats(m).name;
    const roll = Math.random();
    if(roll<0.25){
      m.trait = rollTrait();
      notes.push(`${name} picked up a new trait on the sideline: ${traitName(m.trait)}`);
    } else if(roll<0.85){
      const amt = Math.max(1, Math.round(stageExp()*0.25));
      awardExp([{monsterUid:m.uid}], amt);
      notes.push(`${name} picked up a sliver of EXP from the sideline`);
    } else {
      const need = Math.max(1, m.level*10 - m.exp);
      const levelled = awardExp([{monsterUid:m.uid}], need);
      notes.push(levelled.length ? `${name} levelled up just from watching: ${levelled[0]}` : `${name} picked up a sliver of EXP from the sideline`);
    }
  });
  return notes;
}

function endBattle(result){
  const b = state.battle;
  b.result = result;

  if(state.tutorial){
    state.lastResult = { win: result==='win', tutorial:true };
    state.screen = 'result';
    sfx(result==='win' ? 'victory' : 'defeat');
    musicStop();
    render();
    return;
  }

  const dailyDone = scoreDailies(battleStats(result));

  if(state.duel){
    const won = result==='win';
    state.lastResult = { win:won, duel:true, opponent:state.duel.name, dailyDone };
    state.screen = 'result';
    render();
    ladderReport(won, state.duel.userId).then(r=>{
      social.lastDuel = r.ok ? 'Rating updated.' : ('Result not recorded: ' + (r.error||'unknown error'));
      if(state.screen==='result') render();
    });
    return;
  }

  if(state.raidRun){
    const won = result==='win';
    const dealt = computeRaidDamage(b);
    const raidDrops = [];
    if(won && raidMutatorActive('salvage')){
      const keys = b.enemyUnits.map(u=>u.speciesKey).filter(Boolean);
      for(let i=0;i<2 && state.parts.length<14 && keys.length;i++){
        const drop = { uid: uid(), key: keys[Math.floor(Math.random()*keys.length)] };
        state.parts.push(drop);
        raidDrops.push(drop);
      }
    }
    state.lastResult = { win:won, raid:true, dealt, dailyDone, raidDrops, raidMutators:currentRaidMutators() };
    state.screen = 'result';
    if(raidDrops.length) autosave();
    render();
    raidContribute(dealt).then(r=>{
      social.status = r.ok ? `Logged ${dealt} damage to the raid.` : ('Damage not logged: ' + (r.error||'unknown error'));
      if(state.screen==='result') render();
    });
    return;
  }

  if(state.worldBossRun){
    const won = result==='win';
    const dealt = computeWorldBossDamage(b);
    state.lastResult = { win:won, worldBoss:true, dealt, dailyDone };
    state.screen = 'result';
    render();
    worldBossContribute(dealt).then(r=>{
      social.worldBossStatus = r.ok ? `Logged ${dealt} damage to the World Boss.` : ('Damage not logged: ' + (r.error||'unknown error'));
      if(state.screen==='result') render();
    });
    return;
  }

  if(state.guildWarRun){
    const won = result==='win';
    const scored = computeWarScore(b, result);
    state.lastResult = { win:won, guildWar:true, scored, dailyDone };
    state.screen = 'result';
    render();
    guildWarContribute(scored).then(r=>{
      social.guildWarStatus = r.ok ? `Logged ${scored} points for the guild war.` : ('Score not logged: ' + (r.error||'unknown error'));
      if(state.screen==='result') render();
    });
    return;
  }

  if(state.trial){
    const won = result==='win';
    const drops = [];
    if(won){
      for(let i=0;i<state.trial.reward && state.parts.length<14;i++){
        const keys = ENEMY_IDS;
        drops.push({ uid: uid(), key: keys[Math.floor(Math.random()*keys.length)] });
      }
      drops.forEach(d=>state.parts.push(d));
    }
    state.lastResult = { win:won, trial:true, drops, dailyDone,
      mods: state.trial.mods.slice(), stage: state.trial.stage };
    state.screen = 'result';
    sfx(won ? 'victory' : 'defeat');
    autosave();
    render();
    return;
  }

  if(state.gauntletRun){
    const g = state.gauntlet;
    if(result==='win'){
      let drop = null;
      if(state.parts.length<14){
        drop = { uid: uid(), key: ENEMY_IDS[Math.floor(Math.random()*ENEMY_IDS.length)] };
        state.parts.push(drop);
      }
      if(g.wave > (state.gauntletBest||0)) state.gauntletBest = g.wave;
      state.lastResult = { win:true, gauntlet:true, waveCleared:g.wave, drop,
        isRecord: g.wave===state.gauntletBest };
      g.wave++;
      state.screen = 'result';
      sfx('victory');
      render();
      return;
    }
    const wavesCleared = g.wave - 1;
    state.lastResult = { win:false, gauntlet:true, wavesCleared, best: state.gauntletBest||0,
      isRecord: wavesCleared>0 && wavesCleared===state.gauntletBest };
    state.stage = state.stageBeforeGauntlet || state.stage;
    state.gauntletRun = false;
    state.gauntlet = null;
    state.screen = 'result';
    sfx('defeat');
    autosave();
    render();
    return;
  }

  if(result==='win'){
    const expGain = Math.round(stageExp() * (bossForStage(state.stage) ? 1.75 : 1) * (hasPerk('exp') ? 1.10 : 1) * (commanderHasPerk('exp_all') ? 1.05 : 1) * (codexBonusActive('enemies') ? 1.05 : 1) * (1 + companionPerkPct('exp')));
    const levelled = awardExp(b.playerUnits, expGain);

    // --- Rustbound intel: they study what actually hurt them ---
    const dom = dominantFromElemDamage(b.elemDamage);
    if(dom){
      state.intel.history.push(dom);
      if(state.intel.history.length>5) state.intel.history.shift();
    }
    state.intel.wins++;
    state.cleared[state.stage] = true;

    // --- Rustbound doctrine: the same signal, but it never forgets (see
    // RUSTBOUND DOCTRINE above) — persists through Rebirth, only escalates.
    const prevDoctrineElement = doctrineElement();
    const prevDoctrineTier = doctrineTier();
    if(dom) state.doctrine.elementTally[dom] = (state.doctrine.elementTally[dom]||0) + 1;
    b.playerUnits.forEach(u=>{ state.doctrine.formationTally[u.row] = (state.doctrine.formationTally[u.row]||0) + 1; });
    Object.keys(b.killsBySpecies||{}).forEach(sp=>{
      state.doctrine.kills[sp] = (state.doctrine.kills[sp]||0) + b.killsBySpecies[sp];
    });
    state.doctrine.wins++;
    const newDoctrineElement = doctrineElement();
    const newDoctrineTier = doctrineTier();
    if(newDoctrineTier>prevDoctrineTier || (newDoctrineElement && newDoctrineElement!==prevDoctrineElement)){
      journalAdd(doctrineShiftEntry(prevDoctrineElement, newDoctrineElement, newDoctrineTier));
    }

    // Battle-Forged Bonds: every pair of player units still standing shares
    // one more fight together (see recordBattleBonds/applyBattleBonds above).
    recordBattleBonds(b.playerUnits.filter(u=>!u.fainted));

    // Monster Nicknames — close calls: only meaningful on a win, since a loss
    // means checkBattleEnd() found every player unit fainted already.
    b.playerUnits.forEach(u=>{
      if(u.fainted || u.hp<=0 || u.maxHp<=0) return;
      if((u.hp/u.maxHp) > CLOSE_CALL_HP_FRAC) return;
      const m = findMonster(u.monsterUid); if(m) m.closeCalls = (m.closeCalls||0) + 1;
    });

    // Tribes notice who actually did the fighting.
    const favorGains = {};
    Object.keys(b.elemDamage).forEach(e=>{
      if(!TRIBES[e]) return;
      const share = b.elemDamage[e];
      if(share>0) favorGains[e] = (favorGains[e]||0) + Math.min(8, 2 + Math.round(share/60));
    });
    b.playerUnits.forEach(u=>{
      (u.attackElements||[]).forEach(e=>{ if(TRIBES[e] && !favorGains[e]) favorGains[e] = 1; });
    });
    Object.keys(favorGains).forEach(e=>addFavor(e, Math.round(favorGains[e]*(1+companionPerkPct('favor')))));

    // --- Salvage from the wreckage (elite waves are stripped twice over) ---
    const drops = [];
    const isBossWin = !!bossForStage(state.stage);
    const pulls = (isEliteStage(state.stage) || isBossWin) ? 2 : 1;
    for(let d=0; d<pulls; d++){
      if(state.parts.length>=14) break;
      if(d===0 && !isEliteStage(state.stage) && !isBossWin && Math.random() >= ((hasPerk('salvage')?0.85:0.7) + (commanderHasPerk('salvage_pct')?0.10:0) + (codexBonusActive('hybrids')?0.05:0) + WIN_STREAK_SALVAGE_PER*winStreakLevel() + (hasProject('vault')?0.08:0) + companionPerkPct('salvage'))) break;
      const keys = b.enemyUnits.map(u=>u.speciesKey).filter(Boolean);
      if(!keys.length) break;
      const drop = { uid: uid(), key: keys[Math.floor(Math.random()*keys.length)] };
      state.parts.push(drop);
      drops.push(drop);
    }
    const part = drops.length ? drops[0] : null;

    // --- Archive Fragments: Deep-only, independent of the salvage pull above. ---
    const archiveFragment = isDeep(state.stage) ? rollArchiveFragment() : null;

    let captured = null;
    const recruitChance = (isEliteStage(state.stage) || isBossWin) ? 1 : (isDeep(state.stage) ? 0.6 : 0.45);
    if(Math.random()<recruitChance && state.roster.length<rosterCap()){
      // Recruits skew toward tribes already in your legion, so duplicates accumulate
      // and the evolution ladder (pair -> Prime, three Primes -> Ascended) can actually be climbed.
      const owned = state.roster.map(m=>m.speciesId).filter(id=>SPECIES[id] && !SPECIES[id].champion);
      const id = (owned.length && Math.random()<0.55)
        ? owned[Math.floor(Math.random()*owned.length)]
        : WILD_IDS[Math.floor(Math.random()*WILD_IDS.length)];
      captured = newMonster(id,1,1);
      state.roster.push(captured);
    }
    if(signedIn() && social.guild) guildAddXp(50 + state.stage*5);
    state.lastResult = { win:true, expGain, captured, part, drops, dom, nextAdapt: currentAdaptation(), levelled,
                         finale: state.stage===CAMPAIGN_LENGTH, elite: isEliteStage(state.stage),
                         boss: bossForStage(state.stage) ? bossForStage(state.stage).name : null,
                         favorGains, newChampions: TRIBE_IDS.filter(e=>championUnlocked(e) && !state.recruited[e]),
                         newBlessings: TRIBE_IDS.filter(e=>blessingUnlocked(e)), dailyDone, archiveFragment };
  } else {
    // A defeat still teaches the legion something — otherwise a loss is unrecoverable.
    const expGain = Math.max(1, Math.round(stageExp()*0.5));
    const levelled = awardExp(b.playerUnits, expGain);
    state.lastResult = { win:false, expGain, levelled, dailyDone };
  }
  // Win streak: how many stage battles in a row have broken the same way
  // (positive = wins, negative = losses). Pure flavour for The Camp's
  // commentary — never read anywhere that affects battle odds or rewards.
  state.streak = (result==='win') ? ((state.streak>0) ? state.streak+1 : 1)
                                   : ((state.streak<0) ? state.streak-1 : -1);
  // Trophy Case: a permanent high-water mark, since state.streak itself
  // resets to 0 the moment a single loss snaps it (only a positive — an
  // actual win streak — is ever a record worth keeping).
  if(state.streak > (state.bestStreak||0)) state.bestStreak = state.streak;
  // Monster Nicknames — every unit that deployed this battle was fielded,
  // win or lose; kills are credited off the same killsByUnit tally
  // applyDamage/applyCascadeOverflow build (right beside killsBySpecies).
  // Same shared tail as the streak/Caravan above, so duels/raids/trials/the
  // tutorial (which all return earlier) never touch a monster's own record.
  b.playerUnits.forEach(u=>{
    const m = findMonster(u.monsterUid); if(!m) return;
    m.timesFielded = (m.timesFielded||0) + 1;
  });
  Object.keys(b.killsByUnit||{}).forEach(uidStr=>{
    const m = findMonster(uidStr); if(m) m.kills = (m.kills||0) + b.killsByUnit[uidStr];
  });
  // Scavenger Caravan: checked here for the same reason streak is updated
  // here — this tail is the shared ending for normal stage wins, Redeployment
  // and Campaign Map Detours, and skipped entirely by duels/raids/trials/the
  // tutorial (which all return earlier above), so a real-time-gated offer only
  // ever spawns or expires against battles that actually return to the Hub.
  tickCaravan(Date.now());
  // The Black Market: same shared tail, same exclusions, own independent clock.
  tickBlackMarket(Date.now());
  // Field Companion: same shared tail, same exclusions — "ordinary play"
  // means a real stage battle reached the Hub again, not a duel or trial.
  addCompanionXp(COMPANION_XP_PER_BATTLE);
  // Online Now: same shared tail, same exclusions — a fire-and-forget
  // heartbeat so a legion shows up as active from ordinary play, not only
  // when the player happens to have the Online Now screen open.
  if(signedIn()) presenceSync();
  if(state.redeploy && state.lastResult) state.lastResult.redeploy = true;
  const portrait = victoryPortrait(result);
  journalAdd(battleJournalEntry(result));
  if(portrait && state.journal[0]) state.journal[0].portrait = portrait;
  if(state.lastResult) state.lastResult.portrait = portrait;
  // Battle Replays: at most one capture per battle, in priority order —
  // see the BATTLE REPLAYS block above for why each check reads the way
  // it does (bestStreak/bestDepth haven't been bumped for THIS win yet
  // when the streak/depth checks run, so ">" here really does mean "new").
  if(result==='win'){
    const bossHere = bossForStage(state.stage);
    if(bossHere) captureReplay('boss', bossHere.name + ' felled');
    else if(state.streak>=3 && state.streak===state.bestStreak) captureReplay('streak', state.streak + '-win streak');
    else if(isDeep(state.stage) && deepDepth(state.stage) > (state.bestDepth||0)) captureReplay('depth', 'Depth ' + deepDepth(state.stage) + ' reached');
  }
  if(state.detour && state.lastResult){
    const det = CAMPAIGN_DETOURS.find(d=>d.id===state.detour.id);
    state.lastResult.detour = true;
    state.lastResult.detourName = det ? det.name : null;
    if(det && result==='win' && !claimedDetour(det.id)){
      const granted = grantDetourReward(det);
      if(granted){
        state.campaignDetours = state.campaignDetours || {};
        state.campaignDetours[det.id] = true;
        state.lastResult.detourReward = granted;
      }
    }
  }
  if(state.undercroft && state.lastResult){
    state.lastResult.undercroft = true;
    if(result==='win' && !state.undercroftClaimed){
      state.undercroftClaimed = true;
      state.undercroftWard = true;
      state.lastResult.undercroftReward = `☣ Corruption Ward earned — the whole legion runs ${UNDERCROFT_WARD_REDUCTION} rust cooler, permanently.`;
    }
  }
  // Mercenary Contract: the hire was already consumed in beginBattle() the
  // instant it was fielded — this just carries the flavor through to the
  // result screen, win or lose, same as Detour/Undercroft above.
  if(b.mercenary && state.lastResult){
    state.lastResult.mercenary = b.mercenary;
  }
  const cmdLevelled = commanderAddXp(result==='win' ? (20 + state.stage*2) : (5 + Math.floor(state.stage/2)));
  if(cmdLevelled && state.lastResult) state.lastResult.commanderLevel = cmdLevelled;
  const fieldPromoNotes = applyFieldPromotions();
  if(fieldPromoNotes.length && state.lastResult) state.lastResult.fieldPromotions = fieldPromoNotes;
  autosave();
  state.screen = 'result';
  sfx(result==='win' ? 'victory' : 'defeat');
  if(result==='win' && state.lastResult && state.lastResult.levelled && state.lastResult.levelled.length) setTimeout(()=>sfx('levelup'), 700);
  musicStop();
  render();
}

/* ================= ENERGY =================
   A second account-level resource, right alongside Commander Rank below:
   lives OUTSIDE any save slot, in its own localStorage key, so restarting
   a legion, prestiging into a Rebirth, or wiping a slot never touches it
   — this is the player's own energy on this device, not any one legion's.

   Regeneration is a pure function of real elapsed time, recomputed on
   demand at a small number of fixed choke points (tickEnergy's call sites:
   the top of renderHub/renderRedeploy/renderCampaignMap) — never a
   setInterval, same convention the Scavenger Caravan and Black Market
   clocks already use. Energy accrues in whole-hour batches: lastUpdate
   only ever advances by a whole multiple of one hour, so a fractional
   hour of progress already earned is never silently discarded by an
   awkwardly-timed tick, and it never banks up while already full (see the
   early branch in tickEnergy) — sitting at max for a week doesn't let the
   next spend refill instantly the moment it ticks again.

   Every fight that actually advances or defends the campaign — an
   ordinary stage battle, a Redeployment, a Campaign Map Detour, or a trip
   into the Undercroft — costs energy, gated at the natural entry point
   for each (goGambitOrBattle/beginRedeploy/beginDetour/beginUndercroft),
   as one more condition on the same "refuse first, mutate nothing" guard
   clause those functions already open with — no separate message state to
   juggle, since each screen already computes its own button's disabled
   state and explanatory text live, the same way an empty formation or an
   unclaimed Detour already does. Duels, raids, the World Boss, Guild War
   sorties and Trials are untouched — see isCampaignBattle() above — so
   there's always something to do even at zero energy. */
const ENERGY_KEY = 'gridlegion.v1.energy';
const ENERGY_MAX = 100;
const ENERGY_REGEN_PER_HOUR = 5;    // one battle's worth of energy back every hour
const ENERGY_COST_PER_BATTLE = 5;   // a full tank is exactly 20 campaign battles
function loadStoredEnergy(){
  if(!hasStorage()) return null;
  try{
    const raw = window.localStorage.getItem(ENERGY_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || typeof d.current!=='number' || !isFinite(d.current) || typeof d.lastUpdate!=='number' || !isFinite(d.lastUpdate)) return null;
    return { current: Math.max(0, Math.min(ENERGY_MAX, Math.round(d.current))), lastUpdate: d.lastUpdate };
  }catch(e){ return null; }
}
function saveStoredEnergy(){
  if(!hasStorage()) return;
  try{ window.localStorage.setItem(ENERGY_KEY, JSON.stringify({ current: energy.current, lastUpdate: energy.lastUpdate })); }
  catch(e){ /* a browser that refuses storage just means this device won't remember energy between sessions */ }
}
let energy = loadStoredEnergy() || { current: ENERGY_MAX, lastUpdate: Date.now() };
/* The only mutator of energy.current via regen. Whole-hour batches only —
   a partial hour is simply left for the next call to pick up from exactly
   where this one left off, via lastUpdate. */
function tickEnergy(nowMs){
  if(energy.current>=ENERGY_MAX){ energy.lastUpdate = nowMs; return; }
  const elapsedMs = nowMs - energy.lastUpdate;
  if(elapsedMs<3600000) return;
  const wholeHours = Math.floor(elapsedMs / 3600000);
  energy.current = Math.min(ENERGY_MAX, energy.current + wholeHours*ENERGY_REGEN_PER_HOUR);
  energy.lastUpdate += wholeHours * 3600000;
  saveStoredEnergy();
}
function energyPct(){ return Math.max(0, Math.min(100, Math.round((energy.current/ENERGY_MAX)*100))); }
function hasEnergyFor(cost){ return energy.current >= cost; }
function spendEnergy(cost){
  if(!hasEnergyFor(cost)) return false;
  energy.current = Math.max(0, energy.current - cost);
  saveStoredEnergy();
  return true;
}
/* Minutes until the next whole-hour batch lands — always <=60, since
   lastUpdate is only ever behind "now" by less than one full hour once
   tickEnergy has caught up. */
function energyMinutesToNextTick(){
  if(energy.current>=ENERGY_MAX) return 0;
  const msLeft = 3600000 - ((Date.now() - energy.lastUpdate) % 3600000);
  return Math.max(1, Math.ceil(msLeft/60000));
}

/* ================= COMMANDER RANK =================
   A meta-progression track that lives OUTSIDE any save slot, in its own
   localStorage key — initGame() never touches it, so restarting a legion,
   prestiging, or wiping a slot never resets it. This is the player's own
   history across every run on this device, not any one legion's.
   ===================================================== */
const COMMANDER_KEY = 'gridlegion.v1.commander';
const COMMANDER_XP = [0, 500, 1500, 3500, 7000, 13000, 22000, 35000, 55000, 85000];   // index = level-1
const MAX_COMMANDER_LEVEL = COMMANDER_XP.length;
const COMMANDER_PERKS = {
  2:  { key:'salvage_start', name:"Scavenger's Eye",  desc:'Every new legion starts with one salvage part already in hand' },
  4:  { key:'roster_slot',   name:'Extended Muster',   desc:'+1 roster slot cap' },
  6:  { key:'exp_all',       name:'Veteran Cadre',     desc:'+5% EXP from every victory, on any legion' },
  8:  { key:'roster_slot2',  name:'Standing Reserve',  desc:'+1 more roster slot cap' },
  10: { key:'salvage_pct',   name:'Foundry Contacts',  desc:'+10% salvage chance on a win, on any legion' },
};
function loadStoredCommander(){
  if(!hasStorage()) return null;
  try{
    const raw = window.localStorage.getItem(COMMANDER_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || typeof d.xp!=='number' || typeof d.level!=='number') return null;
    return { xp: Math.max(0, Math.round(d.xp)), level: Math.max(1, Math.min(MAX_COMMANDER_LEVEL, Math.round(d.level))) };
  }catch(e){ return null; }
}
function saveStoredCommander(){
  if(!hasStorage()) return;
  try{ window.localStorage.setItem(COMMANDER_KEY, JSON.stringify({ xp:commander.xp, level:commander.level })); }
  catch(e){ /* a browser that refuses storage just means this device won't remember rank */ }
}
let commander = loadStoredCommander() || { xp:0, level:1 };

function commanderXpFloor(){ return COMMANDER_XP[Math.max(0, commander.level-1)] || 0; }
function commanderXpNext(){ return (commander.level >= MAX_COMMANDER_LEVEL) ? null : COMMANDER_XP[commander.level]; }
function commanderXpPct(){
  const next = commanderXpNext();
  if(next===null) return 100;
  const floor = commanderXpFloor();
  return Math.max(0, Math.min(100, Math.round(((commander.xp-floor) / (next-floor)) * 100)));
}
function commanderHasPerk(key){
  for(let l=2; l<=commander.level; l++){ if(COMMANDER_PERKS[l] && COMMANDER_PERKS[l].key===key) return true; }
  return false;
}
/* Returns the new level if this award crossed one, else null. */
function commanderAddXp(n){
  if(!(n>0)) return null;
  const before = commander.level;
  commander.xp += Math.round(n);
  while(commander.level<MAX_COMMANDER_LEVEL && commander.xp>=COMMANDER_XP[commander.level]) commander.level++;
  saveStoredCommander();
  return commander.level>before ? commander.level : null;
}
function rosterCap(){
  return 18 + (commanderHasPerk('roster_slot')?1:0) + (commanderHasPerk('roster_slot2')?1:0)
       + (codexBonusActive('species')?1:0) + (hasAugment('extended_muster')?1:0);
}
function goCommanderRank(){ state.screen='commander'; render(); }
function renderCommanderRank(){
  const lvl = commander.level, next = commanderXpNext();
  const perkRows = Object.keys(COMMANDER_PERKS).map(l=>{
    const P = COMMANDER_PERKS[l], have = lvl >= Number(l);
    return `<div style="color:${have?'var(--gold)':'var(--dim)'}; font-size:16px;">
      ${have?'✔':'○'} <b>Lv.${l} ${P.name}</b> — ${P.desc}</div>`;
  }).join('');
  return `
  <div class="panel">
    <h2 class="section">🎖 COMMANDER RANK</h2>
    <p class="dim">Your own record, separate from any one legion. It never resets — not on a wipe, not on a fresh start, not when you prestige into the Deep.</p>
    <div style="font-size:26px; color:var(--gold); margin-top:8px;">Level ${lvl}</div>
    <div class="gauge-bg" style="margin-top:6px;"><div class="gauge-fill" style="width:${commanderXpPct()}%"></div></div>
    <div class="dim" style="font-size:15px;">${next===null
      ? `${commander.xp.toLocaleString()} XP — maximum rank reached`
      : `${commander.xp.toLocaleString()} / ${next.toLocaleString()} XP to Level ${lvl+1}`}</div>
    <p class="dim" style="margin-top:8px;">Earned from every stage battle you fight, win or lose, on every legion.</p>
    <div style="margin-top:8px;">${perkRows}</div>
  </div>
  <div class="panel footer-nav"><button class="btn" onclick="state.screen='hub'; render();">← Back to Hub</button></div>`;
}

/* ================= VICTORY PORTRAIT =================
   A small CSS-drawn scene generated after a genuinely big win — a boss (or
   warlord) kill, or a clean campaign finale — themed by whichever unit
   carried the fight. Attached to the matching War Journal entry so it stays
   visible after the result screen is gone.
   ======================================================= */
function victoryPortrait(result){
  const b = state.battle; if(!b || result!=='win') return null;
  const bossDef = bossForStage(state.stage);
  const finale = state.stage===CAMPAIGN_LENGTH && !state.redeploy;   // a redeploy replay of Stage 10 is not the campaign ending again
  if(!bossDef && !finale) return null;   // only genuinely big wins get a portrait

  let mvpId = null, mvpDmg = 0;
  Object.keys(b.dmgByUnitId||{}).forEach(id=>{
    if(b.dmgByUnitId[id] > mvpDmg){ mvpDmg = b.dmgByUnitId[id]; mvpId = id; }
  });
  const mvp = mvpId ? b.playerUnits.find(u=>u.id===mvpId) : null;
  const element = mvp ? mvp.element : 'volt';
  const label = isDeep(state.stage) ? `Depth ${deepDepth(state.stage)}` : `Stage ${state.stage}`;
  return {
    element, mvpName: mvp ? mvp.name : null, mvpEmoji: mvp ? mvp.emoji : '⚔', mvpSprite: mvp ? mvp.sprite : null,
    label, bossName: bossDef ? bossDef.name : null, bossEmoji: bossDef ? bossDef.emoji : null, bossSprite: bossDef ? bossDef.sprite : null,
    finale, warlord: !!(bossDef && bossDef.isWarlord), faction: (bossDef && bossDef.faction) || null,
  };
}
function renderVictoryPortrait(p){
  if(!p) return '';
  const glow = 'var(--'+p.element+')';
  const title = p.finale ? 'THE GATE FALLS' : (p.bossName || 'VICTORY');
  const heroSprite = p.bossSprite || p.mvpSprite;
  const heroEmoji = p.bossEmoji || p.mvpEmoji;
  return `
  <div class="panel" style="text-align:center; overflow:hidden; position:relative;
       background:radial-gradient(circle at 50% 30%, ${glow}22, var(--bg2) 70%);">
    <div style="font-size:11px; letter-spacing:2px; color:${glow};">${p.warlord ? (p.faction||'WARLORD').toUpperCase() : (p.finale?'CAMPAIGN COMPLETE':'COMMANDER DOWN')}</div>
    <div style="margin:10px 0; display:flex; justify-content:center;">${heroSprite ? spriteSvg(heroSprite, p.element, 72) : `<span style="font-size:54px; filter:drop-shadow(0 0 14px ${glow});">${heroEmoji}</span>`}</div>
    <h2 class="section" style="border:none; justify-content:center;">${escapeHtml(title)}</h2>
    <div class="dim" style="font-size:15px;">${escapeHtml(p.label)}</div>
    ${p.mvpName ? `<div style="margin-top:8px; font-size:16px;">${p.mvpEmoji} <b style="color:${glow};">${escapeHtml(p.mvpName)}</b> carried the fight</div>` : ''}
  </div>`;
}

/* ============ BATTLE RENDER ============ */
function statusIconLine(u){
  const icons = [];
  if(u.status && u.status.type==='burn') icons.push('🔥'+u.status.turnsLeft);
  if(u.status && u.status.type==='slow') icons.push('🐌'+u.status.turnsLeft);
  if(u.status && u.status.type==='stun') icons.push('💫');
  if(u.shield) icons.push('🛡');
  if(u.taunt>0) icons.push('👊'+u.taunt);
  return icons.join(' ');
}
/* A live strip of who acts next this round, reflecting b.queue/b.qIndex
   directly — the currently active unit is always its first chip. */
function renderTurnTimeline(b, activeUnit){
  const upcoming = b.queue.slice(b.qIndex).filter(u=>!u.fainted).slice(0, 8);
  if(!upcoming.length) return '';
  const chips = upcoming.map((u,i)=>{
    const now = activeUnit && u.id===activeUnit.id && i===0;
    const sprite = unitSpriteHtml(u, 22);
    return `<div class="turn-chip ${u.side} ${now?'now':''}" title="${escapeHtml(u.name)}${u.isBoss?' (boss)':''}">${sprite||u.emoji}</div>`;
  }).join('<span class="turn-chip-arrow">›</span>');
  return `<div class="turnline"><span class="turnline-label">NEXT</span>${chips}</div>`;
}
function renderUnit(u, activeId, validTargetIds){
  const jammed = hasMod('blackout') && u.side==='enemy' && !u.fainted;
  const pct = jammed ? 100 : Math.max(0, Math.round((u.hp/u.maxHp)*100));
  const selectable = validTargetIds && validTargetIds.includes(u.id) && !u.fainted;
  const allyPick = selectable && u.side==='player';
  return `
  <div class="unit ${u.isBoss?'boss':''} ${u.isGenerator?'gen':''} ${u.isAce?'ace':''} ${u.isVanguard?'vanguard':''} ${u.fainted?'fainted':''} ${u.id===activeId?'active':''} ${selectable?(allyPick?'allytarget':'targetable'):''}"
       data-unit="${u.id}"
       ${selectable?`onclick="${planningOpen()?'planChooseTarget':'playerTarget'}('${u.id}')"`:''}>
    ${u.shielded?`<div class="shield-tag" title="shielded while a pylon stands">🛡 SHIELDED</div>`:''}
    ${u.isAce?`<div class="shield-tag" style="background:var(--gold); color:#241a02;" title="Rustbound Ace — noticeably tougher than its squadmates">⭐ ACE</div>`:''}
    ${u.isVanguard?`<div class="shield-tag" style="background:var(--danger); color:#2a0410;" title="Vanguard — clear its escort first and it drops a unique trophy when it finally falls">🛡️ VANGUARD</div>`:''}
    ${u.isReinforcement?`<div class="shield-tag" style="background:var(--gold); color:#3a2a00;" title="Reinforcement — rushed in when the fight dragged on too long">🚨 REINFORCEMENT</div>`:''}
    ${u.isMercenary?`<div class="shield-tag" style="background:var(--earth); color:#2a1a06;" title="Mercenary Contract — a rented tribe champion, fighting this one battle only">🗡️ MERCENARY</div>`:''}
    ${u.plating?`<div class="plate-tag" title="counter-plating">▣</div>`:''}
    ${u.corruption?`<div class="rust-tag" title="rust ${u.corruption}">⚙</div>`:''}
    ${u.trait&&!u.corruption?`<div class="rust-tag" style="color:var(--volt)" title="${traitName(u.trait)}: ${traitDesc(u.trait)}">${TRAITS[u.trait.key].emoji}</div>`:''}
    <div class="unit-motion"><div class="emoji" style="animation-delay:-${(seedRandom(u.id)(24)/10).toFixed(1)}s">${unitSpriteHtml(u, (u.isBoss||u.isAce||u.isVanguard)?48:36)}</div></div>
    <div class="uname">${u.name}${u.mentorRookie?` <span title="Mentor Bond: paired with a veteran — earning bonus EXP this fight">🌱</span>`:''}${u.mentorVeteran?` <span title="Mentor Bond: mentoring a rookie — fighting sharper for it">🎓</span>`:''}${u.battleBond?` <span title="Battle-Forged Bond: fought and survived enough fights alongside this partner to fight sharper for it">🔗</span>`:''}</div>
    <div class="hpbar-bg"><div class="hpbar-fill ${(!jammed&&pct<30)?'low':''}" style="width:${pct}%; ${jammed?'background:repeating-linear-gradient(90deg,var(--dim) 0 4px,#000 4px 8px);':''}"></div></div>
    <div class="cd-tag">${u.fainted?'DOWN':(u.skillCd>0?'skill:'+u.skillCd:'skill ready')}</div>
    <div class="status-tag">${statusIconLine(u)}</div>
  </div>`;
}

function renderBattle(){
  const b = state.battle;
  const activeUnit = b.qIndex<b.queue.length ? b.queue[b.qIndex] : null;
  const isPlayerTurn = activeUnit && activeUnit.side==='player' && !activeUnit.fainted && b.awaitingInput;
  let validTargetIds = [];
  if(planningOpen() && b.planUnit && b.planAction){
    const pu = b.playerUnits.find(u=>u.id===b.planUnit);
    if(pu) validTargetIds = getValidTargets(pu).map(u=>u.id);
  } else if(isPlayerTurn && b.pendingAction==='shift'){
    const dest = shiftDestination(activeUnit);
    validTargetIds = b.playerUnits.filter(u=>u.row===dest && !u.fainted).map(u=>u.id);
  } else if(isPlayerTurn && b.pendingAction==='gauge_purge'){
    validTargetIds = b.playerUnits.filter(u=>!u.fainted).map(u=>u.id);
  } else if(isPlayerTurn && b.pendingAction==='gauge_alpha'){
    validTargetIds = b.enemyUnits.filter(u=>!u.fainted).map(u=>u.id);
  } else if(isPlayerTurn && b.pendingAction){
    validTargetIds = getValidTargets(activeUnit).map(u=>u.id);
  }

  /* Player on the left facing right, enemy on the right facing left — front
     row of each side sits in the column nearest the center divider, back
     row further out, so a lunge/knockback has a real "toward/away from the
     opponent" direction to animate along (see fxMotion() / .bf-side CSS). */
  const uHtml = (list)=>list.map(u=>renderUnit(u, activeUnit?activeUnit.id:null, validTargetIds)).join('');
  const enemyFront = uHtml(b.enemyUnits.filter(u=>u.row==='front'));
  const enemyBack  = uHtml(b.enemyUnits.filter(u=>u.row==='back'));
  const playerFront = uHtml(b.playerUnits.filter(u=>u.row==='front'));
  const playerBack  = uHtml(b.playerUnits.filter(u=>u.row==='back'));

  const enemySide = `
    <div class="bf-side enemy">
      <div class="bf-side-head">🤖 RUSTBOUND FORCES${b.plating?` <span style="color:var(--water)">▣ ${b.plating}-plated</span>`:''}</div>
      <div class="bf-cols">
        <div class="unit-row">${enemyFront}</div>
        <div class="unit-row">${enemyBack}</div>
      </div>
    </div>`;

  const playerSide = `
    <div class="bf-side player">
      <div class="bf-side-head">🛡 YOUR LEGION</div>
      <div class="bf-cols">
        <div class="unit-row">${playerBack}<div class="rowsyn">${b.synLabels.back?'✨ '+b.synLabels.back:''}</div></div>
        <div class="unit-row">${playerFront}<div class="rowsyn">${b.synLabels.front?'✨ '+b.synLabels.front:''}</div></div>
      </div>
    </div>`;

  let actionHtml = '';
  if(isPlayerTurn){
    if(!b.pendingAction){
      const dest = shiftDestination(activeUnit);
      actionHtml = `
      <div class="actionbar">
        <button class="btn primary" onclick="playerChooseAction('attack')">⚔ Attack</button>
        <button class="btn" ${activeUnit.skillCd>0?'disabled':''} onclick="playerChooseAction('skill')">✨ ${activeUnit.skillName} ${activeUnit.skillCd>0?'('+activeUnit.skillCd+')':''}</button>
        <button class="btn" onclick="playerChooseAction('shift')">🔀 Shift to ${dest.toUpperCase()}</button>
        ${b.gauge>=GAUGE_COST.purge ? `<button class="btn primary" onclick="playerChooseAction('gauge_purge')">🔧 Purge <span class="cost">−${GAUGE_COST.purge}</span></button>` : ''}
        ${b.gauge>=GAUGE_COST.rally ? `<button class="btn primary" onclick="playerChooseAction('gauge_rally')">🛡 Rally <span class="cost">−${GAUGE_COST.rally}</span></button>` : ''}
        ${b.gauge>=GAUGE_COST.overdrive ? `
          <button class="btn primary" onclick="playerChooseAction('gauge_overdrive')">⚡⚡ Overdrive <span class="cost">−${GAUGE_COST.overdrive}</span></button>
          <button class="btn primary" onclick="playerChooseAction('gauge_alpha')">💥 Alpha Strike <span class="cost">−${GAUGE_COST.alpha}</span></button>
        ` : ''}
      </div>`;
    } else if(b.pendingAction==='shift'){
      actionHtml = `<p class="dim">The ${shiftDestination(activeUnit).toUpperCase()} line is full — pick an ally to trade places with... <span style="cursor:pointer; color:var(--danger);" onclick="state.battle.pendingAction=null; render();">[cancel]</span></p>`;
    } else {
      const cancel = `<span style="cursor:pointer; color:var(--danger);" onclick="state.battle.pendingAction=null; render();">[cancel]</span>`;
      if(b.pendingAction==='gauge_purge'){
        actionHtml = `<p class="dim">Choose an ally to strip down and purge... ${cancel}</p>`;
      } else {
        const label = b.pendingAction==='skill' ? activeUnit.skillName : (b.pendingAction==='gauge_alpha' ? 'Alpha Strike' : 'attack');
        actionHtml = `<p class="dim">Choose a target for ${activeUnit.name}'s ${label}... ${cancel}</p>`;
      }
    }
  } else if(activeUnit){
    actionHtml = `<p class="dim">${activeUnit.side==='enemy' ? 'Enemy is acting...' : 'Resolving...'}</p>`;
  }

  if(planningOpen()){
    const rows = livingPlayerUnits().map(u=>{
      const o = b.orders[u.id];
      const sel = b.planUnit===u.id;
      let desc = '<span class="dim">no order</span>';
      if(o){
        if(o.kind==='shift') desc = `🔀 shift to ${shiftDestination(u).toUpperCase()}`;
        else {
          const t = b.enemyUnits.concat(b.playerUnits).find(x=>x.id===o.targetId);
          desc = `${o.kind==='skill'?'✨ '+escapeHtml(u.skillName):'⚔ attack'} → ${t?escapeHtml(t.name):'?'}`;
        }
      }
      return `<div class="planrow ${sel?'sel':''}">
        <span style="cursor:pointer;" onclick="planSelectUnit('${u.id}')">${u.emoji} <b>${escapeHtml(u.name)}</b> <span class="dim">(${u.row})</span></span>
        <span> — ${desc}</span>
        ${o?`<span style="cursor:pointer; color:var(--danger);" onclick="planClear('${u.id}')"> [clear]</span>`:''}
      </div>`;
    }).join('');

    let picker = '<p class="dim">Tap a unit above to give it an order.</p>';
    if(b.planUnit){
      const pu = b.playerUnits.find(u=>u.id===b.planUnit);
      if(pu){
        picker = b.planAction
          ? `<p class="dim">Now tap a target for ${escapeHtml(pu.name)}'s ${b.planAction==='skill'?escapeHtml(pu.skillName):'attack'}.</p>`
          : `<div class="actionbar">
               <button class="btn primary" onclick="planChooseAction('attack')">⚔ Attack</button>
               <button class="btn" ${pu.skillCd>0?'disabled':''} onclick="planChooseAction('skill')">✨ ${escapeHtml(pu.skillName)}${pu.skillCd>0?' ('+pu.skillCd+')':''}</button>
               <button class="btn" onclick="planChooseAction('shift')">🔀 Shift to ${shiftDestination(pu).toUpperCase()}</button>
             </div>`;
      }
    }
    actionHtml = `
      <div class="coach">
        <div class="coach-title">TACTICAL ORDERS — ROUND ${b.rounds}</div>
        <div>Write an order for every unit, then execute the round at once. If a mark falls before its turn, that unit retargets rather than wasting the turn.</div>
      </div>
      <div class="planbox">${rows}</div>
      ${picker}
      <div class="row" style="margin-top:8px;">
        <button class="btn primary" ${planReady()?'':'disabled'} onclick="executePlan()">▶ EXECUTE ROUND${planReady()?'':' (orders missing)'}</button>
        <button class="btn small" onclick="toggleTactical(); state.battle.planning=false; state.battle.orders={}; nextTurn();">Switch to live turns</button>
      </div>`;
  }

  return `
  ${tutorialPanelHtml()}
  <div class="panel">
    <h2 class="section">${tutorialActive()?'TRAINING DEPLOYMENT':(isDeep(state.stage)?`DEPTH ${deepDepth(state.stage)}`:`STAGE ${state.stage}`)} — ${bossForStage(state.stage)&&!tutorialActive()?'<span style="color:var(--danger)">COMMANDER FIGHT</span>':'BATTLE'}${isEliteStage(state.stage)?' <span style="color:var(--danger)">☠ ELITE</span>':''}</h2>
    ${state.trial?`<div class="boss-banner">☠ TRIAL — ${state.trial.mods.map(id=>MODIFIERS[id].emoji+' '+MODIFIERS[id].name).join(' · ')}</div>`:''}
    ${state.redeploy?`<div class="boss-banner">🔁 REDEPLOYMENT — ordinary rewards, your place at the frontier is untouched</div>`:''}
    ${state.detour?`<div class="boss-banner">🧭 DETOUR — a tougher wave, a guaranteed reward if you take it</div>`:''}
    ${state.undercroft?`<div class="boss-banner">☣ THE UNDERCROFT — a much tougher fight, but a permanent Corruption Ward awaits</div>`:''}
    <div class="terrain-banner">🗺 ${b.terrain.name}: ${b.terrain.desc}</div>
    <div class="gauge-wrap">
      <div class="gauge-label">LEGION GAUGE ${Math.floor(b.gauge)}% <span class="dim" style="font-size:13px;">— 🔧33 · 🛡66 · ⚡100</span></div>
      <div class="gauge-bg">
        <div class="gauge-fill ${b.gauge>=100?'full':''}" style="width:${Math.floor(b.gauge)}%"></div>
        <div class="gauge-tick" style="left:${GAUGE_COST.purge}%"></div>
        <div class="gauge-tick" style="left:${GAUGE_COST.rally}%"></div>
      </div>
    </div>
    ${renderTurnTimeline(b, activeUnit)}
    <div class="battlefield">
      ${playerSide}
      <div class="bf-divider"></div>
      ${enemySide}
    </div>
  </div>
  <div class="panel">
    ${actionHtml}
    <div id="log">${b.log.map(m=>`<div>${m}</div>`).join('')}</div>
  </div>`;
}

/* ============ RESULT ============ */
function renderResult(){
  const r = state.lastResult;
  if(r.tutorial){
    return `
    <div class="panel finale" style="text-align:center;">
      <h1 class="title" style="font-size:20px;">TRAINING COMPLETE</h1>
      <p class="dim">You have the four verbs the whole game runs on:</p>
      <div class="storytext" style="text-align:left;">
        <b>Attack and skills</b> — skills hit harder and carry elemental riders.<br>
        <b>Shift</b> — rows are not fixed. Reshaping the line rebuilds synergies mid-fight.<br>
        <b>The gauge</b> — spend small and often, or bank it for Overdrive.<br>
        <b>Elements</b> — fire beats nature, nature beats water, water beats fire; earth, volt and wind form the other ring.
      </div>
      <p class="dim">Everything else — salvage, fusion, tribes, the Deep — is built on top of those. The campaign will introduce them one at a time.</p>
      <button class="btn primary" style="margin-top:10px;" onclick="finishTutorial()">Begin the campaign →</button>
    </div>`;
  }
  if(r.duel){
    return `
    <div class="panel" style="text-align:center;">

      <p class="dim">against ${escapeHtml(r.opponent)}'s legion.</p>
      <p class="dim">${social.lastDuel?escapeHtml(social.lastDuel):'Reporting the result…'}</p>
      <button class="btn primary" style="margin-top:10px;" onclick="endDuel()">Back to the Ladder →</button>

      ${(r.raidDrops&&r.raidDrops.length)?`<p style="color:var(--rust)">⚙ Salvage Surge: ${r.raidDrops.map(d=>`<b>${PARTS[d.key].emoji} ${PARTS[d.key].name}</b>`).join(' + ')}</p>`:''}
      <p class="dim">${social.status?escapeHtml(social.status):'Logging damage…'}</p>
      <button class="btn primary" style="margin-top:10px;" onclick="endRaidRun()">Back to the Guild →</button>
    </div>`;
  }
  if(r.worldBoss){
    return `
    <div class="panel" style="text-align:center;">
      <h1 class="title" style="font-size:20px;">WORLD BOSS ATTEMPT</h1>
      <p>You dealt <b>${r.dealt.toLocaleString()}</b> damage to the World Boss.</p>
      <p class="dim">${r.win?'Your legion held the field.':'Your legion fell — the damage still counts.'}</p>
      <p class="dim">${social.worldBossStatus?escapeHtml(social.worldBossStatus):'Logging damage…'}</p>
      <button class="btn primary" style="margin-top:10px;" onclick="endWorldBossRun()">Back to the World Boss →</button>
    </div>`;
  }
  if(r.guildWar){
    return `
    <div class="panel" style="text-align:center;">
      <h1 class="title" style="font-size:20px;">GUILD WAR SORTIE</h1>
      <p>You logged <b>${r.scored.toLocaleString()}</b> points for your guild.</p>
      <p class="dim">${r.win?'Your legion held the field.':'Your legion fell — a losing fight still scores, just less.'}</p>
      <p class="dim">${social.guildWarStatus?escapeHtml(social.guildWarStatus):'Logging score…'}</p>

      </div>`;

    <div class="panel" style="text-align:center;">
      <h1 class="title" style="font-size:20px; color:var(--danger);">TRIAL FAILED</h1>
      <p class="dim">${escapeHtml(names)} proved too much. Nothing lost but the attempt.</p>
      <button class="btn primary" style="margin-top:10px;" onclick="endTrial()">Return to Hub →</button>
    </div>`;
  }
  if(r.gauntlet){
    if(r.win){
      return `
      <div class="panel" style="text-align:center;">
        <h1 class="title" style="font-size:20px;">WAVE ${r.waveCleared} CLEARED</h1>
        ${r.isRecord?`<p style="color:var(--gold)">🏆 New personal best — Wave ${r.waveCleared}!</p>`:''}
        ${r.drop?`<p style="color:var(--rust)">⚙ Stripped from the wreckage: <b>${PARTS[r.drop.key].emoji} ${PARTS[r.drop.key].name}</b></p>`:'<p class="dim">Your salvage store is full.</p>'}
        <p class="dim">No retreat from here — the only way out is through.</p>
        <button class="btn primary" style="margin-top:10px;" onclick="continueGauntlet()">☠ Continue to Wave ${r.waveCleared+1} →</button>
      </div>`;

      <h1 class="title" style="font-size:20px; color:var(--danger);">THE GAUNTLET ENDS</h1>
      <p>Your legion held for <b>${r.wavesCleared}</b> wave${r.wavesCleared===1?'':'s'}.</p>
      ${r.isRecord?`<p style="color:var(--gold)">🏆 New personal best!</p>`:`<p class="dim">Personal best: Wave ${r.best}.</p>`}
      <button class="btn primary" style="margin-top:10px;" onclick="endGauntlet()">Return to Hub →</button>
    </div>`;
  }
  if(r.win && r.finale && !r.redeploy){
    return `
    <div class="panel finale" style="text-align:center;">
      <h1 class="title">THE GATE FALLS</h1>
      <div class="heading" style="font-size:11px; color:var(--dim); margin-bottom:14px;">CAMPAIGN COMPLETE</div>
      <p>The forward base burns behind you. Texel breathes again — the tribes hold the surface, and the Rustbound advance is broken.</p>
      <div class="storytext">But the gate opened onto a stairwell, and the stairwell goes down. Whatever built the horde is still down there, still building.</div>
      <p class="dim">Your legion, its salvage and every splice carry onward. The Deep scales without end: elite waves every fifth depth, richer wreckage, and recruits enough to finish an evolution ladder.</p>
      ${(r.fieldPromotions && r.fieldPromotions.length) ? `<p class="dim" style="font-size:14px;">🎓 ${r.fieldPromotions.map(escapeHtml).join(' · ')}</p>` : ''}

      <p class="dim" style="font-size:15px;">📔 <span style="cursor:pointer; text-decoration:underline;" onclick="goJournal()">Read it in your War Journal</span></p>
      <div class="row" style="justify-content:center; margin-top:14px;">
        <button class="btn primary" style="font-size:22px;" onclick="advanceStage()">⬇ DESCEND INTO THE DEEP</button>
      </div>
    </div>
    ${renderVictoryPortrait(r.portrait)}
    ${r.commanderLevel ? `<div class="panel" style="text-align:center;"><p style="color:var(--gold)">🎖 Commander Rank up! You are now Level ${r.commanderLevel}.</p></div>` : ''}`;
  }
  if(r.win){
    const pd = r.part ? PARTS[r.part.key] : null;
    return `
    <div class="panel" style="text-align:center;">
      <h1 class="title" style="font-size:20px;">${r.boss?'COMMANDER DOWN!':(r.elite?'ELITE WAVE BROKEN!':'VICTORY!')}</h1>

      ${r.detour?`<p class="dim" style="font-size:14px;">🧭 Detour — ${escapeHtml(r.detourName||'')} — your place at the frontier is untouched.</p>`:''}
      ${r.mercenary?`<p class="dim" style="font-size:14px;">🗡️ Mercenary Contract — ${r.mercenary.emoji} <b>${escapeHtml(r.mercenary.name)}</b> fought this battle, then walked. The contract's done.</p>`:''}
      ${r.boss?`<p style="color:var(--danger)">${escapeHtml(r.boss)} is scrap.</p>`:''}

      <p class="dim">Each deployed monster gained ${r.expGain} EXP.</p>
      ${r.levelled && r.levelled.length ? `<p style="color:var(--gold)">⬆ Level up: ${r.levelled.join(', ')}</p>` : ''}

      ${(r.drops&&r.drops.length) ? `<p style="color:var(--rust)">⚙ Stripped from the wreckage: ${r.drops.map(d=>`<b>${PARTS[d.key].emoji} ${PARTS[d.key].name}</b>`).join(' + ')}</p>` : ''}
      ${(r.dailyDone && r.dailyDone.length) ? `<p style="color:var(--nature)">📋 Order complete: ${r.dailyDone.map(escapeHtml).join(' · ')}</p>` : ''}
      ${(r.favorGains && Object.keys(r.favorGains).length) ? `<p style="color:var(--nature)">🏕 Favour earned: ${Object.keys(r.favorGains).map(e=>`${TRIBES[e].emoji} ${TRIBES[e].name} +${r.favorGains[e]}`).join(', ')}</p>` : ''}
      ${(r.newChampions && r.newChampions.length) ? `<p style="color:var(--gold)">★ ${r.newChampions.map(e=>TRIBES[e].name).join(' and ')} will send ${r.newChampions.length===1?'a champion':'champions'} — visit the Tribes camp.</p>` : ''}
      ${r.dom ? `<p class="dim">📡 The Rustbound log your <b>${r.dom.toUpperCase()}</b> assault. Next deployment they will expect <b>${(r.nextAdapt||r.dom).toUpperCase()}</b>.</p>` : ''}
      ${r.archiveFragment ? `<p style="color:var(--gold)">📜 Archive fragment recovered — <span style="cursor:pointer; text-decoration:underline;" onclick="goArchive()">read it</span>.</p>` : ''}
      ${(r.fieldPromotions && r.fieldPromotions.length) ? `<p class="dim" style="font-size:14px;">🎓 ${r.fieldPromotions.map(escapeHtml).join(' · ')}</p>` : ''}
      ${r.detourReward ? `<p style="color:var(--gold)">🧭 ${escapeHtml(r.detourReward)}</p>` : ''}
      ${r.undercroftReward ? `<p style="color:var(--wind)">${escapeHtml(r.undercroftReward)}</p>` : ''}
      <p class="dim" style="font-size:15px;">📔 <span style="cursor:pointer; text-decoration:underline;" onclick="goJournal()">Read it in your War Journal</span></p>
      <button class="btn primary" style="margin-top:10px;" onclick="${r.redeploy?'endRedeploy()':(r.detour?'endDetour()':(r.undercroft?'endUndercroft()':'advanceStage()'))}">${(r.redeploy||r.detour||r.undercroft)?'Return to Hub →':(isDeep(state.stage)?'Descend further →':'Continue →')}</button>
    </div>
    ${renderVictoryPortrait(r.portrait)}
    ${r.commanderLevel ? `<div class="panel" style="text-align:center;"><p style="color:var(--gold)">🎖 Commander Rank up! You are now Level ${r.commanderLevel}.</p></div>` : ''}`;
  }
  return `
  <div class="panel" style="text-align:center;">
    <h1 class="title" style="font-size:20px; color:var(--danger);">DEFEAT</h1>
    ${r.redeploy?`<p class="dim" style="font-size:14px;">🔁 Redeployment — your place at the frontier is untouched.</p>`:''}
    ${r.detour?`<p class="dim" style="font-size:14px;">🧭 Detour — ${escapeHtml(r.detourName||'')} — your place at the frontier is untouched.</p>`:''}
    ${r.mercenary?`<p class="dim" style="font-size:14px;">🗡️ Mercenary Contract — ${r.mercenary.emoji} <b>${escapeHtml(r.mercenary.name)}</b> fought this battle, then walked. The contract's done.</p>`:''}
    <p>Your legion was overrun. The Rustbound advance no further today, but neither do you.</p>
    <p class="dim">Your survivors studied the enemy through the rout — each deployed monster gained ${r.expGain} EXP.</p>
    ${r.levelled && r.levelled.length ? `<p style="color:var(--gold)">⬆ Level up: ${r.levelled.join(', ')}</p>` : ''}
    ${(r.fieldPromotions && r.fieldPromotions.length) ? `<p class="dim" style="font-size:14px;">🎓 ${r.fieldPromotions.map(escapeHtml).join(' · ')}</p>` : ''}
    <p class="dim">Adjust your formation, re-plate your beasts, and go again.</p>
    <p class="dim" style="font-size:15px;">📔 <span style="cursor:pointer; text-decoration:underline;" onclick="goJournal()">Read it in your War Journal</span></p>
    ${r.commanderLevel ? `<p style="color:var(--gold)">🎖 Commander Rank up! You are now Level ${r.commanderLevel}.</p>` : ''}
    <button class="btn primary" style="margin-top:10px;" onclick="${r.redeploy?'endRedeploy()':(r.detour?'endDetour()':(r.undercroft?'endUndercroft()':'retryStage()'))}">${(r.redeploy||r.detour||r.undercroft)?'Return to Hub →':`Retry ${isDeep(state.stage)?`Depth ${deepDepth(state.stage)}`:`Stage ${state.stage}`} →`}</button>
  </div>`;
}
function finishTutorial(){
  state.tutorial = null;
  state.battle = null;
  state.lastResult = null;
  sfx('click');
  goProfiles();
}
function advanceStage(){
  state.stage++;
  if(isDeep(state.stage)){
    const newDepth = deepDepth(state.stage);
    // Field Companion: only a genuinely NEW record pays out, same ">"
    // check Battle Replays already uses for the same reason.
    if(newDepth > (state.bestDepth||0)) addCompanionXp(COMPANION_XP_PER_NEW_DEPTH);
    state.bestDepth = Math.max(state.bestDepth||0, newDepth);
  }
  state.battle=null; state.screen='hub';
  autosave();
  render();
}
function retryStage(){ state.battle=null; state.screen='hub'; render(); }

/* ============ INIT ============ */
/* Browsers block audio until a gesture; the first click anywhere unlocks it. */
if(typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('click', function primeAudio(){
    audioResume();
    if(audio.music) musicStart();
  }, { once:false, passive:true });
}
render();
try{ cloudInit(); }catch(e){ cloud.status = cloudConfigured() ? 'error' : 'off'; }
</script>
</body>
</html>
