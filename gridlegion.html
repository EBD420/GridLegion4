/* ---- guild council ----
   Once a week the guild votes on one shared doctrine. Lightweight and
   asynchronous: no real-time anything, just a row per member per week that
   everyone reads and tallies client-side, same trust model as the raid
   damage board. The leading option (by vote count; ties favour Offensive)
   applies a small stat buff to every battle for the rest of that week. */
const COUNCIL_OPTIONS = {
  atk: { key:'atk', name:'Offensive Doctrine', emoji:'⚔', desc:'+8% ATK for the whole guild this week' },
  def: { key:'def', name:'Defensive Doctrine', emoji:'🛡', desc:'+8% DEF for the whole guild this week' },
};
/* A stable key that resets every Monday 00:00 UTC. Not a calendar ISO week
   number — just needs to be identical for every player in the same week,
   which a simple "weeks since a fixed Monday" count gives for free. */
function weekKey(){
  const now = Date.now();
  const dayMs = 86400000;
  const todayUtcMidnight = Math.floor(now / dayMs) * dayMs;
  const dow = new Date(todayUtcMidnight).getUTCDay();          // 0=Sun..6=Sat
  const sinceMonday = (dow + 6) % 7;                            // Mon=0..Sun=6
  const mondayThisWeek = todayUtcMidnight - sinceMonday * dayMs;
  const epochMonday = Date.UTC(2020, 0, 6);                     // a known Monday
  return 'W' + Math.floor((mondayThisWeek - epochMonday) / (7 * dayMs));
}
function councilFetch(){
  if(!signedIn() || !social.guild) return Promise.resolve(null);
  return restGetDiag('guild_council_votes?select=user_id,option,voted_at&guild_id=eq.'+social.guild.id+'&week=eq.'+weekKey(),
      'Your project is missing the guild council upgrade — run Step 5 of SETUP-MULTIPLAYER.md (adds the weekly guild vote), then reload the schema.')
    .then(res=>{
      if(!res.ok){ social.council=[]; social.councilError=res.error; return null; }
      social.councilError='';
      social.council = res.rows;
      return social.council;
    });
}
function councilVote(option){
  if(!COUNCIL_OPTIONS[option]) return Promise.resolve({ok:false, error:'Not a valid doctrine.'});
  return rpc('cast_council_vote', { p_week: weekKey(), p_option: option },
      'The guild council vote is not installed on your project yet — run step 5 of SETUP-MULTIPLAYER.md, then reload the schema.')
    .then(r=>{ if(r.ok) return councilFetch().then(()=>({ok:true})); return r; });
}
function councilTally(){
  const t = { atk:0, def:0 };
  (social.council||[]).forEach(v=>{ if(t[v.option]!==undefined) t[v.option]++; });
  return t;
}
function councilLeadingOption(){
  const t = councilTally();
  if(t.atk===0 && t.def===0) return null;
  return t.def>t.atk ? 'def' : 'atk';   // tie favours Offensive
}
function myCouncilVote(){
  if(!cloud.session) return null;
  const row = (social.council||[]).find(v=>v.user_id===cloud.session.user.id);
  return row ? row.option : null;
}

/* ---- raid mutators ----
   Every raid boss draws 1-2 modifiers from a small pool, seeded off that
   boss's own server row id — so it's identical for every guild member
   looking at the same boss, no schema change needed, and it reshuffles
   naturally the moment the guild summons a new one (rather than on an
   artificial calendar clock the raid system doesn't otherwise have). */
const RAID_ENRAGE_BONUS = 0.20;
const RAID_WARD_PENALTY = 0.30;
const RAID_MUTATOR_POOL = [
  { key:'enraged', name:'Enraged Past Half', emoji:'😡',
    make:()=>({ desc:`Under 50% HP the boss fights back — every attempt logs ${Math.round(RAID_ENRAGE_BONUS*100)}% more raid damage once it's that low.` }) },
  { key:'warded', name:'Elemental Ward', emoji:'🛡',
    make:r=>{ const elem = TRIBE_IDS[r(TRIBE_IDS.length)];
      return { elem, desc:`Warded against ${elem.toUpperCase()} — ${elem} damage counts for ${Math.round(RAID_WARD_PENALTY*100)}% less raid credit.` }; } },
  { key:'salvage', name:'Salvage Surge', emoji:'⚙️',
    make:()=>({ desc:'A raid win strips 2 salvage parts from the field, same haul as an elite wave.' }) },
];
function raidMutatorsFor(bossId){
  if(!bossId) return [];
  const r = seedRandom('raidmut:'+bossId);
  const count = Math.min(RAID_MUTATOR_POOL.length, 1 + r(2));
  const idx = [];
  while(idx.length < count){
    const i = r(RAID_MUTATOR_POOL.length);
    if(idx.indexOf(i)<0) idx.push(i);
  }
  return idx.map(i=>{
    const def = RAID_MUTATOR_POOL[i];
    return Object.assign({ key:def.key, name:def.name, emoji:def.emoji }, def.make(r));
  });
}
function currentRaidMutators(){ return (social.raid && social.raid.id) ? raidMutatorsFor(social.raid.id) : []; }
function raidMutatorActive(key){ return currentRaidMutators().some(m=>m.key===key); }
/* Applies Enraged / Elemental Ward to the raw damage total before it's sent
   to the server. Elemental Ward needs the per-element breakdown the battle
   already tracks in b.elemDamage; Enraged reads the boss's HP snapshot from
   when the run began (social.raid), same eventual-consistency trust model
   as the rest of the raid board. */
function computeRaidDamage(b){
  let dmg = b.totalDamage || 0;
  const muts = currentRaidMutators();
  const ward = muts.find(m=>m.key==='warded');
  if(ward){
    const wardedDealt = (b.elemDamage && b.elemDamage[ward.elem]) || 0;
    dmg -= Math.round(wardedDealt * RAID_WARD_PENALTY);
  }
  if(muts.some(m=>m.key==='enraged') && social.raid && social.raid.max_hp>0 && (social.raid.hp/social.raid.max_hp)<=0.5){
    dmg = Math.round(dmg * (1+RAID_ENRAGE_BONUS));
  }
  return Math.max(0, dmg);
}

function ladderSnapshot(){
  const units = [];
  ['front','back'].forEach(row=>{
    state.formation[row].forEach(u=>{
      if(!u) return; const m = findMonster(u); if(!m) return;
      const st = computeStats(m);
      units.push({ row, speciesId:m.speciesId, level:m.level, tier:m.tier,
                   parts:(m.parts||[]).slice(), trait:m.trait||null, name:st.name });
    });
  });
  return { units, blessing: activeBlessing(), stage: state.stage };
}
function formationPower(){
  let p = 0;
  ['front','back'].forEach(row=>state.formation[row].forEach(u=>{
    if(!u) return; const m=findMonster(u); if(!m) return;
    const st=computeStats(m);
    p += st.hp + st.atk*3 + st.def*2 + st.spd*2;
  }));
  return Math.round(p);

function readSlot(slot){
  if(!hasStorage()) return null;
  try{
    const raw = window.localStorage.getItem(SAVE_PREFIX+slot);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return validateSave(d) ? d : null;
  }catch(e){ return null; }
}
function writeSlot(slot, data){
  if(!hasStorage()) return false;
  try{ window.localStorage.setItem(SAVE_PREFIX+slot, JSON.stringify(data)); return true; }
  catch(e){ return false; }
}
function deleteSlot(slot){
  if(!hasStorage()) return false;
  try{ window.localStorage.removeItem(SAVE_PREFIX+slot); return true; }catch(e){ return false; }
}

/* --- cloud sync: local write is instant and authoritative; the push is best-effort --- */
function cloudPushSoon(){
  if(!signedIn() || state.slot===null) return;
  cloud.pendingPush = true;
  if(cloud.pushTimer) return;
  cloud.pushTimer = setTimeout(()=>{
    cloud.pushTimer = null;
    if(!cloud.pendingPush) return;
    cloud.pendingPush = false;
    const slot = state.slot, payload = serializeSave();
    cloud.status = 'syncing';
    cloudPutSlot(slot, payload).then(okPush=>{
      cloud.status = okPush ? 'ready' : 'offline';
      cloud.message = okPush ? '' : 'Saved on this device — cloud unreachable, will retry.';
      if(!okPush) cloud.pendingPush = true;

function cloudSyncDown(){
  if(!signedIn()) return Promise.resolve({ pulled:0, restored:0, kept:0 });

    if(rows===null){
      cloud.status='offline';
      cloud.message='Could not reach the cloud — playing from this device.';
      return { pulled:0, restored:0, kept:0, offline:true };
    }
    let restored=0, kept=0;
    rows.forEach(row=>{
      const slot = row.slot;
      if(typeof slot!=='number' || slot<0 || slot>=SLOT_COUNT) return;
      const remote = row.data;
      if(!validateSave(remote)) return;
      const local = readSlot(slot);
      if(!local || (remote.savedAt||0) > (local.savedAt||0)){ writeSlot(slot, remote); restored++; }
      else kept++;
    });
    cloud.status='ready';
    cloud.message = restored ? `${restored} legion${restored===1?'':'s'} restored from your account.`

  const who = cloud.session.user.email || 'your account';
  if(cloud.status==='syncing') return `${escapeHtml(who)} · syncing…`;
  if(cloud.status==='offline') return `${escapeHtml(who)} · offline, will retry`;
  return `${escapeHtml(who)} · synced`;
}

/* Transfer codes: a save as text, so a legion can move between browsers without a server. */
function exportCode(){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(serializeSave())))); }
  catch(e){ return null; }
}
function decodeCode(str){
  try{
    const d = JSON.parse(decodeURIComponent(escape(atob(String(str).replace(/\s+/g,'')))));
    return validateSave(d) ? d : null;
  }catch(e){ return null; }
}

function getSpeciesData(speciesId, tier){
  const base = SPECIES[speciesId] || HYBRID_SPECIES[speciesId];
  if(tier>=3){
    return {
      name: 'Ascended ' + base.name, element: base.element,
      elements: base.elements ? base.elements.slice() : null,
      hybrid: !!base.hybrid, emoji: base.emoji + '👑', sprite: base.sprite,
      base: { hp: Math.round(base.base.hp*2.3), atk: Math.round(base.base.atk*2.3), def: Math.round(base.base.def*2.3), spd: Math.round(base.base.spd*1.3) },
      skill: base.skill + '++',
    };
  }
  if(tier>=2){
    return {
      name: 'Prime ' + base.name, element: base.element,
      elements: base.elements ? base.elements.slice() : null,
      hybrid: !!base.hybrid, emoji: base.emoji + '✨', sprite: base.sprite,
      base: { hp: Math.round(base.base.hp*1.6), atk: Math.round(base.base.atk*1.6), def: Math.round(base.base.def*1.6), spd: Math.round(base.base.spd*1.15) },
      skill: base.skill + '+',
    };
  }
  return base;
}

function partSlots(m){
  const base = m.tier>=3 ? 4 : (m.tier>=2 ? 3 : 2);
  return base + graftCount(m,'slot');
}
function monsterCorruption(m){
  const ps = (m.parts||[]).map(k=>partInfo(k)).filter(Boolean);
  if(ps.length===0) return 0;
  let c = ps.reduce((s,p)=>s+p.corruption,0) + (ps.length-1)*8;
  if(m.trait && m.trait.key==='scavenger') c = Math.max(0, c-10);
  if(codexBonusActive('parts')) c = Math.max(0, c - ps.length*2);
  if(state.undercroftWard) c = Math.max(0, c - UNDERCROFT_WARD_REDUCTION);
  return c;
}

function computeStats(monster){
  const sd = getSpeciesData(monster.speciesId, monster.tier);
  const mult = 1 + (monster.level-1)*0.12;
  let hp = Math.round(sd.base.hp*mult), atk = Math.round(sd.base.atk*mult),
      def = Math.round(sd.base.def*mult), spd = Math.round(sd.base.spd*mult);
  const innate = sd.elements ? sd.elements.slice() : [sd.element];
  const elements = innate.slice();
  (monster.parts||[]).forEach(k=>{
    const p = partInfo(k); if(!p) return;
    if(p.stat==='hp')  hp  = Math.round(hp *(1+p.pct));
    if(p.stat==='atk') atk = Math.round(atk*(1+p.pct));
    if(p.stat==='def') def = Math.round(def*(1+p.pct));
    if(p.stat==='spd') spd = Math.round(spd*(1+p.pct));
    if(p.bonusStat==='hp')  hp  = Math.round(hp *(1+p.bonusPct));
    if(p.bonusStat==='atk') atk = Math.round(atk*(1+p.bonusPct));
    if(p.bonusStat==='def') def = Math.round(def*(1+p.bonusPct));
    if(p.bonusStat==='spd') spd = Math.round(spd*(1+p.bonusPct));
    if(!elements.includes(p.element)) elements.push(p.element);
  });
  activeSetBonuses(monster.parts).forEach(sb=>{
    if(sb.stat==='hp')  hp  = Math.round(hp *(1+sb.pct));
    if(sb.stat==='atk') atk = Math.round(atk*(1+sb.pct));
    if(sb.stat==='def') def = Math.round(def*(1+sb.pct));
    if(sb.stat==='spd') spd = Math.round(spd*(1+sb.pct));
  });
  const g = graftsOf(monster);
  if(g){
    if(g.atk) atk = Math.round(atk * Math.pow(1.10, g.atk));
    if(g.def) def = Math.round(def * Math.pow(1.10, g.def));
    if(g.hp)  hp  = Math.round(hp  * Math.pow(1.10, g.hp));
    if(g.spd) spd = Math.round(spd * Math.pow(1.10, g.spd));
  }
  const tr = monster.trait;
  if(tr){
    if(tr.key==='savage')   atk = Math.round(atk*1.08);
    if(tr.key==='stalwart') def = Math.round(def*1.10);
    if(tr.key==='hardy')    hp  = Math.round(hp *1.10);
    if(tr.key==='swift')    spd = Math.round(spd*1.10);
  }
  const corruption = monsterCorruption(monster);
  return {
    // A nickname (see Monster Nicknames) fully replaces the display name,
    // same as renaming a legion or a guild does elsewhere in this game —
    // baseName keeps the species name available for anywhere that still
    // wants to show it (a nicknamed monster's own card, mainly).
    name: monster.nickname || sd.name, baseName: sd.name, emoji: sd.emoji + ((monster.parts||[]).length?'⚙':''), sprite: sd.sprite,
    element: sd.element, elements, innate, hybrid: !!sd.hybrid, skill: sd.skill,
    trait: tr || null, tier: monster.tier, grafts: g,
    hp, atk, def, spd, corruption,
  };
}

function findMonster(uidStr){ return state.roster.find(m=>m.uid===uidStr); }

function elementMultiplier(atkElem, defElem){
  if(ELEM_BEATS[atkElem]===defElem) return 1.4;
  if(ELEM_BEATS[defElem]===atkElem) return 0.75;
  return 1.0;
}
/* Defence: bolted-on plating protects, so a dual-element unit takes the most favourable multiplier.
   Offence: only INNATE elements (species/fusion, never parts) can be struck with — a hybrid
   picks whichever of its two natures the target is weakest to. Returns {mult, elem}. */
function multiplierVs(attacker, defender){
  const dl = (defender.elements && defender.elements.length) ? defender.elements : [defender.element];
  const al = (attacker.attackElements && attacker.attackElements.length) ? attacker.attackElements : [attacker.element];
  let best = -Infinity, bestElem = al[0];
  al.forEach(ae=>{
    const m = Math.min.apply(null, dl.map(de=>elementMultiplier(ae, de)));
    if(m > best){ best = m; bestElem = ae; }
  });
  return { mult: best, elem: bestElem };
}

/* elementLists = array of (array of elements) or null.
   A dual-element unit counts toward EVERY element it carries, and a row grants
   every synergy that reaches its threshold — so one hybrid can complete two lines. */
function computeRowSynergies(elementLists){
  const counts = {};
  elementLists.forEach(list=>{
    if(!list) return;
    const seen = [];
    list.forEach(e=>{ if(e && !seen.includes(e)){ seen.push(e); counts[e]=(counts[e]||0)+1; } });
  });
  return Object.keys(counts)
    .filter(e=>counts[e]>=2)
    .map(e=>({ element:e, count: Math.min(counts[e],3) }))
    .sort((a,b)=> b.count-a.count || a.element.localeCompare(b.element));
}
/* single-best helper, kept for anything that wants just the headline */
function computeRowSynergy(elementLists){
  const all = computeRowSynergies(elementLists);
  return all.length ? all[0] : null;
}
function synergyInfo(syn){
  if(!syn) return null;
  const t = SYNERGY_TABLE[syn.element];
  return { element:syn.element, count:syn.count, statKey:t.statKey, bonus:t[syn.count], flavor: syn.count>=3 ? t.flavor3 : null };
}
function synergyLabelText(info){
  if(!info) return null;
  return `${info.element.toUpperCase()} ${info.count===3?'TRIO':'DUO'} +${Math.round(info.bonus*100)}% ${STAT_LABEL[info.statKey]}`;
}
function formationRowSynergyLabel(row){
  const lists = state.formation[row].map(u=> u ? computeStats(findMonster(u)).elements : null);
  const infos = computeRowSynergies(lists).map(synergyInfo);
  return infos.length ? infos.map(synergyLabelText).join(' · ') : null;
}

/* ================= SOUND =================
   Synthesised at runtime with the Web Audio API — no files, no CDN, the single
   file stays single. Every entry point is guarded so headless runs are silent
   no-ops rather than crashes.
   ========================================= */
const audio = { ctx:null, master:null, sfx:true, music:false, musicTimer:null, step:0, ready:false };

function audioAvailable(){
  return typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
}
/* Browsers refuse to start audio before a gesture, so this is called from clicks. */
function audioInit(){
  if(audio.ready || !audioAvailable()) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    audio.ctx = new AC();
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = 0.28;
    audio.master.connect(audio.ctx.destination);
    audio.ready = true;
  }catch(e){ audio.ready = false; }
}
function audioResume(){
  if(!audio.ready) audioInit();
  try{ if(audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume(); }catch(e){}
}
/* One voice: an oscillator through its own envelope. */
function tone(freq, dur, type, vol, slideTo){
  if(!audio.sfx || !audio.ready || !audio.ctx) return;
  try{
    const t = audio.ctx.currentTime;
    const osc = audio.ctx.createOscillator();
    const g = audio.ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(audio.master);
    osc.start(t); osc.stop(t + dur + 0.02);
  }catch(e){}
}
function noise(dur, vol){
  if(!audio.sfx || !audio.ready || !audio.ctx) return;
  try{
    const t = audio.ctx.currentTime;
    const n = Math.floor(audio.ctx.sampleRate * dur);
    const buf = audio.ctx.createBuffer(1, n, audio.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = audio.ctx.createBufferSource(); src.buffer = buf;
    const g = audio.ctx.createGain(); g.gain.value = vol || 0.15;
    src.connect(g); g.connect(audio.master); src.start(t);
  }catch(e){}
}
const SFX = {
  click:   ()=>tone(440, 0.05, 'square', 0.10),
  hit:     ()=>{ noise(0.09, 0.16); tone(180, 0.08, 'square', 0.14, 90); },
  crit:    ()=>{ noise(0.14, 0.22); tone(320, 0.16, 'sawtooth', 0.20, 120); },
  skill:   ()=>{ tone(520, 0.10, 'square', 0.16, 880); tone(660, 0.14, 'triangle', 0.12, 1100); },
  miss:    ()=>tone(300, 0.10, 'sine', 0.10, 180),
  shield:  ()=>tone(700, 0.14, 'triangle', 0.16, 900),
  faint:   ()=>tone(260, 0.35, 'sawtooth', 0.18, 60),
  shift:   ()=>{ tone(400, 0.07, 'triangle', 0.12, 620); tone(620, 0.07, 'triangle', 0.10, 400); },
  gauge:   ()=>{ tone(600, 0.09, 'square', 0.14); tone(900, 0.12, 'square', 0.14); },
  glitch:  ()=>{ noise(0.16, 0.20); tone(120, 0.18, 'sawtooth', 0.16, 60); },
  victory: ()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f, 0.18, 'square', 0.16), i*110)),
  defeat:  ()=>[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f, 0.26, 'triangle', 0.16), i*150)),
  levelup: ()=>[659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f, 0.14, 'square', 0.15), i*90)),
};
function sfx(name){ try{ if(SFX[name]) SFX[name](); }catch(e){} }

/* A slow minor arpeggio under the battle. Deliberately sparse. */
const MUSIC_STEPS = [110,131,165,196,165,131,110,98];
function musicStart(){
  if(!audio.music || !audio.ready || audio.musicTimer) return;
  audio.musicTimer = setInterval(()=>{
    if(!audio.music){ musicStop(); return; }
    const f = MUSIC_STEPS[audio.step % MUSIC_STEPS.length];
    audio.step++;
    const wasSfx = audio.sfx; audio.sfx = true;      // music ignores the SFX toggle
    tone(f, 0.42, 'triangle', 0.055);
    if(audio.step % 4 === 0) tone(f*2, 0.22, 'sine', 0.035);
    audio.sfx = wasSfx;
  }, 460);
}
function musicStop(){ if(audio.musicTimer){ clearInterval(audio.musicTimer); audio.musicTimer=null; } }
function toggleSfx(){ audio.sfx = !audio.sfx; audioResume(); sfx('click'); autosave(); render(); }
function toggleMusic(){
  audio.music = !audio.music; audioResume();
  if(audio.music) musicStart(); else musicStop();
  sfx('click'); autosave(); render();
}

/* ================= BATTLE FX =================
   render() replaces #app wholesale, so effects are queued during resolution and
   painted afterwards into a separate overlay that survives the re-render.
   ============================================= */
const fxQueue = [];
function fx(unitId, text, kind){ fxQueue.push({ unitId, text, kind }); }
function domReady(){
  return typeof document !== 'undefined' && typeof document.createElement === 'function'
      && typeof document.querySelector === 'function';
}
function flushFx(){
  if(!domReady()) { fxQueue.length = 0; return; }
  const layer = document.getElementById('fx');
  if(!layer){ fxQueue.length = 0; return; }
  const items = fxQueue.splice(0);
  items.forEach((it, i)=>{
    try{
      const host = document.querySelector('[data-unit="' + it.unitId + '"]');
      if(!host) return;
      const r = host.getBoundingClientRect();
      const el = document.createElement('div');
      el.className = 'floater ' + (it.kind || '');
      el.textContent = it.text;
      el.style.left = (r.left + r.width/2) + 'px';
      el.style.top  = (r.top + 8) + 'px';
      layer.appendChild(el);
      setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 900);
      host.classList.add(it.kind === 'heal' ? 'flash-heal' : 'flash-hit');
      setTimeout(()=>{ try{ host.classList.remove('flash-hit','flash-heal'); }catch(e){} }, 220);
    }catch(e){}
  });
}
function shake(strong){
  if(!domReady()) return;
  try{
    const app = document.getElementById('app');
    if(!app || !app.classList) return;
    const cls = strong ? 'shake-hard' : 'shake';
    app.classList.add(cls);
    setTimeout(()=>{ try{ app.classList.remove(cls); }catch(e){} }, strong ? 320 : 180);
  }catch(e){}
}

/* ================= BATTLE MOTION =================
   Same queue-during-resolution / flush-after-render pattern as fx() above,
   for two more things a hit needs: the attacker lunging toward its target
   and the target flinching back, plus a short burst of element-colored
   particles on a real hit. Queued from applyDamage() (and the Alpha Strike
   ultimate, which resolves damage outside applyDamage), flushed once per
   battle render right after flushFx(). Motion lands on a unit's inner
   `.unit-motion` wrapper rather than the `.unit` card itself specifically
   so it never collides with the card's own always-on `.active` pulse or
   the sprite's always-on idle bob — different elements, so the `animation`
   shorthand on each never has to fight over which value wins. */
const fxMotionQueue = [];
function fxMotion(attacker, defender, elem, hit){
  if(!attacker || !defender) return;
  fxMotionQueue.push({
    attackerId: attacker.id, attackerSide: attacker.side,
    defenderId: defender.id, defenderSide: defender.side,
    elem: elem || null, hit: !!hit,
  });
}
function towardCenter(side){ return side==='player' ? 'lunge-right' : 'lunge-left'; }
function awayFromCenter(side){ return side==='player' ? 'knock-left' : 'knock-right'; }
const PARTICLE_ELEMS = ['fire','water','nature','earth','volt','wind'];
function spawnParticles(host, elem){
  if(!domReady()) return;
  const layer = document.getElementById('fx');
  if(!layer) return;
  const kind = PARTICLE_ELEMS.indexOf(elem)>=0 ? elem : 'earth';
  try{
    const r = host.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const n = 6;
    for(let i=0;i<n;i++){
      const ang = (Math.PI*2*i/n) + (Math.random()-0.5)*0.6;
      const dist = 20 + Math.random()*18;
      const el = document.createElement('div');
      el.className = 'particle particle-' + kind;
      el.style.left = cx + 'px'; el.style.top = cy + 'px';
      el.style.setProperty('--tx', Math.round(Math.cos(ang)*dist) + 'px');
      el.style.setProperty('--ty', Math.round(Math.sin(ang)*dist) + 'px');
      layer.appendChild(el);
      setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 600);
    }
  }catch(e){}
}
function flushMotion(){
  if(!domReady()) { fxMotionQueue.length = 0; return; }
  const items = fxMotionQueue.splice(0);
  items.forEach(it=>{
    try{
      const aUnit = document.querySelector('[data-unit="' + it.attackerId + '"]');
      const aHost = aUnit ? aUnit.querySelector('.unit-motion') : null;
      if(aHost){
        const cls = towardCenter(it.attackerSide);
        aHost.classList.add(cls);
        setTimeout(()=>{ try{ aHost.classList.remove('lunge-right','lunge-left'); }catch(e){} }, 340);
      }
      if(it.hit){
        const dUnit = document.querySelector('[data-unit="' + it.defenderId + '"]');
        const dHost = dUnit ? dUnit.querySelector('.unit-motion') : null;
        if(dHost){
          const cls = awayFromCenter(it.defenderSide);
          dHost.classList.add(cls);
          setTimeout(()=>{ try{ dHost.classList.remove('knock-right','knock-left'); }catch(e){} }, 300);
        }
        if(dUnit) spawnParticles(dUnit, it.elem);
      }
    }catch(e){}
  });
}

/* ================= BESTIARY =================
   Fills in as you meet things. Doubles as the reference the game needs now that
   it has this many systems.
   ============================================ */
function codex(){
  state.codex = state.codex || { species:{}, enemies:{}, hybrids:{}, bosses:{}, terrains:{}, parts:{}, traits:{} };
  return state.codex;
}
function codexSee(cat, key){
  if(!key) return;
  const c = codex();
  if(!c[cat]) c[cat] = {};
  if(!c[cat][key]){ c[cat][key] = true; return true; }
  return false;
}
function codexCount(cat){ return Object.keys(codex()[cat]||{}).length; }
function codexTotals(){
  return {
    species: Object.keys(SPECIES).length,
    enemies: ENEMY_IDS.length,
    hybrids: Object.keys(HYBRID_SPECIES).length,
    bosses: Object.keys(BOSSES).length + 2 + Object.keys(WARLORDS).length,  // +1 Foundry Core, +1 Fracture Engine
    terrains: Object.keys(TERRAINS).length,
    parts: Object.keys(PARTS).length,
    traits: TRAIT_IDS.length,
  };
}
function codexProgress(){
  const t = codexTotals();
  let seen = 0, total = 0;
  Object.keys(t).forEach(k=>{ seen += codexCount(k); total += t[k]; });
  return { seen, total, pct: total ? Math.round((seen/total)*100) : 0 };
}

/* ---- codex set bonuses ----
   Filling in an entire bestiary category — every tribe, every chassis, every
   splice — grants a small permanent passive on top of it, read live off the
   codex rather than earned or toggled separately. Completing the section is
   what unlocks it, so there's nothing here to lose on a wipe (the codex never
   resets) and nothing to re-earn after one either. */
const CODEX_BONUSES = {
  species:  { name:'Field Naturalist',         box:'TRIBES OF TEXEL',   desc:'+1 roster slot cap' },
  enemies:  { name:'Countermeasures Doctrine', box:'RUSTBOUND CHASSIS', desc:'+5% EXP from every victory' },
  hybrids:  { name:'Splice Archive',           box:'SPLICED HYBRIDS',   desc:'+5% chance of salvage from a win' },
  bosses:   { name:"Commander's Ledger",       box:'COMMANDERS',        desc:'+6% ATK and DEF for your whole legion in any commander or warlord fight' },
  terrains: { name:'Terrain Mastery',          box:'BATTLEFIELDS',      desc:'Legion Gauge starts every battle with +10%' },
  parts:    { name:'Salvage Efficiency',       box:'SALVAGE',           desc:'−2 rust from every equipped part' },
  traits:   { name:'Trait Fluency',            box:'TRAITS',            desc:'+3% SPD for your whole legion' },
};
function codexBonusActive(cat){
  const total = codexTotals()[cat];
  return !!total && codexCount(cat) >= total;
}

/* ================= LEGION IDENTITY =================
   A name plus a banner assembled from salvage parts the player has actually
   unlocked (installed at least once). Purely cosmetic, but it's what other
   commanders see in the guild roster, the raid board and the ladder.
   The banner rides along inside the existing "display name" text sent to
   the cloud, so no schema change is needed for it to show up there.
   ==================================================== */
function unlockedPartKeys(){
  const c = codex();
  return Object.keys(PARTS).filter(k=>c.parts && c.parts[k]);
}
function emblemGlyph(keys){
  return (Array.isArray(keys)?keys:[]).map(k=>PARTS[k]?PARTS[k].emoji:'').filter(Boolean).join('');
}
function legionBanner(){
  const badge = (state.badge && BADGES[state.badge] && (state.badgesUnlocked||[]).indexOf(state.badge)>=0)
    ? BADGES[state.badge].emoji+' ' : '';
  const g = emblemGlyph(state.emblem);
  const name = (state.profileName||'Commander').trim() || 'Commander';
  const base = g ? (g+' '+name) : name;
  return badge + base + rebirthMark();
}
function goLegionId(){ state.screen='legionid'; state.confirmRebirth=null; sfx('click'); render(); }

/* ================= LEGION REBIRTH =================
   A voluntary prestige reset, separate from Commander Rank: Commander Rank
   accrues just from playing, on any legion, and never costs anything.
   Rebirth is a deliberate choice with a real cost — it wipes THIS legion's
   roster, levels and current stage back to the start — in exchange for a
   small permanent stat multiplier and a cosmetic mark on the banner. Gated
   behind reaching Stage 5 first, so there's always a genuine run behind it;
   without that gate a fresh legion could rebirth for free the instant it's
   created. Collection progress (codex, favour, champions, cleared trials,
   the War Journal, salvage bay, banner) is untouched — only the roster
   grind resets. */
const REBIRTH_MIN_STAGE = 5;
const REBIRTH_STAT_BONUS = 0.04;   // +4% ATK/DEF/HP/SPD per rebirth, stacking
function rebirthCount(){ return (state.rebirth && state.rebirth.count) || 0; }
function rebirthEligible(){ return state.stage >= REBIRTH_MIN_STAGE; }
function rebirthMultiplier(){ return 1 + rebirthCount()*REBIRTH_STAT_BONUS; }
function rebirthMark(){ const n = Math.min(5, rebirthCount()); return n>0 ? ' '+'★'.repeat(n) : ''; }
function doRebirth(){
  if(!rebirthEligible()) return;
  if(!state.confirmRebirth){ state.confirmRebirth = true; render(); return; }
  state.confirmRebirth = false;
  const fromStage = state.stage, wasDeep = isDeep(fromStage);
  state.rebirth = state.rebirth || { count:0 };
  state.rebirth.count = rebirthCount() + 1;
  const starters = ['emberling','aqualing','terrafang'].map(id=>newMonster(id,1,1));
  state.roster = starters;
  state.formation.front = starters.map(m=>m.uid);
  state.formation.back = [null,null,null];
  state.formSelected = null;
  state.renamingUid = null;   // the roster it pointed at is gone
  state.intel = { history: [], wins: 0 };
  state.stage = 1;
  /* Draft Augments are chosen for THIS build, alongside the roster and
     formation just reset above — unlike Doctrine, Bonds and the Archive,
     they do not carry into the next life. The checkpoints re-offer fresh. */
  state.augments = {};
  state.augmentStagesOffered = {};
  const pct = Math.round((rebirthMultiplier()-1)*100);
  journalAdd({
    id: uid(), stage: fromStage, deep: wasDeep, win: true, boss: null,
    text: `${legionBanner()} stands down at ${wasDeep?('Depth '+deepDepth(fromStage)):('Stage '+fromStage)} and starts again from nothing — by choice. Everything collected stays; the roster does not. The legion carries forward a permanent edge: every beast now fights ${pct}% stronger across the board.`,
    at: Date.now(), portrait: null,
  });
  autosave();
  sfx('levelup');
  render();
}
function toggleEmblemPart(k){
  if(!PARTS[k] || unlockedPartKeys().indexOf(k)<0) return;
  const cur = Array.isArray(state.emblem) ? state.emblem.slice() : [];
  const i = cur.indexOf(k);
  if(i>=0) cur.splice(i,1);
  else if(cur.length<3) cur.push(k);
  else { sfx('click'); return; }
  state.emblem = cur;
  autosave();
  sfx('click');
  render();
}
function setLegionName(raw){
  const name = String(raw||'').trim().slice(0,18);
  state.profileName = name || 'Commander';
  autosave();
}
function doSaveLegionName(){
  setLegionName(readInput('idn_name'));
  sfx('click');
  render();
}
/* ============ AUTO USERNAME ============
   Every fresh save already carries a name — legionBanner() reads
   state.profileName into the Guild roster, the raid board, the Ladder and
   now Online Now, exactly the same field the player can rename by hand from
   Legion Identity above. A brand-new account signing up for the first time
   has almost always never touched that screen, so it would otherwise show
   up next to everyone else's legion as the same generic "Legion" — this
   gives it something distinctive instead, the moment the account exists. */
const USERNAME_ADJ = ['Iron','Rust','Volt','Ember','Aqua','Terra','Gale','Shadow','Chrome','Scrap','Blitz','Ashen'];
const USERNAME_NOUN = ['Vanguard','Scout','Warden','Reclaimer','Rustbound','Sentinel','Rider','Forgemaster','Wraith','Raider'];
function generateUsername(){
  const adj = USERNAME_ADJ[Math.floor(Math.random()*USERNAME_ADJ.length)];
  const noun = USERNAME_NOUN[Math.floor(Math.random()*USERNAME_NOUN.length)];
  const num = 100 + Math.floor(Math.random()*900);
  // Truncate the word half only, never the number — a cut-off "Shadow
  // Forgemaster9" reads as a typo, "ShadowForgema999" still reads as a name.
  return (adj + noun).slice(0,15) + num;
}
/* Only overwrites a legion that has never been given a real name — the
   untouched defaults startGame() and newSlot() hand out on their own when
   the player leaves the name field blank. A name the player already chose,
   on this legion or a prior save, is never clobbered. */
function isDefaultLegionName(name){
  return !name || name==='Legion' || /^Legion \d+$/.test(name);
}
function assignDefaultUsername(){
  if(isDefaultLegionName(state.profileName)){
    state.profileName = generateUsername();
    autosave();
  }
}
/* Record everything a battle puts in front of the player. */
function codexRecordBattle(){
  const b = state.battle; if(!b) return;
  Object.keys(TERRAINS).forEach(k=>{ if(TERRAINS[k]===b.terrain) codexSee('terrains', k); });
  b.enemyUnits.forEach(u=>{
    if(u.speciesKey) codexSee('enemies', u.speciesKey);
    if(u.isBoss) codexSee('bosses', u.bossCodexName || u.name);
  });
  b.playerUnits.forEach(u=>codexRecordMonsterUnit(u));
}
function codexRecordMonsterUnit(u){
  const m = findMonster(u.monsterUid);
  if(m) codexRecordMonster(m);
}
function codexRecordMonster(m){
  if(!m) return;
  if(isHybridId(m.speciesId)) codexSee('hybrids', m.speciesId);
  else codexSee('species', m.speciesId);
  (m.parts||[]).forEach(k=>codexSee('parts', baseKeyOf(k)));
  if(m.trait) codexSee('traits', m.trait.key);
}

/* ============ THE DEPTH CHART (screen) ============ */
function goDepthChart(){ state.screen='depthchart'; sfx('click'); render(); }
function renderDepthChart(){
  const { depths, stats, maxDepth } = depthChartStats();
  const bestDepth = Math.max(state.bestDepth||0, maxDepth);
  const currentDepth = isDeep(state.stage) ? deepDepth(state.stage) : 0;
  const surfaceDone = !!state.cleared[CAMPAIGN_LENGTH];
  const clearedSet = new Set(depths);
  const totalRange = Math.max(bestDepth, currentDepth, 1);
  const shown = Math.min(totalRange, DEPTH_CHART_MAX_ROWS);
  const startDepth = totalRange - shown + 1;
  const rowH = DEPTH_CHART_ROW_H;
  const leftX = 60, svgW = 640;
  const svgH = 20 + shown*rowH + 10;

  let rows = '';
  for(let d=startDepth; d<=totalRange; d++){
    const y = 20 + (d-startDepth)*rowH;
    const cleared = clearedSet.has(d);
    const here = currentDepth>0 && d===currentDepth;
    if(!cleared){
      if(here){
        rows += `<circle cx="${leftX}" cy="${y}" r="8" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="2 2"/><text x="${leftX+16}" y="${y+4}" font-size="12" fill="var(--gold)">Depth ${d} — you are here</text>`;
      } else {
        rows += `<line x1="${leftX-3}" y1="${y}" x2="${leftX+3}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
      }
      continue;
    }
    const type = depthMilestoneType(d);
    const meta = depthMilestoneMeta(d, type);
    if(type==='wave'){
      rows += `<circle cx="${leftX}" cy="${y}" r="2" fill="var(--dim)"/>`;
    } else {
      rows += `<circle cx="${leftX}" cy="${y}" r="7" fill="${meta.color}" fill-opacity="0.18" stroke="${meta.color}" stroke-width="1.5"/><text x="${leftX}" y="${y+4}" text-anchor="middle" font-size="9">${meta.emoji}</text><text x="${leftX+16}" y="${y+4}" font-size="12" fill="${meta.color}">Depth ${d} — ${escapeHtml(meta.label)}</text>`;
    }
    if(here){
      rows += `<circle cx="${leftX}" cy="${y}" r="11" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="2 2"/>`;
    }
  }
  const spine = `<line x1="${leftX}" y1="10" x2="${leftX}" y2="${svgH-10}" stroke="var(--border)" stroke-width="2"/>`;
  const svg = `<svg viewBox="0 0 ${svgW} ${svgH}" width="100%" height="${svgH}" style="display:block;">${spine}${rows}</svg>`;
  const clippedNote = totalRange>shown ? `<p class="dim" style="font-size:13px;">Showing the most recent ${shown} depths — the full climb goes back to Depth 1.</p>` : '';
  const nothingYet = depths.length===0 && currentDepth===0;

  return `
  <div class="panel">
    <h2 class="section">THE DEPTH CHART</h2>
    <p class="dim">${surfaceDone ? 'Surface campaign cleared.' : `Surface campaign not yet cleared — the Deep starts once Stage ${CAMPAIGN_LENGTH} falls.`} Every depth this legion has ever cleared, across every Rebirth, plotted at its real position. Nothing here resets.</p>
    <p class="dim">🏆 Deepest reach: <b>Depth ${bestDepth}</b> &nbsp; ⚙️ Foundry Core ×${stats.foundry} &nbsp; 👑 Warlords ×${stats.warlord} &nbsp; ⚙️ Fracture Engine ×${stats.fracture} &nbsp; ☠ Elite waves ×${stats.elite} &nbsp; ${depths.length} depths cleared total</p>
  </div>
  <div class="panel">
    ${nothingYet ? `<p class="dim">Nothing charted yet — the Deep starts past Stage ${CAMPAIGN_LENGTH}.</p>` : svg}
    ${clippedNote}
  </div>
  <div class="panel footer-nav"><button class="btn" onclick="state.screen='hub'; render();">← Back to Hub</button></div>`;
}

  <div class="panel" style="text-align:center;">
    <h1 class="title">GRID LEGION</h1>
    <div class="heading" style="font-size:11px; color:var(--dim); margin-bottom:18px;">RISE OF THE RUSTBOUND</div>
    <p class="dim">Command elemental beast-tribes against the robotic Rustbound horde.<br>Shift your lines mid-battle. Bolt enemy salvage onto your beasts. Stay ahead of a machine that learns.</p>

    <div style="margin-top:20px;">

function goProfiles(){ state.screen='profiles'; state.transfer=null; state.confirmWipe=null; render(); }
function saveStatusText(){
  if(state.slot===null) return hasStorage() ? 'Not bound to a legion slot — progress will not be kept.' : 'Saving unavailable in this browser — use a transfer code.';
  if(state.saveState==='unsaved') return '⚠ could not write to storage';
  const base = `${escapeHtml(legionBanner())} · autosaving`;
  return cloudConfigured() ? `${base} · ${cloudStatusText()}` : base;
}
function manualSave(){
  const okWrite = autosave();
  state.saveState = okWrite ? 'saved' : 'unsaved';
  render();
}
function leaveToProfiles(){ autosave(); goProfiles(); }
/* kept so an existing session can jump straight in */

      <div class="slotcard">

        <div class="dim" style="font-size:14px;">saved ${when.toLocaleDateString()} ${when.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>

          <button class="btn small primary" onclick="continueSlot(${i})">▶ Continue</button>
          <button class="btn small danger" onclick="wipeSlot(${i})">${state.confirmWipe===i?'Really delete?':'Delete'}</button>
        </div>
      </div>`);
    } else {
      slots.push(`
      <div class="slotcard">
        <div class="slotname dim">Empty slot ${i+1}</div>
        <div class="dim" style="font-size:15px;">No legion recorded here.</div>
        <div class="row" style="margin-top:8px;">
          <button class="btn small primary" onclick="newSlot(${i})">+ New Legion</button>

  const msg = state.transfer && state.transfer.msg
    ? `<p style="color:${state.transfer.ok?'var(--gold)':'var(--danger)'}">${state.transfer.msg}</p>` : '';

  const accountRow = cloudConfigured() ? `
    <div class="row" style="margin-bottom:10px; align-items:center;">
      <button class="btn small ${signedIn()?'':'primary'}" onclick="goAccount()">${signedIn()?'👤 Account':'👤 Sign in / Create account'}</button>
      <span class="dim" style="font-size:15px;">${cloudStatusText()}</span>
    </div>` : '';

  return `
  <div class="panel">
    <h2 class="section">LEGIONS</h2>

      <button class="btn" onclick="importIntoSlot()">📥 Restore Legion</button>

function escapeHtml(t){ return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function readInput(id){ const el=document.getElementById(id); return el ? el.value : ''; }

function newSlot(i){
  const typed = readInput('pname').trim().slice(0,18);
  initGame();
  state.slot = i;
  state.profileName = typed || ('Legion ' + (i+1));
  state.saveState = hasStorage() ? 'saved' : 'unsaved';
  autosave();
  state.screen = 'hub';
  render();
}
function continueSlot(i){
  const d = readSlot(i);
  if(!d){ render(); return; }
  const prevSavedAt = (typeof d.savedAt==='number' && isFinite(d.savedAt) && d.savedAt>0) ? d.savedAt : null;
  applySave(d, i);
  state.saveState = 'saved';
  // Compute the "while you were out" bonus, if any, then immediately
  // re-save — this both keeps the grant from being lost if the tab closes
  // before the next autosave, and stamps a fresh savedAt so backing out to
  // Legions and hitting Continue again right away can't roll it twice.
  state.campWelcome = prevSavedAt ? campWelcomeBonus(Date.now()-prevSavedAt) : null;
  // Re-sync the caravan's clock against real elapsed time the instant a save
  // loads, same reasoning as the away-time bonus just above: an offer left
  // open when the tab closed should read as expired (or a fresh one eligible)
  // by the time the player is back, not frozen at however it last looked.
  tickCaravan(Date.now());
  // The Black Market gets the same real-time re-sync, on its own clock.
  tickBlackMarket(Date.now());
  autosave();
  state.screen = 'camp';
  render();
}
function wipeSlot(i){
  if(state.confirmWipe===i){ deleteSlot(i); if(signedIn()) cloudDeleteSlot(i); state.confirmWipe=null; }
  else state.confirmWipe = i;
  render();
}
function importIntoSlot(){
  const d = decodeCode(readInput('impcode'));
  if(!d){ state.transfer = { ok:false, msg:'That code could not be read — check it copied in full.' }; render(); return; }
  let target = null;
  for(let i=0;i<SLOT_COUNT;i++){ if(!readSlot(i)){ target=i; break; } }
  applySave(d, target);
  if(target!==null) autosave();
  state.transfer = { ok:true, msg:'Legion restored.' };
  state.saveState = target!==null ? 'saved' : 'unsaved';
  state.screen = 'hub';
  render();
}

/* ================= TRAINING DEPLOYMENT =================
   A scripted first battle. It does not lecture: each step waits for the player
   to do the thing, and the formation is rigged so the shift completes a trio.
   ======================================================= */
const TUTORIAL_STEPS = [
  { id:'attack',
    title:'Pick a target',
    body:'Your front line takes the hits so the back line can work. Tap <b>⚔ Attack</b>, then tap an enemy.' },
  { id:'skill',
    title:'Spend a skill',
    body:'Skills hit far harder and carry an elemental rider — burn, slow, stun — but then need a few turns to come back. Use yours.' },
  { id:'shift',
    title:'Reshape the line',
    body:'Your front line is <b>fire, fire, water</b>. Two fire beasts is a DUO. Send the water one back with <b>🔀 Shift</b> and the fire beast behind it steps up — turning the duo into a <b>FIRE TRIO</b>, mid-battle.' },
  { id:'gauge',
    title:'Spend the gauge',
    body:'The Legion Gauge fills as you deal and take damage. It spends in tiers: <b>🔧 Purge</b> at 33 clears afflictions and rust, <b>🛡 Rally</b> at 66 shields everyone, <b>⚡ Overdrive</b> at 100 has the whole legion strike at once. Spend it.' },
];
function tutorialActive(){ return !!state.tutorial && !state.tutorial.done; }
function tutorialStep(){
  if(!tutorialActive()) return null;
  return TUTORIAL_STEPS[state.tutorial.step] || null;
}
/* Called after the player does something; advances if it matches the current step. */
function tutorialSaw(what){
  if(!tutorialActive()) return;
  const t = state.tutorial;
  if(!TUTORIAL_STEPS.some(st=>st.id===what)) return;
  t.seen = t.seen || [];
  if(t.seen.indexOf(what) < 0) t.seen.push(what);
  // Skip over anything already done, so doing things out of order is rewarded
  // rather than ignored — the coach just moves on to what is still unlearned.
  const before = t.step;
  while(t.step < TUTORIAL_STEPS.length && t.seen.indexOf(TUTORIAL_STEPS[t.step].id) >= 0) t.step++;
  if(t.step !== before) sfx('levelup');
  if(t.step >= TUTORIAL_STEPS.length) t.done = true;
}
function tutorialPanelHtml(){
  const step = tutorialStep();
  if(!step) return '';
  return `<div class="coach">
    <div class="coach-title">TRAINING · ${state.tutorial.step+1}/${TUTORIAL_STEPS.length} — ${escapeHtml(step.title)}</div>
    <div>${step.body}</div>
    <div style="margin-top:6px;"><span class="dim" style="cursor:pointer;" onclick="skipTutorial()">[skip training]</span></div>
  </div>`;
}
function skipTutorial(){
  if(state.tutorial) state.tutorial.done = true;
  sfx('click');
  render();
}

/* ============ RUSTBOUND ADAPTATION ============ */
function currentAdaptation(){
  const h = state.intel.history.slice(-3);
  if(h.length===0) return null;
  const counts = {};
  h.forEach(e=>counts[e]=(counts[e]||0)+1);
  let best=null, bc=0;
  Object.entries(counts).forEach(([e,c])=>{ if(c>bc){ bc=c; best=e; } });
  return best;
}
function platingActive(){ return state.stage>=3 && !!currentAdaptation(); }
function platingPct(){ return Math.min(0.35, 0.15 + 0.03*state.intel.wins); }

/* ============ RUSTBOUND DOCTRINE ============
   Where INTEL above is short-term and tactical — the last five wins' worth
   of damage-by-element, reset the instant a legion Rebirths — DOCTRINE is
   the faction's long memory: a tally that has run since this save file's
   legion began, survives every Rebirth exactly like Battle-Forged Bonds
   (see doRebirth — it is never touched there), and only ever escalates. It
   never overrides INTEL's per-wave read; it stacks quietly underneath it in
   pickEnemySpecies, so a save with real history behind it fights a subtly
   different, slower-moving war than a fresh one even at the identical
   stage — and the two signals can agree or point in different directions,
   since one is "recently" and the other is "basically always". */
const DOCTRINE_MIN_SAMPLE = 8;             // wins before a lifetime-favourite element locks in
const DOCTRINE_TIER_THRESHOLDS = [10, 25, 50];  // cumulative doctrine wins needed for tier 1/2/3
const DOCTRINE_TIER_WEIGHT = 0.15;         // extra counter-weight multiplier per tier, stacking
const DOCTRINE_FORMATION_MIN = 6;          // wins before formation-shape flavour text is confident
const DOCTRINE_FORMATION_RATIO = 1.4;      // front:back (or back:front) ratio needed to call it a "shape"
function doctrineElement(){
  const t = state.doctrine.elementTally;
  const total = Object.values(t).reduce((s,v)=>s+v,0);
  if(total < DOCTRINE_MIN_SAMPLE) return null;
  let best=null, bc=0;
  Object.entries(t).forEach(([e,c])=>{ if(c>bc){ bc=c; best=e; } });
  return best;
}
function doctrineTier(){
  let tier = 0;
  DOCTRINE_TIER_THRESHOLDS.forEach(need=>{ if(state.doctrine.wins>=need) tier++; });
  return tier;
}
/* The extra multiplier pickEnemySpecies applies to a chassis whose element
   hard-counters the doctrine-locked element — separate from and additive to
   the existing short-term `adapted` weighting it already carries. */
function doctrineWeight(chassisElem, lockedElem){
  if(!lockedElem || ELEM_BEATS[chassisElem]!==lockedElem) return 1;
  return 1 + DOCTRINE_TIER_WEIGHT*doctrineTier();
}
function doctrineFormationShape(){
  const f = state.doctrine.formationTally;
  const total = f.front + f.back;
  if(total < DOCTRINE_FORMATION_MIN) return null;
  if(f.front >= f.back*DOCTRINE_FORMATION_RATIO) return 'front';
  if(f.back >= f.front*DOCTRINE_FORMATION_RATIO) return 'back';
  return null;
}
function doctrineKillLeader(){
  const k = state.doctrine.kills;
  let best=null, bc=0;
  Object.entries(k).forEach(([id,c])=>{ if(c>bc){ bc=c; best=id; } });
  if(!best) return null;
  const sd = SPECIES[best] || HYBRID_SPECIES[best];
  if(!sd) return null;
  return { speciesId:best, count:bc, name:sd.name, emoji:sd.emoji };
}
/* Only fires when doctrineTier() just crossed a new threshold, or the
   locked-in element just changed — see the callsite in endBattle's win
   branch, which computes before/after and only calls this on a real shift. */
function doctrineShiftEntry(prevElement, elem, tier){
  const label = isDeep(state.stage) ? `Depth ${deepDepth(state.stage)}` : `Stage ${state.stage}`;
  let text;
  if(elem && elem!==prevElement){
    text = pickText([
      `${label}. The Rustbound case file on your legion gets rewritten: your history now reads mostly ${elem.toUpperCase()}, and the machines have stopped calling it a coincidence.`,
      `${label}. A new directive circulates through the Rustbound ranks — your legion's pattern has settled on ${elem.toUpperCase()}, and they intend to stop pretending otherwise.`,
    ]);
  } else {
    text = pickText([
      `${label}. The Rustbound archive on your legion has grown thick enough to matter — expect harder counters from here on.`,
      `${label}. Somewhere behind the lines, your legion's file gets escalated again. They are done underestimating you.`,
    ]);
  }
  return { id: uid(), stage: state.stage, deep: isDeep(state.stage), win:true, boss:null, text, at: Date.now(), portrait: null };
}

function deployedElementCounts(){
  const counts = {};
  ['front','back'].forEach(row=>{
    state.formation[row].forEach(u=>{
      if(!u) return;
      const m = findMonster(u); if(!m) return;
      computeStats(m).elements.forEach(e=> counts[e]=(counts[e]||0)+1 );
    });
  });
  return counts;
}
function deployedDominantElement(){
  const counts = deployedElementCounts();
  let best=null, bc=0;
  Object.entries(counts).forEach(([e,c])=>{ if(c>bc){ bc=c; best=e; } });
  return best;
}
/* The pre-battle hub banner explaining a commander fight's gimmick — branches
   for a split-phase boss (no genName to read: two parts, no shield at all)
   vs. every other scripted boss/warlord (the usual shield-while-pylons-stand
   line). */
function bossBannerHtml(bd){
  const body = bd.parts
    ? `No shield this time — ${bd.parts.map(p=>escapeHtml(p.name)).join(' and ')} are both exposed from the start. Pick your fight.`
    : `Its shield holds while any ${escapeHtml(bd.genName.toLowerCase())} stands, and it reboots a downed one every few turns. Drop them all at once.`;
  return `<div class="boss-banner">☠ <b>COMMANDER FIGHT</b> — ${escapeHtml(bd.intro)} ${body}</div>`;
}

function goAccount(){ state.screen='account'; cloud.message=''; cloud.test=null; render(); }
function selfTestHtml(){
  if(!cloud.test) return '';
  if(cloud.test==='running') return '<p class="dim">Testing the connection…</p>';
  return `<div class="testbox">${cloud.test.map(l=>
    `<div style="color:${l.ok?'var(--nature)':'var(--danger)'}">${l.ok?'✔':'✖'} ${escapeHtml(l.text)}</div>`).join('')}</div>`;
}
function doSelfTest(){
  cloud.busy = true; cloud.test = 'running'; cloud.message=''; render();
  cloudSelfTest().then(r=>{ cloud.busy=false; cloud.test=r.lines; render(); })
                 .catch(()=>{ cloud.busy=false; cloud.test=[{ok:false,text:'The test itself failed to run.'}]; render(); });
}

function validCredentials(email, password){
  if(!email || email.indexOf('@')<1 || email.length<5) return 'That does not look like an email address.';
  if(!password || password.length<6) return 'Password needs to be at least 6 characters.';
  return null;
}
function doSignIn(){
  const email = readInput('acc_email').trim(), password = readInput('acc_pass');
  const bad = validCredentials(email, password);
  if(bad){ cloud.status='error'; cloud.message=bad; render(); return; }
  cloud.busy = true; cloud.message = 'Signing in…'; render();
  cloudSignIn(email, password).then(r=>{
    cloud.busy = false;
    if(!r.ok){ cloud.status='error'; cloud.message=r.error; render(); return; }
    cloud.status='ready'; cloud.message='';
    cloudSyncDown().then(()=>cloudSyncUp()).then(()=>{ state.screen='profiles'; render(); });
    render();
  });
}
function doSignUp(){
  const email = readInput('acc_email').trim(), password = readInput('acc_pass');
  const bad = validCredentials(email, password);
  if(bad){ cloud.status='error'; cloud.message=bad; render(); return; }
  cloud.busy = true; cloud.message = 'Creating your account…'; render();
  cloudSignUp(email, password).then(r=>{
    cloud.busy = false;
    if(!r.ok){ cloud.status='error'; cloud.message=r.error; render(); return; }
    assignDefaultUsername();   // give a brand-new registration something better than "Legion" to show up as
    if(r.needsConfirm){
      cloud.status='signed-out';
      cloud.message='Account created — check your email to confirm it, then sign in.';
      render(); return;
    }
    cloud.status='ready'; cloud.message='Account created.';
    cloudSyncUp().then(()=>{ state.screen='profiles'; render(); });
    render();
  });
}
function doSignOut(){
  cloud.busy = true; render();
  cloudSignOut().then(()=>{ cloud.busy=false; cloud.message='Signed out. Legions on this device are untouched.'; render(); });
}
function doSyncNow(){
  cloud.busy = true; cloud.message=''; render();
  cloudSyncDown().then(()=>cloudSyncUp()).then(()=>{ cloud.busy=false; render(); });
}

function timeAgo(iso){
  const t = Date.parse(iso);
  if(!t) return 'recently';
  const mins = Math.max(0, Math.round((Date.now()-t)/60000));
  if(mins < 2) return 'just now';
  if(mins < 60) return mins+' min ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+' hr ago';
  const days = Math.round(hrs/24);
  return days+' day'+(days===1?'':'s')+' ago';
}
/* Same idea as timeAgo, pointed at the future — used for a Guild War's
   "ends in" countdown, which is otherwise the only clock in the game that
   counts down rather than up. */
function timeUntil(iso){
  const t = Date.parse(iso);
  if(!t) return 'soon';
  const mins = Math.max(0, Math.round((t-Date.now())/60000));
  if(mins < 1) return 'any moment now';
  if(mins < 60) return mins+' min';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+' hr';
  const days = Math.round(hrs/24);
  return days+' day'+(days===1?'':'s');
}

/* n is a real count, or the string 'max' to donate everything the bay holds
   (still capped at GUILD_PROJECT_CONTRIB_CAP). Spends the parts only once
   the server confirms the contribution landed — see guildProjectContribute. */
function doGuildProjectContribute(n){
  if(!social.guild || social.busy) return;
  const avail = state.parts.length;
  if(avail<=0){ social.status='You have no salvage parts to contribute.'; render(); return; }
  const amount = Math.max(1, Math.min(avail, GUILD_PROJECT_CONTRIB_CAP, n==='max' ? avail : (Math.floor(Number(n))||0)));
  social.busy=true; render();
  guildProjectContribute(amount).then(r=>{
    social.busy=false;
    if(r.ok) state.parts.splice(0, amount);
    social.status = r.ok ? `Contributed ${amount} part${amount===1?'':'s'} to the guild project.` : ('Could not contribute: '+r.error);
    render();
  });
}

  const cards = d.missions.map((m,i)=>{
    const def = missionDef(m.id);
    return `
    <div class="misscard ${m.done?'done':''}">
      <div style="font-size:18px; color:${m.done?'var(--nature)':'var(--text)'}">${m.done?'✔':'○'} ${escapeHtml(def.text(m.params))}</div>
      <div class="dim" style="font-size:15px; margin-top:4px;">Reward: ${MISSION_REWARD} salvage part</div>
      ${m.done && !m.claimed ? `<button class="btn small primary" style="margin-top:6px;" onclick="claimMission(${i})">Claim</button>`
        : (m.claimed ? '<div class="dim" style="font-size:15px;">claimed</div>' : '')}
    </div>`;
  }).join('');
  const p = dailyProgress();
  return `
  <div class="panel">
    <h2 class="section">SCAVENGER ORDERS — ${escapeHtml(d.date)}</h2>
    <p class="dim">Three orders, rotating every day at 00:00 UTC. They are the same for everyone on the same day, and they reward you for taking a legion you would not normally field.</p>
    <p style="color:var(--gold)">${p.done}/${p.total} complete${p.unclaimed?` · ${p.unclaimed} waiting to claim`:''}</p>
    <div class="row">${cards}</div>
  </div>
  <div class="panel footer-nav"><button class="btn" onclick="state.screen='hub'; render();">← Back to Hub</button></div>`;
}

function renderTribes(){
  const cards = TRIBE_IDS.map(e=>{
    const t = TRIBES[e], f = favorOf(e), c = CHAMPIONS[e];
    const pctF = Math.round((f/FAVOR_MAX)*100);
    const hasChamp = championUnlocked(e), hasBless = blessingUnlocked(e);
    const taken = !!state.recruited[e];
    const isActive = state.blessing===e;
    return `
    <div class="tribecard">
      <div class="slotname">${t.emoji} ${t.name}</div>
      <div class="dim" style="font-size:15px;">${t.home}</div>
      <div class="favor-bg"><div class="favor-fill elem-bg-${e}" style="width:${pctF}%"></div></div>
      <div class="dim" style="font-size:14px;">favour ${f}/${FAVOR_MAX}</div>
      <div style="margin-top:6px; font-size:15px;">
        <div style="color:${hasChamp?'var(--gold)':'var(--dim)'}">
          ${hasChamp?'✔':'○'} ${c.emoji} ${c.name} <span class="dim">(${FAVOR_CHAMPION})</span>
          ${hasChamp ? (taken ? '<span class="dim">— joined</span>'
            : ` <button class="btn small primary" onclick="recruitChampion('${e}')">Call</button>`) : ''}
        </div>
        <div style="color:${hasBless?'var(--gold)':'var(--dim)'}; margin-top:4px;">
          ${hasBless?'✔':'○'} ${BLESSINGS[e].name} <span class="dim">(${FAVOR_BLESSING})</span>
        </div>
        <div class="dim" style="font-size:14px;">${BLESSINGS[e].desc}</div>
        ${hasBless ? `<button class="btn small ${isActive?'primary':''}" style="margin-top:4px;" onclick="setBlessing('${e}')">${isActive?'★ Active':'Invoke'}</button>` : ''}
      </div>
    </div>`;
  }).join('');

  const active = activeBlessing();
  return `
  <div class="panel">
    <h2 class="section">TRIBES OF TEXEL</h2>
    <p class="dim">Every element you fight with is somebody's people. Deal damage with a tribe's element and their favour rises — at ${FAVOR_CHAMPION} they send their champion, at ${FAVOR_BLESSING} they grant a blessing. Only one blessing can be invoked at a time.</p>
    <p style="color:var(--gold)">${active ? `★ Invoked: ${TRIBES[active].emoji} ${BLESSINGS[active].name} — ${BLESSINGS[active].desc}` : 'No blessing invoked.'}
      ${active?`<button class="btn small" onclick="setBlessing(null)">Dismiss</button>`:''}</p>
    ${state.lastChampion?`<p style="color:var(--gold)">★ ${state.lastChampion.emoji} ${state.lastChampion.name} joins your legion.</p>`:''}
    <div class="row">${cards}</div>
  </div>
  <div class="panel footer-nav"><button class="btn" onclick="state.lastChampion=null; state.screen='hub'; render();">← Back to Hub</button></div>`;
}
function recruitChampion(e){
  if(!championUnlocked(e) || state.recruited[e]) return;
  if(state.roster.length>=rosterCap()) return;
  state.recruited[e] = true;
  const m = newMonster(CHAMPIONS[e].id, 1, 1);
  state.roster.push(m);
  state.lastChampion = computeStats(m);
  autosave();
  render();
}
function setBlessing(e){
  if(e===null){ state.blessing=null; autosave(); render(); return; }
  if(!blessingUnlocked(e)) return;
  state.blessing = (state.blessing===e) ? null : e;
  autosave();
  render();
}

function clearedStages(){
  return Object.keys(state.cleared).map(Number).filter(n=>n>=1).sort((a,b)=>a-b);
}
/* ============ THE DEPTH CHART ============
   A generated visual of the Deep, not another block of prose — the War
   Journal already tells that story in words. Needs no new save data at
   all: `state.cleared` and `state.bestDepth` already record everything
   this draws, and both already survive Rebirth untouched (see initGame,
   which is the only place that resets them), so the chart reads as a
   career map — every depth this legion has ever cleared, across every
   Rebirth — not just the current life. Milestone type at any depth is
   fully deterministic from bossForStage/isEliteStage, so nothing new
   needs tracking to classify what happened there. */
const DEPTH_CHART_ROW_H = 15;      // px per depth level
const DEPTH_CHART_MAX_ROWS = 400;  // defensive cap on an unbounded "scales without end" climb
function depthMilestoneType(depth){
  const stage = CAMPAIGN_LENGTH + depth;
  const bd = bossForStage(stage);
  if(bd === DEEP_BOSS) return 'foundry';
  if(bd === DEEP_SPLIT_BOSS) return 'fracture';
  if(bd && bd.isWarlord) return 'warlord';
  if(isEliteStage(stage)) return 'elite';
  return 'wave';
}
function depthMilestoneMeta(depth, type){
  if(type==='foundry') return { emoji: DEEP_BOSS.emoji, color:'var(--volt)', label: DEEP_BOSS.name };
  if(type==='fracture') return { emoji: DEEP_SPLIT_BOSS.emoji, color:'var(--earth)', label: DEEP_SPLIT_BOSS.name };
  if(type==='warlord'){ const bd = bossForStage(CAMPAIGN_LENGTH+depth); return { emoji: bd.emoji, color:'var(--'+bd.element+')', label: bd.name }; }
  if(type==='elite') return { emoji:'☠', color:'var(--danger)', label:'Elite Wave' };
  return { emoji:null, color:'var(--dim)', label:null };
}
function clearedDeepDepths(){
  return Object.keys(state.cleared).map(Number).filter(n=>n>CAMPAIGN_LENGTH).map(n=>n-CAMPAIGN_LENGTH).sort((a,b)=>a-b);
}
function depthChartStats(){
  const depths = clearedDeepDepths();
  const stats = { foundry:0, fracture:0, warlord:0, elite:0, wave:0 };
  depths.forEach(d=>{ stats[depthMilestoneType(d)]++; });
  return { depths, stats, maxDepth: depths.length ? depths[depths.length-1] : 0 };
}
function renderTrials(){
  const list = clearedStages();
  if(!list.length){
    return `
    <div class="panel">
      <h2 class="section">TRIALS</h2>
      <p class="dim">Clear a stage first. Any stage you have beaten can be re-fought under a handicap for extra salvage.</p>
    </div>
    <div class="panel footer-nav"><button class="btn" onclick="state.screen='hub'; render();">← Back to Hub</button></div>`;
  }
  const pick = state.trialPick || { stage:list[list.length-1], mods:[] };
  state.trialPick = pick;

  const stageBtns = list.map(n=>`
    <button class="btn small ${pick.stage===n?'primary':''}" onclick="pickTrialStage(${n})">
      ${isDeep(n)?'D'+deepDepth(n):n}${bossForStage(n)?' ☠':''}
    </button>`).join('');

  const modCards = MODIFIER_IDS.map(id=>{
    const m = MODIFIERS[id];
    const on = pick.mods.indexOf(id)>=0;
    return `<div class="pcard ${on?'selected':''}" style="width:150px; border-color:${on?'var(--gold)':'var(--border)'}" onclick="toggleMod('${id}')">
      <div class="pname" style="color:${on?'var(--gold)':'var(--wind)'}">${m.emoji} ${m.name}</div>
      <div class="dim" style="font-size:14px;">${m.desc}</div>
    </div>`;
  }).join('');

  const count = pick.mods.length;
  const reward = trialReward(pick.stage) * Math.max(1, count);
  return `
  <div class="panel">
    <h2 class="section">TRIALS</h2>
    <p class="dim">Re-fight a cleared stage under handicaps. No story progress and no recruits — trials pay in <b>salvage</b>, and the more handicaps you stack, the bigger the haul. Lose and you simply walk away.</p>
    <div class="dim" style="margin-top:8px;">Stage</div>
    <div class="row">${stageBtns}</div>
    <div class="dim" style="margin-top:12px;">Handicaps ${count?`(${count} stacked)`:'— pick at least one'}</div>
    <div class="row">${modCards}</div>
    <p style="margin-top:10px; color:var(--gold)">Reward: ${reward} salvage part${reward===1?'':'s'}${count?'':' — select a handicap to begin'}</p>
    <button class="btn primary" ${count?'':'disabled'} onclick="startTrial()">☠ BEGIN TRIAL</button>
  </div>
  <div class="panel footer-nav"><button class="btn" onclick="state.screen='hub'; render();">← Back to Hub</button></div>`;
}
function pickTrialStage(n){ state.trialPick.stage = n; render(); }
function toggleMod(id){
  const m = state.trialPick.mods, i = m.indexOf(id);
  if(i>=0) m.splice(i,1); else m.push(id);
  render();
}
function startTrial(){
  const pick = state.trialPick;
  if(!pick || !pick.mods.length) return;
  state.trial = { stage: pick.stage, mods: pick.mods.slice(), reward: trialReward(pick.stage)*Math.max(1,pick.mods.length) };
  state.stageBeforeTrial = state.stage;
  state.stage = pick.stage;
  beginBattle();
}
function endTrial(){
  state.stage = state.stageBeforeTrial || state.stage;
  state.trial = null;
  state.battle = null;
  state.screen = 'hub';
  autosave();
  render();
}

/* ---- Redeployment: re-fight a cleared stage at its own, ordinary difficulty ----
   Trials trade a handicap for salvage-only pay, and deliberately skip EXP,
   recruits and every long-lived tally — they're a side activity, not a real
   fight. Redeployment is the opposite kind of "go back": no handicap, no
   inflated haul, just the stage's own honest rewards, so a legion that's
   outgrown Stage 2 can send a fresh, low-level recruit back there to
   actually catch up instead of getting thrown at the current frontier (or a
   Trial, which was never built to hand out EXP or new monsters at all).
   Because it's a real fight, it flows through the exact same win/loss
   resolution as any other battle in endBattle() — Doctrine, tribe favour,
   Battle-Forged Bonds and the War Journal all still apply — by swapping
   state.stage for the fight's duration and restoring it afterward, the same
   swap-and-restore Trials already established with stageBeforeTrial. */
function goRedeploy(){ state.screen='redeploy'; state.redeployPick=null; render(); }
function renderRedeploy(){
  tickEnergy(Date.now());
  const list = clearedStages();
  if(!list.length){
    return `
    <div class="panel">
      <h2 class="section">REDEPLOYMENT</h2>
      <p class="dim">Clear a stage first. Any stage you've beaten stays reachable here, at its own ordinary difficulty.</p>
    </div>
    <div class="panel footer-nav"><button class="btn" onclick="state.screen='hub'; render();">← Back to Hub</button></div>`;
  }
  const pick = (state.redeployPick && list.indexOf(state.redeployPick.stage)>=0) ? state.redeployPick : { stage:list[0] };
  state.redeployPick = pick;
  const stageBtns = list.map(n=>`
    <button class="btn small ${pick.stage===n?'primary':''}" onclick="pickRedeployStage(${n})">
      ${isDeep(n)?'D'+deepDepth(n):n}${bossForStage(n)?' ☠':''}
    </button>`).join('');
  const filled = state.formation.front.concat(state.formation.back).filter(Boolean).length;
  return `
  <div class="panel">
    <h2 class="section">REDEPLOYMENT</h2>
    <p class="dim">Re-fight any stage you've already cleared, at its own ordinary difficulty — full EXP, a real shot at a recruit, normal salvage. No handicap, no bonus haul, and it never touches your place at the frontier. Good ground to season a fresh recruit before you throw them at the real fight.</p>
    <div class="dim" style="margin-top:8px;">Stage</div>
    <div class="row">${stageBtns}</div>
    <button class="btn primary" style="margin-top:12px;" ${(filled && hasEnergyFor(ENERGY_COST_PER_BATTLE))?'':'disabled'} onclick="beginRedeploy()">🔁 REDEPLOY TO ${isDeep(pick.stage)?'DEPTH '+deepDepth(pick.stage):'STAGE '+pick.stage}</button>
    ${(filled && !hasEnergyFor(ENERGY_COST_PER_BATTLE))?`<p class="dim">Needs ${ENERGY_COST_PER_BATTLE} energy — you have ${energy.current}.</p>`:''}
  </div>
  <div class="panel footer-nav"><button class="btn" onclick="state.screen='hub'; render();">← Back to Hub</button></div>`;
}
function pickRedeployStage(n){ state.redeployPick = { stage:n }; render(); }
function beginRedeploy(){
  const pick = state.redeployPick;
  if(!pick || clearedStages().indexOf(pick.stage)<0 || !hasEnergyFor(ENERGY_COST_PER_BATTLE)) return;
  state.redeploy = { stage: pick.stage };
  state.stageBeforeRedeploy = state.stage;
  state.stage = pick.stage;
  beginBattle();
}
function endRedeploy(){
  state.stage = state.stageBeforeRedeploy || state.stage;
  state.redeploy = null;
  state.battle = null;
  state.screen = 'hub';
  autosave();
  render();
}

function goCampaignMap(){ state.screen='campaignmap'; state.detourSelected=null; state.mapStageSelected=null; render(); }
function selectDetour(id){ state.detourSelected = id; state.mapStageSelected = null; render(); }
/* Toggles a main-line stage node: tapping the same stage again closes its
   panel rather than re-opening it. Locked (uncleared) stages are still
   selectable — the panel just explains why there's nothing to do there yet
   — mirroring how a locked detour behaves. */
function selectMapStage(n){
  state.mapStageSelected = (state.mapStageSelected===n) ? null : n;
  state.detourSelected = null;
  render();
}
/* Reuses Redeployment wholesale rather than inventing a second "go fight an
   old stage" path: the map's stage nodes are just another door into the
   same, already-tested flow (ordinary difficulty and rewards, your place
   in the campaign untouched — see beginRedeploy/endRedeploy above). */
function redeployFromMap(n){
  state.redeployPick = { stage: n };
  beginRedeploy();
}
function beginDetour(id){
  const det = CAMPAIGN_DETOURS.find(d=>d.id===id);
  if(!det || !detourAvailable(det) || !hasEnergyFor(ENERGY_COST_PER_BATTLE)) return;
  state.detour = { id: det.id };
  state.stageBeforeDetour = state.stage;
  state.stage = det.afterStage;
  beginBattle();
  logMsg(`🧭 A detour: ${det.name} — tougher ground, worth the risk.`);
}
function endDetour(){
  state.stage = state.stageBeforeDetour || state.stage;
  state.detour = null;
  state.battle = null;
  state.screen = 'hub';
  autosave();
  render();
}
function beginUndercroft(){
  if(!undercroftAvailable() || !hasEnergyFor(ENERGY_COST_PER_BATTLE)) return;
  state.undercroft = true;
  state.stageBeforeUndercroft = state.stage;
  state.stage = UNDERCROFT_ANCHOR_STAGE;
  beginBattle();
  logMsg('☣ The Undercroft opens beneath you — the rust has found a way in.');
}
function endUndercroft(){
  state.stage = state.stageBeforeUndercroft || state.stage;
  state.undercroft = null;
  state.battle = null;
  state.screen = 'hub';
  autosave();
  render();
}

/* ================= THE GAUNTLET =================
   An endless survival mode off to the side of the campaign proper — no
   story stage, no retreat once it starts, just wave after wave until you
   lose. It reuses the Deep's already-tuned, already-endless scaling wholesale
   rather than inventing a second difficulty curve: wave N is simply fought
   at the virtual stage CAMPAIGN_LENGTH+N (i.e. Depth N), through the exact
   same terrainForStage()/buildEnemyUnits() beginBattle() already calls for
   any other fight, with state.stage temporarily overridden and restored
   afterward — the same "anchor stage, restore on exit" trick Redeployment,
   a Detour and the Undercroft above all already use. Each wave is a fresh,
   fully-crewed fight built straight from the current roster (no HP or
   fainted status carried over between waves) — the escalating Depth scaling
   alone is what makes it a real gauntlet, not attrition on top of it.

   It sits outside isCampaignBattle() (see above), same boundary Duels,
   Raids, the World Boss, Guild War and Trials already draw, so it neither
   costs per-wave Energy nor feeds EXP, recruits, Rustbound Doctrine,
   Battle-Forged Bonds or state.cleared — it is its own separate scoring
   layer, exactly like those. What it tracks instead is a single permanent
   number: the deepest wave this legion has ever cleared, gauntletBest — a
   Trophy-Case-style high-water mark (reset only by initGame(), never by
   Rebirth) that gives a clean score to chase independent of story stage. A
   modest, capped salvage drop per wave cleared acknowledges the effort
   without turning this into a better campaign farm than the campaign. */
const GAUNTLET_ENTRY_COST = 5; // deliberately equal to ENERGY_COST_PER_BATTLE — one flat fee, however many waves you go on to clear
function gauntletAvailable(){ return clearedStages().indexOf(CAMPAIGN_LENGTH) >= 0; }
function beginGauntlet(){
  if(!gauntletAvailable()) return;
  const filled = state.formation.front.concat(state.formation.back).filter(Boolean).length;
  if(filled===0 || !hasEnergyFor(GAUNTLET_ENTRY_COST)) return;
  spendEnergy(GAUNTLET_ENTRY_COST);
  state.gauntletRun = true;
  state.gauntlet = { wave: 1 };
  state.stageBeforeGauntlet = state.stage;
  state.stage = CAMPAIGN_LENGTH + 1;
  beginBattle();
  logMsg('☠ The Gauntlet opens — no retreat from here. Wave 1.');
}
/* Called from the result screen's "Continue" button after clearing a wave —
   the only way forward once the Gauntlet has started; there is no "return
   to Hub and keep the score" option, by design. */
function continueGauntlet(){
  if(!state.gauntletRun || !state.gauntlet) return;
  state.stage = CAMPAIGN_LENGTH + state.gauntlet.wave;
  beginBattle();
}
function endGauntlet(){
  state.stage = state.stageBeforeGauntlet || state.stage;
  state.gauntletRun = false;
  state.gauntlet = null;
  state.battle = null;
  state.screen = 'hub';
  autosave();
  render();
}
function goGauntlet(){ state.screen='gauntlet'; sfx('click'); render(); }
function renderGauntlet(){
  const filled = state.formation.front.concat(state.formation.back).filter(Boolean).length;
  const afford = hasEnergyFor(GAUNTLET_ENTRY_COST);
  const canStart = filled>0 && afford;
  return `
  <div class="panel">
    <h2 class="section">THE GAUNTLET</h2>
    <p class="dim">Wave after wave, scaled the same way the Deep already scales past Stage ${CAMPAIGN_LENGTH} — no story stage, no rewards pipeline, no retreat once it starts. Win a wave and it throws the next, harder one at you immediately; the run only ends when you lose. The only thing it keeps is a single number: the deepest wave you've ever cleared.</p>
    <p style="margin-top:8px;">Personal best: <b style="color:var(--gold)">${state.gauntletBest?('Wave '+state.gauntletBest):'—'}</b></p>
    <p class="dim">Entry costs ${GAUNTLET_ENTRY_COST} energy, charged once — however many waves you go on to clear.</p>
    <button class="btn primary" style="margin-top:10px;" ${canStart?'':'disabled'} onclick="beginGauntlet()">☠ Enter the Gauntlet</button>
    ${filled===0?'<p class="dim">Assign at least one monster to your formation first.</p>':(!afford?`<p class="dim">Needs ${GAUNTLET_ENTRY_COST} energy — you have ${energy.current}.</p>`:'')}
  </div>
  <div class="panel footer-nav"><button class="btn" onclick="state.screen='hub'; render();">← Back to Hub</button></div>`;
}
function renderCampaignMap(){
  tickEnergy(Date.now());
  const n = CAMPAIGN_LENGTH, spineY = 46, leftX = 40, rightX = 600;
  const stepX = (rightX-leftX) / (n-1);
  const here = !isDeep(state.stage) ? state.stage : null;
  const xFor = s => leftX + (s-1)*stepX;

  let nodes = '';
  for(let s=1; s<=n; s++){
    const x = xFor(s);
    const boss = bossForStage(s);
    const cleared = !!state.cleared[s];
    const r = boss ? 12 : 7;
    const color = boss ? 'var(--gold)' : 'var(--nature)';
    // A larger, invisible hit-circle makes every stage tappable (not just
    // the boss nodes' bigger visible ring) without changing how anything
    // looks.
    nodes += `<circle cx="${x}" cy="${spineY}" r="${r+7}" fill="transparent" style="cursor:pointer;" onclick="selectMapStage(${s})"/>`;
    nodes += `<circle cx="${x}" cy="${spineY}" r="${r}" fill="${color}" fill-opacity="${cleared?0.85:0.1}" stroke="${color}" stroke-width="2" style="pointer-events:none;"/>`;
    if(boss) nodes += `<text x="${x}" y="${spineY+4}" text-anchor="middle" font-size="11" style="pointer-events:none;">☠</text>`;
    if(here===s) nodes += `<circle cx="${x}" cy="${spineY}" r="${r+5}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="2 2" style="pointer-events:none;"/>`;
    nodes += `<text x="${x}" y="${spineY+24}" text-anchor="middle" font-size="11" fill="var(--dim)" style="pointer-events:none;">${s}</text>`;
  }
  const spine = `<line x1="${leftX}" y1="${spineY}" x2="${rightX}" y2="${spineY}" stroke="var(--border)" stroke-width="2"/>`;

  let branches = '';
  CAMPAIGN_DETOURS.forEach(det=>{
    const x = xFor(det.afterStage), by = spineY + 55;
    const claimed = claimedDetour(det.id);
    const avail = detourAvailable(det);
    const color = claimed ? 'var(--gold)' : (avail ? 'var(--volt)' : 'var(--dim)');
    branches += `<line x1="${x}" y1="${spineY+8}" x2="${x}" y2="${by-9}" stroke="${color}" stroke-width="1.5"/>`;
    branches += `<circle cx="${x}" cy="${by}" r="9" fill="${color}" fill-opacity="${claimed?0.85:(avail?0.3:0.08)}" stroke="${color}" stroke-width="2" style="cursor:pointer;" onclick="selectDetour('${det.id}')"/>`;
    branches += `<text x="${x}" y="${by+4}" text-anchor="middle" font-size="10" style="pointer-events:none;">${claimed?'✓':'🧭'}</text>`;
  });

  const svgH = spineY + 55 + 20;
  const svg = `<svg viewBox="0 0 640 ${svgH}" width="100%" height="${svgH}" style="display:block;">${spine}${nodes}${branches}</svg>`;

  const sel = state.detourSelected ? CAMPAIGN_DETOURS.find(d=>d.id===state.detourSelected) : null;
  let detailHtml = '';
  if(sel){
    const claimed = claimedDetour(sel.id);
    const avail = detourAvailable(sel);
    const locked = !claimed && !avail;
    detailHtml = `
    <div class="panel">
      <h2 class="section">🧭 ${escapeHtml(sel.name)}</h2>
      <p class="dim">${escapeHtml(sel.desc)}</p>
      <p class="dim" style="font-size:14px;">Off Stage ${sel.afterStage} — a tougher fight than that wave was. Reward: <b>${claimed?'already claimed':(avail?escapeHtml(sel.rewardDesc):'??? — clear Stage '+sel.afterStage+' first')}</b></p>
      ${avail?`<button class="btn primary" ${hasEnergyFor(ENERGY_COST_PER_BATTLE)?'':'disabled'} onclick="beginDetour('${sel.id}')">🧭 TAKE THE DETOUR</button>`:''}
      ${(avail && !hasEnergyFor(ENERGY_COST_PER_BATTLE))?`<p class="dim">Needs ${ENERGY_COST_PER_BATTLE} energy — you have ${energy.current}.</p>`:''}
      ${claimed?`<p class="dim">✓ Claimed — the map remembers, even after a Rebirth.</p>`:''}
      ${locked?`<p class="dim">Not open yet.</p>`:''}
    </div>`;
  }
  if(!sel && state.mapStageSelected){
    const s = state.mapStageSelected;
    const cleared = !!state.cleared[s];
    const isHere = here===s;
    const filled = state.formation.front.concat(state.formation.back).filter(Boolean).length;
    detailHtml = `
    <div class="panel">
      <h2 class="section">📍 STAGE ${s}${bossForStage(s)?' ☠':''}</h2>
