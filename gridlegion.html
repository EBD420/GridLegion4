/* ============ BATTLE SETUP ============ */
function baseUnitDefaults(){
  return {
    status:null, shield:false, taunt:0,
    dodge:0, burnOnHit:0, stunOnHit:0, regen:0, slowImmune:false,
    firstHitReduction:false, firstHitUsed:false,
    missChance:0, backfireChance:0, burnImmune:false, stunImmune:false,
    critBonus:0, baneElem:null, resilient:false,
    attackElements:[], hybrid:false, traitDodge:0, traitRegen:0, traitSlowImmune:false,
    plating:null, platingPct:0,
    corruption:0, glitchChance:0, defectChance:0,
    elements:[], synergyLabel:null,
  };
}
const STAT_BASE_KEY = { atk:'bAtk', def:'bDef', hp:'bHp', spd:'bSpd' };

/* Snapshot the pre-terrain stats so the layer can be recomputed when the field turns. */
function captureRaw(unit){
  unit.rHp = unit.bHp; unit.rAtk = unit.bAtk; unit.rDef = unit.bDef; unit.rSpd = unit.bSpd;
  unit.rSkillMaxCd = unit.skillMaxCd;
}
/* Wipe the old terrain's effects and lay the new one on top of the raw stats. */
function reapplyTerrain(unit, terrain){
  if(unit.rHp === undefined) captureRaw(unit);
  unit.bHp = unit.rHp; unit.bAtk = unit.rAtk; unit.bDef = unit.rDef; unit.bSpd = unit.rSpd;
  unit.skillMaxCd = unit.rSkillMaxCd;
  unit.missChance = 0; unit.backfireChance = 0;
  if(!(unit.hybrid && unit.attackElements && unit.attackElements.indexOf('fire')>=0)) unit.burnImmune = false;
  applyTerrainToUnit(unit, terrain);
}
function applyTerrainToUnit(unit, terrain){
  if(unit.rHp === undefined) captureRaw(unit);
  const m = terrain.mods;
  if(m.buffElem && unit.elements.includes(m.buffElem)){
    const k = STAT_BASE_KEY[m.buffStat]; unit[k] = Math.round(unit[k]*(1+m.buffPct));
  }
  if(m.debuffElem && unit.elements.includes(m.debuffElem)){
    const k = STAT_BASE_KEY[m.debuffStat]; unit[k] = Math.round(unit[k]*(1-m.debuffPct));
  }
  if(m.missElem && unit.elements.includes(m.missElem)) unit.missChance = m.missChance;
  if(m.backfireElem && unit.elements.includes(m.backfireElem)) unit.backfireChance = m.backfireChance;
  if(m.immuneElem && unit.elements.includes(m.immuneElem) && m.immuneStatus==='burn') unit.burnImmune = true;
  if(m.cdPenalty) unit.skillMaxCd += m.cdPenalty;
}

/* Recomputes the row-synergy layer on top of base stats. Returns {front,back} labels. */
function refreshSynergies(units, initial){
  const labels = { front:null, back:null };
  ['front','back'].forEach(row=>{
    const living = units.filter(u=>u.row===row && !u.fainted);
    const infos = computeRowSynergies(living.map(u=>u.elements)).map(synergyInfo);
    labels[row] = infos.length ? infos.map(synergyLabelText).join(' · ') : null;
    units.filter(u=>u.row===row).forEach(u=>{
      // reset the synergy-derived layer (terrain- and trait-derived flags are re-laid below)
      u.dodge=0; u.burnOnHit=0; u.stunOnHit=0; u.regen=0; u.slowImmune=false; u.firstHitReduction=false;
      let atk=u.bAtk, def=u.bDef, hp=u.bHp, spd=u.bSpd;
      infos.forEach(info=>{
        if(info.statKey==='atk') atk = Math.round(atk*(1+info.bonus));
        if(info.statKey==='def') def = Math.round(def*(1+info.bonus));
        if(info.statKey==='hp')  hp  = Math.round(hp *(1+info.bonus));
        if(info.statKey==='spd') spd = Math.round(spd*(1+info.bonus));
        if(info.flavor){
          const f = info.flavor;
          if(f.type==='dodge') u.dodge = Math.max(u.dodge, f.val);
          if(f.type==='burnOnHit') u.burnOnHit = Math.max(u.burnOnHit, f.val);
          if(f.type==='stunOnHit') u.stunOnHit = Math.max(u.stunOnHit, f.val);
          if(f.type==='regen') u.regen = Math.max(u.regen, f.val);
          if(f.type==='slowImmune') u.slowImmune = true;
          if(f.type==='firstHitReduction') u.firstHitReduction = true;
        }
      });
      // innate hybrid traits survive every recompute
      if(u.traitDodge) u.dodge = Math.max(u.dodge, u.traitDodge);
      if(u.traitRegen) u.regen = Math.max(u.regen, u.traitRegen);
      if(u.traitSlowImmune) u.slowImmune = true;
      u.atk=atk; u.def=def; u.spd=spd; u.maxHp=hp;
      if(initial) u.hp = hp; else u.hp = Math.min(u.hp, u.maxHp);
      u.synergyLabel = labels[row];
    });
  });
  return labels;
}
/* Recompute + log any change. Called after shifts and after any faint. */
function applySynergyRefresh(){
  const b = state.battle; if(!b) return;
  const labels = refreshSynergies(b.playerUnits, false);
  ['front','back'].forEach(row=>{
    const before = b.synLabels[row], after = labels[row];
    if(before !== after){
      if(after) logMsg(`✨ ${row.toUpperCase()} line locks in: ${after}!`);
      else logMsg(`💢 ${row.toUpperCase()} line synergy broken.`);
    }
  });
  b.synLabels = labels;
}

function buildPlayerUnits(terrain){
  const units = [];
  ['front','back'].forEach(row=>{
    state.formation[row].forEach(u=>{
      if(!u) return;
      const m = findMonster(u); if(!m) return;
      const st = computeStats(m);
      const tier = corrTier(st.corruption);
      const unit = Object.assign(baseUnitDefaults(), {
        id:'p_'+m.uid, side:'player', row, monsterUid:m.uid,
        name:st.name, emoji:st.emoji, element:st.element, elements:st.elements.slice(),
        attackElements:st.innate.slice(), hybrid:st.hybrid, skillName:st.skill,
        bHp:st.hp, bAtk:st.atk, bDef:st.def, bSpd:st.spd,
        maxHp:st.hp, hp:st.hp, atk:st.atk, def:st.def, spd:st.spd,
        skillCd:0, skillMaxCd:3, fainted:false,
        corruption: st.corruption, glitchChance: tier.glitch, defectChance: tier.defect,
        trait: st.trait,
      });
      if(hasPerk('might')){ unit.bAtk = Math.round(unit.bAtk*1.06); unit.bDef = Math.round(unit.bDef*1.06); }
      const bless = activeBlessing();
      if(bless==='fire')   unit.bAtk = Math.round(unit.bAtk*1.10);
      if(bless==='earth')  unit.bDef = Math.round(unit.bDef*1.12);
      if(bless==='volt')   unit.bSpd = Math.round(unit.bSpd*1.10);
      if(bless==='nature') unit.traitRegen = Math.max(unit.traitRegen, 0.02);
      if(bless==='wind')   unit.traitDodge = Math.max(unit.traitDodge, 0.08);
      if(bless==='water' && unit.row==='front') unit.shield = true;
      if(hasMod('corrosion')) applyRust(unit, 20);
      if(st.trait){
        if(st.trait.key==='keen') unit.critBonus = 0.08;
        if(st.trait.key==='bane') unit.baneElem = st.trait.elem;
        if(st.trait.key==='resilient') unit.resilient = true;
        if(st.trait.key==='quickstart') unit.skillMaxCd = Math.max(1, unit.skillMaxCd-1);
      }
      if(st.hybrid){
        st.innate.forEach(e=>{
          const t = ELEM_TRAIT[e]; if(!t) return;
          if(t.burnImmune) unit.burnImmune = true;
          if(t.slowImmune) unit.traitSlowImmune = true;
          if(t.stunImmune) unit.stunImmune = true;
          if(t.regen) unit.traitRegen = Math.max(unit.traitRegen, t.regen);
          if(t.dodge) unit.traitDodge = Math.max(unit.traitDodge, t.dodge);
          if(t.bulwark) unit.shield = true;
        });
      }
      applyTerrainToUnit(unit, terrain);
      units.push(unit);
    });
  });
  if(hasMod('vanguard')) units.forEach(u=>{ u.row='front'; });
  refreshSynergies(units, true);
  return units;
}

function pickEnemySpecies(adapted){
  const weights = ENEMY_IDS.map(id=>{
    const e = ENEMY_SPECIES[id].element;
    if(!adapted) return 1;
    if(ELEM_BEATS[e]===adapted) return 5;        // hard-counters the player's favourite
    if(ELEM_BEATS[adapted]===e) return 0.3;      // food for the player's favourite
    return 1;
  });
  const total = weights.reduce((s,w)=>s+w,0);
  let r = Math.random()*total;
  for(let i=0;i<ENEMY_IDS.length;i++){ r -= weights[i]; if(r<=0) return ENEMY_IDS[i]; }
  return ENEMY_IDS[ENEMY_IDS.length-1];
}

function buildEnemyUnits(stage, terrain, adapted, usePlating, platingElem){
  platingElem = platingElem || adapted;
  if(tutorialActive()) return buildTutorialEnemies(terrain);
  const boss = bossForStage(stage);
  if(boss) return buildBossUnits(stage, terrain, adapted, usePlating, boss, platingElem);
  const count = Math.min(3 + Math.floor((stage-1)/2), 6);
  let mult = 1 + (stage-1)*0.14;
  if(isEliteStage(stage)) mult *= 1.25;
  const units = [];
  for(let i=0;i<count;i++){
    const id = pickEnemySpecies(adapted);
    const sd = ENEMY_SPECIES[id];
    const row = i<3 ? 'front' : 'back';
    const hp = Math.round(sd.base.hp*mult);
    const unit = Object.assign(baseUnitDefaults(), {
      id:'e_'+i+'_'+id, side:'enemy', row, speciesKey:id,
      name:sd.name, emoji:sd.emoji, element:sd.element, elements:[sd.element], attackElements:[sd.element], skillName:sd.skill,
      bHp:hp, bAtk:Math.round(sd.base.atk*mult), bDef:Math.round(sd.base.def*mult), bSpd:Math.round(sd.base.spd*mult),
      maxHp:hp, hp:hp,
      atk:Math.round(sd.base.atk*mult), def:Math.round(sd.base.def*mult), spd:Math.round(sd.base.spd*mult),
      skillCd:0, skillMaxCd:3, fainted:false,
    });
    if(usePlating && platingElem){ unit.plating = platingElem; unit.platingPct = platingPct(); }
    applyTerrainToUnit(unit, terrain);
    if(hasMod('blitz')) unit.bSpd = Math.round(unit.bSpd*2);
    unit.atk = unit.bAtk; unit.def = unit.bDef; unit.spd = unit.bSpd;
    unit.maxHp = unit.bHp; unit.hp = unit.bHp;
    units.push(unit);
  }
  return units;
}

/* The commander sits in the back, untouchable, while any pylon still stands.
   Pylons are fragile but the commander reboots one every few turns — so the
   fight is a race to drop them all inside a single window, not a war of attrition. */
function buildBossUnits(stage, terrain, adapted, usePlating, boss, platingElem){
  platingElem = platingElem || adapted;
  const mult = 1 + (stage-1)*0.14;
  const units = [];
  const REF = { hp:32, atk:10, def:8, spd:9 };

  for(let i=0;i<boss.gens;i++){
    const hp = Math.round(REF.hp*mult*0.55);
    const g = Object.assign(baseUnitDefaults(), {
      id:'e_gen'+i, side:'enemy', row:'front', speciesKey:null, isGenerator:true,
      name:boss.genName, emoji:boss.genEmoji, element:boss.genElement, elements:[boss.genElement],
      attackElements:[boss.genElement], skillName:'Overcharge',
      bHp:hp, bAtk:Math.round(REF.atk*mult*0.7), bDef:Math.round(REF.def*mult*1.1), bSpd:Math.round(REF.spd*mult*0.9),
      maxHp:hp, hp:hp, atk:Math.round(REF.atk*mult*0.7), def:Math.round(REF.def*mult*1.1), spd:Math.round(REF.spd*mult*0.9),
      skillCd:0, skillMaxCd:3, fainted:false,
    });
    if(usePlating && platingElem){ g.plating = platingElem; g.platingPct = platingPct(); }
    applyTerrainToUnit(g, terrain);
    if(hasMod('blitz')) g.bSpd = Math.round(g.bSpd*2);
    g.atk=g.bAtk; g.def=g.bDef; g.spd=g.bSpd; g.maxHp=g.bHp; g.hp=g.bHp;
    units.push(g);
  }

  const hp = Math.round(REF.hp*mult*boss.mult.hp);
  const b = Object.assign(baseUnitDefaults(), {
    id:'e_boss', side:'enemy', row:'back', speciesKey:null, isBoss:true, shielded:boss.gens>0,
    name:boss.name, emoji:boss.emoji, element:boss.element, elements:[boss.element],
    attackElements:[boss.element], skillName:boss.skill,
    bHp:hp, bAtk:Math.round(REF.atk*mult*boss.mult.atk), bDef:Math.round(REF.def*mult*boss.mult.def), bSpd:Math.round(REF.spd*mult*boss.mult.spd),
    maxHp:hp, hp:hp,
    atk:Math.round(REF.atk*mult*boss.mult.atk), def:Math.round(REF.def*mult*boss.mult.def), spd:Math.round(REF.spd*mult*boss.mult.spd),
    skillCd:0, skillMaxCd:2, fainted:false, repairCd:BOSS_REPAIR_EVERY,
  });
  if(usePlating && platingElem){ b.plating = platingElem; b.platingPct = platingPct(); }
  applyTerrainToUnit(b, terrain);
  if(hasMod('blitz')) b.bSpd = Math.round(b.bSpd*2);
  b.atk=b.bAtk; b.def=b.bDef; b.spd=b.bSpd; b.maxHp=b.bHp; b.hp=b.bHp;
  units.push(b);
  return units;
}
/* Called whenever an enemy falls: the shield holds while any pylon lives, and
   once they are all down together it collapses for good. */
function updateBossShield(){
  const b = state.battle; if(!b) return;
  const boss = b.enemyUnits.find(u=>u.isBoss);
  if(!boss || boss.fainted || !boss.shielded) return;
  const gens = b.enemyUnits.filter(u=>u.isGenerator);
  if(gens.length && gens.every(g=>g.fainted)){
    boss.shielded = false;
    boss.shieldBroken = true;
    logMsg(`💥 The last ${gens[0].name} bursts — ${boss.emoji} ${boss.name}'s shield collapses! It is exposed.`);
  }
}

function activeMods(){ return (state.trial && state.trial.mods) ? state.trial.mods : []; }
function hasMod(id){ return activeMods().indexOf(id)>=0; }

/* Rebuild an opponent's published legion as the enemy side. Same engine, same
   rules — their monsters simply run on the enemy AI. */
function buildDuelUnits(snapshot, terrain){
  const units = [];
  (snapshot.units||[]).slice(0,6).forEach((u,i)=>{
    const m = reviveMonster({ speciesId:u.speciesId, level:u.level, tier:u.tier, parts:u.parts, trait:u.trait, uid:'d'+i });
    if(!m) return;
    const st = computeStats(m);
    const tier = corrTier(st.corruption);
    const unit = Object.assign(baseUnitDefaults(), {
      id:'e_duel'+i, side:'enemy', row:(u.row==='back'?'back':'front'), speciesKey:null,
      name:st.name, emoji:st.emoji, element:st.element, elements:st.elements.slice(),
      attackElements:st.innate.slice(), hybrid:st.hybrid, skillName:st.skill,
      bHp:st.hp, bAtk:st.atk, bDef:st.def, bSpd:st.spd,
      maxHp:st.hp, hp:st.hp, atk:st.atk, def:st.def, spd:st.spd,
      skillCd:0, skillMaxCd:3, fainted:false,
      corruption:st.corruption, glitchChance:0, defectChance:0, trait:st.trait,
    });
    if(st.trait){
      if(st.trait.key==='keen') unit.critBonus = 0.08;
      if(st.trait.key==='bane') unit.baneElem = st.trait.elem;
      if(st.trait.key==='quickstart') unit.skillMaxCd = Math.max(1, unit.skillMaxCd-1);
    }
    applyTerrainToUnit(unit, terrain);
    unit.atk=unit.bAtk; unit.def=unit.bDef; unit.spd=unit.bSpd; unit.maxHp=unit.bHp; unit.hp=unit.bHp;
    units.push(unit);
  });
  return units;
}

/* Two soft targets: enough to demonstrate every verb, not enough to lose to. */
function buildTutorialEnemies(terrain){
  const units = [];
  ['thornbot','scraphound'].forEach((id,i)=>{
    const sd = ENEMY_SPECIES[id];
    const hp = Math.round(sd.base.hp*0.75);
    const u = Object.assign(baseUnitDefaults(), {

      name:sd.name, emoji:sd.emoji, element:sd.element, elements:[sd.element],
      attackElements:[sd.element], skillName:sd.skill,
      bHp:hp, bAtk:Math.round(sd.base.atk*0.55), bDef:Math.round(sd.base.def*0.7), bSpd:Math.round(sd.base.spd*0.6),
      maxHp:hp, hp:hp, atk:Math.round(sd.base.atk*0.55), def:Math.round(sd.base.def*0.7), spd:Math.round(sd.base.spd*0.6),
      skillCd:2, skillMaxCd:4, fainted:false,
    });

function beginBattle(){
  const terrain = terrainForStage(state.stage);
  const adapted = currentAdaptation();
  // Hardened Steel plates against your strongest element even before the
  // Rustbound have any intel on you — otherwise the handicap does nothing early.
  const platingElem = adapted || (hasMod('hardened') ? deployedDominantElement() : null);
  const usePlating = (platingActive() || hasMod('hardened')) && !!platingElem;
  const playerUnits = buildPlayerUnits(terrain);
  const duel = state.duel;
  state.battle = {
    playerUnits,
    enemyUnits: duel ? buildDuelUnits(duel.formation, terrain)
                     : buildEnemyUnits(state.stage, terrain, adapted, usePlating, platingElem),
    terrain, adapted, plating: usePlating ? platingElem : null,
    queue: [], qIndex: 0, gauge: 0,
    log: [], pendingAction: null, result: null,
    elemDamage: {},
    totalDamage: 0,
    terrainShifts: 0,
    awaitingInput: false,
    synLabels: { front:null, back:null },
  };
  state.battle.synLabels = {
    front: (playerUnits.find(u=>u.row==='front')||{}).synergyLabel || null,
    back:  (playerUnits.find(u=>u.row==='back') ||{}).synergyLabel || null,
  };
  const bossDef = bossForStage(state.stage);
  if(tutorialActive()){ state.battle.gauge = 30; logMsg('Training deployment: a scouting pair, lightly armed.'); }
  logMsg(bossDef ? `${bossDef.intro} (${terrain.name})`
                 : `${isEliteStage(state.stage)?'An ELITE wave':'Wave '+state.stage} approaches under ${terrain.name}!`);
  if(bossDef) logMsg(`🛡 ${bossDef.name} is shielded while any ${bossDef.genName} stands.`);
  if(!adapted && usePlating && platingElem){
    logMsg(`▣ Hardened Steel: every Rustbound unit is plated against ${platingElem} (−${Math.round(platingPct()*100)}%).`);
  }
  if(adapted){
    const dom = deployedDominantElement();
    if(usePlating) logMsg(`📡 Rustbound units deploy ${platingElem}-counter plating (−${Math.round(platingPct()*100)}% ${platingElem} damage).`);
    if(dom && dom!==adapted){
      state.battle.gauge = 30;
      logMsg(`🎭 AMBUSH! They braced for a ${adapted} assault — your ${dom} legion catches them cold. Gauge +30%!`);
    } else {
      logMsg(`📡 The Rustbound anticipated your ${adapted} legion.`);
    }
  }
  codexRecordBattle();
  state.screen = 'battle';
  audioResume();
  if(audio.music) musicStart();
  startRound();
}

function logMsg(msg){
  state.battle.log.unshift(msg);
  if(state.battle.log.length>40) state.battle.log.pop();
}
function aliveUnits(){ return state.battle.playerUnits.concat(state.battle.enemyUnits).filter(u=>!u.fainted); }
function effectiveSpd(u){ return (u.status && u.status.type==='slow') ? Math.round(u.spd*0.7) : u.spd; }

function startRound(){
  const b = state.battle;
  if(!b || b.result) return;
  b.rounds = (b.rounds||0) + 1;
  b.focusId = null;
  if(tacticalOn()){ beginPlanning(); }
  b.queue = aliveUnits().sort((a,c)=> effectiveSpd(c) - effectiveSpd(a) + (Math.random()-0.5));
  b.qIndex = 0;
  if(b.planning){ render(); return; }   // wait for the player to write orders
  nextTurn();
}
function battleActive(b){ return state.battle && state.battle===b && !b.result; }
function checkBattleEnd(){
  const b = state.battle;
  if(!b || b.result) return true;
  if(b.enemyUnits.every(u=>u.fainted)){ endBattle('win'); return true; }
  if(b.playerUnits.every(u=>u.fainted)){ endBattle('lose'); return true; }
  return false;
}

function setStatus(unit, type, turns){
  if(type==='burn' && unit.burnImmune){ logMsg(`${unit.emoji} ${unit.name} is immune to burn!`); return; }
  if(type==='slow' && unit.slowImmune){ logMsg(`${unit.emoji} ${unit.name} resists the slow!`); return; }
  if(type==='stun' && unit.stunImmune){ logMsg(`${unit.emoji} ${unit.name} shrugs off the shock!`); return; }
  if(unit.resilient && turns>1) turns = Math.max(1, Math.round(turns*0.75));
  unit.status = { type, turnsLeft: turns };
  const icon = type==='burn'?'🔥':type==='slow'?'🐌':'💫';
  logMsg(`${icon} ${unit.emoji} ${unit.name} is afflicted with ${type}!`);
}

function tickStatusStart(unit){
  let skip = false;
  if(unit.regen && !unit.fainted){
    const heal = Math.max(1, Math.round(unit.maxHp*unit.regen));
    unit.hp = Math.min(unit.maxHp, unit.hp+heal);
    fx(unit.id, '+' + heal, 'heal');
    logMsg(`🌿 ${unit.emoji} ${unit.name} regenerates ${heal} HP.`);
  }
  if(unit.status){
    if(unit.status.type==='burn'){
      const dmg = Math.max(1, Math.round(unit.maxHp*0.05));
      unit.hp = Math.max(0, unit.hp-dmg);
      logMsg(`🔥 ${unit.emoji} ${unit.name} takes ${dmg} burn damage.`);
      if(unit.hp<=0){ unit.fainted=true; logMsg(`${unit.emoji} ${unit.name} succumbs to its burns!`); if(unit.side==='enemy') updateBossShield(); }
    } else if(unit.status.type==='stun'){
      logMsg(`💫 ${unit.emoji} ${unit.name} is stunned and can't act!`);
      skip = true;
    }
    unit.status.turnsLeft--;
    if(unit.status.turnsLeft<=0) unit.status=null;
  }
  if(!skip && !unit.fainted && unit.glitchChance && Math.random()<unit.glitchChance){
    skip = true;
    const allies = state.battle.playerUnits.filter(u=>!u.fainted && u.id!==unit.id);
    if(unit.defectChance && allies.length>0 && Math.random()<unit.defectChance){
      const victim = allies[Math.floor(Math.random()*allies.length)];
      logMsg(`☢️ RUST DEFECTION! ${unit.emoji} ${unit.name}'s grafts seize control!`);
      sfx('glitch'); shake(true);
      applyDamage(unit, victim, false);
    } else {
      logMsg(`⚙️ RUST GLITCH! ${unit.emoji} ${unit.name} locks up and loses its turn.`);
      sfx('glitch'); fx(unit.id, 'SEIZED', 'miss');
    }
  }
  if(unit.taunt>0) unit.taunt--;
  return skip;
}

function nextTurn(){
  const b = state.battle;
  if(!b || b.result) return;
  b.awaitingInput = false;
  applySynergyRefresh();
  if(checkBattleEnd()) return;
  if(b.qIndex >= b.queue.length){ startRound(); return; }
  const unit = b.queue[b.qIndex];
  if(unit.fainted){ b.qIndex++; nextTurn(); return; }
  const stunned = tickStatusStart(unit);
  render();
  if(checkBattleEnd()) return;
  if(unit.fainted){ b.qIndex++; setTimeout(nextTurn, 300); return; }
  if(stunned){ setTimeout(()=>{ if(!battleActive(b)) return; b.qIndex++; render(); nextTurn(); }, 600); return; }
  if(unit.side==='enemy'){
    setTimeout(()=>{
      if(!battleActive(b)) return;
      enemyAct(unit); b.qIndex++; render();
      if(!checkBattleEnd()) setTimeout(nextTurn, 550);
    }, 500);
    return;
  }
  // player's turn
  if(tacticalOn() && b.orders && b.orders[unit.id]){
    setTimeout(()=>{
      if(!battleActive(b)) return;
      runOrder(unit);
      b.qIndex++;
      render();
      if(!checkBattleEnd()) setTimeout(nextTurn, 420);
    }, 380);
    return;
  }
  b.awaitingInput = true;
  render();
}

function getValidTargets(unit){
  const b = state.battle;
  let opponents = (unit.side==='player' ? b.enemyUnits : b.playerUnits).filter(u=>!u.fainted);
  const reachable = opponents.filter(u=>!u.shielded);
  if(reachable.length) opponents = reachable;   // never leave a side with nothing to hit
  const taunters = opponents.filter(u=>u.taunt>0);
  if(unit.row==='front' && taunters.length>0) return taunters;
  const front = opponents.filter(u=>u.row==='front');
  const back = opponents.filter(u=>u.row==='back');
  if(unit.row==='front') return front.length>0 ? front : back;
  return front.concat(back);
}

function computeDamage(attacker, defender, isSkill){
  const baseAtk = isSkill ? attacker.atk*1.6 : attacker.atk;
  let dmg = Math.max(1, Math.round(baseAtk - defender.def*0.5));
  const m = multiplierVs(attacker, defender);
  const strikeElem = m.elem;
  dmg = Math.round(dmg * m.mult);
  let plated = false;
  if(defender.plating && strikeElem===defender.plating){
    dmg = Math.max(1, Math.round(dmg*(1-defender.platingPct)));
    plated = true;
  }
  if(attacker.baneElem){
    const dl2 = (defender.elements && defender.elements.length) ? defender.elements : [defender.element];
    if(dl2.indexOf(attacker.baneElem)>=0) dmg = Math.round(dmg*1.15);
  }
  if(hasMod('glass')) dmg = Math.round(dmg*1.5);
  let crit = false;
  if(Math.random() < 0.12 + (attacker.critBonus||0)){ dmg = Math.round(dmg*1.5); crit = true; }
  return { dmg, crit, plated, strikeElem };
}

function spendGauge(cost){
  const b = state.battle;
  b.gauge = Math.max(0, b.gauge - cost);
}
/* Shifts a unit's rust up or down and re-derives its glitch behaviour. */
function applyRust(unit, delta){
  unit.corruption = Math.max(0, unit.corruption + delta);
  const t = corrTier(unit.corruption);
  unit.glitchChance = t.glitch;
  unit.defectChance = t.defect;
}

/* Reactive terrain: enough of one element and the battlefield takes on its character. */
function checkTerrainShift(){
  const b = state.battle;
  if(!b || b.result) return;
  b.terrainShifts = b.terrainShifts || 0;
  if(b.terrainShifts >= MAX_TERRAIN_SHIFTS) return;
  let best = null, bestDmg = 0;
  Object.keys(b.elemDamage).forEach(e=>{
    if(b.elemDamage[e] > bestDmg){ bestDmg = b.elemDamage[e]; best = e; }
  });
  if(!best || bestDmg < TERRAIN_SHIFT_AT * (b.terrainShifts + 1)) return;
  const key = ELEM_TERRAIN[best];
  if(!key || !TERRAINS[key] || b.terrain === TERRAINS[key]) return;
  b.terrain = TERRAINS[key];
  b.terrainShifts++;
  b.playerUnits.concat(b.enemyUnits).forEach(u=>reapplyTerrain(u, b.terrain));
  refreshSynergies(b.playerUnits, false);
  b.enemyUnits.forEach(u=>{ u.atk=u.bAtk; u.def=u.bDef; u.spd=u.bSpd; u.maxHp=u.bHp; u.hp=Math.min(u.hp,u.maxHp); });
  sfx('gauge'); shake(false);
  logMsg(`🌎 The field turns — sustained ${best.toUpperCase()} has made this ${b.terrain.name}. ${b.terrain.desc}`);
}

function chargeGauge(amount){
  const b = state.battle;
  if(activeBlessing()==='volt') amount *= 1.25;
  if(hasPerk('gauge')) amount *= 1.15;
  const totalHp = b.playerUnits.reduce((s,u)=>s+u.maxHp,0);
  const curHp = b.playerUnits.reduce((s,u)=>s+(u.fainted?0:u.hp),0);
  const desperate = totalHp>0 && (curHp/totalHp) < 0.4;
  b.gauge = Math.min(100, b.gauge + amount*(desperate?1.5:1));
}

function applyDamage(attacker, defender, isSkill){
  if(attacker.missChance && Math.random()<attacker.missChance){
    logMsg(`🌫️ ${attacker.emoji} ${attacker.name}'s attack is swallowed by the storm and misses!`);
    sfx('miss'); fx(defender.id, 'MISS', 'miss');
    return;
  }
  if(defender.dodge && Math.random()<defender.dodge){
    logMsg(`💨 ${defender.emoji} ${defender.name} dodges the attack!`);
    sfx('miss'); fx(defender.id, 'DODGE', 'miss');
    return;
  }
  const {dmg, crit, plated, strikeElem} = computeDamage(attacker, defender, isSkill);
  let finalDmg = dmg, note = '';
  if(plated) note += ' (counter-plating holds)';
  if(defender.shield){ defender.shield=false; finalDmg=0; note=' — shield absorbs it!'; }
  else if(defender.firstHitReduction && !defender.firstHitUsed){ defender.firstHitUsed=true; finalDmg=Math.round(finalDmg*0.5); note += ' (tide ward halves the blow)'; }
  defender.hp = Math.max(0, defender.hp-finalDmg);
  if(defender.hp<=0) defender.fainted = true;
  if(finalDmg > 0){
    fx(defender.id, '-' + finalDmg + (crit ? '!' : ''), crit ? 'crit' : (defender.side==='player' ? 'hurt' : 'dmg'));
    sfx(crit ? 'crit' : (isSkill ? 'skill' : 'hit'));
    if(crit || (defender.side==='player' && finalDmg > defender.maxHp*0.25)) shake(crit);
  } else {
    fx(defender.id, 'BLOCK', 'miss'); sfx('shield');
  }
  if(defender.fainted) sfx('faint');
  const verb = isSkill ? attacker.skillName : 'attacks';
  const dual = (attacker.attackElements && attacker.attackElements.length>1) ? ` [${strikeElem}]` : '';
  logMsg(`${attacker.emoji} ${attacker.name} ${isSkill?'uses '+verb+' on':verb} ${defender.emoji} ${defender.name}${dual} for ${finalDmg}${crit?' (CRIT!)':''}${note}${defender.fainted?' — defeated!':''}`);

  if(attacker.side==='player' && defender.side==='enemy' && finalDmg>0){
    const b = state.battle;
    b.elemDamage[strikeElem] = (b.elemDamage[strikeElem]||0) + finalDmg;
    b.totalDamage = (b.totalDamage||0) + finalDmg;
    checkTerrainShift();
  }
  if(attacker.side==='player' && finalDmg>0) chargeGauge(finalDmg/3);
  if(defender.side==='player' && finalDmg>0) chargeGauge(finalDmg/5);

  if(defender.fainted && defender.side==='enemy') updateBossShield();
  if(!defender.fainted && finalDmg>0){
    if(attacker.burnOnHit && Math.random()<attacker.burnOnHit) setStatus(defender,'burn',3);
    if(attacker.stunOnHit && Math.random()<attacker.stunOnHit) setStatus(defender,'stun',1);
    if(isSkill){
      if(strikeElem==='fire' && Math.random()<0.4) setStatus(defender,'burn',3);
      else if(strikeElem==='water' && Math.random()<0.4) setStatus(defender,'slow',2);
      else if(strikeElem==='volt' && Math.random()<0.45) setStatus(defender,'stun',1);
    }
  }
  if(isSkill){
    if(strikeElem==='earth'){ attacker.taunt=2; logMsg(`🪨 ${attacker.emoji} ${attacker.name} braces and draws the enemy's aim!`); }
    else if(strikeElem==='nature'){ attacker.shield=true; logMsg(`🌿 ${attacker.emoji} ${attacker.name} wraps itself in thorns!`); }
    else if(strikeElem==='wind' && Math.random()<0.4){ attacker.shield=true; logMsg(`🌪️ ${attacker.emoji} ${attacker.name} whips up an evasive gust!`); }
    if(attacker.backfireChance && Math.random()<attacker.backfireChance){
      const allies = (attacker.side==='player'? state.battle.playerUnits : state.battle.enemyUnits).filter(u=>!u.fainted && u.id!==attacker.id);
      if(allies.length>0){
        const ally = allies[Math.floor(Math.random()*allies.length)];
        const backDmg = Math.max(1, Math.round(dmg*0.3));
        ally.hp = Math.max(0, ally.hp-backDmg);
        if(ally.hp<=0) ally.fainted = true;
        logMsg(`⚡ Short circuit! ${ally.emoji} ${ally.name} also takes ${backDmg} damage.`);
      }
    }
  }
}

/* ================= RUSTBOUND TACTICS =================
   The machines get the player's own verbs. Intelligence is tiered by stage so
   the opening hours keep the balance they were tuned at, and the Deep fights back.
   ===================================================== */
const AI_BASIC = 0, AI_TACTICAL = 1, AI_COORDINATED = 2;
function aiTier(){
  if(state.duel) return AI_COORDINATED;            // a real player's formation deserves a real fight
  const st = state.stage;
  if(bossForStage(st) || isDeep(st)) return AI_COORDINATED;
  if(st >= 4) return AI_TACTICAL;
  return AI_BASIC;
}
/* Pure: no RNG, no mutation. Used for deciding, never for resolving. */
function estimateDamage(attacker, defender, isSkill){
  const baseAtk = isSkill ? attacker.atk*1.6 : attacker.atk;
  let dmg = Math.max(1, Math.round(baseAtk - defender.def*0.5));
  const m = multiplierVs(attacker, defender);
  dmg = Math.round(dmg * m.mult);
  if(defender.plating && m.elem===defender.plating) dmg = Math.max(1, Math.round(dmg*(1-defender.platingPct)));
  if(attacker.baneElem){
    const dl = (defender.elements&&defender.elements.length)?defender.elements:[defender.element];
    if(dl.indexOf(attacker.baneElem)>=0) dmg = Math.round(dmg*1.15);
  }
  return dmg;
}
function scoreTarget(attacker, target, tier){
  if(target.shielded) return -Infinity;              // untouchable while its pylons stand
  const dmg = estimateDamage(attacker, target, false);
  let s = dmg;
  if(dmg >= target.hp) s += 500;                     // secure the kill
  if(tier >= AI_TACTICAL){
    s += target.atk * 2;                             // silence the dangerous one
    if(target.synergyLabel) s += 30;                 // breaking a line is worth more than raw damage
    s += (1 - target.hp/Math.max(1,target.maxHp)) * 40;
    if(target.shield) s -= 25;                       // a blow into a shield is wasted
    if(target.dodge) s -= target.dodge * 60;
  }
  if(tier >= AI_COORDINATED && state.battle && state.battle.focusId===target.id) s += 60;  // pile on
  return s;
}
function decideSkill(unit, target, tier){
  if(unit.skillCd > 0) return false;
  if(tier === AI_BASIC) return Math.random() < 0.5;
  const basic = estimateDamage(unit, target, false);
  const skill = estimateDamage(unit, target, true);
  if(basic >= target.hp) return false;               // a basic finishes it — hold the skill
  if(skill >= target.hp) return true;                // the skill closes it — spend now
  if(target.shield) return false;                    // it would be absorbed
  return Math.random() < 0.75;
}
/* A wounded machine falls back behind its own line — once, and never leaving the front empty. */
function enemyTryShift(unit){
  const b = state.battle;
  if(!b || unit.isBoss || unit.isGenerator) return false;
  if(unit.row !== 'front' || unit.shiftedOnce) return false;
  if(unit.hp / Math.max(1,unit.maxHp) > 0.3) return false;
  const back = b.enemyUnits.filter(u=>u.row==='back' && !u.fainted);
  const frontOthers = b.enemyUnits.filter(u=>u.row==='front' && !u.fainted && u.id!==unit.id);
  if(frontOthers.length === 0) return false;          // never abandon the line

  if(back.length >= 3){
    // Back row full: trade with its healthiest reserve, the way the player must.
    const relief = back.filter(u=>!u.isBoss && !u.isGenerator)
                       .sort((a,c)=>(c.hp/Math.max(1,c.maxHp)) - (a.hp/Math.max(1,a.maxHp)))[0];
    if(!relief) return false;
    if(relief.hp / Math.max(1,relief.maxHp) < 0.5) return false;   // no point swapping in another cripple
    unit.shiftedOnce = true;
    relief.row = 'front';
    unit.row = 'back';
    sfx('shift');
    logMsg(`🔀 ${unit.emoji} ${unit.name} falls back; ${relief.emoji} ${relief.name} steps up to hold the line.`);
    return true;
  }

  unit.shiftedOnce = true;
  unit.row = 'back';
  sfx('shift');
  logMsg(`🔀 ${unit.emoji} ${unit.name} pulls back behind the line.`);
  return true;
}

function enemyAct(unit){
  if(unit.isBoss && unit.shielded){
    unit.repairCd--;
    if(unit.repairCd<=0){
      unit.repairCd = BOSS_REPAIR_EVERY;
      const downed = state.battle.enemyUnits.filter(u=>u.isGenerator && u.fainted);
      if(downed.length){
        const g = downed[Math.floor(Math.random()*downed.length)];
        g.fainted = false;
        g.hp = Math.max(1, Math.round(g.maxHp*0.5));
        g.status = null;
        logMsg(`🔧 ${unit.emoji} ${unit.name} reboots a ${g.name} at half power!`);
        render();
        return;
      }
    }
  }
  const tier = aiTier();
  if(tier >= AI_COORDINATED && enemyTryShift(unit)){ render(); return; }

  if(unit.skillCd>0) unit.skillCd--;
  const targets = getValidTargets(unit);
  if(targets.length===0) return;

  let target = targets[0], best = -Infinity;
  targets.forEach(t=>{
    const sc = scoreTarget(unit, t, tier);
    if(sc > best){ best = sc; target = t; }
  });
  if(tier >= AI_COORDINATED && state.battle) state.battle.focusId = target.id;

  const useSkill = decideSkill(unit, target, tier);
  if(useSkill) unit.skillCd = unit.skillMaxCd;
  applyDamage(unit, target, useSkill);
}

/* ================= TACTICAL MODE =================
   Optional. Instead of acting when each unit's turn arrives, you write orders for
   the whole legion at the start of the round and watch it play out. Orders survive
   their target dying — the unit retargets rather than wasting its turn.
   ================================================= */
function tacticalOn(){ return state.tactical === true && !tutorialActive(); }
function toggleTactical(){
  state.tactical = !state.tactical;
  sfx('click'); autosave(); render();
}
function planningOpen(){
  const b = state.battle;
  return !!(b && !b.result && tacticalOn() && b.planning);
}
function livingPlayerUnits(){
  const b = state.battle;
  return b ? b.playerUnits.filter(u=>!u.fainted) : [];
}
function beginPlanning(){
  const b = state.battle;
  if(!b || b.result || !tacticalOn()) return;
  b.planning = true;
  b.orders = {};
  b.planUnit = null;
  b.awaitingInput = false;
}
function planSelectUnit(id){
  const b = state.battle; if(!b || !b.planning) return;
  b.planUnit = (b.planUnit===id) ? null : id;
  b.planAction = null;
  sfx('click'); render();
}
function planChooseAction(kind){
  const b = state.battle; if(!b || !b.planning || !b.planUnit) return;
  const unit = b.playerUnits.find(u=>u.id===b.planUnit);
  if(!unit) return;
  if(kind==='shift'){
    b.orders[b.planUnit] = { kind:'shift' };
    b.planUnit = null; b.planAction = null;
    sfx('click'); render(); return;
  }
  b.planAction = kind;
  sfx('click'); render();
}
function planChooseTarget(targetId){
  const b = state.battle; if(!b || !b.planning || !b.planUnit || !b.planAction) return;
  b.orders[b.planUnit] = { kind:b.planAction, targetId };
  b.planUnit = null; b.planAction = null;
  sfx('click'); render();
}
function planClear(id){
  const b = state.battle; if(!b || !b.planning) return;
  delete b.orders[id];
  sfx('click'); render();
}
function planReady(){
  const b = state.battle; if(!b) return false;
  return livingPlayerUnits().every(u=>!!b.orders[u.id]);
}
function executePlan(){
  const b = state.battle;
  if(!b || !b.planning || !planReady()) return;
  b.planning = false;
  b.planUnit = null; b.planAction = null;
  sfx('gauge');
  render();
  nextTurn();
}
/* Carry out a standing order when the unit's turn comes round. */
function runOrder(unit){
  const b = state.battle;
  const order = b.orders ? b.orders[unit.id] : null;
  if(!order) return false;
  delete b.orders[unit.id];

  if(order.kind==='shift'){ doShiftAuto(unit); return true; }

  let target = b.enemyUnits.concat(b.playerUnits).find(u=>u.id===order.targetId);
  if(!target || target.fainted || target.shielded){
    const fallback = getValidTargets(unit);
    if(!fallback.length) return false;
    target = fallback.sort((a,c)=>a.hp-c.hp)[0];
    logMsg(`↷ ${unit.emoji} ${unit.name}'s mark is gone — it switches to ${target.emoji} ${target.name}.`);
  }
  const isSkill = order.kind==='skill' && unit.skillCd<=0;
  if(isSkill) unit.skillCd = unit.skillMaxCd;
  else if(unit.skillCd>0) unit.skillCd--;
  applyDamage(unit, target, isSkill);
  return true;
}
function doShiftAuto(unit){
  const b = state.battle;
  const dest = shiftDestination(unit);
  const occupants = b.playerUnits.filter(u=>u.row===dest && !u.fainted);
  let ally = null;
  if(occupants.length >= 3){
    ally = occupants.slice().sort((a,c)=>(c.hp/Math.max(1,c.maxHp))-(a.hp/Math.max(1,a.maxHp)))[0];
  }
  if(ally) ally.row = unit.row;
  unit.row = dest;
  sfx('shift');
  logMsg(`🔀 ${unit.emoji} ${unit.name} shifts to the ${dest.toUpperCase()} line${ally?`, trading with ${ally.emoji} ${ally.name}`:''}.`);
  applySynergyRefresh();
}

/* ============ PLAYER ACTIONS ============ */
function playerChooseAction(kind){
  const b = state.battle;
  if(!battleActive(b) || !b.awaitingInput) return;
  if(kind==='gauge_overdrive'){ useGaugeOverdrive(); return; }
  if(kind==='gauge_rally'){ useGaugeRally(); return; }
  if(kind==='shift'){ playerShift(); return; }
  b.pendingAction = kind;
  render();
}

function shiftDestination(unit){ return unit.row==='front' ? 'back' : 'front'; }
function playerShift(){
  const b = state.battle;
  const unit = b.queue[b.qIndex];
  if(!unit) return;
  const dest = shiftDestination(unit);
  const occupants = b.playerUnits.filter(u=>u.row===dest && !u.fainted);
  if(occupants.length < 3){ doShift(unit, null); return; }
  b.pendingAction = 'shift';
  render();
}
function doShift(unit, ally){
  const b = state.battle;
  b.awaitingInput = false;
  const dest = shiftDestination(unit);
  if(ally) ally.row = unit.row;
  unit.row = dest;
  sfx('shift');
  logMsg(`🔀 ${unit.emoji} ${unit.name} shifts to the ${dest.toUpperCase()} line${ally?`, trading places with ${ally.emoji} ${ally.name}`:''}.`);
  applySynergyRefresh();
  tutorialSaw('shift');
  b.pendingAction = null;
  b.qIndex++;
  render();
  if(checkBattleEnd()) return;
  setTimeout(nextTurn, 500);
}

function useGaugeOverdrive(){
  const b = state.battle;
  b.awaitingInput = false;
  tutorialSaw('gauge');
  spendGauge(GAUGE_COST.overdrive);
  sfx('gauge'); shake(true);
  logMsg('⚡⚡ LEGION OVERDRIVE! The whole legion strikes as one!');
  b.playerUnits.filter(u=>!u.fainted).forEach(u=>{
    const targets = b.enemyUnits.filter(t=>!t.fainted);
    if(targets.length===0) return;
    const target = targets[Math.floor(Math.random()*targets.length)];
    applyDamage(u, target, false);
  });
  b.qIndex++;
  render();
  if(checkBattleEnd()) return;
  setTimeout(nextTurn, 700);
}
function useGaugeRally(){
  const b = state.battle;
  b.awaitingInput = false;
  tutorialSaw('gauge');
  spendGauge(GAUGE_COST.rally);
  sfx('shield');
  logMsg('🛡✨ RALLY! The legion braces as one — shields up, afflictions burned off.');
  b.playerUnits.filter(u=>!u.fainted).forEach(u=>{
    u.shield=true; u.status=null;
    if(u.corruption>0) applyRust(u, -8);
  });
  b.qIndex++;
  render();
  setTimeout(nextTurn, 500);
}

function playerTarget(targetId){
  const b = state.battle;
  if(!battleActive(b) || !b.awaitingInput) return;
  const unit = b.queue[b.qIndex];
  const target = b.enemyUnits.concat(b.playerUnits).find(u=>u.id===targetId);
  if(!unit || !target) return;
  b.awaitingInput = false;

  if(b.pendingAction==='shift'){ doShift(unit, target); return; }

  if(b.pendingAction==='gauge_purge'){
    tutorialSaw('gauge');
    spendGauge(GAUGE_COST.purge);
    const hadStatus = !!target.status;
    target.status = null;
    const rustBefore = target.corruption;
    if(rustBefore>0) applyRust(target, -12);
    logMsg(`🔧 PURGE! ${target.emoji} ${target.name} is stripped down and reset${hadStatus?' — afflictions cleared':''}${rustBefore>0?` — rust ${rustBefore} → ${target.corruption}`:''}.`);
    b.pendingAction = null; b.qIndex++;
    render();
    if(checkBattleEnd()) return;
    setTimeout(nextTurn, 450);
    return;
  }

  if(b.pendingAction==='gauge_alpha'){
    tutorialSaw('gauge');
    spendGauge(GAUGE_COST.alpha);
    sfx('gauge'); shake(true);
    logMsg(`✨💥 ${unit.emoji} ${unit.name} unleashes an ALPHA STRIKE!`);
    const raw = Math.max(1, Math.round(unit.atk*2.5 - target.def*0.5));
    const am = multiplierVs(unit, target);
    let finalBig = Math.round(raw * am.mult);
    if(target.plating && am.elem===target.plating) finalBig = Math.max(1, Math.round(finalBig*(1-target.platingPct)));
    target.hp = Math.max(0, target.hp-finalBig);
    if(target.hp<=0) target.fainted = true;
    b.elemDamage[am.elem] = (b.elemDamage[am.elem]||0) + finalBig;
    logMsg(`${target.emoji} ${target.name} takes ${finalBig} damage!${target.fainted?' — defeated!':''}`);
    b.pendingAction = null; b.qIndex++;
    render();
    if(checkBattleEnd()) return;
    setTimeout(nextTurn, 500);
    return;
  }

  const isSkill = b.pendingAction==='skill';
  if(isSkill) unit.skillCd = unit.skillMaxCd;
  else if(unit.skillCd>0) unit.skillCd--;
  applyDamage(unit, target, isSkill);
  tutorialSaw(isSkill ? 'skill' : 'attack');
  b.pendingAction = null; b.qIndex++;
  render();
  if(checkBattleEnd()) return;
  setTimeout(nextTurn, 450);
}

/* ============ END OF BATTLE ============ */
function dominantFromElemDamage(map){
  let best=null, bd=0;
  Object.entries(map).forEach(([e,d])=>{ if(d>bd){ bd=d; best=e; } });
  return best;
}

function stageExp(){ return 8 + state.stage*2; }
function awardExp(units, amount){
  const levelled = [];
  units.forEach(u=>{
    const m = findMonster(u.monsterUid);
    if(!m) return;
    const before = m.level;
    m.exp += amount;
    let need = m.level*10;
    while(m.exp>=need){ m.exp-=need; m.level++; need=m.level*10; }
    if(m.level>before) levelled.push(computeStats(m).name+' Lv.'+m.level);
  });
  return levelled;
}

function battleStats(result){
  const b = state.battle;
  const elemsUsed = Object.keys(b.elemDamage).filter(e=>b.elemDamage[e]>0);
  return {
    win: result==='win',
    elemDamage: b.elemDamage,
    elemsUsed,
    losses: b.playerUnits.filter(u=>u.fainted).length,
    rounds: b.rounds || 1,
    hybrids: b.playerUnits.filter(u=>u.hybrid).length,
    maxRust: b.playerUnits.reduce((m,u)=>Math.max(m,u.corruption||0), 0),
    boss: !!bossForStage(state.stage),
    trial: !!state.trial,
    mods: state.trial ? state.trial.mods.length : 0,
  };
}

function endBattle(result){
  const b = state.battle;
  b.result = result;

  if(state.tutorial){
    state.lastResult = { win: result==='win', tutorial:true };
    state.screen = 'result';
    sfx(result==='win' ? 'victory' : 'defeat');
    musicStop();
    render();
    return;
  }

  const dailyDone = scoreDailies(battleStats(result));

  if(state.duel){
    const won = result==='win';
    state.lastResult = { win:won, duel:true, opponent:state.duel.name, dailyDone };
    state.screen = 'result';
    render();
    ladderReport(won, state.duel.userId).then(r=>{
      social.lastDuel = r.ok ? 'Rating updated.' : ('Result not recorded: ' + (r.error||'unknown error'));
      if(state.screen==='result') render();
    });
    return;
  }

  if(state.raidRun){
    const dealt = b.totalDamage || 0;
    state.lastResult = { win:result==='win', raid:true, dealt, dailyDone };
    state.screen = 'result';
    render();
    raidContribute(dealt).then(r=>{
      social.status = r.ok ? `Logged ${dealt} damage to the raid.` : ('Damage not logged: ' + (r.error||'unknown error'));
      if(state.screen==='result') render();
    });
    return;
  }

  if(state.trial){
    const won = result==='win';
    const drops = [];
    if(won){
      for(let i=0;i<state.trial.reward && state.parts.length<14;i++){
        const keys = ENEMY_IDS;
        drops.push({ uid: uid(), key: keys[Math.floor(Math.random()*keys.length)] });
      }
      drops.forEach(d=>state.parts.push(d));
    }
    state.lastResult = { win:won, trial:true, drops, dailyDone,
      mods: state.trial.mods.slice(), stage: state.trial.stage };
    state.screen = 'result';
    sfx(won ? 'victory' : 'defeat');
    autosave();
    render();
    return;
  }

  if(result==='win'){
    const expGain = Math.round(stageExp() * (bossForStage(state.stage) ? 1.75 : 1) * (hasPerk('exp') ? 1.10 : 1));
    const levelled = awardExp(b.playerUnits, expGain);

    // --- Rustbound intel: they study what actually hurt them ---
    const dom = dominantFromElemDamage(b.elemDamage);
    if(dom){
      state.intel.history.push(dom);
      if(state.intel.history.length>5) state.intel.history.shift();
    }
    state.intel.wins++;
    state.cleared[state.stage] = true;

    // Tribes notice who actually did the fighting.
    const favorGains = {};
    Object.keys(b.elemDamage).forEach(e=>{
      if(!TRIBES[e]) return;
      const share = b.elemDamage[e];
      if(share>0) favorGains[e] = (favorGains[e]||0) + Math.min(8, 2 + Math.round(share/60));
    });
    b.playerUnits.forEach(u=>{
      (u.attackElements||[]).forEach(e=>{ if(TRIBES[e] && !favorGains[e]) favorGains[e] = 1; });
    });
    Object.keys(favorGains).forEach(e=>addFavor(e, favorGains[e]));

    // --- Salvage from the wreckage (elite waves are stripped twice over) ---
    const drops = [];
    const isBossWin = !!bossForStage(state.stage);
    const pulls = (isEliteStage(state.stage) || isBossWin) ? 2 : 1;
    for(let d=0; d<pulls; d++){
      if(state.parts.length>=14) break;
      if(d===0 && !isEliteStage(state.stage) && !isBossWin && Math.random() >= (hasPerk('salvage')?0.85:0.7)) break;
      const keys = b.enemyUnits.map(u=>u.speciesKey).filter(Boolean);
      if(!keys.length) break;
      const drop = { uid: uid(), key: keys[Math.floor(Math.random()*keys.length)] };
      state.parts.push(drop);
      drops.push(drop);
    }
    const part = drops.length ? drops[0] : null;

    let captured = null;
    const recruitChance = (isEliteStage(state.stage) || isBossWin) ? 1 : (isDeep(state.stage) ? 0.6 : 0.45);
    if(Math.random()<recruitChance && state.roster.length<18){
      // Recruits skew toward tribes already in your legion, so duplicates accumulate
      // and the evolution ladder (pair -> Prime, three Primes -> Ascended) can actually be climbed.
      const owned = state.roster.map(m=>m.speciesId).filter(id=>SPECIES[id] && !SPECIES[id].champion);
      const id = (owned.length && Math.random()<0.55)
        ? owned[Math.floor(Math.random()*owned.length)]
        : WILD_IDS[Math.floor(Math.random()*WILD_IDS.length)];
      captured = newMonster(id,1,1);
      state.roster.push(captured);
    }
    if(signedIn() && social.guild) guildAddXp(50 + state.stage*5);
    state.lastResult = { win:true, expGain, captured, part, drops, dom, nextAdapt: currentAdaptation(), levelled,
                         finale: state.stage===CAMPAIGN_LENGTH, elite: isEliteStage(state.stage),
                         boss: bossForStage(state.stage) ? bossForStage(state.stage).name : null,
                         favorGains, newChampions: TRIBE_IDS.filter(e=>championUnlocked(e) && !state.recruited[e]),
                         newBlessings: TRIBE_IDS.filter(e=>blessingUnlocked(e)), dailyDone };
  } else {
    // A defeat still teaches the legion something — otherwise a loss is unrecoverable.
    const expGain = Math.max(1, Math.round(stageExp()*0.5));
    const levelled = awardExp(b.playerUnits, expGain);
    state.lastResult = { win:false, expGain, levelled, dailyDone };
  }
  autosave();
  state.screen = 'result';
  sfx(result==='win' ? 'victory' : 'defeat');
  if(result==='win' && state.lastResult && state.lastResult.levelled && state.lastResult.levelled.length) setTimeout(()=>sfx('levelup'), 700);
  musicStop();
  render();
}

/* ============ BATTLE RENDER ============ */
function statusIconLine(u){
  const icons = [];
  if(u.status && u.status.type==='burn') icons.push('🔥'+u.status.turnsLeft);
  if(u.status && u.status.type==='slow') icons.push('🐌'+u.status.turnsLeft);
  if(u.status && u.status.type==='stun') icons.push('💫');
  if(u.shield) icons.push('🛡');
  if(u.taunt>0) icons.push('👊'+u.taunt);
  return icons.join(' ');
}
function renderUnit(u, activeId, validTargetIds){
  const jammed = hasMod('blackout') && u.side==='enemy' && !u.fainted;
  const pct = jammed ? 100 : Math.max(0, Math.round((u.hp/u.maxHp)*100));
  const selectable = validTargetIds && validTargetIds.includes(u.id) && !u.fainted;
  const allyPick = selectable && u.side==='player';
  return `
  <div class="unit ${u.isBoss?'boss':''} ${u.isGenerator?'gen':''} ${u.fainted?'fainted':''} ${u.id===activeId?'active':''} ${selectable?(allyPick?'allytarget':'targetable'):''}"
       data-unit="${u.id}"
       ${selectable?`onclick="${planningOpen()?'planChooseTarget':'playerTarget'}('${u.id}')"`:''}>
    ${u.shielded?`<div class="shield-tag" title="shielded while a pylon stands">🛡 SHIELDED</div>`:''}
    ${u.plating?`<div class="plate-tag" title="counter-plating">▣</div>`:''}
    ${u.corruption?`<div class="rust-tag" title="rust ${u.corruption}">⚙</div>`:''}
    ${u.trait&&!u.corruption?`<div class="rust-tag" style="color:var(--volt)" title="${traitName(u.trait)}: ${traitDesc(u.trait)}">${TRAITS[u.trait.key].emoji}</div>`:''}
    <div class="emoji">${u.emoji}</div>
    <div class="uname">${u.name}</div>
    <div class="hpbar-bg"><div class="hpbar-fill ${(!jammed&&pct<30)?'low':''}" style="width:${pct}%; ${jammed?'background:repeating-linear-gradient(90deg,var(--dim) 0 4px,#000 4px 8px);':''}"></div></div>
    <div class="cd-tag">${u.fainted?'DOWN':(u.skillCd>0?'skill:'+u.skillCd:'skill ready')}</div>
    <div class="status-tag">${statusIconLine(u)}</div>
  </div>`;
}

function renderBattle(){
  const b = state.battle;
  const activeUnit = b.qIndex<b.queue.length ? b.queue[b.qIndex] : null;
  const isPlayerTurn = activeUnit && activeUnit.side==='player' && !activeUnit.fainted && b.awaitingInput;
  let validTargetIds = [];
  if(planningOpen() && b.planUnit && b.planAction){
    const pu = b.playerUnits.find(u=>u.id===b.planUnit);
    if(pu) validTargetIds = getValidTargets(pu).map(u=>u.id);
  } else if(isPlayerTurn && b.pendingAction==='shift'){
    const dest = shiftDestination(activeUnit);
    validTargetIds = b.playerUnits.filter(u=>u.row===dest && !u.fainted).map(u=>u.id);
  } else if(isPlayerTurn && b.pendingAction==='gauge_purge'){
    validTargetIds = b.playerUnits.filter(u=>!u.fainted).map(u=>u.id);
  } else if(isPlayerTurn && b.pendingAction==='gauge_alpha'){
    validTargetIds = b.enemyUnits.filter(u=>!u.fainted).map(u=>u.id);
  } else if(isPlayerTurn && b.pendingAction){
    validTargetIds = getValidTargets(activeUnit).map(u=>u.id);
  }

  const enemyRows = `
    <div class="side-label">🤖 RUSTBOUND FORCES${b.plating?` <span style="color:var(--water)">▣ ${b.plating}-plated</span>`:''}</div>
    <div class="unit-row">${b.enemyUnits.filter(u=>u.row==='back').map(u=>renderUnit(u, activeUnit?activeUnit.id:null, validTargetIds)).join('')}</div>
    <div class="unit-row">${b.enemyUnits.filter(u=>u.row==='front').map(u=>renderUnit(u, activeUnit?activeUnit.id:null, validTargetIds)).join('')}</div>`;

  const playerRows = `
    <div class="unit-row">${b.playerUnits.filter(u=>u.row==='front').map(u=>renderUnit(u, activeUnit?activeUnit.id:null, validTargetIds)).join('')}</div>
    <div class="rowsyn">${b.synLabels.front?'✨ FRONT '+b.synLabels.front:''}</div>
    <div class="unit-row">${b.playerUnits.filter(u=>u.row==='back').map(u=>renderUnit(u, activeUnit?activeUnit.id:null, validTargetIds)).join('')}</div>
    <div class="rowsyn">${b.synLabels.back?'✨ BACK '+b.synLabels.back:''}</div>
    <div class="side-label">🛡 YOUR LEGION</div>`;

  let actionHtml = '';
  if(isPlayerTurn){
    if(!b.pendingAction){
      const dest = shiftDestination(activeUnit);
      actionHtml = `
      <div class="actionbar">
        <button class="btn primary" onclick="playerChooseAction('attack')">⚔ Attack</button>
        <button class="btn" ${activeUnit.skillCd>0?'disabled':''} onclick="playerChooseAction('skill')">✨ ${activeUnit.skillName} ${activeUnit.skillCd>0?'('+activeUnit.skillCd+')':''}</button>
        <button class="btn" onclick="playerChooseAction('shift')">🔀 Shift to ${dest.toUpperCase()}</button>
        ${b.gauge>=GAUGE_COST.purge ? `<button class="btn primary" onclick="playerChooseAction('gauge_purge')">🔧 Purge <span class="cost">−${GAUGE_COST.purge}</span></button>` : ''}
        ${b.gauge>=GAUGE_COST.rally ? `<button class="btn primary" onclick="playerChooseAction('gauge_rally')">🛡 Rally <span class="cost">−${GAUGE_COST.rally}</span></button>` : ''}
        ${b.gauge>=GAUGE_COST.overdrive ? `
          <button class="btn primary" onclick="playerChooseAction('gauge_overdrive')">⚡⚡ Overdrive <span class="cost">−${GAUGE_COST.overdrive}</span></button>
          <button class="btn primary" onclick="playerChooseAction('gauge_alpha')">💥 Alpha Strike <span class="cost">−${GAUGE_COST.alpha}</span></button>
        ` : ''}
      </div>`;
    } else if(b.pendingAction==='shift'){
      actionHtml = `<p class="dim">The ${shiftDestination(activeUnit).toUpperCase()} line is full — pick an ally to trade places with... <span style="cursor:pointer; color:var(--danger);" onclick="state.battle.pendingAction=null; render();">[cancel]</span></p>`;
    } else {
      const cancel = `<span style="cursor:pointer; color:var(--danger);" onclick="state.battle.pendingAction=null; render();">[cancel]</span>`;
      if(b.pendingAction==='gauge_purge'){
        actionHtml = `<p class="dim">Choose an ally to strip down and purge... ${cancel}</p>`;
      } else {
        const label = b.pendingAction==='skill' ? activeUnit.skillName : (b.pendingAction==='gauge_alpha' ? 'Alpha Strike' : 'attack');
        actionHtml = `<p class="dim">Choose a target for ${activeUnit.name}'s ${label}... ${cancel}</p>`;
      }
    }
  } else if(activeUnit){
    actionHtml = `<p class="dim">${activeUnit.side==='enemy' ? 'Enemy is acting...' : 'Resolving...'}</p>`;
  }

  if(planningOpen()){
    const rows = livingPlayerUnits().map(u=>{
      const o = b.orders[u.id];
      const sel = b.planUnit===u.id;
      let desc = '<span class="dim">no order</span>';
      if(o){
        if(o.kind==='shift') desc = `🔀 shift to ${shiftDestination(u).toUpperCase()}`;
        else {
          const t = b.enemyUnits.concat(b.playerUnits).find(x=>x.id===o.targetId);
          desc = `${o.kind==='skill'?'✨ '+escapeHtml(u.skillName):'⚔ attack'} → ${t?escapeHtml(t.name):'?'}`;
        }
      }
      return `<div class="planrow ${sel?'sel':''}">
        <span style="cursor:pointer;" onclick="planSelectUnit('${u.id}')">${u.emoji} <b>${escapeHtml(u.name)}</b> <span class="dim">(${u.row})</span></span>
        <span> — ${desc}</span>
        ${o?`<span style="cursor:pointer; color:var(--danger);" onclick="planClear('${u.id}')"> [clear]</span>`:''}
      </div>`;
    }).join('');

    let picker = '<p class="dim">Tap a unit above to give it an order.</p>';
    if(b.planUnit){
      const pu = b.playerUnits.find(u=>u.id===b.planUnit);
      if(pu){
        picker = b.planAction
          ? `<p class="dim">Now tap a target for ${escapeHtml(pu.name)}'s ${b.planAction==='skill'?escapeHtml(pu.skillName):'attack'}.</p>`
          : `<div class="actionbar">
               <button class="btn primary" onclick="planChooseAction('attack')">⚔ Attack</button>
               <button class="btn" ${pu.skillCd>0?'disabled':''} onclick="planChooseAction('skill')">✨ ${escapeHtml(pu.skillName)}${pu.skillCd>0?' ('+pu.skillCd+')':''}</button>
               <button class="btn" onclick="planChooseAction('shift')">🔀 Shift to ${shiftDestination(pu).toUpperCase()}</button>
             </div>`;
      }
    }
    actionHtml = `
      <div class="coach">
        <div class="coach-title">TACTICAL ORDERS — ROUND ${b.rounds}</div>
        <div>Write an order for every unit, then execute the round at once. If a mark falls before its turn, that unit retargets rather than wasting the turn.</div>
      </div>
      <div class="planbox">${rows}</div>
      ${picker}
      <div class="row" style="margin-top:8px;">
        <button class="btn primary" ${planReady()?'':'disabled'} onclick="executePlan()">▶ EXECUTE ROUND${planReady()?'':' (orders missing)'}</button>
        <button class="btn small" onclick="toggleTactical(); state.battle.planning=false; state.battle.orders={}; nextTurn();">Switch to live turns</button>
      </div>`;
  }

  return `
  ${tutorialPanelHtml()}
  <div class="panel">
    <h2 class="section">${tutorialActive()?'TRAINING DEPLOYMENT':(isDeep(state.stage)?`DEPTH ${deepDepth(state.stage)}`:`STAGE ${state.stage}`)} — ${bossForStage(state.stage)&&!tutorialActive()?'<span style="color:var(--danger)">COMMANDER FIGHT</span>':'BATTLE'}${isEliteStage(state.stage)?' <span style="color:var(--danger)">☠ ELITE</span>':''}</h2>
    ${state.trial?`<div class="boss-banner">☠ TRIAL — ${state.trial.mods.map(id=>MODIFIERS[id].emoji+' '+MODIFIERS[id].name).join(' · ')}</div>`:''}
    <div class="terrain-banner">🗺 ${b.terrain.name}: ${b.terrain.desc}</div>
    <div class="gauge-wrap">
      <div class="gauge-label">LEGION GAUGE ${Math.floor(b.gauge)}% <span class="dim" style="font-size:13px;">— 🔧33 · 🛡66 · ⚡100</span></div>
      <div class="gauge-bg">
        <div class="gauge-fill ${b.gauge>=100?'full':''}" style="width:${Math.floor(b.gauge)}%"></div>
        <div class="gauge-tick" style="left:${GAUGE_COST.purge}%"></div>
        <div class="gauge-tick" style="left:${GAUGE_COST.rally}%"></div>
      </div>
    </div>
    <div class="battlefield">
      ${enemyRows}
      <div style="border-top:2px dashed var(--border); margin:6px 0;"></div>
      ${playerRows}
    </div>
  </div>
  <div class="panel">
    ${actionHtml}
    <div id="log">${b.log.map(m=>`<div>${m}</div>`).join('')}</div>
  </div>`;
}

/* ============ RESULT ============ */
function renderResult(){
  const r = state.lastResult;
  if(r.tutorial){
    return `
    <div class="panel finale" style="text-align:center;">
      <h1 class="title" style="font-size:20px;">TRAINING COMPLETE</h1>
      <p class="dim">You have the four verbs the whole game runs on:</p>
      <div class="storytext" style="text-align:left;">
        <b>Attack and skills</b> — skills hit harder and carry elemental riders.<br>
        <b>Shift</b> — rows are not fixed. Reshaping the line rebuilds synergies mid-fight.<br>
        <b>The gauge</b> — spend small and often, or bank it for Overdrive.<br>
        <b>Elements</b> — fire beats nature, nature beats water, water beats fire; earth, volt and wind form the other ring.
      </div>
      <p class="dim">Everything else — salvage, fusion, tribes, the Deep — is built on top of those. The campaign will introduce them one at a time.</p>
      <button class="btn primary" style="margin-top:10px;" onclick="finishTutorial()">Begin the campaign →</button>
    </div>`;
  }
  if(r.duel){
    return `
    <div class="panel" style="text-align:center;">
      <h1 class="title" style="font-size:20px; color:${r.win?'var(--gold)':'var(--danger)'};">${r.win?'DUEL WON':'DUEL LOST'}</h1>
      <p class="dim">against ${escapeHtml(r.opponent)}'s legion.</p>
      <p class="dim">${social.lastDuel?escapeHtml(social.lastDuel):'Reporting the result…'}</p>
      <button class="btn primary" style="margin-top:10px;" onclick="endDuel()">Back to the Ladder →</button>
    </div>`;
  }
  if(r.raid){
    return `
    <div class="panel" style="text-align:center;">
      <h1 class="title" style="font-size:20px;">RAID ATTEMPT</h1>
      <p>You dealt <b>${r.dealt.toLocaleString()}</b> damage to the boss.</p>
      <p class="dim">${r.win?'Your legion held the field.':'Your legion fell — the damage still counts.'}</p>
      <p class="dim">${social.status?escapeHtml(social.status):'Logging damage…'}</p>
      <button class="btn primary" style="margin-top:10px;" onclick="endRaidRun()">Back to the Guild →</button>
    </div>`;
  }
  if(r.trial){
    const names = r.mods.map(id=>MODIFIERS[id].emoji+' '+MODIFIERS[id].name).join(', ');
    if(r.win){
      return `
      <div class="panel" style="text-align:center;">
        <h1 class="title" style="font-size:20px;">TRIAL CLEARED</h1>
        <p class="dim">${isDeep(r.stage)?`Depth ${deepDepth(r.stage)}`:`Stage ${r.stage}`} under ${escapeHtml(names)}.</p>
        ${(r.dailyDone && r.dailyDone.length) ? `<p style="color:var(--nature)">📋 Order complete: ${r.dailyDone.map(escapeHtml).join(' · ')}</p>` : ''}
        ${r.drops.length?`<p style="color:var(--rust)">⚙ Hauled back: ${r.drops.map(d=>`<b>${PARTS[d.key].emoji} ${PARTS[d.key].name}</b>`).join(' + ')}</p>`:'<p class="dim">Your salvage store is full.</p>'}
        <button class="btn primary" style="margin-top:10px;" onclick="endTrial()">Return to Hub →</button>
      </div>`;
    }
    return `
    <div class="panel" style="text-align:center;">
      <h1 class="title" style="font-size:20px; color:var(--danger);">TRIAL FAILED</h1>
      <p class="dim">${escapeHtml(names)} proved too much. Nothing lost but the attempt.</p>
      <button class="btn primary" style="margin-top:10px;" onclick="endTrial()">Return to Hub →</button>
    </div>`;
  }
  if(r.win && r.finale){
    return `
    <div class="panel finale" style="text-align:center;">
      <h1 class="title">THE GATE FALLS</h1>
      <div class="heading" style="font-size:11px; color:var(--dim); margin-bottom:14px;">CAMPAIGN COMPLETE</div>
      <p>The forward base burns behind you. Texel breathes again — the tribes hold the surface, and the Rustbound advance is broken.</p>
      <div class="storytext">But the gate opened onto a stairwell, and the stairwell goes down. Whatever built the horde is still down there, still building.</div>
      <p class="dim">Your legion, its salvage and every splice carry onward. The Deep scales without end: elite waves every fifth depth, richer wreckage, and recruits enough to finish an evolution ladder.</p>
      <div class="row" style="justify-content:center; margin-top:14px;">
        <button class="btn primary" style="font-size:22px;" onclick="advanceStage()">⬇ DESCEND INTO THE DEEP</button>
      </div>
    </div>`;
  }
  if(r.win){
    const pd = r.part ? PARTS[r.part.key] : null;
    return `
    <div class="panel" style="text-align:center;">
      <h1 class="title" style="font-size:20px;">${r.boss?'COMMANDER DOWN!':(r.elite?'ELITE WAVE BROKEN!':'VICTORY!')}</h1>
      ${r.boss?`<p style="color:var(--danger)">${escapeHtml(r.boss)} is scrap.</p>`:''}
      <p>Your legion held the line at ${isDeep(state.stage)?`Depth ${deepDepth(state.stage)}`:`Stage ${state.stage}`}.</p>
      <p class="dim">Each deployed monster gained ${r.expGain} EXP.</p>
      ${r.levelled && r.levelled.length ? `<p style="color:var(--gold)">⬆ Level up: ${r.levelled.join(', ')}</p>` : ''}
      ${r.captured ? `<p>A wild <b>${getSpeciesData(r.captured.speciesId,1).name}</b> ${getSpeciesData(r.captured.speciesId,1).emoji} joined your roster${r.captured.trait?` — <span style="color:var(--volt)">${TRAITS[r.captured.trait.key].emoji} ${traitName(r.captured.trait)}</span> (${traitDesc(r.captured.trait)})`:''}!</p>` : ''}
      ${(r.drops&&r.drops.length) ? `<p style="color:var(--rust)">⚙ Stripped from the wreckage: ${r.drops.map(d=>`<b>${PARTS[d.key].emoji} ${PARTS[d.key].name}</b>`).join(' + ')}</p>` : ''}
      ${(r.dailyDone && r.dailyDone.length) ? `<p style="color:var(--nature)">📋 Order complete: ${r.dailyDone.map(escapeHtml).join(' · ')}</p>` : ''}
      ${(r.favorGains && Object.keys(r.favorGains).length) ? `<p style="color:var(--nature)">🏕 Favour earned: ${Object.keys(r.favorGains).map(e=>`${TRIBES[e].emoji} ${TRIBES[e].name} +${r.favorGains[e]}`).join(', ')}</p>` : ''}
      ${(r.newChampions && r.newChampions.length) ? `<p style="color:var(--gold)">★ ${r.newChampions.map(e=>TRIBES[e].name).join(' and ')} will send ${r.newChampions.length===1?'a champion':'champions'} — visit the Tribes camp.</p>` : ''}
      ${r.dom ? `<p class="dim">📡 The Rustbound log your <b>${r.dom.toUpperCase()}</b> assault. Next deployment they will expect <b>${(r.nextAdapt||r.dom).toUpperCase()}</b>.</p>` : ''}
      <button class="btn primary" style="margin-top:10px;" onclick="advanceStage()">${isDeep(state.stage)?'Descend further →':'Continue →'}</button>
    </div>`;
  }
  return `
  <div class="panel" style="text-align:center;">
    <h1 class="title" style="font-size:20px; color:var(--danger);">DEFEAT</h1>
    <p>Your legion was overrun. The Rustbound advance no further today, but neither do you.</p>
    <p class="dim">Your survivors studied the enemy through the rout — each deployed monster gained ${r.expGain} EXP.</p>
    ${r.levelled && r.levelled.length ? `<p style="color:var(--gold)">⬆ Level up: ${r.levelled.join(', ')}</p>` : ''}
    <p class="dim">Adjust your formation, re-plate your beasts, and go again.</p>
    <button class="btn primary" style="margin-top:10px;" onclick="retryStage()">Retry ${isDeep(state.stage)?`Depth ${deepDepth(state.stage)}`:`Stage ${state.stage}`} →</button>
  </div>`;
}
function finishTutorial(){
  state.tutorial = null;
  state.battle = null;
  state.lastResult = null;
  sfx('click');
  goProfiles();
}
function advanceStage(){
  state.stage++;
  if(isDeep(state.stage)) state.bestDepth = Math.max(state.bestDepth||0, deepDepth(state.stage));
  state.battle=null; state.screen='hub';
  autosave();
  render();
}
function retryStage(){ state.battle=null; state.screen='hub'; render(); }

/* ============ INIT ============ */
/* Browsers block audio until a gesture; the first click anywhere unlocks it. */
if(typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('click', function primeAudio(){
    audioResume();
    if(audio.music) musicStart();
  }, { once:false, passive:true });
}
render();
try{ cloudInit(); }catch(e){ cloud.status = cloudConfigured() ? 'error' : 'off'; }
</script>
</body>
</html>
