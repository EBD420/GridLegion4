    <h2 class="section">SALVAGE BAY</h2>
    <p class="dim">Bolt Rustbound parts onto your beasts. A part grants stats <b>and a second element</b> — which counts toward row synergy, and shields the unit with the most favourable elemental matchup. It also loads the beast with <b>rust</b>. Rusted units seize up mid-battle, and badly rusted ones turn on their own line.</p>
    <div class="row">${partCards || '<p class="dim">No salvage in storage. Win battles to strip parts from the wreckage.</p>'}</div>
    <p class="dim" style="margin-top:8px;">${state.selectedPart?'Now tap an <b>empty</b> slot on a beast below to install it.':'Tap a part to select it. Tap an installed part to purge it (the part is destroyed).'}</p>
  </div>
  <div class="panel">
    <h2 class="section">LEGION</h2>
    <div class="row">${monCards}</div>
  </div>
  <div class="panel footer-nav">
    <button class="btn" onclick="state.selectedPart=null; state.screen='hub'; render();">← Back to Hub</button>
  </div>`;
}
function selectPart(u){ state.selectedPart = (state.selectedPart===u) ? null : u; render(); }
function installPart(monsterUid){
  if(!state.selectedPart) return;
  const m = findMonster(monsterUid); if(!m) return;
  if((m.parts||[]).length >= partSlots(m)) return;
  const idx = state.parts.findIndex(p=>p.uid===state.selectedPart);
  if(idx<0) return;
  const part = state.parts.splice(idx,1)[0];
  m.parts = (m.parts||[]).concat([part.key]);
  state.selectedPart = null;
  autosave();
  render();
}
function purgePart(monsterUid, slotIdx){
  const m = findMonster(monsterUid); if(!m) return;
  m.parts.splice(slotIdx,1);
  autosave();
  render();
}

/* ============ FORMATION ============ */
function renderFormation(){
  function slotHtml(row, idx){
    const u = state.formation[row][idx];
    const m = u ? findMonster(u) : null;
    if(!m) return `<div class="slot" onclick="placeSelected('${row}',${idx})">+</div>`;
    const st = computeStats(m);
    return `<div class="slot filled" onclick="clearSlot('${row}',${idx})">
      <div>${st.emoji}</div><div class="slvl">Lv${m.level}</div>
    </div>`;
  }
  const placedUids = state.formation.front.concat(state.formation.back).filter(Boolean);
  const bench = state.roster.filter(m=>!placedUids.includes(m.uid));
  const benchCards = bench.map(m=>{
    const st = computeStats(m);
    const sel = state.formSelected===m.uid;
    return `<div class="mcard ${sel?'selected':''}" onclick="selectBenchMonster('${m.uid}')">
      <div class="emoji">${st.emoji}</div>
      <div class="name">${st.name}</div>
      <div class="lvl">Lv.${m.level}</div>
      ${elemTags(st.elements)}
      ${traitTag(st.trait)}
    </div>`;
  }).join('');

  const frontSyn = formationRowSynergyLabel('front');
  const backSyn = formationRowSynergyLabel('back');

  return `
  <div class="panel">
    <h2 class="section">FORMATION</h2>
    <p class="dim">Front row = melee, absorbs enemy melee strikes first. Back row = ranged, can strike any enemy but is safe from melee until the front falls. Match elements in a row for synergy bonuses — and remember you can <b>Shift</b> rows mid-battle to make or break them.</p>
    <div class="formation">
      <div class="frow"><div class="label">FRONT</div>${[0,1,2].map(i=>slotHtml('front',i)).join('')}</div>
      ${frontSyn?`<div class="synergy-tag">✨ ${frontSyn}</div>`:''}
      <div class="frow"><div class="label">BACK</div>${[0,1,2].map(i=>slotHtml('back',i)).join('')}</div>
      ${backSyn?`<div class="synergy-tag">✨ ${backSyn}</div>`:''}
    </div>
  </div>
  <div class="panel">
    <h2 class="section">BENCH ${state.formSelected?'<span class="dim">(tap a slot to place)</span>':''}</h2>
    <div class="row">${benchCards || '<p class="dim">Everyone is deployed.</p>'}</div>
  </div>
  <div class="panel footer-nav">
    <button class="btn" onclick="state.formSelected=null; state.screen='hub'; render();">← Back to Hub</button>
  </div>`;
}
function selectBenchMonster(u){ state.formSelected = (state.formSelected===u) ? null : u; render(); }
function placeSelected(row, idx){
  if(!state.formSelected) return;
  ['front','back'].forEach(r=>{ state.formation[r] = state.formation[r].map(u=> u===state.formSelected? null : u); });
  state.formation[row][idx] = state.formSelected;
  state.formSelected = null;
  render();
}
function clearSlot(row, idx){ state.formation[row][idx] = null; render(); }

/* ============ BATTLE SETUP ============ */
function baseUnitDefaults(){
  return {
    status:null, shield:false, taunt:0,
    dodge:0, burnOnHit:0, stunOnHit:0, regen:0, slowImmune:false,
    firstHitReduction:false, firstHitUsed:false,
    missChance:0, backfireChance:0, burnImmune:false, stunImmune:false,
    critBonus:0, baneElem:null, resilient:false,
    attackElements:[], hybrid:false, traitDodge:0, traitRegen:0, traitSlowImmune:false,
    plating:null, platingPct:0,
    corruption:0, glitchChance:0, defectChance:0,
    elements:[], synergyLabel:null,
  };
}
const STAT_BASE_KEY = { atk:'bAtk', def:'bDef', hp:'bHp', spd:'bSpd' };

function applyTerrainToUnit(unit, terrain){
  const m = terrain.mods;
  if(m.buffElem && unit.elements.includes(m.buffElem)){
    const k = STAT_BASE_KEY[m.buffStat]; unit[k] = Math.round(unit[k]*(1+m.buffPct));
  }
  if(m.debuffElem && unit.elements.includes(m.debuffElem)){
    const k = STAT_BASE_KEY[m.debuffStat]; unit[k] = Math.round(unit[k]*(1-m.debuffPct));
  }
  if(m.missElem && unit.elements.includes(m.missElem)) unit.missChance = m.missChance;
  if(m.backfireElem && unit.elements.includes(m.backfireElem)) unit.backfireChance = m.backfireChance;
  if(m.immuneElem && unit.elements.includes(m.immuneElem) && m.immuneStatus==='burn') unit.burnImmune = true;
  if(m.cdPenalty) unit.skillMaxCd += m.cdPenalty;
}

/* Recomputes the row-synergy layer on top of base stats. Returns {front,back} labels. */
function refreshSynergies(units, initial){
  const labels = { front:null, back:null };
  ['front','back'].forEach(row=>{
    const living = units.filter(u=>u.row===row && !u.fainted);
    const infos = computeRowSynergies(living.map(u=>u.elements)).map(synergyInfo);
    labels[row] = infos.length ? infos.map(synergyLabelText).join(' · ') : null;
    units.filter(u=>u.row===row).forEach(u=>{
      // reset the synergy-derived layer (terrain- and trait-derived flags are re-laid below)
      u.dodge=0; u.burnOnHit=0; u.stunOnHit=0; u.regen=0; u.slowImmune=false; u.firstHitReduction=false;
      let atk=u.bAtk, def=u.bDef, hp=u.bHp, spd=u.bSpd;
      infos.forEach(info=>{
        if(info.statKey==='atk') atk = Math.round(atk*(1+info.bonus));
        if(info.statKey==='def') def = Math.round(def*(1+info.bonus));
        if(info.statKey==='hp')  hp  = Math.round(hp *(1+info.bonus));
        if(info.statKey==='spd') spd = Math.round(spd*(1+info.bonus));
        if(info.flavor){
          const f = info.flavor;
          if(f.type==='dodge') u.dodge = Math.max(u.dodge, f.val);
          if(f.type==='burnOnHit') u.burnOnHit = Math.max(u.burnOnHit, f.val);
          if(f.type==='stunOnHit') u.stunOnHit = Math.max(u.stunOnHit, f.val);
          if(f.type==='regen') u.regen = Math.max(u.regen, f.val);
          if(f.type==='slowImmune') u.slowImmune = true;
          if(f.type==='firstHitReduction') u.firstHitReduction = true;
        }
      });
      // innate hybrid traits survive every recompute
      if(u.traitDodge) u.dodge = Math.max(u.dodge, u.traitDodge);
      if(u.traitRegen) u.regen = Math.max(u.regen, u.traitRegen);
      if(u.traitSlowImmune) u.slowImmune = true;
      u.atk=atk; u.def=def; u.spd=spd; u.maxHp=hp;
      if(initial) u.hp = hp; else u.hp = Math.min(u.hp, u.maxHp);
      u.synergyLabel = labels[row];
    });
  });
  return labels;
}
/* Recompute + log any change. Called after shifts and after any faint. */
function applySynergyRefresh(){
  const b = state.battle; if(!b) return;
  const labels = refreshSynergies(b.playerUnits, false);
  ['front','back'].forEach(row=>{
    const before = b.synLabels[row], after = labels[row];
    if(before !== after){
      if(after) logMsg(`✨ ${row.toUpperCase()} line locks in: ${after}!`);
      else logMsg(`💢 ${row.toUpperCase()} line synergy broken.`);
    }
  });
  b.synLabels = labels;
}

function buildPlayerUnits(terrain){
  const units = [];
  ['front','back'].forEach(row=>{
    state.formation[row].forEach(u=>{
      if(!u) return;
      const m = findMonster(u); if(!m) return;
      const st = computeStats(m);
      const tier = corrTier(st.corruption);
      const unit = Object.assign(baseUnitDefaults(), {
        id:'p_'+m.uid, side:'player', row, monsterUid:m.uid,
        name:st.name, emoji:st.emoji, element:st.element, elements:st.elements.slice(),
        attackElements:st.innate.slice(), hybrid:st.hybrid, skillName:st.skill,
        bHp:st.hp, bAtk:st.atk, bDef:st.def, bSpd:st.spd,
        maxHp:st.hp, hp:st.hp, atk:st.atk, def:st.def, spd:st.spd,
        skillCd:0, skillMaxCd:3, fainted:false,
        corruption: st.corruption, glitchChance: tier.glitch, defectChance: tier.defect,
        trait: st.trait,
      });
      if(st.trait){
        if(st.trait.key==='keen') unit.critBonus = 0.08;
        if(st.trait.key==='bane') unit.baneElem = st.trait.elem;
        if(st.trait.key==='resilient') unit.resilient = true;
        if(st.trait.key==='quickstart') unit.skillMaxCd = Math.max(1, unit.skillMaxCd-1);
      }
      if(st.hybrid){
        st.innate.forEach(e=>{
          const t = ELEM_TRAIT[e]; if(!t) return;
          if(t.burnImmune) unit.burnImmune = true;
          if(t.slowImmune) unit.traitSlowImmune = true;
          if(t.stunImmune) unit.stunImmune = true;
          if(t.regen) unit.traitRegen = Math.max(unit.traitRegen, t.regen);
          if(t.dodge) unit.traitDodge = Math.max(unit.traitDodge, t.dodge);
          if(t.bulwark) unit.shield = true;
        });
      }
      applyTerrainToUnit(unit, terrain);
      units.push(unit);
    });
  });
  refreshSynergies(units, true);
  return units;
}

function pickEnemySpecies(adapted){
  const weights = ENEMY_IDS.map(id=>{
    const e = ENEMY_SPECIES[id].element;
    if(!adapted) return 1;
    if(ELEM_BEATS[e]===adapted) return 5;        // hard-counters the player's favourite
    if(ELEM_BEATS[adapted]===e) return 0.3;      // food for the player's favourite
    return 1;
  });
  const total = weights.reduce((s,w)=>s+w,0);
  let r = Math.random()*total;
  for(let i=0;i<ENEMY_IDS.length;i++){ r -= weights[i]; if(r<=0) return ENEMY_IDS[i]; }
  return ENEMY_IDS[ENEMY_IDS.length-1];
}

function buildEnemyUnits(stage, terrain, adapted, usePlating){
  const count = Math.min(3 + Math.floor((stage-1)/2), 6);
  let mult = 1 + (stage-1)*0.14;
  if(isEliteStage(stage)) mult *= 1.25;
  const units = [];
  for(let i=0;i<count;i++){
    const id = pickEnemySpecies(adapted);
    const sd = ENEMY_SPECIES[id];
    const row = i<3 ? 'front' : 'back';
    const hp = Math.round(sd.base.hp*mult);
    const unit = Object.assign(baseUnitDefaults(), {
      id:'e_'+i+'_'+id, side:'enemy', row, speciesKey:id,
      name:sd.name, emoji:sd.emoji, element:sd.element, elements:[sd.element], attackElements:[sd.element], skillName:sd.skill,
      bHp:hp, bAtk:Math.round(sd.base.atk*mult), bDef:Math.round(sd.base.def*mult), bSpd:Math.round(sd.base.spd*mult),
      maxHp:hp, hp:hp,
      atk:Math.round(sd.base.atk*mult), def:Math.round(sd.base.def*mult), spd:Math.round(sd.base.spd*mult),
      skillCd:0, skillMaxCd:3, fainted:false,
    });
    if(usePlating && adapted){ unit.plating = adapted; unit.platingPct = platingPct(); }
    applyTerrainToUnit(unit, terrain);
    unit.atk = unit.bAtk; unit.def = unit.bDef; unit.spd = unit.bSpd;
    unit.maxHp = unit.bHp; unit.hp = unit.bHp;
    units.push(unit);
  }
  return units;
}

function beginBattle(){
  const terrain = terrainForStage(state.stage);
  const adapted = currentAdaptation();
  const usePlating = platingActive();
  const playerUnits = buildPlayerUnits(terrain);
  state.battle = {
    playerUnits,
    enemyUnits: buildEnemyUnits(state.stage, terrain, adapted, usePlating),
    terrain, adapted, plating: usePlating ? adapted : null,
    queue: [], qIndex: 0, gauge: 0,
    log: [], pendingAction: null, result: null,
    elemDamage: {},
    awaitingInput: false,
    synLabels: { front:null, back:null },
  };
  state.battle.synLabels = {
    front: (playerUnits.find(u=>u.row==='front')||{}).synergyLabel || null,
    back:  (playerUnits.find(u=>u.row==='back') ||{}).synergyLabel || null,
  };
  logMsg(`${isEliteStage(state.stage)?'An ELITE wave':'Wave '+state.stage} approaches under ${terrain.name}!`);
  if(adapted){
    const dom = deployedDominantElement();
    if(usePlating) logMsg(`📡 Rustbound units deploy ${adapted}-counter plating (−${Math.round(platingPct()*100)}% ${adapted} damage).`);
    if(dom && dom!==adapted){
      state.battle.gauge = 30;
      logMsg(`🎭 AMBUSH! They braced for a ${adapted} assault — your ${dom} legion catches them cold. Gauge +30%!`);
    } else {
      logMsg(`📡 The Rustbound anticipated your ${adapted} legion.`);
    }
  }
  state.screen = 'battle';
  startRound();
}

function logMsg(msg){
  state.battle.log.unshift(msg);
  if(state.battle.log.length>40) state.battle.log.pop();
}
function aliveUnits(){ return state.battle.playerUnits.concat(state.battle.enemyUnits).filter(u=>!u.fainted); }
function effectiveSpd(u){ return (u.status && u.status.type==='slow') ? Math.round(u.spd*0.7) : u.spd; }

function startRound(){
  const b = state.battle;
  if(!b || b.result) return;
  b.queue = aliveUnits().sort((a,c)=> effectiveSpd(c) - effectiveSpd(a) + (Math.random()-0.5));
  b.qIndex = 0;
  nextTurn();
}
function battleActive(b){ return state.battle && state.battle===b && !b.result; }
function checkBattleEnd(){
  const b = state.battle;
  if(!b || b.result) return true;
  if(b.enemyUnits.every(u=>u.fainted)){ endBattle('win'); return true; }
  if(b.playerUnits.every(u=>u.fainted)){ endBattle('lose'); return true; }
  return false;
}

function setStatus(unit, type, turns){
  if(type==='burn' && unit.burnImmune){ logMsg(`${unit.emoji} ${unit.name} is immune to burn!`); return; }
  if(type==='slow' && unit.slowImmune){ logMsg(`${unit.emoji} ${unit.name} resists the slow!`); return; }
  if(type==='stun' && unit.stunImmune){ logMsg(`${unit.emoji} ${unit.name} shrugs off the shock!`); return; }
  if(unit.resilient && turns>1) turns = Math.max(1, Math.round(turns*0.75));
  unit.status = { type, turnsLeft: turns };
  const icon = type==='burn'?'🔥':type==='slow'?'🐌':'💫';
  logMsg(`${icon} ${unit.emoji} ${unit.name} is afflicted with ${type}!`);
}

function tickStatusStart(unit){
  let skip = false;
  if(unit.regen && !unit.fainted){
    const heal = Math.max(1, Math.round(unit.maxHp*unit.regen));
    unit.hp = Math.min(unit.maxHp, unit.hp+heal);
    logMsg(`🌿 ${unit.emoji} ${unit.name} regenerates ${heal} HP.`);
  }
  if(unit.status){
    if(unit.status.type==='burn'){
      const dmg = Math.max(1, Math.round(unit.maxHp*0.05));
      unit.hp = Math.max(0, unit.hp-dmg);
      logMsg(`🔥 ${unit.emoji} ${unit.name} takes ${dmg} burn damage.`);
      if(unit.hp<=0){ unit.fainted=true; logMsg(`${unit.emoji} ${unit.name} succumbs to its burns!`); }
    } else if(unit.status.type==='stun'){
      logMsg(`💫 ${unit.emoji} ${unit.name} is stunned and can't act!`);
      skip = true;
    }
    unit.status.turnsLeft--;
    if(unit.status.turnsLeft<=0) unit.status=null;
  }
  if(!skip && !unit.fainted && unit.glitchChance && Math.random()<unit.glitchChance){
    skip = true;
    const allies = state.battle.playerUnits.filter(u=>!u.fainted && u.id!==unit.id);
    if(unit.defectChance && allies.length>0 && Math.random()<unit.defectChance){
      const victim = allies[Math.floor(Math.random()*allies.length)];
      logMsg(`☢️ RUST DEFECTION! ${unit.emoji} ${unit.name}'s grafts seize control!`);
      applyDamage(unit, victim, false);
    } else {
      logMsg(`⚙️ RUST GLITCH! ${unit.emoji} ${unit.name} locks up and loses its turn.`);
    }
  }
  if(unit.taunt>0) unit.taunt--;
  return skip;
}

function nextTurn(){
  const b = state.battle;
  if(!b || b.result) return;
  b.awaitingInput = false;
  applySynergyRefresh();
  if(checkBattleEnd()) return;
  if(b.qIndex >= b.queue.length){ startRound(); return; }
  const unit = b.queue[b.qIndex];
  if(unit.fainted){ b.qIndex++; nextTurn(); return; }
  const stunned = tickStatusStart(unit);
  render();
  if(checkBattleEnd()) return;
  if(unit.fainted){ b.qIndex++; setTimeout(nextTurn, 300); return; }
  if(stunned){ setTimeout(()=>{ if(!battleActive(b)) return; b.qIndex++; render(); nextTurn(); }, 600); return; }
  if(unit.side==='enemy'){
    setTimeout(()=>{
      if(!battleActive(b)) return;
      enemyAct(unit); b.qIndex++; render();
      if(!checkBattleEnd()) setTimeout(nextTurn, 550);
    }, 500);
    return;
  }
  // player's turn — only now do we accept input
  b.awaitingInput = true;
  render();
}

function getValidTargets(unit){
  const b = state.battle;
  const opponents = (unit.side==='player' ? b.enemyUnits : b.playerUnits).filter(u=>!u.fainted);
  const taunters = opponents.filter(u=>u.taunt>0);
  if(unit.row==='front' && taunters.length>0) return taunters;
  const front = opponents.filter(u=>u.row==='front');
  const back = opponents.filter(u=>u.row==='back');
  if(unit.row==='front') return front.length>0 ? front : back;
  return front.concat(back);
}

function computeDamage(attacker, defender, isSkill){
  const baseAtk = isSkill ? attacker.atk*1.6 : attacker.atk;
  let dmg = Math.max(1, Math.round(baseAtk - defender.def*0.5));
  const m = multiplierVs(attacker, defender);
  const strikeElem = m.elem;
  dmg = Math.round(dmg * m.mult);
  let plated = false;
  if(defender.plating && strikeElem===defender.plating){
    dmg = Math.max(1, Math.round(dmg*(1-defender.platingPct)));
    plated = true;
  }
  if(attacker.baneElem){
    const dl2 = (defender.elements && defender.elements.length) ? defender.elements : [defender.element];
    if(dl2.indexOf(attacker.baneElem)>=0) dmg = Math.round(dmg*1.15);
  }
  let crit = false;
  if(Math.random() < 0.12 + (attacker.critBonus||0)){ dmg = Math.round(dmg*1.5); crit = true; }
  return { dmg, crit, plated, strikeElem };
}

function spendGauge(cost){
  const b = state.battle;
  b.gauge = Math.max(0, b.gauge - cost);
}
/* Shifts a unit's rust up or down and re-derives its glitch behaviour. */
function applyRust(unit, delta){
  unit.corruption = Math.max(0, unit.corruption + delta);
  const t = corrTier(unit.corruption);
  unit.glitchChance = t.glitch;
  unit.defectChance = t.defect;
}

function chargeGauge(amount){
  const b = state.battle;
  const totalHp = b.playerUnits.reduce((s,u)=>s+u.maxHp,0);
  const curHp = b.playerUnits.reduce((s,u)=>s+(u.fainted?0:u.hp),0);
  const desperate = totalHp>0 && (curHp/totalHp) < 0.4;
  b.gauge = Math.min(100, b.gauge + amount*(desperate?1.5:1));
}

function applyDamage(attacker, defender, isSkill){
  if(attacker.missChance && Math.random()<attacker.missChance){
    logMsg(`🌫️ ${attacker.emoji} ${attacker.name}'s attack is swallowed by the storm and misses!`);
    return;
  }
  if(defender.dodge && Math.random()<defender.dodge){
    logMsg(`💨 ${defender.emoji} ${defender.name} dodges the attack!`);
    return;
  }
  const {dmg, crit, plated, strikeElem} = computeDamage(attacker, defender, isSkill);
  let finalDmg = dmg, note = '';
  if(plated) note += ' (counter-plating holds)';
  if(defender.shield){ defender.shield=false; finalDmg=0; note=' — shield absorbs it!'; }
  else if(defender.firstHitReduction && !defender.firstHitUsed){ defender.firstHitUsed=true; finalDmg=Math.round(finalDmg*0.5); note += ' (tide ward halves the blow)'; }
  defender.hp = Math.max(0, defender.hp-finalDmg);
  if(defender.hp<=0) defender.fainted = true;
  const verb = isSkill ? attacker.skillName : 'attacks';
  const dual = (attacker.attackElements && attacker.attackElements.length>1) ? ` [${strikeElem}]` : '';
  logMsg(`${attacker.emoji} ${attacker.name} ${isSkill?'uses '+verb+' on':verb} ${defender.emoji} ${defender.name}${dual} for ${finalDmg}${crit?' (CRIT!)':''}${note}${defender.fainted?' — defeated!':''}`);

  if(attacker.side==='player' && defender.side==='enemy' && finalDmg>0){
    const b = state.battle;
    b.elemDamage[strikeElem] = (b.elemDamage[strikeElem]||0) + finalDmg;
  }
  if(attacker.side==='player' && finalDmg>0) chargeGauge(finalDmg/3);
  if(defender.side==='player' && finalDmg>0) chargeGauge(finalDmg/5);

  if(!defender.fainted && finalDmg>0){
    if(attacker.burnOnHit && Math.random()<attacker.burnOnHit) setStatus(defender,'burn',3);
    if(attacker.stunOnHit && Math.random()<attacker.stunOnHit) setStatus(defender,'stun',1);
    if(isSkill){
      if(strikeElem==='fire' && Math.random()<0.4) setStatus(defender,'burn',3);
      else if(strikeElem==='water' && Math.random()<0.4) setStatus(defender,'slow',2);
      else if(strikeElem==='volt' && Math.random()<0.45) setStatus(defender,'stun',1);
    }
  }
  if(isSkill){
    if(strikeElem==='earth'){ attacker.taunt=2; logMsg(`🪨 ${attacker.emoji} ${attacker.name} braces and draws the enemy's aim!`); }
    else if(strikeElem==='nature'){ attacker.shield=true; logMsg(`🌿 ${attacker.emoji} ${attacker.name} wraps itself in thorns!`); }
    else if(strikeElem==='wind' && Math.random()<0.4){ attacker.shield=true; logMsg(`🌪️ ${attacker.emoji} ${attacker.name} whips up an evasive gust!`); }
    if(attacker.backfireChance && Math.random()<attacker.backfireChance){
      const allies = (attacker.side==='player'? state.battle.playerUnits : state.battle.enemyUnits).filter(u=>!u.fainted && u.id!==attacker.id);
      if(allies.length>0){
        const ally = allies[Math.floor(Math.random()*allies.length)];
        const backDmg = Math.max(1, Math.round(dmg*0.3));
        ally.hp = Math.max(0, ally.hp-backDmg);
        if(ally.hp<=0) ally.fainted = true;
        logMsg(`⚡ Short circuit! ${ally.emoji} ${ally.name} also takes ${backDmg} damage.`);
      }
    }
  }
}

function enemyAct(unit){
  if(unit.skillCd>0) unit.skillCd--;
  const targets = getValidTargets(unit);
  if(targets.length===0) return;
  targets.sort((a,c)=>a.hp-c.hp);
  const target = targets[0];
  const useSkill = unit.skillCd<=0 && Math.random()<0.5;
  if(useSkill) unit.skillCd = unit.skillMaxCd;
  applyDamage(unit, target, useSkill);
}

/* ============ PLAYER ACTIONS ============ */
function playerChooseAction(kind){
  const b = state.battle;
  if(!battleActive(b) || !b.awaitingInput) return;
  if(kind==='gauge_overdrive'){ useGaugeOverdrive(); return; }
  if(kind==='gauge_rally'){ useGaugeRally(); return; }
  if(kind==='shift'){ playerShift(); return; }
  b.pendingAction = kind;
  render();
}

function shiftDestination(unit){ return unit.row==='front' ? 'back' : 'front'; }
function playerShift(){
  const b = state.battle;
  const unit = b.queue[b.qIndex];
  if(!unit) return;
  const dest = shiftDestination(unit);
  const occupants = b.playerUnits.filter(u=>u.row===dest && !u.fainted);
  if(occupants.length < 3){ doShift(unit, null); return; }
  b.pendingAction = 'shift';
  render();
}
function doShift(unit, ally){
  const b = state.battle;
  b.awaitingInput = false;
  const dest = shiftDestination(unit);
  if(ally) ally.row = unit.row;
  unit.row = dest;
  logMsg(`🔀 ${unit.emoji} ${unit.name} shifts to the ${dest.toUpperCase()} line${ally?`, trading places with ${ally.emoji} ${ally.name}`:''}.`);
  applySynergyRefresh();
  b.pendingAction = null;
  b.qIndex++;
  render();
  if(checkBattleEnd()) return;
  setTimeout(nextTurn, 500);
}

function useGaugeOverdrive(){
  const b = state.battle;
  b.awaitingInput = false;
  spendGauge(GAUGE_COST.overdrive);
  logMsg('⚡⚡ LEGION OVERDRIVE! The whole legion strikes as one!');
  b.playerUnits.filter(u=>!u.fainted).forEach(u=>{
    const targets = b.enemyUnits.filter(t=>!t.fainted);
    if(targets.length===0) return;
    const target = targets[Math.floor(Math.random()*targets.length)];
    applyDamage(u, target, false);
  });
  b.qIndex++;
  render();
  if(checkBattleEnd()) return;
  setTimeout(nextTurn, 700);
}
function useGaugeRally(){
  const b = state.battle;
  b.awaitingInput = false;
  spendGauge(GAUGE_COST.rally);
  logMsg('🛡✨ RALLY! The legion braces as one — shields up, afflictions burned off.');
  b.playerUnits.filter(u=>!u.fainted).forEach(u=>{
    u.shield=true; u.status=null;
    if(u.corruption>0) applyRust(u, -8);
  });
  b.qIndex++;
  render();
  setTimeout(nextTurn, 500);
}

function playerTarget(targetId){
  const b = state.battle;
  if(!battleActive(b) || !b.awaitingInput) return;
  const unit = b.queue[b.qIndex];
  const target = b.enemyUnits.concat(b.playerUnits).find(u=>u.id===targetId);
  if(!unit || !target) return;
  b.awaitingInput = false;

  if(b.pendingAction==='shift'){ doShift(unit, target); return; }

  if(b.pendingAction==='gauge_purge'){
    spendGauge(GAUGE_COST.purge);
    const hadStatus = !!target.status;
    target.status = null;
    const rustBefore = target.corruption;
    if(rustBefore>0) applyRust(target, -12);
    logMsg(`🔧 PURGE! ${target.emoji} ${target.name} is stripped down and reset${hadStatus?' — afflictions cleared':''}${rustBefore>0?` — rust ${rustBefore} → ${target.corruption}`:''}.`);
    b.pendingAction = null; b.qIndex++;
    render();
    if(checkBattleEnd()) return;
    setTimeout(nextTurn, 450);
    return;
  }

  if(b.pendingAction==='gauge_alpha'){
    spendGauge(GAUGE_COST.alpha);
    logMsg(`✨💥 ${unit.emoji} ${unit.name} unleashes an ALPHA STRIKE!`);
    const raw = Math.max(1, Math.round(unit.atk*2.5 - target.def*0.5));
    const am = multiplierVs(unit, target);
    let finalBig = Math.round(raw * am.mult);
    if(target.plating && am.elem===target.plating) finalBig = Math.max(1, Math.round(finalBig*(1-target.platingPct)));
    target.hp = Math.max(0, target.hp-finalBig);
    if(target.hp<=0) target.fainted = true;
    b.elemDamage[am.elem] = (b.elemDamage[am.elem]||0) + finalBig;
    logMsg(`${target.emoji} ${target.name} takes ${finalBig} damage!${target.fainted?' — defeated!':''}`);
    b.pendingAction = null; b.qIndex++;
    render();
    if(checkBattleEnd()) return;
    setTimeout(nextTurn, 500);
    return;
  }

  const isSkill = b.pendingAction==='skill';
  if(isSkill) unit.skillCd = unit.skillMaxCd;
  else if(unit.skillCd>0) unit.skillCd--;
  applyDamage(unit, target, isSkill);
  b.pendingAction = null; b.qIndex++;
  render();
  if(checkBattleEnd()) return;
  setTimeout(nextTurn, 450);
}

/* ============ END OF BATTLE ============ */
function dominantFromElemDamage(map){
  let best=null, bd=0;
  Object.entries(map).forEach(([e,d])=>{ if(d>bd){ bd=d; best=e; } });
  return best;
}

function stageExp(){ return 8 + state.stage*2; }
function awardExp(units, amount){
  const levelled = [];
  units.forEach(u=>{
    const m = findMonster(u.monsterUid);
    if(!m) return;
    const before = m.level;
    m.exp += amount;
    let need = m.level*10;
    while(m.exp>=need){ m.exp-=need; m.level++; need=m.level*10; }
    if(m.level>before) levelled.push(computeStats(m).name+' Lv.'+m.level);
  });
  return levelled;
}

function endBattle(result){
  const b = state.battle;
  b.result = result;
  if(result==='win'){
    const expGain = stageExp();
    const levelled = awardExp(b.playerUnits, expGain);

    // --- Rustbound intel: they study what actually hurt them ---
    const dom = dominantFromElemDamage(b.elemDamage);
    if(dom){
      state.intel.history.push(dom);
      if(state.intel.history.length>5) state.intel.history.shift();
    }
    state.intel.wins++;

    // --- Salvage from the wreckage (elite waves are stripped twice over) ---
    const drops = [];
    const pulls = isEliteStage(state.stage) ? 2 : 1;
    for(let d=0; d<pulls; d++){
      if(state.parts.length>=14) break;
      if(d===0 && !isEliteStage(state.stage) && Math.random()>=0.7) break;
      const keys = b.enemyUnits.map(u=>u.speciesKey).filter(Boolean);
      if(!keys.length) break;
      const drop = { uid: uid(), key: keys[Math.floor(Math.random()*keys.length)] };
      state.parts.push(drop);
      drops.push(drop);
    }
    const part = drops.length ? drops[0] : null;

    let captured = null;
    const recruitChance = isEliteStage(state.stage) ? 1 : (isDeep(state.stage) ? 0.6 : 0.45);
    if(Math.random()<recruitChance && state.roster.length<18){
      // Recruits skew toward tribes already in your legion, so duplicates accumulate
      // and the evolution ladder (pair -> Prime, three Primes -> Ascended) can actually be climbed.
      const owned = state.roster.map(m=>m.speciesId).filter(id=>SPECIES[id]);
      const id = (owned.length && Math.random()<0.55)
        ? owned[Math.floor(Math.random()*owned.length)]
        : SPECIES_IDS[Math.floor(Math.random()*SPECIES_IDS.length)];
      captured = newMonster(id,1,1);
      state.roster.push(captured);
    }
    state.lastResult = { win:true, expGain, captured, part, drops, dom, nextAdapt: currentAdaptation(), levelled,
                         finale: state.stage===CAMPAIGN_LENGTH, elite: isEliteStage(state.stage) };
  } else {
    // A defeat still teaches the legion something — otherwise a loss is unrecoverable.
    const expGain = Math.max(1, Math.round(stageExp()*0.5));
    const levelled = awardExp(b.playerUnits, expGain);
    state.lastResult = { win:false, expGain, levelled };
  }
  autosave();
  state.screen = 'result';
  render();
}

/* ============ BATTLE RENDER ============ */
function statusIconLine(u){
  const icons = [];
  if(u.status && u.status.type==='burn') icons.push('🔥'+u.status.turnsLeft);
  if(u.status && u.status.type==='slow') icons.push('🐌'+u.status.turnsLeft);
  if(u.status && u.status.type==='stun') icons.push('💫');
  if(u.shield) icons.push('🛡');
  if(u.taunt>0) icons.push('👊'+u.taunt);
  return icons.join(' ');
}
function renderUnit(u, activeId, validTargetIds){
  const pct = Math.max(0, Math.round((u.hp/u.maxHp)*100));
  const selectable = validTargetIds && validTargetIds.includes(u.id) && !u.fainted;
  const allyPick = selectable && u.side==='player';
  return `
  <div class="unit ${u.fainted?'fainted':''} ${u.id===activeId?'active':''} ${selectable?(allyPick?'allytarget':'targetable'):''}"
       ${selectable?`onclick="playerTarget('${u.id}')"`:''}>
    ${u.plating?`<div class="plate-tag" title="counter-plating">▣</div>`:''}
    ${u.corruption?`<div class="rust-tag" title="rust ${u.corruption}">⚙</div>`:''}
    ${u.trait&&!u.corruption?`<div class="rust-tag" style="color:var(--volt)" title="${traitName(u.trait)}: ${traitDesc(u.trait)}">${TRAITS[u.trait.key].emoji}</div>`:''}
    <div class="emoji">${u.emoji}</div>
    <div class="uname">${u.name}</div>
    <div class="hpbar-bg"><div class="hpbar-fill ${pct<30?'low':''}" style="width:${pct}%"></div></div>
    <div class="cd-tag">${u.fainted?'DOWN':(u.skillCd>0?'skill:'+u.skillCd:'skill ready')}</div>
    <div class="status-tag">${statusIconLine(u)}</div>
  </div>`;
}

function renderBattle(){
  const b = state.battle;
  const activeUnit = b.qIndex<b.queue.length ? b.queue[b.qIndex] : null;
  const isPlayerTurn = activeUnit && activeUnit.side==='player' && !activeUnit.fainted && b.awaitingInput;
  let validTargetIds = [];
  if(isPlayerTurn && b.pendingAction==='shift'){
    const dest = shiftDestination(activeUnit);
    validTargetIds = b.playerUnits.filter(u=>u.row===dest && !u.fainted).map(u=>u.id);
  } else if(isPlayerTurn && b.pendingAction==='gauge_purge'){
    validTargetIds = b.playerUnits.filter(u=>!u.fainted).map(u=>u.id);
  } else if(isPlayerTurn && b.pendingAction==='gauge_alpha'){
    validTargetIds = b.enemyUnits.filter(u=>!u.fainted).map(u=>u.id);
  } else if(isPlayerTurn && b.pendingAction){
    validTargetIds = getValidTargets(activeUnit).map(u=>u.id);
  }

  const enemyRows = `
    <div class="side-label">🤖 RUSTBOUND FORCES${b.plating?` <span style="color:var(--water)">▣ ${b.plating}-plated</span>`:''}</div>
    <div class="unit-row">${b.enemyUnits.filter(u=>u.row==='back').map(u=>renderUnit(u, activeUnit?activeUnit.id:null, validTargetIds)).join('')}</div>
    <div class="unit-row">${b.enemyUnits.filter(u=>u.row==='front').map(u=>renderUnit(u, activeUnit?activeUnit.id:null, validTargetIds)).join('')}</div>`;

  const playerRows = `
    <div class="unit-row">${b.playerUnits.filter(u=>u.row==='front').map(u=>renderUnit(u, activeUnit?activeUnit.id:null, validTargetIds)).join('')}</div>
    <div class="rowsyn">${b.synLabels.front?'✨ FRONT '+b.synLabels.front:''}</div>
    <div class="unit-row">${b.playerUnits.filter(u=>u.row==='back').map(u=>renderUnit(u, activeUnit?activeUnit.id:null, validTargetIds)).join('')}</div>
    <div class="rowsyn">${b.synLabels.back?'✨ BACK '+b.synLabels.back:''}</div>
    <div class="side-label">🛡 YOUR LEGION</div>`;

  let actionHtml = '';
  if(isPlayerTurn){
    if(!b.pendingAction){
      const dest = shiftDestination(activeUnit);
      actionHtml = `
      <div class="actionbar">
        <button class="btn primary" onclick="playerChooseAction('attack')">⚔ Attack</button>
        <button class="btn" ${activeUnit.skillCd>0?'disabled':''} onclick="playerChooseAction('skill')">✨ ${activeUnit.skillName} ${activeUnit.skillCd>0?'('+activeUnit.skillCd+')':''}</button>
        <button class="btn" onclick="playerChooseAction('shift')">🔀 Shift to ${dest.toUpperCase()}</button>
        ${b.gauge>=GAUGE_COST.purge ? `<button class="btn primary" onclick="playerChooseAction('gauge_purge')">🔧 Purge <span class="cost">−${GAUGE_COST.purge}</span></button>` : ''}
        ${b.gauge>=GAUGE_COST.rally ? `<button class="btn primary" onclick="playerChooseAction('gauge_rally')">🛡 Rally <span class="cost">−${GAUGE_COST.rally}</span></button>` : ''}
        ${b.gauge>=GAUGE_COST.overdrive ? `
          <button class="btn primary" onclick="playerChooseAction('gauge_overdrive')">⚡⚡ Overdrive <span class="cost">−${GAUGE_COST.overdrive}</span></button>
          <button class="btn primary" onclick="playerChooseAction('gauge_alpha')">💥 Alpha Strike <span class="cost">−${GAUGE_COST.alpha}</span></button>
        ` : ''}
      </div>`;
    } else if(b.pendingAction==='shift'){
      actionHtml = `<p class="dim">The ${shiftDestination(activeUnit).toUpperCase()} line is full — pick an ally to trade places with... <span style="cursor:pointer; color:var(--danger);" onclick="state.battle.pendingAction=null; render();">[cancel]</span></p>`;
    } else {
      const cancel = `<span style="cursor:pointer; color:var(--danger);" onclick="state.battle.pendingAction=null; render();">[cancel]</span>`;
      if(b.pendingAction==='gauge_purge'){
        actionHtml = `<p class="dim">Choose an ally to strip down and purge... ${cancel}</p>`;
      } else {
        const label = b.pendingAction==='skill' ? activeUnit.skillName : (b.pendingAction==='gauge_alpha' ? 'Alpha Strike' : 'attack');
        actionHtml = `<p class="dim">Choose a target for ${activeUnit.name}'s ${label}... ${cancel}</p>`;
      }
    }
  } else if(activeUnit){
    actionHtml = `<p class="dim">${activeUnit.side==='enemy' ? 'Enemy is acting...' : 'Resolving...'}</p>`;
  }

  return `
  <div class="panel">
    <h2 class="section">${isDeep(state.stage)?`DEPTH ${deepDepth(state.stage)}`:`STAGE ${state.stage}`} — BATTLE${isEliteStage(state.stage)?' <span style="color:var(--danger)">☠ ELITE</span>':''}</h2>
    <div class="terrain-banner">🗺 ${b.terrain.name}: ${b.terrain.desc}</div>
    <div class="gauge-wrap">
      <div class="gauge-label">LEGION GAUGE ${Math.floor(b.gauge)}% <span class="dim" style="font-size:13px;">— 🔧33 · 🛡66 · ⚡100</span></div>
      <div class="gauge-bg">
        <div class="gauge-fill ${b.gauge>=100?'full':''}" style="width:${Math.floor(b.gauge)}%"></div>
        <div class="gauge-tick" style="left:${GAUGE_COST.purge}%"></div>
        <div class="gauge-tick" style="left:${GAUGE_COST.rally}%"></div>
      </div>
    </div>
    <div class="battlefield">
      ${enemyRows}
      <div style="border-top:2px dashed var(--border); margin:6px 0;"></div>
      ${playerRows}
    </div>
  </div>
  <div class="panel">
    ${actionHtml}
    <div id="log">${b.log.map(m=>`<div>${m}</div>`).join('')}</div>
  </div>`;
}

/* ============ RESULT ============ */
function renderResult(){
  const r = state.lastResult;
  if(r.win && r.finale){
    return `
    <div class="panel finale" style="text-align:center;">
      <h1 class="title">THE GATE FALLS</h1>
      <div class="heading" style="font-size:11px; color:var(--dim); margin-bottom:14px;">CAMPAIGN COMPLETE</div>
      <p>The forward base burns behind you. Texel breathes again — the tribes hold the surface, and the Rustbound advance is broken.</p>
      <div class="storytext">But the gate opened onto a stairwell, and the stairwell goes down. Whatever built the horde is still down there, still building.</div>
      <p class="dim">Your legion, its salvage and every splice carry onward. The Deep scales without end: elite waves every fifth depth, richer wreckage, and recruits enough to finish an evolution ladder.</p>
      <div class="row" style="justify-content:center; margin-top:14px;">
        <button class="btn primary" style="font-size:22px;" onclick="advanceStage()">⬇ DESCEND INTO THE DEEP</button>
      </div>
    </div>`;
  }
  if(r.win){
    const pd = r.part ? PARTS[r.part.key] : null;
    return `
    <div class="panel" style="text-align:center;">
      <h1 class="title" style="font-size:20px;">${r.elite?'ELITE WAVE BROKEN!':'VICTORY!'}</h1>
      <p>Your legion held the line at ${isDeep(state.stage)?`Depth ${deepDepth(state.stage)}`:`Stage ${state.stage}`}.</p>
      <p class="dim">Each deployed monster gained ${r.expGain} EXP.</p>
      ${r.levelled && r.levelled.length ? `<p style="color:var(--gold)">⬆ Level up: ${r.levelled.join(', ')}</p>` : ''}
      ${r.captured ? `<p>A wild <b>${getSpeciesData(r.captured.speciesId,1).name}</b> ${getSpeciesData(r.captured.speciesId,1).emoji} joined your roster${r.captured.trait?` — <span style="color:var(--volt)">${TRAITS[r.captured.trait.key].emoji} ${traitName(r.captured.trait)}</span> (${traitDesc(r.captured.trait)})`:''}!</p>` : ''}
      ${(r.drops&&r.drops.length) ? `<p style="color:var(--rust)">⚙ Stripped from the wreckage: ${r.drops.map(d=>`<b>${PARTS[d.key].emoji} ${PARTS[d.key].name}</b>`).join(' + ')}</p>` : ''}
      ${r.dom ? `<p class="dim">📡 The Rustbound log your <b>${r.dom.toUpperCase()}</b> assault. Next deployment they will expect <b>${(r.nextAdapt||r.dom).toUpperCase()}</b>.</p>` : ''}
      <button class="btn primary" style="margin-top:10px;" onclick="advanceStage()">${isDeep(state.stage)?'Descend further →':'Continue →'}</button>
    </div>`;
  }
  return `
  <div class="panel" style="text-align:center;">
    <h1 class="title" style="font-size:20px; color:var(--danger);">DEFEAT</h1>
    <p>Your legion was overrun. The Rustbound advance no further today, but neither do you.</p>
    <p class="dim">Your survivors studied the enemy through the rout — each deployed monster gained ${r.expGain} EXP.</p>
    ${r.levelled && r.levelled.length ? `<p style="color:var(--gold)">⬆ Level up: ${r.levelled.join(', ')}</p>` : ''}
    <p class="dim">Adjust your formation, re-plate your beasts, and go again.</p>
    <button class="btn primary" style="margin-top:10px;" onclick="retryStage()">Retry ${isDeep(state.stage)?`Depth ${deepDepth(state.stage)}`:`Stage ${state.stage}`} →</button>
  </div>`;
}
function advanceStage(){
  state.stage++;
  if(isDeep(state.stage)) state.bestDepth = Math.max(state.bestDepth||0, deepDepth(state.stage));
  state.battle=null; state.screen='hub';
  autosave();
  render();
}
function retryStage(){ state.battle=null; state.screen='hub'; render(); }

/* ============ INIT ============ */
render();
try{ cloudInit(); }catch(e){ cloud.status = cloudConfigured() ? 'error' : 'off'; }
</script>
</body>
</html>
