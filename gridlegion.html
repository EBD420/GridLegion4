<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Legion: Rise of the Rustbound</title>
<!-- Vercel Web Analytics — this is a single static HTML file with no build
     step and no npm dependencies (see README), so this uses Vercel's plain
     script-tag integration instead of the @vercel/analytics npm package,
     which needs a bundler. Vercel serves this path automatically once Web
     Analytics is turned on for the project; nothing else to wire up. -->
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #06080b;
    --bg2: #0c1117;
    --panel: #10161d;
    --panel-hi: #1a232c;
    --border: #2a3f4c;
    --text: #dff4f0;
    --dim: #7794a1;
    --fire: #ff6a45;
    --water: #2fd9ff;
    --nature: #4dffb2;
    --earth: #d6a25c;
    --volt: #f5e64c;
    --wind: #b79dff;
    --danger: #ff3366;
    --gold: #ffb238;
    --rust: #e2884a;
    --glow: #2fe6ff;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -8%, rgba(47,230,255,0.07), transparent 60%),
      linear-gradient(rgba(47,230,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47,230,255,0.04) 1px, transparent 1px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    background-size: auto, 32px 32px, 32px 32px, auto;
    background-attachment: fixed;
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 20px;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 14px 10px 40px;
  }
  .heading{ font-family:'Orbitron', sans-serif; font-weight:700; letter-spacing:1px; }
  #app{ width: 100%; max-width: 640px; }
  .panel{
    background: linear-gradient(180deg, var(--panel), var(--bg2));
    border: 1px solid var(--border);
    position: relative;
    box-shadow: 0 0 0 1px rgba(47,230,255,0.05), 0 10px 26px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
    padding: 16px;
    margin-bottom: 14px;
  }
  .panel::before, .panel::after{
    content:''; position:absolute; width:14px; height:14px; pointer-events:none;
    border: 2px solid var(--glow); opacity:0.5;
  }
  .panel::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .panel::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  h1.title{ font-family:'Orbitron', sans-serif; font-weight:900; font-size: 22px; line-height:1.6; color: var(--gold); letter-spacing:2px; text-shadow: 0 0 14px rgba(255,178,56,0.55), 0 0 3px rgba(255,178,56,0.8); margin: 6px 0 4px; }
  h2.section{ font-family:'Orbitron', sans-serif; font-weight:700; font-size: 13px; color: var(--glow); margin: 0 0 12px; letter-spacing: 1.5px; padding-bottom:6px; border-bottom:1px solid rgba(47,230,255,0.18); text-shadow: 0 0 6px rgba(47,230,255,0.4); }
  p{ line-height:1.5; color: var(--text); }
  .dim{ color: var(--dim); }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{
    font-family:'VT323', monospace; font-size: 20px;
    background: linear-gradient(180deg, var(--panel-hi), var(--panel));
    color: var(--text);
    border: 1px solid var(--border); padding: 10px 16px; cursor:pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    transition: border-color 0.12s, box-shadow 0.12s, transform 0.05s;
  }
  .btn:hover{ border-color: var(--glow); box-shadow: 0 0 10px rgba(47,230,255,0.35), 0 2px 6px rgba(0,0,0,0.5); }
  .btn:active{ transform: translateY(1px); box-shadow: inset 0 2px 6px rgba(0,0,0,0.6); }
  .btn.primary{ background: linear-gradient(180deg, #2c2010, var(--panel)); border-color: var(--gold); color: var(--gold); box-shadow: 0 0 10px rgba(255,178,56,0.25), 0 2px 6px rgba(0,0,0,0.5); }
  .btn.primary:hover{ box-shadow: 0 0 18px rgba(255,178,56,0.45), 0 2px 6px rgba(0,0,0,0.5); }
  .btn.danger{ border-color: var(--danger); color: var(--danger); }
  .btn.rust{ border-color: var(--rust); color: var(--rust); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn.small{ font-size:16px; padding:6px 10px; }
  .cost{ font-size:14px; opacity:0.75; }
  .trait-tag{ font-size:11px; color:var(--volt); border:1px solid var(--volt); padding:0 3px; margin-top:3px; line-height:1.3; text-shadow:0 0 4px rgba(245,230,76,0.5); }
  .tier3tag{ position:absolute; top:2px; right:2px; font-size:11px; color:var(--fire); }
  .elite-banner{ font-size:16px; color:var(--danger); border:1px dashed var(--danger); padding:8px; margin-bottom:10px; line-height:1.4; box-shadow: inset 0 0 12px rgba(255,51,102,0.08); }
  .slotcard{ background:var(--bg2); border:1px solid var(--border); padding:10px; width:190px; }
  .slotname{ font-size:19px; color:var(--gold); }
  .testbox{ background:#050709; border:1px solid var(--border); padding:8px; margin-top:10px; font-size:16px; line-height:1.5; box-shadow: inset 0 1px 4px rgba(0,0,0,0.6); }
  .tinput{
    font-family:'VT323', monospace; font-size:18px; width:100%; background:#050709; color:var(--text);
    border:1px solid var(--border); padding:6px 8px; margin-top:4px;
  }
  .tinput:focus{ outline:none; border-color:var(--glow); box-shadow:0 0 8px rgba(47,230,255,0.35); }
  .finale{ border-color: var(--gold); box-shadow: 0 0 24px 4px rgba(255,178,56,0.3), 0 10px 26px rgba(0,0,0,0.55); }

  .mcard{
    background: var(--bg2); border: 1px solid var(--border); padding: 8px; width: 96px; text-align:center; cursor:pointer; position:relative;
  }
  .mcard.selected{ border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset, 0 0 10px rgba(255,178,56,0.35); }
  .mcard .emoji{ font-size: 30px; line-height:1; }
  .mcard .name{ font-size:14px; margin-top:4px; height: 32px; overflow:hidden; }
  .mcard .lvl{ font-size:13px; color:var(--gold); }
  .mcard .tier2tag{ position:absolute; top:2px; right:2px; font-size:11px; color:var(--gold); }
  .elem-tag{ display:inline-block; font-size:11px; padding:1px 5px; margin-top:3px; border:1px solid; text-shadow:0 0 4px currentColor; }
  .elem-fire{ color:var(--fire); border-color:var(--fire); }
  .elem-water{ color:var(--water); border-color:var(--water); }
  .elem-nature{ color:var(--nature); border-color:var(--nature); }
  .elem-earth{ color:var(--earth); border-color:var(--earth); }
  .elem-volt{ color:var(--volt); border-color:var(--volt); }
  .elem-wind{ color:var(--wind); border-color:var(--wind); }

  .formation{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .frow{ display:flex; gap:8px; align-items:center; }
  .frow .label{ width:56px; font-size:14px; color:var(--dim); align-self:center; }
  .slot{
    width: 78px; height: 78px; border: 1px dashed var(--border); background: var(--bg2);
    display:flex; align-items:center; justify-content:center; flex-direction:column; cursor:pointer; font-size:28px; text-align:center;
  }
  .slot.filled{ border-style:solid; border-color:var(--border); }
  .slot .slvl{ font-size:12px; color:var(--gold); }
  .synergy-tag{ font-size:12px; color:var(--gold); margin-left:64px; margin-top:-4px; margin-bottom:2px; text-shadow:0 0 4px rgba(255,178,56,0.4); }

  /* A positioned battlefield: two facing lanes (player left, enemy right)
     either side of a center divider. Within a side the FRONT formation row
     sits nearest the divider (where the clash actually happens) and the
     BACK row sits further out — real left/right coordinates so an attack
     can lunge toward the opposing side and a hit can knock back away from
     it, instead of everyone just sitting in one generic stacked block. */
  .battlefield{ display:flex; align-items:flex-start; justify-content:center; gap:0; }
  .bf-side{ display:flex; flex-direction:column; flex:1; min-width:0; }
  .bf-side-head{ font-size:14px; color:var(--dim); text-align:center; margin-bottom:6px; }
  .bf-cols{ display:flex; flex-direction:row; gap:8px; flex-wrap:wrap; }
  .bf-side.player .bf-cols{ justify-content:flex-end; }
  .bf-side.enemy .bf-cols{ justify-content:flex-start; }
  .bf-divider{ align-self:stretch; width:2px; margin:0 12px; flex:none;
    background:repeating-linear-gradient(to bottom, var(--border) 0 6px, transparent 6px 13px); }
  .side-label{ font-size:14px; color:var(--dim); text-align:center; margin:2px 0; }
  .rowsyn{ font-size:12px; color:var(--gold); text-align:center; min-height:14px; }
  .unit-row{ display:flex; flex-direction:column; gap:6px; align-items:center; }
  .unit{
    width: 86px; background: var(--bg2); border:1px solid var(--border); padding:6px 4px; text-align:center; position:relative;
  }
  .unit.fainted{ opacity:0.25; }
  .unit.active{ border-color: var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .unit.targetable{ border-color: var(--danger); cursor:pointer; box-shadow: 0 0 8px rgba(255,51,102,0.3); }
  .unit.allytarget{ border-color: var(--water); cursor:pointer; box-shadow: 0 0 8px rgba(47,217,255,0.3); }
  /* The sprite lives in its own inner wrapper so a one-shot attack
     lunge/knockback (JS-driven, added post-render like flash-hit below)
     never fights the sprite's own always-on idle bob for the `animation`
     shorthand — they're different elements, so both run at once instead of
     one silently overwriting the other. */
  .unit-motion{ display:inline-block; }
  .unit .emoji{ font-size:26px; animation: idlebob 2.6s ease-in-out infinite; }
  .unit.fainted .emoji{ animation:none; }
  @keyframes idlebob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }
  @keyframes lungeR{ 0%,100%{ transform:translateX(0); } 45%{ transform:translateX(16px); } }
  @keyframes lungeL{ 0%,100%{ transform:translateX(0); } 45%{ transform:translateX(-16px); } }
  @keyframes knockR{ 0%,100%{ transform:translateX(0); } 35%{ transform:translateX(10px); } }
  @keyframes knockL{ 0%,100%{ transform:translateX(0); } 35%{ transform:translateX(-10px); } }
  .unit-motion.lunge-right{ animation: lungeR 0.34s ease-out 1; }
  .unit-motion.lunge-left{ animation: lungeL 0.34s ease-out 1; }
  .unit-motion.knock-right{ animation: knockR 0.3s ease-out 1; }
  .unit-motion.knock-left{ animation: knockL 0.3s ease-out 1; }
  /* Element-themed hit particles — a short burst spawned in the #fx overlay
     at the moment of a real (non-blocked, non-missed) hit, one shape+color
     per element so a strike actually reads as fire/water/nature/... */
  .particle{ position:absolute; width:8px; height:8px; pointer-events:none; animation: particleburst 0.55s ease-out forwards; }
  @keyframes particleburst{ 0%{ opacity:1; transform:translate(0,0) scale(1); } 100%{ opacity:0; transform:translate(var(--tx),var(--ty)) scale(0.5); } }
  .particle-fire{ background:var(--fire); border-radius:50%; box-shadow:0 0 6px var(--fire); }
  .particle-water{ background:var(--water); border-radius:50% 50% 50% 0; transform:rotate(45deg); }
  .particle-nature{ background:var(--nature); border-radius:0 100% 0 100%; }
  .particle-earth{ width:7px; height:7px; background:var(--earth); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
  .particle-volt{ width:3px; height:13px; background:var(--volt); box-shadow:0 0 6px var(--volt); }
  .particle-wind{ width:15px; height:3px; border-radius:2px; background:var(--wind); opacity:0.85; }
  /* Turn-order timeline — a live strip of who acts next, reflecting
     b.queue/b.qIndex, updated on every battle render. */
  .turnline{ display:flex; gap:6px; align-items:center; overflow-x:auto; padding:6px 2px; margin-bottom:10px; }
  .turnline-label{ font-size:11px; color:var(--dim); letter-spacing:1px; margin-right:2px; flex:none; }
  .turn-chip{ flex:none; width:34px; height:34px; border:1px solid var(--border); background:var(--bg2); display:flex; align-items:center; justify-content:center; position:relative; }
  .turn-chip.enemy{ border-color: rgba(255,51,102,0.4); }
  .turn-chip.player{ border-color: rgba(47,217,255,0.4); }
  .turn-chip.now{ border-color:var(--gold); box-shadow:0 0 8px rgba(255,178,56,0.5); }
  .turn-chip svg{ width:22px !important; height:22px !important; }
  .turn-chip-arrow{ flex:none; color:var(--dim); font-size:13px; }
  .unit .uname{ font-size:12px; height:28px; overflow:hidden; }
  .hpbar-bg{ height:8px; background:#050709; border:1px solid var(--border); margin-top:3px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.7); }
  .hpbar-fill{ height:100%; background: var(--nature); box-shadow: 0 0 6px var(--nature); }
  .hpbar-fill.low{ background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .cd-tag{ font-size:10px; color:var(--dim); }
  .status-tag{ font-size:12px; margin-top:2px; min-height:14px; }
  .plate-tag{ position:absolute; top:1px; left:2px; font-size:11px; color:var(--water); }
  .unit.boss{ width:124px; border-color:var(--danger); box-shadow:0 0 12px rgba(255,51,102,0.4); }
  .unit.boss .emoji{ font-size:34px; }
  .unit.gen{ width:74px; border-color:var(--water); }
  .unit.ace{ border-color: var(--gold); box-shadow:0 0 12px rgba(255,178,56,0.45); }
  .shield-tag{ position:absolute; top:-9px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--water); background:var(--bg2); border:1px solid var(--water); padding:0 3px; white-space:nowrap; }
  .misscard{ background:var(--bg2); border:1px solid var(--border); padding:10px; width:280px; }
  .misscard.done{ border-color:var(--nature); box-shadow: 0 0 8px rgba(77,255,178,0.25); }
  .planbox{ background:#050709; border:1px solid var(--border); padding:8px; margin-bottom:8px; font-size:17px; line-height:1.6; }
  .planrow{ padding:2px 0; }
  .planrow.sel{ background:var(--panel-hi); }
  .coach{
    background: #0c1a24; border:1px solid var(--water); border-left-width:4px;
    padding:12px 14px; margin-bottom:14px; font-size:19px; line-height:1.45;
    box-shadow: 0 0 14px rgba(47,217,255,0.15), 0 10px 22px rgba(0,0,0,0.5);
  }
  .coach-title{ font-family:'Orbitron', sans-serif; font-weight:700; font-size: 13px; color: var(--water); letter-spacing:1.5px; margin-bottom:6px; }
  #fx{ position:fixed; inset:0; pointer-events:none; z-index:50; }
  .floater{
    position:absolute; transform:translate(-50%,0); font-family:'VT323',monospace;
    font-size:26px; font-weight:bold; text-shadow:0 0 6px currentColor, 2px 2px 0 #000; white-space:nowrap;
    animation: floatup 0.9s ease-out forwards;
  }
  .floater.dmg{ color: var(--gold); }
  .floater.hurt{ color: var(--danger); }
  .floater.crit{ color: #fff; font-size:34px; text-shadow:0 0 10px var(--danger), 2px 2px 0 #000; }
  .floater.heal{ color: var(--nature); }
  .floater.miss{ color: var(--dim); font-size:20px; }
  @keyframes floatup{
    0%   { opacity:0; transform:translate(-50%,6px) scale(0.7); }
    18%  { opacity:1; transform:translate(-50%,-6px) scale(1.15); }
    100% { opacity:0; transform:translate(-50%,-42px) scale(1); }
  }
  .unit.flash-hit{ animation: flashhit 0.22s steps(2,end) 2; }
  .unit.flash-heal{ animation: flashheal 0.22s ease-out 1; }
  @keyframes flashhit{ 0%,100%{ filter:none; } 50%{ filter:brightness(2.4) saturate(0.2); } }
  @keyframes flashheal{ 0%,100%{ filter:none; } 50%{ filter:brightness(1.5) hue-rotate(40deg); } }
  #app.shake{ animation: shk 0.18s linear 1; }
  #app.shake-hard{ animation: shkh 0.32s linear 1; }
  @keyframes shk{ 0%,100%{transform:translate(0,0);} 25%{transform:translate(-3px,2px);} 75%{transform:translate(3px,-2px);} }
  @keyframes shkh{ 0%,100%{transform:translate(0,0);} 15%{transform:translate(-7px,3px);} 35%{transform:translate(6px,-4px);} 55%{transform:translate(-5px,-2px);} 80%{transform:translate(4px,3px);} }
  .unit.active{ animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 2px var(--gold) inset; } 50%{ box-shadow:0 0 0 2px var(--gold) inset, 0 0 12px rgba(255,178,56,0.5); } }
  .hpbar-fill{ transition: width 0.35s ease-out; }
  .audio-btn{ font-size:16px; padding:4px 8px; }
  @media (prefers-reduced-motion: reduce){
    .floater, .unit.flash-hit, .unit.flash-heal, #app.shake, #app.shake-hard, .unit.active,
    .unit .emoji, .unit-motion, .particle{ animation:none !important; }
    .hpbar-fill{ transition:none; }
  }
  .membercard{ background:var(--bg2); border:1px solid var(--border); padding:10px; width:190px; }
  .membercard.me{ border-color:var(--gold); box-shadow: 0 0 8px rgba(255,178,56,0.25); }
  .tribecard{ background:var(--bg2); border:1px solid var(--border); padding:10px; width:200px; }
  .favor-bg{ height:8px; background:#050709; border:1px solid var(--border); margin-top:6px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.7); }
  .favor-fill{ height:100%; }
  .elem-bg-fire{ background:var(--fire); } .elem-bg-water{ background:var(--water); }
  .elem-bg-nature{ background:var(--nature); } .elem-bg-earth{ background:var(--earth); }
  .elem-bg-volt{ background:var(--volt); } .elem-bg-wind{ background:var(--wind); }
  .boss-banner{ font-size:16px; color:var(--danger); border:1px dashed var(--danger); padding:8px; margin-bottom:10px; line-height:1.4; box-shadow: inset 0 0 12px rgba(255,51,102,0.08); }
  .rust-tag{ position:absolute; top:1px; right:2px; font-size:11px; color:var(--rust); }

  #log{
    background:#050709; border:1px solid var(--border); height:110px; overflow-y:auto; padding:8px;
    font-size:16px; margin-bottom:12px; display:flex; flex-direction:column-reverse;
    box-shadow: inset 0 1px 6px rgba(0,0,0,0.7);
  }
  #log div{ margin-bottom:2px; }
  #log::-webkit-scrollbar{ width:8px; }
  #log::-webkit-scrollbar-track{ background:#000; }
  #log::-webkit-scrollbar-thumb{ background:var(--border); }
  #log::-webkit-scrollbar-thumb:hover{ background:var(--glow); }

  .actionbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .hidden{ display:none !important; }
  .storytext{ font-size:19px; color:var(--dim); border-left:3px solid var(--gold); padding-left:10px; margin:10px 0; }
  .terrain-banner{ font-size:15px; color:var(--wind); border:1px dashed var(--border); padding:6px 8px; margin-bottom:10px; }
  .intel-banner{ font-size:16px; color:var(--rust); border:1px dashed var(--rust); padding:8px; margin-bottom:10px; line-height:1.4; box-shadow: inset 0 0 12px rgba(226,136,74,0.08); }
  .doctrine-banner{ font-size:16px; color:var(--wind); border:1px dashed var(--wind); padding:8px; margin-bottom:10px; line-height:1.4; box-shadow: inset 0 0 12px rgba(183,157,255,0.08); }
  .caravan-banner{ font-size:16px; color:var(--gold); border:1px dashed var(--gold); padding:8px; margin-bottom:10px; line-height:1.4; box-shadow: inset 0 0 12px rgba(255,178,56,0.08); }
  .black-market-banner{ font-size:16px; color:var(--danger); border:1px dashed var(--danger); padding:8px; margin-bottom:10px; line-height:1.4; box-shadow: inset 0 0 12px rgba(255,51,102,0.08); }
  .undercroft-banner{ font-size:16px; color:var(--wind); border:1px dashed var(--wind); padding:8px; margin-bottom:10px; line-height:1.4; box-shadow: inset 0 0 12px rgba(183,157,255,0.10); }
  .mercenary-banner{ font-size:16px; color:var(--earth); border:1px dashed var(--earth); padding:8px; margin-bottom:10px; line-height:1.4; box-shadow: inset 0 0 12px rgba(214,162,92,0.10); }
  .energy-banner{ font-size:16px; color:var(--volt); border:1px dashed var(--volt); padding:8px; margin-bottom:10px; line-height:1.4; box-shadow: inset 0 0 12px rgba(245,230,76,0.10); }
  .threat-banner{ font-size:16px; color:var(--danger); border:1px dashed var(--danger); padding:8px; line-height:1.4; box-shadow: inset 0 0 12px rgba(255,51,102,0.08); }
  .gauge-wrap{ margin-bottom:12px; }
  .gauge-label{ font-size:14px; color:var(--gold); margin-bottom:3px; }
  .gauge-bg{ height:14px; background:#050709; border:1px solid var(--border); position:relative; box-shadow: inset 0 1px 4px rgba(0,0,0,0.7); }
  .gauge-tick{ position:absolute; top:0; bottom:0; width:2px; background:var(--border); }
  .gauge-fill{ height:100%; background: linear-gradient(90deg, #ff8c42, var(--gold)); transition: width 0.3s; box-shadow: 0 0 8px rgba(255,178,56,0.45); }
  .gauge-fill.full{ box-shadow: 0 0 12px 2px var(--gold); }
  .footer-nav{ display:flex; justify-content:space-between; gap:10px; margin-top:4px; }

  .corr-bg{ height:6px; background:#050709; border:1px solid var(--border); margin-top:4px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.7); }
  .corr-fill{ height:100%; }
  .corr-label{ font-size:11px; margin-top:2px; }
  .pcard{

<script>
/* ============ DATA ============ */
const ELEM_BEATS = { fire:'nature', nature:'water', water:'fire', earth:'volt', volt:'wind', wind:'earth' };

const SPECIES = {
  emberling: { name:'Emberling', element:'fire', emoji:'🔥', base:{hp:32, atk:11, def:6, spd:9}, skill:'Cinder Burst',
    sprite:{shape:'organic', accents:['ears','tail'], eyes:2} },
  aqualing:  { name:'Aqualing',  element:'water', emoji:'💧', base:{hp:34, atk:9,  def:8, spd:8}, skill:'Tide Slam',
    sprite:{shape:'organic', accents:['fin','tail'], eyes:2} },
  mossling:  { name:'Mossling',  element:'nature', emoji:'🌿', base:{hp:36, atk:8,  def:9, spd:7}, skill:'Thorn Whip',
    sprite:{shape:'organic', accents:['ears','crest'], eyes:2} },
  terrafang: { name:'Terrafang', element:'earth', emoji:'🪨', base:{hp:40, atk:10, def:10, spd:5}, skill:'Boulder Crush',
    sprite:{shape:'organic', accents:['horns','spikes'], eyes:2} },
  galekit:   { name:'Galekit',   element:'wind', emoji:'🌪️', base:{hp:28, atk:10, def:5, spd:12}, skill:'Cyclone Slash',
    sprite:{shape:'organic', accents:['ears','tail','wings'], eyes:2} },
  voltcub:   { name:'Voltcub',   element:'volt', emoji:'⚡', base:{hp:26, atk:12, def:5, spd:11}, skill:'Static Fang',
    sprite:{shape:'organic', accents:['ears','antenna'], eyes:2} },
};
const SPECIES_IDS = Object.keys(SPECIES);

const ENEMY_SPECIES = {
  scraphound: { name:'Scraphound', element:'earth', emoji:'🤖', base:{hp:34, atk:9, def:9, spd:6}, skill:'Scrap Slam',
    sprite:{shape:'mech', accents:['ears','legs','tail'], eyes:2} },
  sparkdrone: { name:'Sparkdrone', element:'volt', emoji:'🛸', base:{hp:26, atk:11, def:5, spd:11}, skill:'Overload',
    sprite:{shape:'disc', accents:['antenna','wings'], eyes:1} },
  cinderjaw:  { name:'Cinderjaw',  element:'fire', emoji:'👾', base:{hp:30, atk:11, def:6, spd:9}, skill:'Napalm Bite',
    sprite:{shape:'mech', accents:['horns','spikes'], eyes:2} },
  frostcoil:  { name:'Frostcoil',  element:'water', emoji:'🦾', base:{hp:32, atk:9, def:8, spd:8}, skill:'Cryo Lash',
    sprite:{shape:'core', accents:['tentacles','fin'], eyes:2} },
  thornbot:   { name:'Thornbot',   element:'nature', emoji:'🕷️', base:{hp:34, atk:8, def:9, spd:7}, skill:'Rust Vines',
    sprite:{shape:'mech', accents:['legs','spikes','antenna'], eyes:3} },
  galekite:   { name:'Galekite',   element:'wind', emoji:'🛩️', base:{hp:24, atk:10, def:5, spd:13}, skill:'Shear Gust',
    sprite:{shape:'disc', accents:['wings','tail'], eyes:1} },
};
const ENEMY_IDS = Object.keys(ENEMY_SPECIES);

/* ---- Salvageable Rustbound parts (one per enemy chassis) ---- */
const PARTS = {
  scraphound: { name:'Scrap Plating', emoji:'🛡️', element:'earth',  stat:'def', pct:0.30, corruption:20, desc:'Welded slabs of enemy hull.' },
  sparkdrone: { name:'Static Coil',   emoji:'🔌', element:'volt',   stat:'spd', pct:0.28, corruption:24, desc:'Hums with stolen current.' },
  cinderjaw:  { name:'Napalm Jets',   emoji:'🔥', element:'fire',   stat:'atk', pct:0.30, corruption:28, desc:'Leaks accelerant. Constantly.' },
  frostcoil:  { name:'Cryo Cell',     emoji:'❄️', element:'water',  stat:'def', pct:0.26, corruption:20, desc:'Frost-rimed coolant core.' },
  thornbot:   { name:'Rustvine Spool',emoji:'🌱', element:'nature', stat:'hp',  pct:0.32, corruption:18, desc:'Self-repairing metal creeper.' },
  galekite:   { name:'Shear Rotor',   emoji:'🌀', element:'wind',   stat:'spd', pct:0.32, corruption:22, desc:'Screams above 4000 RPM.' },
};
const STAT_LABEL = { hp:'HP', atk:'ATK', def:'DEF', spd:'SPD' };

/* ============ PROCEDURAL SPRITES ============
   Every creature/boss data entry (SPECIES, ENEMY_SPECIES, HYBRID_SPECIES,
   BOSSES, DEEP_BOSS, WARLORDS) carries a `sprite` recipe alongside its
   `emoji`:  { shape, accents:[...], eyes, scale }
     shape   — one of SPRITE_SHAPES: the body silhouette.
     accents — names from SPRITE_ACCENTS layered on top (ears, horns, ...).
     eyes    — how many eye-dots to draw (1-4).
     scale   — optional size multiplier (bosses run 1.15-1.6).
   Colors are never stored in the recipe — spriteSvg() resolves them from
   the creature's live element(s) via elemColor(), so a sprite automatically
   tracks the same --fire/--water/... palette used everywhere else and a
   dual-element hybrid gets a genuinely two-toned body+accent split.
   Built entirely from primitives (ellipse/rect/polygon/simple paths) rather
   than hand-authored bezier blobs, specifically so the geometry is cheap to
   reason about and verify without round after round of visual iteration. */
const SPRITE_SHAPES = ['organic','mech','disc','core'];
function elemColor(e){ return 'var(--'+(e||'earth')+')'; }

function spBodyShape(shape, color){
  switch(shape){
    case 'mech': return `<rect x="20" y="28" width="60" height="50" rx="10" fill="${color}"/><rect x="30" y="8" width="40" height="28" rx="8" fill="${color}"/>`;
    case 'disc': return `<ellipse cx="50" cy="52" rx="36" ry="15" fill="${color}"/><ellipse cx="50" cy="38" rx="17" ry="13" fill="${color}" opacity="0.85"/>`;
    case 'core': return `<polygon points="50,6 86,50 50,94 14,50" fill="${color}"/>`;
    default:     return `<ellipse cx="50" cy="64" rx="29" ry="25" fill="${color}"/><circle cx="50" cy="31" r="20" fill="${color}"/>`;
  }
}
function spEyes(shape, n, color){
  n = Math.max(1, Math.min(4, Math.round(n)||2));
  const cy = shape==='disc' ? 38 : (shape==='mech' ? 22 : 30);
  const spread = n===1 ? 0 : (n===2 ? 18 : (n===3 ? 15 : 12));
  let out = '';
  for(let i=0;i<n;i++){
    const cx = 50 + (i - (n-1)/2) * spread;
    out += `<circle cx="${cx}" cy="${cy}" r="4.5" fill="#eef6ff"/><circle cx="${cx}" cy="${cy}" r="2.2" fill="${color}"/>`;
  }
  return out;
}
/* Each accent is a small pure function of an accent color to an SVG
   fragment, positioned against the 0-100 body coordinate space (the
   viewBox itself is padded to -15..115 so horns/wings/tails can extend
   past the body without clipping). */
const SPRITE_ACCENTS = {
  ears:      c=>`<polygon points="33,20 39,1 47,22" fill="${c}"/><polygon points="67,20 61,1 53,22" fill="${c}"/>`,
  horns:     c=>`<polygon points="36,16 26,-8 45,19" fill="${c}"/><polygon points="64,16 74,-8 55,19" fill="${c}"/>`,
  wings:     c=>`<polygon points="21,58 -12,42 24,76" fill="${c}" opacity="0.88"/><polygon points="79,58 112,42 76,76" fill="${c}" opacity="0.88"/>`,
  tail:      c=>`<path d="M76,72 Q102,78 93,101 Q79,92 71,76 Z" fill="${c}"/>`,
  fin:       c=>`<polygon points="57,18 74,-9 64,24" fill="${c}"/>`,
  antenna:   c=>`<line x1="42" y1="10" x2="34" y2="-11" stroke="${c}" stroke-width="3" stroke-linecap="round"/><circle cx="34" cy="-13" r="4" fill="${c}"/><line x1="58" y1="10" x2="66" y2="-11" stroke="${c}" stroke-width="3" stroke-linecap="round"/><circle cx="66" cy="-13" r="4" fill="${c}"/>`,
  crest:     c=>`<polygon points="50,4 41,-14 50,-2 59,-14" fill="${c}"/>`,
  spikes:    c=>[0,1,2,3].map(i=>{ const x=28+i*15; return `<polygon points="${x},30 ${x+6},14 ${x+12},30" fill="${c}"/>`; }).join(''),
  stinger:   c=>`<path d="M74,76 Q100,90 84,108 Q74,96 68,80 Z" fill="${c}"/>`,
  tentacles: c=>[0,1,2,3].map(i=>{ const x=30+i*14; return `<path d="M${x},86 Q${x-6},102 ${x+2},116" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/>`; }).join(''),
  legs:      c=>[0,1,2,3].map(i=>{ const x=26+i*16; return `<rect x="${x}" y="86" width="8" height="17" rx="3" fill="${c}"/>`; }).join(''),
};
const SPRITE_ACCENT_IDS = Object.keys(SPRITE_ACCENTS);
/* A shared small-drone look for commander-fight generators (shield pylons,
   guard drones, feeder arms) — they're functionally identical fixtures
   regardless of which boss summoned them, so one recipe covers all of them. */
const GEN_SPRITE = { shape:'disc', accents:['antenna'], eyes:1 };

/* recipe -> self-contained inline <svg>. `elements` may be a single element
   id or an array (a hybrid's two elements split body/accent color). size is
   the rendered pixel box before `recipe.scale` is applied. */
function spriteSvg(recipe, elements, size){
  if(!recipe) return '';
  size = size || 40;
  const els = (Array.isArray(elements) ? elements : [elements]).filter(Boolean);
  const bodyColor = elemColor(els[0]);
  const accentColor = elemColor(els[1] || els[0]);
  const scale = recipe.scale || 1;
  const px = Math.round(size * scale);
  const glow = els[0] ? `filter:drop-shadow(0 0 ${Math.max(2,Math.round(4*scale))}px ${elemColor(els[0])}88);` : '';
  const accents = (recipe.accents||[]).map(a => SPRITE_ACCENTS[a] ? SPRITE_ACCENTS[a](accentColor) : '').join('');
  return `<svg viewBox="-15 -15 130 130" width="${px}" height="${px}" style="${glow}flex:none;">`
       + spBodyShape(SPRITE_SHAPES.includes(recipe.shape)?recipe.shape:'organic', bodyColor)
       + accents
       + spEyes(recipe.shape, recipe.eyes, '#1a1a22')
       + `</svg>`;
}
/* A defensive sanitizer for a sprite recipe pulled back out of localStorage
   (Victory Portrait snapshots persist one) — never trust stored shape/accent
   strings against the live SPRITE_SHAPES/SPRITE_ACCENTS tables blindly. */
function reviveSpriteRecipe(s){
  if(!s || typeof s!=='object') return null;
  if(typeof s.shape!=='string' || !SPRITE_SHAPES.includes(s.shape)) return null;
  const accents = Array.isArray(s.accents) ? s.accents.filter(a=>SPRITE_ACCENT_IDS.includes(a)).slice(0,4) : [];
  const eyes = (typeof s.eyes==='number' && isFinite(s.eyes)) ? Math.max(1, Math.min(4, Math.round(s.eyes))) : 2;
  const scale = (typeof s.scale==='number' && isFinite(s.scale)) ? Math.max(0.5, Math.min(2.5, s.scale)) : 1;
  return { shape:s.shape, accents, eyes, scale };
}
/* Card/bestiary sites: known + a sprite -> svg; known but no sprite (should
   not happen once every table entry has one, but stay defensive) -> emoji;
   unknown -> the '?' placeholder they already show. */
function spriteOrEmoji(entry, known, size){
  if(!known) return '❓';
  if(entry && entry.sprite) return spriteSvg(entry.sprite, (entry.elements&&entry.elements.length)?entry.elements:[entry.element], size);
  return entry ? entry.emoji : '❓';
}
/* Battle units: always visible (no fog-of-war gate), and carry their own
   resolved .elements/.element already. */
function unitSpriteHtml(u, size){
  if(!u) return '';
  if(u.sprite) return spriteSvg(u.sprite, (u.elements&&u.elements.length)?u.elements:[u.element], size);
  return u.emoji||'';
}

/* ---- The Forge: burns 3 of the same raw part into one named, stronger
       part carrying a second stat the raw part never had. Forged parts are
       kept OUT of the PARTS table itself (so they never inflate the Salvage
       bestiary category or become bannable emblem picks) — they're just a
       raw key with a "_forged" suffix, resolved through partInfo() below at
       every place that needs full part data. ---- */
const FORGE_SUFFIX = '_forged';
const FORGE_COST = 3;
const FORGE_PCT_MULT = 1.2;
const FORGE_CORRUPTION_MULT = 0.75;
const FORGED_PARTS = {
  scraphound: { name:'Reinforced Scrap Plating',   bonusStat:'hp',  bonusPct:0.08 },
  sparkdrone: { name:'Overcharged Static Coil',    bonusStat:'atk', bonusPct:0.08 },
  cinderjaw:  { name:'Superheated Napalm Jets',    bonusStat:'def', bonusPct:0.08 },
  frostcoil:  { name:'Absolute Cryo Cell',         bonusStat:'spd', bonusPct:0.08 },
  thornbot:   { name:'Bloomforged Rustvine Spool', bonusStat:'def', bonusPct:0.08 },
  galekite:   { name:'Tempered Shear Rotor',       bonusStat:'atk', bonusPct:0.08 },
};
function isForgedKey(key){ return typeof key==='string' && key.length>FORGE_SUFFIX.length && key.slice(-FORGE_SUFFIX.length)===FORGE_SUFFIX; }
/* ---- Rustbound Aces: a rare, named elite enemy embedded in an otherwise
   ordinary wave (see buildEnemyUnits/applyAceRoll below). Killing one guarantees
   a drop of its own part type, marked with this suffix — same trick as
   Forge's "_forged", same partInfo() resolution, so it installs, purges and
   feeds the Legion Identity banner exactly like any other part. Unlike a
   forged part it carries no stat bonus at all: the reward is that it's
   guaranteed and cosmetically marked, not that it's stronger. ---- */
const ACE_SUFFIX = '_ace';
function isAceKey(key){ return typeof key==='string' && key.length>ACE_SUFFIX.length && key.slice(-ACE_SUFFIX.length)===ACE_SUFFIX; }
/* ---- The Vanguard Bounty: a rare, named elite embedded specifically in an
   Elite Wave (see applyVanguardRoll below — Aces and Vanguards are mutually
   exclusive by construction, since applyAceRoll explicitly skips elite
   stages). Unlike an Ace, a Vanguard's drop is NOT guaranteed on death: it
   only pays out if the Vanguard is the very last enemy left standing on its
   side at the moment it falls (checkVanguardBounty, called from the same
   onEnemyFainted funnel Aces use, so it fires correctly however the kill
   happened — a direct hit, a cascade splash, a burn tick). The reward is a
   genuinely stronger part (a small real stat bump, see partInfo), not just a
   cosmetic marker — the payoff for reading the whole formation instead of
   focus-firing the biggest threat first. ---- */
const VANGUARD_SUFFIX = '_vanguard';
const VANGUARD_PCT_BONUS = 0.03;
function isVanguardKey(key){ return typeof key==='string' && key.length>VANGUARD_SUFFIX.length && key.slice(-VANGUARD_SUFFIX.length)===VANGUARD_SUFFIX; }
/* ---- The Black Market: a second, shadier trader alongside the Scavenger
   Caravan (see the caravan block below) — she deals in a single named
   chassis's part at a steep discount, but it runs noticeably hotter than a
   raw part: a bigger stat boost than even a Forge upgrade, in exchange for
   a corruption INCREASE rather than the decrease Forge gives. Corruption is
   otherwise a pure downside (see monsterCorruption/corrTier below), so this
   is the one part in the game a player might equip specifically to court it.
   Same suffix trick as Forge/Ace/Vanguard, same partInfo() resolution, so it
   slots into Set Bonuses and every other part-consuming system for free. ---- */
const BLACK_MARKET_SUFFIX = '_black';
const BLACK_MARKET_PCT_MULT = 1.5;
const BLACK_MARKET_CORRUPTION_MULT = 1.75;
function isBlackMarketKey(key){ return typeof key==='string' && key.length>BLACK_MARKET_SUFFIX.length && key.slice(-BLACK_MARKET_SUFFIX.length)===BLACK_MARKET_SUFFIX; }
function baseKeyOf(key){
  if(isForgedKey(key)) return key.slice(0, -FORGE_SUFFIX.length);
  if(isAceKey(key)) return key.slice(0, -ACE_SUFFIX.length);
  if(isVanguardKey(key)) return key.slice(0, -VANGUARD_SUFFIX.length);
  if(isBlackMarketKey(key)) return key.slice(0, -BLACK_MARKET_SUFFIX.length);
  return key;
}
/* Resolves a state.parts / monster.parts key (raw, forged, or ace) to full
   display and stat data. Every PARTS[k] lookup that can see an equipped or
   bay-stored key (as opposed to enumerating the 6 known types themselves)
   goes through this instead. */
function partInfo(key){
  const base = PARTS[baseKeyOf(key)];
  if(!base) return null;
  if(isForgedKey(key)){
    const fb = FORGED_PARTS[baseKeyOf(key)];
    if(!fb) return base;
    return {
      name: fb.name, emoji: base.emoji, element: base.element, desc: base.desc,
      stat: base.stat, pct: Math.round(base.pct*FORGE_PCT_MULT*100)/100,
      corruption: Math.max(1, Math.round(base.corruption*FORGE_CORRUPTION_MULT)),
      forged: true, bonusStat: fb.bonusStat, bonusPct: fb.bonusPct,
    };
  }
  if(isAceKey(key)){
    return {
      name: 'Ace-Marked ' + base.name, emoji: base.emoji, element: base.element, desc: base.desc,
      stat: base.stat, pct: base.pct, corruption: base.corruption, ace: true,
    };
  }
  if(isVanguardKey(key)){
    return {
      name: 'Vanguard Trophy: ' + base.name, emoji: base.emoji, element: base.element, desc: base.desc,
      stat: base.stat, pct: Math.round((base.pct+VANGUARD_PCT_BONUS)*100)/100, corruption: base.corruption, vanguard: true,
    };
  }
  if(isBlackMarketKey(key)){
    return {
      name: 'Black-Market ' + base.name, emoji: base.emoji, element: base.element, desc: base.desc,
      stat: base.stat, pct: Math.round(base.pct*BLACK_MARKET_PCT_MULT*100)/100,
      corruption: Math.round(base.corruption*BLACK_MARKET_CORRUPTION_MULT), black: true,
    };
  }
  return base;
}

/* ---- Set Bonuses: 2 or 3 equipped parts sharing a family — the same base
   chassis a part was salvaged from, so a raw cinderjaw, a forged one, an
   Ace-marked one and a Vanguard trophy all count as "the cinderjaw family"
   together (see baseKeyOf) — push that chassis's own stat a little further
   on top of what each part already grants individually. No new part data:
   this only ever counts what's already equipped and reads PARTS[fam].stat
   for which stat to add to, so a family's set bonus always reinforces the
   same stat its own parts already lean into. ---- */
const SET_BONUS_2PC = 0.06;   // 2 parts of the same family
const SET_BONUS_3PC = 0.12;   // 3 or more — not additive with the 2pc figure, this replaces it
function activeSetBonuses(parts){
  const counts = {};
  (parts||[]).forEach(k=>{
    const p = partInfo(k); if(!p) return;
    const fam = baseKeyOf(k);
    counts[fam] = (counts[fam]||0) + 1;
  });
  const out = [];
  Object.keys(counts).forEach(fam=>{
    const n = counts[fam];
    if(n<2) return;
    const base = PARTS[fam]; if(!base) return;
    out.push({ family: fam, name: base.name, stat: base.stat, count: n, pct: n>=3 ? SET_BONUS_3PC : SET_BONUS_2PC });
  });
  return out;
}

/* ---- Cross-species fusion: every element pair has a named hybrid ---- */
const HYBRIDS = {
  'fire+water':   { name:'Steamling',    emoji:'♨️', skill:'Scald Burst' },
  'fire+nature':  { name:'Cinderbloom',  emoji:'🍂', skill:'Wildfire Bloom' },
  'earth+fire':   { name:'Magmaw',       emoji:'🌋', skill:'Magma Maul' },
  'fire+volt':    { name:'Arcflare',     emoji:'☄️', skill:'Arc Detonation' },
  'fire+wind':    { name:'Firestorm',    emoji:'🎆', skill:'Firestorm Rush' },
  'nature+water': { name:'Bogling',      emoji:'🐸', skill:'Mire Drag' },
  'earth+water':  { name:'Siltback',     emoji:'🐢', skill:'Silt Crush' },
  'volt+water':   { name:'Voltide',      emoji:'🌊', skill:'Chain Surge' },
  'water+wind':   { name:'Mistral',      emoji:'🌫️', skill:'Mist Lash' },
  'earth+nature': { name:'Grovewarden',  emoji:'🌳', skill:'Root Bind' },
  'nature+volt':  { name:'Sporesurge',   emoji:'🍄', skill:'Spore Discharge' },
  'nature+wind':  { name:'Pollenwing',   emoji:'🦋', skill:'Pollen Cyclone' },
  'earth+volt':   { name:'Magnetite',    emoji:'🧲', skill:'Magnetic Slam' },
  'earth+wind':   { name:'Sandwyrm',     emoji:'🦂', skill:'Sand Shear' },
  'volt+wind':    { name:'Stormkite',    emoji:'🪁', skill:'Thunder Dive' },
};
/* Innate traits a hybrid inherits from each of its two elements. */
const ELEM_TRAIT = {
  fire:   { burnImmune:true },
  water:  { slowImmune:true },
  volt:   { stunImmune:true },
  nature: { regen:0.03 },
  earth:  { bulwark:true },
  wind:   { dodge:0.10 },
};
function hybridKey(a,b){ return [a,b].sort().join('+'); }
function hybridIdFor(a,b){ return 'hyb_' + [a,b].sort().join('_'); }

/* One sprite recipe per hybrid key, keyed the same way as HYBRIDS itself.
   Any pair missing here (there shouldn't be any) falls back to a plain
   organic/fin/tail default in the generator loop below. */
const HYBRID_SPRITES = {
  'fire+water':   {shape:'organic', accents:['fin','antenna'], eyes:2},
  'fire+nature':  {shape:'organic', accents:['crest','tail'], eyes:2},
  'earth+fire':   {shape:'mech',    accents:['horns','spikes'], eyes:2},
  'fire+volt':    {shape:'core',    accents:['spikes','antenna'], eyes:1},
  'fire+wind':    {shape:'organic', accents:['wings','crest'], eyes:2},
  'nature+water': {shape:'organic', accents:['ears','fin'], eyes:2},
  'earth+water':  {shape:'mech',    accents:['fin','legs'], eyes:2},
  'volt+water':   {shape:'core',    accents:['tentacles','fin'], eyes:1},
  'water+wind':   {shape:'disc',    accents:['wings','tail'], eyes:1},
  'earth+nature': {shape:'organic', accents:['horns','spikes'], eyes:2},
  'nature+volt':  {shape:'organic', accents:['crest','antenna'], eyes:2},
  'nature+wind':  {shape:'organic', accents:['wings','antenna'], eyes:2},
  'earth+volt':   {shape:'core',    accents:['horns','spikes'], eyes:1},
  'earth+wind':   {shape:'mech',    accents:['stinger','legs','spikes'], eyes:2},
  'volt+wind':    {shape:'disc',    accents:['wings','antenna'], eyes:1},
};
const HYBRID_SPRITE_DEFAULT = { shape:'organic', accents:['fin','tail'], eyes:2 };

const HYBRID_SPECIES = {};
Object.keys(HYBRIDS).forEach(key=>{
  const els = key.split('+');
  const parents = els.map(e=>SPECIES_IDS.find(id=>SPECIES[id].element===e)).map(id=>SPECIES[id]);
  const blend = k => Math.round((parents[0].base[k] + parents[1].base[k]) / 2 * 1.25);
  HYBRID_SPECIES[hybridIdFor(els[0],els[1])] = {
    name: HYBRIDS[key].name, emoji: HYBRIDS[key].emoji, skill: HYBRIDS[key].skill,

   Corruption's second consequence — the in-battle glitch/defect risk

const UNDERCROFT_STAT_MULT = 1.5;      // meaner than a Detour's 1.3x — this is meant to hurt
const UNDERCROFT_ANCHOR_STAGE = 8;     // fixed, non-boss — same trick as CAMPAIGN_DETOURS' afterStage

/* ---- Daily scavenger missions. Purely local: date-seeded, so every
       player on a given day gets the same three, with no server needed. ---- */
const MISSION_POOL = [
  { id:'mono',      make:r=>({ elem: TRIBE_IDS[r(6)] }),
    text:m=>`Win a battle where only ${m.elem.toUpperCase()} strikes land`,
    check:(m,st)=>st.win && st.elemsUsed.length===1 && st.elemsUsed[0]===m.elem },
  { id:'flawless',  make:()=>({}),
    text:()=>'Win without losing a single monster',
    check:(m,st)=>st.win && st.losses===0 },
  { id:'swift',     make:r=>({ rounds: 4 + r(3) }),
    text:m=>`Win a battle within ${m.rounds} rounds`,
    check:(m,st)=>st.win && st.rounds<=m.rounds },
  { id:'splicer',   make:()=>({}),
    text:()=>'Win with a spliced hybrid in your formation',
    check:(m,st)=>st.win && st.hybrids>0 },
  { id:'heavy',     make:r=>({ elem: TRIBE_IDS[r(6)], amount: 120 + r(5)*40 }),
    text:m=>`Deal ${m.amount} damage with ${m.elem.toUpperCase()} in one battle`,
    check:(m,st)=>(st.elemDamage[m.elem]||0) >= m.amount },
  { id:'commander', make:()=>({}),
    text:()=>'Bring down a Rustbound commander',
    check:(m,st)=>st.win && st.boss },
  { id:'trial',     make:r=>({ mods: 1 + r(2) }),
    text:m=>`Clear a trial with at least ${m.mods} handicap${m.mods>1?'s':''} stacked`,
    check:(m,st)=>st.win && st.trial && st.mods>=m.mods },
  { id:'rusty',     make:()=>({}),
    text:()=>'Win with a rust-loaded monster (25+) in your line',
    check:(m,st)=>st.win && st.maxRust>=25 },
];
const MISSION_COUNT = 3;
const MISSION_REWARD = 1;   // salvage parts per mission

function dateKeyFor(d){
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}
function todayKey(){ return dateKeyFor(new Date()); }
/* Small deterministic PRNG so a given day yields the same missions everywhere. */
function seedRandom(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(n){
    h ^= h<<13; h>>>=0; h ^= h>>17; h ^= h<<5; h>>>=0;
    return n ? (h % n) : h;
  };
}
function buildDailies(key){
  const r = seedRandom(key);
  const idx = [];
  while(idx.length < MISSION_COUNT){
    const i = r(MISSION_POOL.length);
    if(idx.indexOf(i)<0) idx.push(i);
  }
  return {
    date: key,
    missions: idx.map(i=>{
      const def = MISSION_POOL[i];
      return { id: def.id, params: def.make(r), done:false, claimed:false };
    }),
  };
}
function missionDef(id){ return MISSION_POOL.find(m=>m.id===id); }
function ensureDailies(){
  const key = todayKey();
  if(!state.daily || state.daily.date !== key) state.daily = buildDailies(key);
  return state.daily;
}
function dailyProgress(){
  const d = ensureDailies();
  return { done: d.missions.filter(m=>m.done).length, total: d.missions.length,
           unclaimed: d.missions.filter(m=>m.done && !m.claimed).length };
}
/* Called once per finished battle with a summary of what happened. */
function scoreDailies(stats){
  const d = ensureDailies();
  const newly = [];
  d.missions.forEach(m=>{
    if(m.done) return;
    const def = missionDef(m.id);
    if(def && def.check(m.params, stats)){ m.done = true; newly.push(def.text(m.params)); }
  });
  return newly;
}
function claimMission(i){
  const d = ensureDailies();
  const m = d.missions[i];
  if(!m || !m.done || m.claimed) return;
  m.claimed = true;
  for(let k=0;k<MISSION_REWARD && state.parts.length<14;k++){
    state.parts.push({ uid: uid(), key: ENEMY_IDS[Math.floor(Math.random()*ENEMY_IDS.length)] });
  }
  autosave();
  render();
}

/* ============ SCAVENGER CARAVAN ============
   A traveling trader who shows up at the Hub on her own clock, offers a
   single short-lived trade, and moves on if it isn't taken — "the world
   keeps going even when you're not deploying," per the pitch. That means
   real elapsed time, not the calendar day Orders resets on, so this is
   built on the same idea as The Camp's away-time bonus (see
   campAwayFrac): a pure function of an injectable nowMs, checked — never
   ticked on a timer — at the same two choke points The Camp already
   uses: right after a save loads (continueSlot) and in endBattle()'s
   shared win/loss tail, the same spot state.streak updates. A duel,
   raid, trial or the tutorial never reach that tail, so the caravan
   can't spawn or expire mid-detour into one of those. No decline button
   on purpose — an offer just sits on the Hub, tradeable or not, until
   it's taken or its own clock runs out.
   ============================================= */
const CARAVAN_MIN_GAP_MS = 10*60*1000;   // real minutes before the NEXT offer becomes eligible to roll
const CARAVAN_WINDOW_MS  = 15*60*1000;   // real minutes an offer stays open before it quietly moves on
const CARAVAN_SPAWN_CHANCE = 0.35;       // odds a roll actually produces an offer, once eligible
/* concord_trade is a member of the full whitelist below (so a saved offer of
   this type survives revival), but it is only ever ROLLED for a guild that
   has funded the Caravan Concord project — see caravanRollPool(). */
const CARAVAN_OFFER_TYPES = ['parts_for_favor', 'favor_for_parts', 'recruit_for_salvage', 'concord_trade'];
const CARAVAN_PARTS_COST = 2;           // parts_for_favor: parts spent
const CARAVAN_FAVOR_REWARD = 15;        // parts_for_favor: favor gained, with the offer's own tribe
const CARAVAN_FAVOR_COST = 20;          // favor_for_parts: favor spent, with the offer's own tribe
const CARAVAN_PARTS_REWARD = 2;         // favor_for_parts: parts gained
const CARAVAN_RECRUIT_PARTS_COST = 3;   // recruit_for_salvage: parts spent for a guaranteed recruit
const CARAVAN_CONCORD_PARTS_COST = 2;   // concord_trade: parts spent — same cost as parts_for_favor...
const CARAVAN_CONCORD_FAVOR_REWARD = 24;// ...but a noticeably better rate, courtesy of the guild project

function caravanOfferText(o){
  if(!o) return '';
  const trib = TRIBES[o.tribe];
  if(o.type==='parts_for_favor')    return `${trib.emoji} The caravan is buying: ${CARAVAN_PARTS_COST} salvage parts for ${CARAVAN_FAVOR_REWARD} favor with the ${trib.name}.`;
  if(o.type==='favor_for_parts')    return `${trib.emoji} The caravan is selling: ${CARAVAN_PARTS_REWARD} salvage parts for ${CARAVAN_FAVOR_COST} of your favor with the ${trib.name}.`;
  if(o.type==='concord_trade')      return `${trib.emoji} Caravan Concord: trading at guild rates — ${CARAVAN_CONCORD_PARTS_COST} salvage parts for ${CARAVAN_CONCORD_FAVOR_REWARD} favor with the ${trib.name}.`;
  return `${trib.emoji} The caravan has a recruit to place: a guaranteed ${trib.name}-aligned monster for ${CARAVAN_RECRUIT_PARTS_COST} salvage parts.`;
}
function caravanCanAfford(o){
  if(!o) return false;
  if(o.type==='parts_for_favor')    return state.parts.length>=CARAVAN_PARTS_COST;
  if(o.type==='favor_for_parts')    return favorOf(o.tribe)>=CARAVAN_FAVOR_COST && state.parts.length<14;
  if(o.type==='recruit_for_salvage')return state.parts.length>=CARAVAN_RECRUIT_PARTS_COST && state.roster.length<rosterCap();
  if(o.type==='concord_trade')      return hasProject('concord') && state.parts.length>=CARAVAN_CONCORD_PARTS_COST;
  return false;
}
/* The pool actually eligible to roll — every ordinary type, plus
   concord_trade only once this player's guild has funded that project.
   A previously-rolled concord_trade offer still honours its own save/accept
   logic even if the project gate later reads false (e.g. mid-load, before
   guildProjectFetch resolves), same "stale until refreshed" trust model as
   every other hasPerk()/hasProject() read in the game. */
function caravanRollPool(){
  return hasProject('concord') ? CARAVAN_OFFER_TYPES : CARAVAN_OFFER_TYPES.filter(t=>t!=='concord_trade');
}
function rollCaravanOffer(nowMs){
  const pool = caravanRollPool();
  state.caravan = {
    type: pool[Math.floor(Math.random()*pool.length)],
    tribe: TRIBE_IDS[Math.floor(Math.random()*TRIBE_IDS.length)],
    expiresAt: nowMs + CARAVAN_WINDOW_MS,
  };
}
/* The only two call sites are continueSlot() and endBattle()'s shared win/loss
   tail — never a setInterval, so the Hub banner never needs a live countdown. */
function tickCaravan(nowMs){
  if(state.caravan && state.caravan.expiresAt<=nowMs){
    state.caravan = null;
    state.caravanNextEligible = nowMs + CARAVAN_MIN_GAP_MS;
  }
  if(!state.caravan && nowMs>=(state.caravanNextEligible||0)){
    if(Math.random()<CARAVAN_SPAWN_CHANCE) rollCaravanOffer(nowMs);
    else state.caravanNextEligible = nowMs + CARAVAN_MIN_GAP_MS;
  }
}
function acceptCaravanTrade(){
  const o = state.caravan;
  if(!o || !caravanCanAfford(o)) return;
  if(o.type==='parts_for_favor'){
    state.parts.splice(0, CARAVAN_PARTS_COST);
    addFavor(o.tribe, CARAVAN_FAVOR_REWARD);
  } else if(o.type==='favor_for_parts'){
    addFavor(o.tribe, -CARAVAN_FAVOR_COST);
    for(let i=0;i<CARAVAN_PARTS_REWARD && state.parts.length<14;i++){
      state.parts.push({ uid: uid(), key: ENEMY_IDS[Math.floor(Math.random()*ENEMY_IDS.length)] });
    }
  } else if(o.type==='recruit_for_salvage'){
    state.parts.splice(0, CARAVAN_RECRUIT_PARTS_COST);
    const owned = state.roster.map(m=>m.speciesId).filter(id=>SPECIES[id] && !SPECIES[id].champion);
    const id = (owned.length && Math.random()<0.55) ? owned[Math.floor(Math.random()*owned.length)] : WILD_IDS[Math.floor(Math.random()*WILD_IDS.length)];
    state.roster.push(newMonster(id,1,1));
  } else if(o.type==='concord_trade'){
    state.parts.splice(0, CARAVAN_CONCORD_PARTS_COST);
    addFavor(o.tribe, CARAVAN_CONCORD_FAVOR_REWARD);
  }
  state.caravan = null;
  state.caravanNextEligible = Date.now() + CARAVAN_MIN_GAP_MS;
  autosave();
  render();
}

/* ============ THE BLACK MARKET ============
   A second, shadier trader who shows up independently of the Scavenger
   Caravan above and only ever offers one thing: a single named chassis's
   Black-Market part (see partInfo/isBlackMarketKey above), shown up front —
   never a blind box — for a flat, steep-discount cost in ordinary salvage
   parts. Same rotation/expiry plumbing as the Caravan, reused wholesale (a
   pure function of an injectable nowMs, ticked only at the same two choke
   points: continueSlot() and endBattle()'s shared win/loss tail), but tuned
   rarer and more fleeting to feel dangerous rather than routine: a longer
   gap between eligible rolls, a shorter window once she appears, and lower
   odds of showing up at all. No decline button, same as the Caravan — she
   just moves on if you don't bite.
   ============================================= */
const BLACK_MARKET_MIN_GAP_MS = 20*60*1000; // real minutes before the NEXT offer becomes eligible to roll
const BLACK_MARKET_WINDOW_MS  = 8*60*1000;  // real minutes an offer stays open before she moves on
const BLACK_MARKET_SPAWN_CHANCE = 0.25;     // odds a roll actually produces an offer, once eligible
const BLACK_MARKET_PART_COST = 1;           // ordinary salvage parts spent for one Black-Market part

function blackMarketOfferText(o){
  if(!o) return '';
  const d = partInfo(o.key + BLACK_MARKET_SUFFIX);
  if(!d) return '';
  return `☠️ ${d.emoji} ${d.name}: +${Math.round(d.pct*100)}% ${STAT_LABEL[d.stat]} for ${BLACK_MARKET_PART_COST} salvage part — but ⚙ +${d.corruption} rust, no questions asked.`;
}
function blackMarketCanAfford(o){
  if(!o) return false;
  return state.parts.length>=BLACK_MARKET_PART_COST && state.parts.length<14;
}
function rollBlackMarketOffer(nowMs){
  state.blackMarket = {
    key: ENEMY_IDS[Math.floor(Math.random()*ENEMY_IDS.length)],
    expiresAt: nowMs + BLACK_MARKET_WINDOW_MS,
  };
}
/* The only two call sites are continueSlot() and endBattle()'s shared win/loss
   tail — never a setInterval, so the Hub banner never needs a live countdown. */
function tickBlackMarket(nowMs){
  if(state.blackMarket && state.blackMarket.expiresAt<=nowMs){
    state.blackMarket = null;
    state.blackMarketNextEligible = nowMs + BLACK_MARKET_MIN_GAP_MS;
  }
  if(!state.blackMarket && nowMs>=(state.blackMarketNextEligible||0)){
    if(Math.random()<BLACK_MARKET_SPAWN_CHANCE) rollBlackMarketOffer(nowMs);
    else state.blackMarketNextEligible = nowMs + BLACK_MARKET_MIN_GAP_MS;
  }
}
function acceptBlackMarketTrade(){
  const o = state.blackMarket;
  if(!o || !blackMarketCanAfford(o)) return;
  state.parts.splice(0, BLACK_MARKET_PART_COST);
  state.parts.push({ uid: uid(), key: o.key + BLACK_MARKET_SUFFIX });
  state.blackMarket = null;
  state.blackMarketNextEligible = Date.now() + BLACK_MARKET_MIN_GAP_MS;
  autosave();
  render();
}

/* ============ MERCENARY CONTRACT ============
   Spend salvage, rent a tribe champion's raw strength for exactly one
   battle, and it walks the moment that battle ends — a taste of power the
   legion never actually owns, in contrast to a Champion earned permanently
   through Tribe favor (see CHAMPIONS/championUnlocked above, which this
   reuses wholesale rather than inventing a second cast of monsters — every
   champion is already a real SPECIES entry, so computeStats/sprites/traits
   all just work on one).

   Unlike the Caravan or Black Market, there is no rotation and no expiry
   clock — a contract is available to hire any time the player can afford
   it. Hiring only reserves it (state.mercenary): it stays pending, and
   survives a save/reload since real salvage was already spent on it, until
   the very next battle that's actually eligible to use it
   (mercenaryEligibleBattle — the same "a real fight in every other sense"
   carve-out Reinforcements already draws, minus Reinforcements' own boss
   exclusion, since a hired gun present from round one has none of
   Reinforcements' fairness concerns about a shielded commander). Consumed
   the instant it's fielded, win or lose — "one deployment" means the
   deployment, not the outcome.

   It never joins state.roster, so it never counts toward rosterCap(),
   never survives as a real monster, and — because findMonster() will never
   find its throwaway uid — is automatically invisible to every permanent
   per-monster tracker: EXP, kills, codex, nicknames, timesFielded/
   closeCalls. Its species is deliberately excluded from the killsBySpecies
   credit that feeds Doctrine's permanent kill-leader tally (see the
   isMercenary guard beside every killsBySpecies write below) and from
   Battle-Forged Bonds (recordBattleBonds never sees it) — a rented
   champion must never quietly mint a permanent bond or a permanent "kill
   leader" title for a species the player never actually recruited. Only
   the element it fights with counts toward elemDamage (and so Rustbound
   intel/adaptation and Doctrine's element tally) — a real, in-fiction
   consequence of the specialist you hired, not a species-identity leak.

   It also skips every whole-legion bonus buildPlayerUnits() layers on for
   a real deployed monster — blessings, Council options, Rebirth's
   multiplier, the mentor/battle-bond passives — on purpose: those are
   earned by the legion over time, and a rental was never part of it. What
   you're paying for is the flat MERCENARY_STAT_MULT and the level lead
   below, nothing the legion has built compounds on top of it.
   ============================================= */
const MERCENARY_PART_COST = 4;     // salvage parts spent to hire — steeper than a permanent recruit's 3
const MERCENARY_MIN_LEVEL = 8;
const MERCENARY_LEVEL_BONUS = 6;   // hired at Lv. stage+6 (floor 8) — always well ahead of a fresh recruit
const MERCENARY_STAT_MULT = 1.3;   // "genuinely strong" — a real cut above a same-level monster
function mercenaryOptions(){
  return TRIBE_IDS.map(e=>({ speciesId: CHAMPIONS[e].id, name: CHAMPIONS[e].name, emoji: CHAMPIONS[e].emoji, element: e }));
}
function mercenaryLevel(){ return Math.max(MERCENARY_MIN_LEVEL, state.stage + MERCENARY_LEVEL_BONUS); }
function canHireMercenary(){ return !state.mercenary && state.parts.length>=MERCENARY_PART_COST; }
function mercenaryPendingText(){
  const h = state.mercenary; if(!h) return null;
  const opt = mercenaryOptions().find(o=>o.speciesId===h.speciesId);
  return `${opt?opt.emoji+' ':''}<b>${opt?escapeHtml(opt.name):'Unknown'}</b> (Lv.${h.level}) is on retainer — fights your next real battle, then the contract's done.`;
}
function hireMercenary(speciesId){
  if(!canHireMercenary()) return;
  if(CHAMPION_IDS.indexOf(speciesId)<0) return;
  state.parts.splice(0, MERCENARY_PART_COST);
  state.mercenary = { speciesId, level: mercenaryLevel() };
  autosave();
  render();
}
/* Which battles count as "the campaign" — shared by Mercenary Contract and
   Energy (see ENERGY below). Same exclusion list Reinforcements uses for
   fairness/scope (a Duel is a formation-vs-formation fair fight, raids/
   World Boss/Guild War and Trials each already run their own separate
   difficulty/scoring layer, and the tutorial is a fixed scripted scouting
   pair) — minus Reinforcements' own boss exclusion, which doesn't apply to
   either mechanic here. The Gauntlet (see THE GAUNTLET below) joins the
   same exclusion list for the same reason: it runs its own score, not the
   campaign's. */
function isCampaignBattle(){
  return !state.duel && !state.raidRun && !state.worldBossRun && !state.guildWarRun && !state.trial && !state.gauntletRun && !tutorialActive();
}
function mercenaryEligibleBattle(){ return isCampaignBattle(); }
/* Built the same way buildPlayerUnits() builds a real monster's unit —
   right down to running it through newMonster()/computeStats() — except
   this monster is never pushed to state.roster, and its base stats get the
   flat MERCENARY_STAT_MULT bump on top. Returns null if the pending
   contract somehow names a non-champion (should never happen — hireMercenary
   already validates against CHAMPION_IDS — but beginBattle() checks anyway
   rather than trusting a save file that could have been hand-edited). */
function buildMercenaryUnit(terrain){
  const hire = state.mercenary;
  if(!hire || CHAMPION_IDS.indexOf(hire.speciesId)<0) return null;
  const m = newMonster(hire.speciesId, hire.level, 1);
  const st = computeStats(m);
  const tier = corrTier(st.corruption);
  const unit = Object.assign(baseUnitDefaults(), {
    id:'p_merc_'+m.uid, side:'player', row:'front', monsterUid:m.uid, level:m.level, speciesId:m.speciesId,
    name:st.name, emoji:st.emoji, sprite:st.sprite, element:st.element, elements:st.elements.slice(),
    attackElements:st.innate.slice(), hybrid:st.hybrid, skillName:st.skill,
    bHp:Math.round(st.hp*MERCENARY_STAT_MULT), bAtk:Math.round(st.atk*MERCENARY_STAT_MULT),
    bDef:Math.round(st.def*MERCENARY_STAT_MULT), bSpd:Math.round(st.spd*MERCENARY_STAT_MULT),
    skillCd:0, skillMaxCd:3, fainted:false,
    corruption: st.corruption, glitchChance: tier.glitch, defectChance: tier.defect,
    trait: st.trait, isMercenary:true,
  });
  applyTerrainToUnit(unit, terrain);
  return unit;
}

/* ============ FIELD COMPANION ============
   A small, non-combat mascot that rides along with the legion — no
   formation slot, no stats, nothing battle-critical. It levels up purely
   from ordinary play: a shared XP pool fed by every stage battle that
   reaches the same "shared tail" choke point the Caravan and Black Market
   already tick from, plus a bonus whenever a genuinely new Deep depth
   record is set. XP buys levels off a fixed cumulative-threshold table,
   same shape as guildLevel(), and each level makes its one passive perk a
   little stronger. Which perk it grants is fixed by which companion got
   rolled — cosmetic variety over one shared mechanic, the same trick Ace/
   Vanguard/Black-Market parts use for names. Rolled once at initGame() and
   never re-rolled; like Trophy Case and Doctrine, a Rebirth never touches
   it — the mascot's bond with the commander outlasts any one legion. ============================================= */
const COMPANION_SPECIES = {
  gearcat:    { name:'Gearcat',    emoji:'🐈‍⬛', desc:'A scrap-plated stray that follows the scent of fresh salvage.', perk:'salvage' },
  mosschick:  { name:'Mosschick',  emoji:'🐥', desc:'Half-feather, half-filament — it studies every fight like homework.', perk:'exp' },
  emberwhelp: { name:'Emberwhelp', emoji:'🦎', desc:'Warms itself at the nearest campfire and charms whoever built it.', perk:'favor' },
};
const COMPANION_IDS = Object.keys(COMPANION_SPECIES);
const COMPANION_XP_PER_BATTLE = 4;       // any stage battle reaching the shared tail, win or lose
const COMPANION_XP_PER_NEW_DEPTH = 6;    // a genuinely new Deep depth record, not a repeat visit
const COMPANION_LEVEL_THRESHOLDS = [0, 40, 100, 200, 360]; // cumulative xp -> levels 1..5, same shape as GUILD_XP
const COMPANION_PERK_BASE = 0.04;  // perk magnitude at level 1
const COMPANION_PERK_STEP = 0.02;  // + per level above 1

function companionLevel(xp){
  let lvl = 1;
  for(let i=1;i<COMPANION_LEVEL_THRESHOLDS.length;i++){ if((xp||0)>=COMPANION_LEVEL_THRESHOLDS[i]) lvl = i+1; }
  return lvl;
}
/* The single read every render/reward site goes through — never poke
   state.companion's fields directly outside addCompanionXp below. */
function companionInfo(){
  if(!state.companion) return null;
  const sp = COMPANION_SPECIES[state.companion.speciesId];
  if(!sp) return null;
  const level = companionLevel(state.companion.xp||0);
  return { speciesId: state.companion.speciesId, name: sp.name, emoji: sp.emoji, desc: sp.desc,
           perk: sp.perk, level, xp: state.companion.xp||0, pct: COMPANION_PERK_BASE + (level-1)*COMPANION_PERK_STEP };
}
function companionPerkPct(kind){
  const c = companionInfo();
  return (c && c.perk===kind) ? c.pct : 0;
}
function addCompanionXp(n){
  if(!state.companion) return;
  state.companion.xp = (state.companion.xp||0) + n;
}
function companionPerkText(c){
  if(!c) return '';
  if(c.perk==='salvage') return `+${Math.round(c.pct*100)}% chance of a bonus salvage drop`;
  if(c.perk==='exp')     return `+${Math.round(c.pct*100)}% EXP from every battle`;
  if(c.perk==='favor')   return `+${Math.round(c.pct*100)}% favor from every battle`;
  return '';
}

/* ---- Archive Fragments: rare Deep-only finds that piece together an

   fragments and walk away with genuinely different beliefs. See
   rollArchiveFragment/leadingArchiveTheory below. Twelve fragments, three
   per theory, deliberately never confirmed one way or the other. */
const ARCHIVE_THEORIES = {
  builders: { name:'Manufactured', blurb:'Every fragment on this side agrees: nothing about the Rustbound looks accidental. Someone built the first of them, on purpose, for a reason nobody wrote down.' },
  kin:      { name:'Corrupted Kin', blurb:'The oldest fragments describe something that used to breathe. If they are telling the truth, the Rustbound are not a separate army at all — they are what your own kind becomes when the rust wins.' },

};
const ARCHIVE_FRAGMENTS = [
  { id:'frag_forge_seal', theory:'builders', text:'A cracked seal, still legible: "FOUNDRY AUTHORIZATION — UNIT CLASS RUSTBOUND — APPROVED FOR FIELD DEPLOYMENT." Someone signed off on the first of them.' },

  { id:'frag_names',      theory:'kin', text:'Etched into a rusted plate, half-erased: a string of names in no known Rustbound cipher — but they scan exactly like the names your own tribes use.' },
  { id:'frag_star_metal', theory:'visitors', text:"A shard of the outer plating does not match anything in Texel's bedrock. Whatever it is, it did not come from here." },
  { id:'frag_crater_map', theory:'visitors', text:'A hand-drawn map marks a single point far to the north with one word: "LANDING." Nothing else on the map is labeled at all.' },
  { id:'frag_countdown',  theory:'visitors', text:'A dead display, its last frame frozen: a number counting down, long since past zero, and a single word above it — "ARRIVAL."' },
  { id:'frag_test_log',   theory:'accident', text:'A test log, mid-sentence: "...never intended for combat applications. Recommend immediate containment." The rest of the page is missing.' },
  { id:'frag_warning',    theory:'accident', text:'A warning sign, bent nearly flat: "DO NOT ACTIVATE WITHOUT SUPERVISION." It was found a long way from wherever it used to hang.' },
  { id:'frag_apology',    theory:'accident', text:'The closest thing to a personal record any fragment has yielded: one sentence, unsigned. "We did not mean for this to keep going."' },
];
const ARCHIVE_FRAGMENT_CHANCE = 0.22;   // per Deep-milestone win, while any fragment remains unfound
const ARCHIVE_THEORY_MIN = 3;           // fragments needed before a leading theory is even offered
function archiveFound(){ return (state.archive && typeof state.archive==='object') ? state.archive : {}; }
function archiveFoundCount(){ return ARCHIVE_FRAGMENTS.filter(f=>!!archiveFound()[f.id]).length; }
function undiscoveredFragments(){ const found = archiveFound(); return ARCHIVE_FRAGMENTS.filter(f=>!found[f.id]); }
/* Called once from endBattle()'s win branch, Deep stages only. Guaranteed
   new (never repeats a fragment already found) until every fragment is
   recovered, then quietly stops rolling — nothing left to find. */
function rollArchiveFragment(){
  const pool = undiscoveredFragments();
  if(!pool.length) return null;
  if(Math.random() >= ARCHIVE_FRAGMENT_CHANCE) return null;
  const frag = pool[Math.floor(Math.random()*pool.length)];
  state.archive[frag.id] = true;
  return frag;
}
function archiveTheoryTally(){
  const t = {}; Object.keys(ARCHIVE_THEORIES).forEach(k=>t[k]=0);
  ARCHIVE_FRAGMENTS.forEach(f=>{ if(archiveFound()[f.id]) t[f.theory]++; });
  return t;
}
/* Returns null until ARCHIVE_THEORY_MIN fragments are in; otherwise an
   object naming the plurality theory (key=null and split=true when two or
   more theories are genuinely tied) so the Archive screen can say the
   evidence itself is inconclusive rather than fake a verdict. */
function leadingArchiveTheory(){
  const t = archiveTheoryTally();
  const total = Object.values(t).reduce((s,v)=>s+v,0);
  if(total < ARCHIVE_THEORY_MIN) return null;
  const max = Math.max(...Object.values(t));
  const leaders = Object.keys(t).filter(k=>t[k]===max && max>0);
  return { key: leaders.length===1 ? leaders[0] : null, split: leaders.length>1, tally:t, total };
}

    const els = Object.keys(ELEM_BEATS);

  }

}

  if(!t) return '';
  return t.key==='bane' ? `+15% damage against ${t.elem}` : TRAITS[t.key].desc;
}

  return `<div class="trait-tag" title="${traitDesc(t)}">${TRAITS[t.key].emoji} ${traitName(t)}</div>`;

/* --- minimal Supabase REST client (no SDK: these are plain HTTPS endpoints) --- */
function cloudFetch(path, opts, auth){
  opts = opts || {};
  const headers = Object.assign({
    'apikey': CLOUD.anonKey,
    'Content-Type': 'application/json',
  }, opts.headers || {});
  if(auth && cloud.session) headers['Authorization'] = 'Bearer ' + cloud.session.access_token;
  return fetch(CLOUD.url + path, Object.assign({}, opts, { headers }))
    .then(res => res.text().then(text => {
      let body = null;
      if(text){ try{ body = JSON.parse(text); }catch(e){ body = text; } }
      return { ok: res.ok, status: res.status, body };
    }));
}
function authErrorText(r){
  const b = r.body;
  if(b && typeof b==='object'){
    if(b.error_description) return b.error_description;
    if(b.msg) return b.msg;
    if(b.message) return b.message;
    if(b.error) return String(b.error);
  }
  if(r.status===0) return 'Could not reach the server.';
  return 'Request failed (' + r.status + ').';
}
function adoptSession(body){
  if(!body || !body.access_token) return null;
  const sess = {
    access_token: body.access_token,
    refresh_token: body.refresh_token,
    expires_at: Date.now() + ((body.expires_in || 3600) * 1000),
    user: { id: body.user ? body.user.id : (body.id||null), email: body.user ? body.user.email : null },
  };
  saveSession(sess);
  return sess;
}

function cloudSignUp(email, password){

    .then(r => {

      const sess = adoptSession(r.body);
      if(!sess) return { ok:true, needsConfirm:true };   // project has email confirmation on
      return { ok:true, session: sess };
    })
    .catch(() => ({ ok:false, error:'Could not reach the server — check your connection.' }));
}
function cloudSignIn(email, password){

      const sess = adoptSession(r.body);
      return sess ? { ok:true, session: sess } : { ok:false, error:'The server returned no session.' };
    })
    .catch(() => ({ ok:false, error:'Could not reach the server — check your connection.' }));
}
function cloudRefresh(){
  if(!cloud.session || !cloud.session.refresh_token) return Promise.resolve(false);
  return cloudFetch('/auth/v1/token?grant_type=refresh_token',
      { method:'POST', body: JSON.stringify({ refresh_token: cloud.session.refresh_token }) })
    .then(r => {
      if(!r.ok){ saveSession(null); return false; }
      return !!adoptSession(r.body);
    })
    .catch(() => false);
}
function cloudSignOut(){
  const done = () => { saveSession(null); cloud.status='signed-out'; cloud.message=''; };
  if(!signedIn()){ done(); return Promise.resolve(); }
  return cloudFetch('/auth/v1/logout', { method:'POST' }, true).then(done).catch(done);
}

/* Any authed call: refresh once on 401 rather than dumping the player at the login screen. */
function authed(path, opts){
  const attempt = () => cloudFetch(path, opts, true);
  const expired = cloud.session && cloud.session.expires_at && Date.now() > cloud.session.expires_at - 30000;
  const pre = expired ? cloudRefresh() : Promise.resolve(true);
  return pre.then(() => attempt()).then(r => {
    if(r.status !== 401) return r;
    return cloudRefresh().then(okRefresh => okRefresh ? attempt() : r);
  });
}

/* ================= GUILDS · RAIDS · LADDER =================
   All of this needs an account. Everything below degrades to a
   "sign in first" prompt when signed out, and the single-player
   game never depends on any of it. See SETUP-MULTIPLAYER.md.
   ============================================================ */
const social = { guild:null, members:[], raid:null, board:[], ladder:[], rank:null, opponent:null,
                 council:[], councilError:'', status:'', guildError:'', busy:false, lastDuel:null,
                 online:[], onlineError:'', replays:[], replaysError:'', replayStatus:'', replayBusy:false,
                 worldBoss:null, worldBossBoard:[], worldBossError:'', worldBossStatus:'', worldBossBusy:false,
                 guildWar:null, guildWarError:'', guildWarStatus:'', guildWarBusy:false,
                 project:null, projectBoard:[], projectError:'' };

/* ---- guild progression ----
   Thresholds are cumulative XP. Perks are read from the server-held level and
   applied client-side, same trust model as everything else here. */
const GUILD_XP = [0, 2000, 6000, 14000, 30000, 60000];   // index = level-1
const MAX_GUILD_LEVEL = GUILD_XP.length;
const GUILD_PERKS = {
  2: { key:'exp',    name:'Quartermasters',  desc:'+10% EXP from every battle' },
  3: { key:'salvage',name:'Foundry Ties',    desc:'+15% chance of salvage from a victory' },
  4: { key:'gauge',  name:'War Drums',       desc:'Legion Gauge charges 15% faster' },
  5: { key:'might',  name:'Iron Discipline', desc:'+6% ATK and DEF for your whole legion' },
  6: { key:'raid',   name:'Siege Doctrine',  desc:'Your raid damage counts for 25% more' },
};
function guildLevel(){ return (social.guild && social.guild.level) ? Math.min(MAX_GUILD_LEVEL, social.guild.level) : 0; }
function guildXp(){ return (social.guild && social.guild.xp) ? Number(social.guild.xp) : 0; }
function guildXpFloor(){ return GUILD_XP[Math.max(0, guildLevel()-1)] || 0; }
function guildXpNext(){ return (guildLevel() >= MAX_GUILD_LEVEL) ? null : GUILD_XP[guildLevel()]; }
function guildXpPct(){
  const next = guildXpNext();
  if(next===null) return 100;
  const floor = guildXpFloor();
  return Math.max(0, Math.min(100, Math.round(((guildXp()-floor) / (next-floor)) * 100)));
}
function hasPerk(key){
  const lvl = guildLevel();
  for(let l=2; l<=lvl; l++){ if(GUILD_PERKS[l] && GUILD_PERKS[l].key===key) return true; }
  return false;
}

/* ---- guild projects ----
   A second, separate progression track from the level/XP ladder above and
   from the weekly council vote — nothing here is passive and nothing here
   resets. Members spend their OWN salvage parts (freeing bay slots the same
   as any other spend) into one running guild-wide total that only ever
   grows; every threshold the total crosses unlocks its effect permanently,
   for every member, forever. Cumulative thresholds, same shape as GUILD_XP,
   so funding a huge amount in one go can cross more than one tier at once.
   See Step 10 of SETUP-MULTIPLAYER.md. */
const GUILD_PROJECT_CONTRIB_CAP = 14;   // a salvage bay can never hold more than this in one go
const GUILD_PROJECT_TIERS = [
  { threshold:30,  key:'vault',   emoji:'🗃️', name:'Salvage Vault',
    desc:'+8% chance of a bonus salvage drop from every victory, for the whole guild.' },
  { threshold:90,  key:'crest',   emoji:'🛡️', name:'Guild Crest',
    desc:'A crest of your own, flown at the top of the Guild Hall for every member.' },
  { threshold:180, key:'concord', emoji:'🤝', name:'Caravan Concord',
    desc:'Unlocks a better caravan exchange, offered only to this guild.' },
];
function guildProjectTotal(){ return (social.project && isFinite(Number(social.project.total))) ? Math.max(0, Number(social.project.total)) : 0; }
function guildProjectTier(){
  const total = guildProjectTotal();
  let n = 0;
  for(const t of GUILD_PROJECT_TIERS){ if(total >= t.threshold) n++; else break; }
  return n;
}
function hasProject(key){
  const n = guildProjectTier();
  for(let i=0;i<n;i++){ if(GUILD_PROJECT_TIERS[i].key===key) return true; }
  return false;
}
function nextGuildProjectTier(){ return GUILD_PROJECT_TIERS[guildProjectTier()] || null; }   // null once every tier is funded
function guildProjectFloor(){ const n = guildProjectTier(); return n>0 ? GUILD_PROJECT_TIERS[n-1].threshold : 0; }
function guildProjectPct(){
  const next = nextGuildProjectTier();
  if(!next) return 100;
  const floor = guildProjectFloor();
  return Math.max(0, Math.min(100, Math.round(((guildProjectTotal()-floor) / (next.threshold-floor)) * 100)));
}

function myMembership(){
  if(!cloud.session) return null;
  return social.members.find(m=>m.user_id===cloud.session.user.id) || null;
}
function isGuildLeader(){ const m = myMembership(); return !!(m && m.role==='leader'); }

function rpcErrorText(r, missingMsg){
  const msg = (r.body && (r.body.message || r.body.hint)) || ('status ' + r.status);
  // PostgREST says this when a function is absent OR when its cache is stale.
  if(r.status===404 || /could not find the function|schema cache/i.test(String(msg))){
    return missingMsg || 'The multiplayer functions are not installed on your project yet — run the FUNCTIONS block (step 2) from SETUP-MULTIPLAYER.md, then reload the schema.';
  }
  if(/permission denied|not signed in/i.test(String(msg))) return 'Your session was not accepted — try signing out and back in.';
  return msg;
}
/* missingMsg lets a caller override the "not installed" guidance for a function that
   belongs to a later migration step (e.g. cast_council_vote, added in step 5). */
function rpc(fn, args, missingMsg){
  return authed('/rest/v1/rpc/' + fn, { method:'POST', body: JSON.stringify(args||{}) })
    .then(r => r.ok ? { ok:true, body:r.body } : { ok:false, error: rpcErrorText(r, missingMsg), status:r.status })
    .catch(() => ({ ok:false, error:'Could not reach the server.' }));
}
function restGet(path){
  return authed('/rest/v1/' + path, { method:'GET' })
    .then(r => (r.ok && Array.isArray(r.body)) ? r.body : null)
    .catch(() => null);
}
/* Like restGet, but tells a genuine query failure (missing column/table — usually an
   un-run migration) apart from a legitimate empty result, and turns the former into a
   message the player can act on instead of a silent blank screen. */
function restGetErrorText(r, missingMsg){
  const msg = (r.body && (r.body.message || r.body.hint)) || ('status ' + r.status);
  if(/column .* does not exist|could not find/i.test(String(msg))){
    return missingMsg || 'Your project is missing the guild-hall upgrade — run Step 4 of SETUP-MULTIPLAYER.md (adds guild levels and member profiles), then reload the schema.';
  }
  return String(msg);
}
/* missingMsg lets a caller override the "not run yet" guidance for its own migration
   step (e.g. the guild council table added in step 5) instead of the guild-hall default. */
function restGetDiag(path, missingMsg){
  return authed('/rest/v1/' + path, { method:'GET' })
    .then(r => (r.ok && Array.isArray(r.body))
      ? { ok:true, rows:r.body }
      : { ok:false, rows:null, error: restGetErrorText(r, missingMsg) })
    .catch(() => ({ ok:false, rows:null, error:'Could not reach the server.' }));
}
