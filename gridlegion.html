/* ================= THE CAMP =================
   The screen a returning commander lands on instead of a blank hub. Two
   independent parts:
   - A small "while you were out" grant (campWelcomeBonus), scaled by real
     time away and capped so it can never substitute for actually playing —
     one of salvage, EXP or tribe favour, computed once from continueSlot()'s
     own save timestamp and immediately re-saved so revisiting Legions and
     hitting Continue again can't roll it twice.
   - Flavour commentary (campCommentary) built entirely from data the game
     already tracks — Rustbound Doctrine, a streak derived from real stage
     results, the Ladder if it's already loaded — never a new system, never
     anything that touches battle math. Always shows something, even for a
     brand-new legion with no history yet.
   ================================================= */
const CAMP_MIN_AWAY_MS = 30*60*1000;    // below this, no bonus at all — just flavour
const CAMP_MAX_AWAY_MS = 24*60*60*1000; // time-away scaling caps here; camping longer buys nothing more
function campAwayFrac(awayMs){
  if(typeof awayMs!=='number' || !(awayMs>0) || awayMs<CAMP_MIN_AWAY_MS) return 0;
  return Math.min(1, (awayMs-CAMP_MIN_AWAY_MS) / (CAMP_MAX_AWAY_MS-CAMP_MIN_AWAY_MS));
}
function campWelcomeBonus(awayMs){
  const frac = campAwayFrac(awayMs);
  if(frac<=0) return null;
  const options = ['exp','favor'];
  if(state.parts.length<14) options.push('salvage');
  const type = options[Math.floor(Math.random()*options.length)];
  if(type==='salvage'){
    const keys = Object.keys(PARTS);
    const key = keys[Math.floor(Math.random()*keys.length)];
    state.parts.push({ uid: uid(), key });
    return { type, key, text: `${PARTS[key].emoji} ${PARTS[key].name} recovered while you were away.` };
  }
  if(type==='exp'){
    const amount = Math.round(4 + frac*10);
    let levelled = 0;
    state.roster.forEach(m=>{
      const before = m.level;
      m.exp += amount;
      let need = m.level*10;
      while(m.exp>=need){ m.exp-=need; m.level++; need=m.level*10; }
      if(m.level>before) levelled++;
    });
    return { type, amount, levelled, text: `The legion kept training on its own — +${amount} EXP to every monster in the roster.` };
  }
  const e = TRIBE_IDS[Math.floor(Math.random()*TRIBE_IDS.length)];
  const amount = Math.round(2 + frac*4);
  addFavor(e, amount);
  return { type, element:e, amount, text: `${TRIBES[e].emoji} +${amount} ${TRIBES[e].name} favor — they kept watch while you were gone.` };
}
function campCommentary(){
  const lines = [];
  const doctElem = doctrineElement();
  if(doctElem){
    const tier = doctrineTier();
    lines.push({ emoji: TRIBES[doctElem].emoji, text: pickText([
      `The ${TRIBES[doctElem].name} keep the closest eye on your fires — your legion fights ${doctElem.toUpperCase()} more than anything else, and it shows.`,
      `Word around the ${TRIBES[doctElem].name} camp is that your legion's all but adopted ${doctElem.toUpperCase()} as a second banner.`,
    ]) + (tier>0 ? ` Escalation tier ${tier}.` : '') });
  }
  if(state.streak>0){
    lines.push({ emoji:'🔥', text: state.streak>=5
      ? `${state.streak} stages clear in a row now. Even the skeptics by the fire have stopped betting against you.`
      : `${state.streak} win${state.streak===1?'':'s'} running. Nobody's saying it out loud, but they're keeping count.` });
  } else if(state.streak<0){
    const n = -state.streak;
    lines.push({ emoji:'🩹', text: `${n} rough stage${n===1?'':'s'} in a row. The camp's still behind you — but they've noticed too.` });
  }
  if(signedIn() && social.ladder && social.ladder.length){
    const top = social.ladder[0];
    lines.push({ emoji:'🏆', text: social.rank
      ? `Ladder talk: ${top.display_name} holds the top spot this week — you're sitting at #${social.rank}.`
      : `Ladder talk: ${top.display_name} holds the top spot this week.` });
  }
  if(!lines.length) lines.push({ emoji:'⛺', text:'The camp is quiet tonight. No news yet — go make some.' });
  return lines;
}
function goCamp(){ state.screen='camp'; render(); }
function leaveCamp(){ state.campWelcome = null; state.screen='hub'; render(); }
function renderCamp(){
  const bonus = state.campWelcome;

  </div>

  <div class="panel">

}

function corruptionBar(c){

/* ============ ROSTER / FUSION ============ */
let fuseSelection = [];

const TRAIT_LABEL = {
  fire:'burn immunity', water:'slow immunity', volt:'stun immunity',
  nature:'regeneration', earth:'a bulwark shield', wind:'evasion',
};
/* Works out what the two selected monsters would make, or null if they can't fuse. */
function inheritTrait(parents){
  const pool = parents.map(m=>m.trait).filter(Boolean);
  if(!pool.length) return rollTrait();
  return pool[Math.floor(Math.random()*pool.length)];
}
function fusionPlan(){
  const picks = fuseSelection.map(findMonster).filter(Boolean);
  if(picks.length!==fuseSelection.length) return null;
  if(picks.some(m=>m.level<3)) return null;

  /* three matching Primes ascend */
  if(picks.length===3){
    const same = picks.every(m=>m.speciesId===picks[0].speciesId);
    if(!same || !picks.every(m=>m.tier===2)) return null;
    return { kind:'ascend', parents:picks, speciesId:picks[0].speciesId,
             parentName:getSpeciesData(picks[0].speciesId,2).name,
             resultName:'Ascended '+getSpeciesData(picks[0].speciesId,1).name };
  }
  if(fuseSelection.length!==2) return null;
  const a = picks[0], b = picks[1];
  if(a.speciesId===b.speciesId){
    if(a.tier!==b.tier || a.tier>=2) return null;
    return { kind:'prime', parents:picks, parentName:getSpeciesData(a.speciesId,a.tier).name,
             resultName:'Prime '+getSpeciesData(a.speciesId,1).name };
  }
  if(a.tier>=2 || b.tier>=2) return null;
  if(isHybridId(a.speciesId) || isHybridId(b.speciesId)) return null;
  const ea = SPECIES[a.speciesId].element, eb = SPECIES[b.speciesId].element;
  if(ea===eb) return null;
  const id = hybridIdFor(ea, eb);
  if(!HYBRID_SPECIES[id]) return null;
  return { kind:'hybrid', parents:picks, resultId:id, resultName:HYBRID_SPECIES[id].name,
           traits:[ea,eb].sort().map(e=>TRAIT_LABEL[e]) };
}
function fusionBlockReason(){
  const picks = fuseSelection.map(findMonster).filter(Boolean);
  if(picks.length<2) return 'Select two monsters.';
  if(picks.some(m=>m.level<3)) return 'Every monster in the forge must be Lv.3 or higher.';
  if(picks.length===3){
    if(!picks.every(m=>m.speciesId===picks[0].speciesId)) return 'Ascension needs three of the <b>same</b> Prime form.';
    if(!picks.every(m=>m.tier===2)) return 'Ascension needs three <b>Prime</b> forms — evolve them first.';
    return 'These three cannot ascend.';
  }
  const a = picks[0], b = picks[1];
  if(a.tier>=3 || b.tier>=3) return 'Ascended forms are the end of the line.';
  if(a.speciesId===b.speciesId && a.tier===2) return 'Two Primes are not enough — ascension takes <b>three</b>.';
  if(a.tier>=2 || b.tier>=2) return 'Prime forms can only be combined with matching Primes.';
  if(isHybridId(a.speciesId) || isHybridId(b.speciesId)) return 'A hybrid can only be evolved with an identical hybrid, not spliced again.';
  return 'These two share an element — splicing needs two different elements.';
}
function renderRoster(){
  fuseSelection = fuseSelection.filter(u=>findMonster(u));
  let cards = state.roster.map(m=>{
    const st = computeStats(m);
    const sel = fuseSelection.includes(m.uid);
    return `
    <div class="mcard ${sel?'selected':''}" onclick="toggleFuseSelect('${m.uid}')">
      ${m.tier>=3?'<div class="tier3tag">👑</div>':(m.tier>=2?'<div class="tier2tag">★</div>':'')}${isHybridId(m.speciesId)?'<div class="tier2tag" style="left:2px; right:auto; color:var(--wind)">✦</div>':''}
      <div class="emoji">${unitSpriteHtml(st, 40)}</div>
      <div class="name">${escapeHtml(st.name)}</div>
      ${m.nickname?`<div class="dim" style="font-size:11px; margin-top:-4px;">${escapeHtml(st.baseName)}</div>`:''}
      <div class="lvl">Lv.${m.level}</div>
      ${elemTags(st.elements)}
      ${traitTag(st.trait)}
      ${corruptionBar(st.corruption)}
    </div>`;
  }).join('');

  const plan = fusionPlan();
  const canFuse = !!plan;
  let fuseInfo;
  if(fuseSelection.length!==2){
    fuseInfo = 'Select from the roster above. <b>Two of a kind</b> evolve into a Prime; <b>two different elements</b> splice into a hybrid; <b>three matching Primes</b> ascend. The result inherits one parent\'s trait.';
  } else if(plan && plan.kind==='ascend'){
    fuseInfo = `Ascend three ${plan.parentName} into a single <b>${plan.resultName}</b> 👑 — 2.3× base stats, a fourth part slot, and an empowered skill. All three are consumed.`;
  } else if(plan && plan.kind==='prime'){
    fuseInfo = `Evolve two ${plan.parentName} into one <b>${plan.resultName}</b>. Installed parts are lost in the forge.`;
  } else if(plan && plan.kind==='hybrid'){
    const sd = HYBRID_SPECIES[plan.resultId];
    fuseInfo = `Splice into <b>${sd.emoji} ${sd.name}</b> — ${elemTags(sd.elements)} — inheriting <b>${plan.traits.join(' + ')}</b>.
      It counts toward <b>both</b> element lines in whichever row it stands. Parents and their parts are consumed.`;
  } else {
    fuseInfo = fusionBlockReason();
  }

  return `
  <div class="panel">
    <h2 class="section">ROSTER</h2>
    <div class="row">${cards || '<p class="dim">No monsters yet.</p>'}</div>
  </div>
  <div class="panel">
    <h2 class="section">FUSION LAB</h2>
    ${state.lastFusion ? `<p style="color:var(--gold)">✦ Forged: <b>${state.lastFusion.emoji} ${state.lastFusion.name}</b> ${elemTags(state.lastFusion.elements)} ${state.lastFusion.trait?`<span style="color:var(--volt)">${TRAITS[state.lastFusion.trait.key].emoji} ${traitName(state.lastFusion.trait)}</span>`:''}</p>` : ''}
    <p class="dim">${fuseInfo}</p>
    <button class="btn primary" ${canFuse?'':'disabled'} onclick="doFuse()">🔥 FUSE SELECTED</button>
  </div>
  <div class="panel">
    <h2 class="section">SPLICE INDEX ${discoveredCount()}/${Object.keys(HYBRID_SPECIES).length}</h2>
    <p class="dim">Every pair of elements makes something. Discovered hybrids stay listed.</p>
    <div class="row">${hybridIndexHtml()}</div>
  </div>
  <div class="panel footer-nav">
    <button class="btn" onclick="fuseSelection=[]; state.lastFusion=null; state.screen='hub'; render();">← Back to Hub</button>
  </div>`;
}
function discoveredCount(){ return Object.keys(state.discovered||{}).length; }
function hybridIndexHtml(){
  return Object.keys(HYBRID_SPECIES).map(id=>{
    const sd = HYBRID_SPECIES[id];
    const known = state.discovered && state.discovered[id];
    return `<div class="mcard" style="width:96px; cursor:default; ${known?'':'opacity:0.35'}">
      <div class="emoji">${spriteOrEmoji(sd, known, 38)}</div>
      <div class="name">${known?sd.name:'???'}</div>
      ${elemTags(sd.elements)}
    </div>`;
  }).join('');
}

function toggleFuseSelect(u){
  const i = fuseSelection.indexOf(u);
  if(i>=0) fuseSelection.splice(i,1);
  else {
    if(fuseSelection.length>=3) fuseSelection.shift();
    fuseSelection.push(u);
  }
  render();
}
function doFuse(){
  const plan = fusionPlan();
  if(!plan) return;
  const parents = plan.parents;
  const eaten = parents.map(m=>m.uid);
  const trait = inheritTrait(parents);
  state.roster = state.roster.filter(m=>eaten.indexOf(m.uid)<0);
  ['front','back'].forEach(row=>{
    state.formation[row] = state.formation[row].map(u=> eaten.indexOf(u)>=0 ? null : u);
  });
  const made = (plan.kind==='prime')  ? newMonster(parents[0].speciesId, 1, 2, trait)
             : (plan.kind==='ascend') ? newMonster(plan.speciesId, 1, 3, trait)
             : newMonster(plan.resultId, 1, 1, trait);
  state.roster.push(made);
  autosaveLater();
  if(plan.kind==='hybrid'){ state.discovered = state.discovered||{}; state.discovered[plan.resultId] = true; }
  state.lastFusion = computeStats(made);
  fuseSelection = [];
  render();
}

  } else if(mode==='transfer'){
    const d = findMonster(state.transfer.donor);
    opPanel = `<div class="panel">
      <h2 class="section">TRAIT TRANSFER — ${escapeHtml(d?computeStats(d).name:'?')}</h2>

    <div class="row">${partCards || '<p class="dim">No salvage in storage. Win battles to strip parts from the wreckage.</p>'}</div>

/* --- harvest: the rust already took this one; take something back --- */
function beginHarvest(uidStr){

function pickGraft(kind){

function doHarvest(targetUid){
  const h = state.harvest;
  if(!h || !h.kind) return;
  const donor = findMonster(h.donor), target = findMonster(targetUid);
  if(!donor || !target || donor.uid===target.uid) return;
  if(!canHarvest(donor)) return;
  if(h.kind==='slot' && graftCount(target,'slot') >= 1){
    state.bayMsg = 'That beast already carries a Bracing Frame.'; render(); return;
  }
  if(!addGraft(target, h.kind)){ state.bayMsg = 'That graft will not take.'; render(); return; }
  // the donor is consumed, parts and all
  state.roster = state.roster.filter(x=>x.uid!==donor.uid);
  ['front','back'].forEach(r=>{ state.formation[r] = state.formation[r].map(u=> u===donor.uid ? null : u); });
  const st = computeStats(target);
  state.bayMsg = `${GRAFT_KINDS[h.kind].emoji} ${GRAFT_KINDS[h.kind].name} grafted onto ${st.name}. ${computeStats(donor).name} is gone.`;
  state.harvest = null;
  sfx('levelup'); autosave(); render();
}

/* --- trait transfer: move a good roll off a body you don't want --- */
function beginTransfer(uidStr){
  const m = findMonster(uidStr);
  if(!m || !m.trait || m.level < 3) return;
  state.transfer = { donor: uidStr };
  state.harvest = null;
  sfx('click'); render();
}
function doTransfer(targetUid){
  const t = state.transfer;
  if(!t) return;
  const donor = findMonster(t.donor), target = findMonster(targetUid);
  if(!donor || !target || donor.uid===target.uid) return;
  if(donor.level < 3){ state.bayMsg = 'The donor must be Lv.3 or higher.'; render(); return; }
  const moved = donor.trait;
  target.trait = moved;
  state.roster = state.roster.filter(x=>x.uid!==donor.uid);
  ['front','back'].forEach(r=>{ state.formation[r] = state.formation[r].map(u=> u===donor.uid ? null : u); });
  state.bayMsg = `${traitName(moved)} carried over to ${computeStats(target).name}. ${computeStats(donor).name} is gone.`;
  state.transfer = null;
  sfx('levelup'); autosave(); render();
}
function cancelBayAction(){ state.harvest=null; state.transfer=null; state.bayMsg=''; sfx('click'); render(); }
function installPart(monsterUid){
  if(!state.selectedPart) return;
  const m = findMonster(monsterUid); if(!m) return;
  if((m.parts||[]).length >= partSlots(m)) return;
  const idx = state.parts.findIndex(p=>p.uid===state.selectedPart);
  if(idx<0) return;
  const part = state.parts.splice(idx,1)[0];
  m.parts = (m.parts||[]).concat([part.key]);
  state.selectedPart = null;
  autosave();
  render();
}
function purgePart(monsterUid, slotIdx){
  const m = findMonster(monsterUid); if(!m) return;
  m.parts.splice(slotIdx,1);
  autosave();
  render();
}

/* ============ THE FORGE ============
   A sink for salvage that's outgrown its usefulness raw: burn 3 of the same
   part and get back 1 named, upgraded part with a second stat the raw part
   never carried. Net bay count always drops (-3 +1), so the 14-part cap is
   never a concern here. */
function goForge(){ state.screen='forge'; state.forgeMsg=''; render(); }
function forgeStock(key){ return state.parts.filter(p=>p.key===key).length; }
function renderForge(){
  const rows = Object.keys(PARTS).map(k=>{
    const P = PARTS[k], fb = FORGED_PARTS[k];
    const have = forgeStock(k);
    const ready = have >= FORGE_COST;
    return `<div class="pcard" style="width:230px; ${ready?'':'opacity:0.55;'}">
      <div class="pname">${P.emoji} ${escapeHtml(P.name)}</div>
      <div class="dim" style="font-size:13px;">${have} in the bay (need ${FORGE_COST})</div>
      <div class="dim" style="font-size:13px; margin-top:4px;">🔨 becomes <b>${escapeHtml(fb.name)}</b></div>
      <div style="font-size:13px; color:var(--gold);">+${Math.round(P.pct*FORGE_PCT_MULT*100)}% ${STAT_LABEL[P.stat]} · +${Math.round(fb.bonusPct*100)}% ${STAT_LABEL[fb.bonusStat]}</div>
      <div style="font-size:13px; color:var(--rust);">⚙ ${Math.max(1,Math.round(P.corruption*FORGE_CORRUPTION_MULT))} rust <span class="dim">(was ${P.corruption})</span></div>
      <button class="btn small ${ready?'primary':''}" style="margin-top:6px;" ${ready?'':'disabled'} onclick="doForge('${k}')">Forge</button>
    </div>`;
  }).join('');
  return `
  <div class="panel">
    <h2 class="section">THE FORGE</h2>
    <p class="dim">Feed ${FORGE_COST} of the same salvage part into the Forge and walk away with one upgraded, named part: a stronger version of the stat it already had, plus a second stat the raw part never carried. The rest of the stack is consumed. Forged parts install and purge exactly like any other.</p>
    ${state.forgeMsg?`<p style="color:var(--gold)">${escapeHtml(state.forgeMsg)}</p>`:''}
    <div class="row" style="margin-top:8px;">${rows}</div>
  </div>
  <div class="panel footer-nav"><button class="btn" onclick="state.forgeMsg=''; state.screen='hub'; render();">← Back to Hub</button></div>`;
}
function doForge(key){
  if(!PARTS[key]) return;
  if(forgeStock(key) < FORGE_COST){ state.forgeMsg = 'Not enough '+PARTS[key].name+' in the bay.'; render(); return; }
  let removed = 0;
  state.parts = state.parts.filter(p=>{
    if(p.key===key && removed<FORGE_COST){ removed++; return false; }
    return true;
  });
  state.parts.push({ uid: uid(), key: key+FORGE_SUFFIX });
  state.forgeMsg = `🔨 Forged ${FORGED_PARTS[key].name}.`;
  autosave();
  sfx('levelup');
  render();
}

/* ============ FORMATION ============ */
function renderFormation(){
  function slotHtml(row, idx){
    const u = state.formation[row][idx];
    const m = u ? findMonster(u) : null;
    if(!m) return `<div class="slot" onclick="placeSelected('${row}',${idx})">+</div>`;
    const st = computeStats(m);

    </div>`;
  }
  const placedUids = state.formation.front.concat(state.formation.back).filter(Boolean);
  const bench = state.roster.filter(m=>!placedUids.includes(m.uid));
  const benchCards = bench.map(m=>{
    const st = computeStats(m);
    const sel = state.formSelected===m.uid;
    return `<div class="mcard ${sel?'selected':''}" onclick="selectBenchMonster('${m.uid}')">
      <div class="emoji">${unitSpriteHtml(st, 40)}</div>
      <div class="name">${st.name}</div>
      <div class="lvl">Lv.${m.level}</div>
      ${elemTags(st.elements)}
      ${traitTag(st.trait)}
    </div>`;
  }).join('');

  const frontSyn = formationRowSynergyLabel('front');
  const backSyn = formationRowSynergyLabel('back');
  const threat = previewFirstThreat();
  const threatHtml = threat ? `
  <div class="panel">
    <h2 class="section">🎯 THREAT PREVIEW</h2>
    <div class="threat-banner">${threat.threatEmoji} ${escapeHtml(threat.threatName)} reads as the fastest on their side, and would likely open on your ${threat.targetEmoji} ${escapeHtml(threat.targetName)} (${threat.targetRow} row) with a <b>${threat.threatElement}</b> strike. A scouting read, not a promise — the real enemy team is drawn fresh the moment the fight starts.</div>
  </div>` : '';

  return `
  <div class="panel">
    <h2 class="section">FORMATION</h2>
    <p class="dim">Front row = melee, absorbs enemy melee strikes first. Back row = ranged, can strike any enemy but is safe from melee until the front falls. Match elements in a row for synergy bonuses — and remember you can <b>Shift</b> rows mid-battle to make or break them.</p>
    <div class="formation">
      <div class="frow"><div class="label">FRONT</div>${[0,1,2].map(i=>slotHtml('front',i)).join('')}</div>
      ${frontSyn?`<div class="synergy-tag">✨ ${frontSyn}</div>`:''}
      <div class="frow"><div class="label">BACK</div>${[0,1,2].map(i=>slotHtml('back',i)).join('')}</div>
      ${backSyn?`<div class="synergy-tag">✨ ${backSyn}</div>`:''}
    </div>
  </div>
  ${threatHtml}
  <div class="panel">
    <h2 class="section">BENCH ${state.formSelected?'<span class="dim">(tap a slot to place)</span>':''}</h2>
    <div class="row">${benchCards || '<p class="dim">Everyone is deployed.</p>'}</div>
  </div>
  <div class="panel footer-nav">
    <button class="btn" onclick="state.formSelected=null; state.screen='hub'; render();">← Back to Hub</button>
  </div>`;
}
/* ---- Threat Preview ----
   A deliberately partial pre-battle tell: which of your units the enemy's
   fastest fielded unit would most likely open on, and with what element —
   computed by actually calling the real targeting logic (getValidTargets +
   scoreTarget), the same functions enemyAct() itself uses for the real first
   move of the battle. It works by building one throwaway sample enemy team
   and briefly pointing state.battle at a scratch object so those functions
   have something to read; nothing here is persisted, and state.battle is
   restored immediately after (try/finally, in case anything above throws).
   Since buildEnemyUnits/buildPlayerUnits are randomized, this is a read on
   one likely draw, not a guarantee of the exact team the fight will use. */
function previewFirstThreat(){
  if(state.duel || state.raidRun || state.worldBossRun || state.guildWarRun || state.trial) return null;
  const filled = state.formation.front.concat(state.formation.back).filter(Boolean).length;
  if(!filled) return null;
  const savedBattle = state.battle;
  let result = null;
  try{
    const terrain = terrainForStage(state.stage);
    const adapted = currentAdaptation();
    const platingElem = adapted || (hasMod('hardened') ? deployedDominantElement() : null);
    const usePlating = (platingActive() || hasMod('hardened')) && !!platingElem;
    const tier = aiTier();
    const playerUnits = buildPlayerUnits(terrain);
    const enemyUnits = buildEnemyUnits(state.stage, terrain, adapted, usePlating, platingElem);
    if(enemyUnits && enemyUnits.length){
      const threatUnit = enemyUnits.slice().sort((a,c)=>c.spd-a.spd)[0];
      state.battle = { playerUnits, enemyUnits, result:null };
      const targets = getValidTargets(threatUnit);
      let target = targets[0], best = -Infinity;
      targets.forEach(t=>{ const sc = scoreTarget(threatUnit, t, tier); if(sc>best){ best=sc; target=t; } });
      if(target){
        result = {
          threatName: threatUnit.name, threatEmoji: threatUnit.emoji, threatElement: threatUnit.element,
          targetName: target.name, targetEmoji: target.emoji, targetRow: target.row,
        };
      }
    }
  } finally {
    state.battle = savedBattle;
  }
  return result;
}
function selectBenchMonster(u){ state.formSelected = (state.formSelected===u) ? null : u; render(); }
function placeSelected(row, idx){
  if(!state.formSelected) return;
  ['front','back'].forEach(r=>{ state.formation[r] = state.formation[r].map(u=> u===state.formSelected? null : u); });
  state.formation[row][idx] = state.formSelected;
  state.formSelected = null;
  render();
}
function clearSlot(row, idx){ state.formation[row][idx] = null; render(); }

/* ============ BATTLE SETUP ============ */
function baseUnitDefaults(){
  return {
    status:null, shield:false, taunt:0,
    dodge:0, burnOnHit:0, stunOnHit:0, regen:0, slowImmune:false,
    firstHitReduction:false, firstHitUsed:false,
    missChance:0, backfireChance:0, burnImmune:false, stunImmune:false,
    critBonus:0, baneElem:null, resilient:false, critVulnerability:0,
    gambitFirstCrit:false, gambitFirstCritUsed:false,
    attackElements:[], hybrid:false, traitDodge:0, traitRegen:0, traitSlowImmune:false,
    plating:null, platingPct:0,
    corruption:0, glitchChance:0, defectChance:0,
    elements:[], synergyLabel:null,
  };
}
const STAT_BASE_KEY = { atk:'bAtk', def:'bDef', hp:'bHp', spd:'bSpd' };

/* Snapshot the pre-terrain stats so the layer can be recomputed when the field turns. */
function captureRaw(unit){
  unit.rHp = unit.bHp; unit.rAtk = unit.bAtk; unit.rDef = unit.bDef; unit.rSpd = unit.bSpd;
  unit.rSkillMaxCd = unit.skillMaxCd;
}
/* Wipe the old terrain's effects and lay the new one on top of the raw stats. */
function reapplyTerrain(unit, terrain){
  if(unit.rHp === undefined) captureRaw(unit);
  unit.bHp = unit.rHp; unit.bAtk = unit.rAtk; unit.bDef = unit.rDef; unit.bSpd = unit.rSpd;
  unit.skillMaxCd = unit.rSkillMaxCd;
  unit.missChance = 0; unit.backfireChance = 0;
  if(!(unit.hybrid && unit.attackElements && unit.attackElements.indexOf('fire')>=0)) unit.burnImmune = false;
  applyTerrainToUnit(unit, terrain);
}
function applyTerrainToUnit(unit, terrain){
  if(unit.rHp === undefined) captureRaw(unit);
  const m = terrain.mods;
  if(m.buffElem && unit.elements.includes(m.buffElem)){
    const k = STAT_BASE_KEY[m.buffStat]; unit[k] = Math.round(unit[k]*(1+m.buffPct));
  }
  if(m.debuffElem && unit.elements.includes(m.debuffElem)){
    const k = STAT_BASE_KEY[m.debuffStat]; unit[k] = Math.round(unit[k]*(1-m.debuffPct));
  }
  if(m.missElem && unit.elements.includes(m.missElem)) unit.missChance = m.missChance;
  if(m.backfireElem && unit.elements.includes(m.backfireElem)) unit.backfireChance = m.backfireChance;
  if(m.immuneElem && unit.elements.includes(m.immuneElem) && m.immuneStatus==='burn') unit.burnImmune = true;
  if(m.cdPenalty) unit.skillMaxCd += m.cdPenalty;
}

/* Recomputes the row-synergy layer on top of base stats. Returns {front,back} labels. */
function refreshSynergies(units, initial){
  const labels = { front:null, back:null };
  ['front','back'].forEach(row=>{
    const living = units.filter(u=>u.row===row && !u.fainted);
    const infos = computeRowSynergies(living.map(u=>u.elements)).map(synergyInfo);
    labels[row] = infos.length ? infos.map(synergyLabelText).join(' · ') : null;
    units.filter(u=>u.row===row).forEach(u=>{
      // reset the synergy-derived layer (terrain- and trait-derived flags are re-laid below)
      u.dodge=0; u.burnOnHit=0; u.stunOnHit=0; u.regen=0; u.slowImmune=false; u.firstHitReduction=false;
      let atk=u.bAtk, def=u.bDef, hp=u.bHp, spd=u.bSpd;
      infos.forEach(info=>{
        if(info.statKey==='atk') atk = Math.round(atk*(1+info.bonus));
        if(info.statKey==='def') def = Math.round(def*(1+info.bonus));
        if(info.statKey==='hp')  hp  = Math.round(hp *(1+info.bonus));
        if(info.statKey==='spd') spd = Math.round(spd*(1+info.bonus));
        if(info.flavor){
          const f = info.flavor;
          if(f.type==='dodge') u.dodge = Math.max(u.dodge, f.val);
          if(f.type==='burnOnHit') u.burnOnHit = Math.max(u.burnOnHit, f.val);
          if(f.type==='stunOnHit') u.stunOnHit = Math.max(u.stunOnHit, f.val);
          if(f.type==='regen') u.regen = Math.max(u.regen, f.val);
          if(f.type==='slowImmune') u.slowImmune = true;
          if(f.type==='firstHitReduction') u.firstHitReduction = true;
        }
      });
      // innate hybrid traits survive every recompute
      if(u.traitDodge) u.dodge = Math.max(u.dodge, u.traitDodge);
      if(u.traitRegen) u.regen = Math.max(u.regen, u.traitRegen);
      if(u.traitSlowImmune) u.slowImmune = true;
      u.atk=atk; u.def=def; u.spd=spd; u.maxHp=hp;
      if(initial) u.hp = hp; else u.hp = Math.min(u.hp, u.maxHp);
      u.synergyLabel = labels[row];
    });
  });
  return labels;
}
/* Recompute + log any change. Called after shifts and after any faint. */
function applySynergyRefresh(){
  const b = state.battle; if(!b) return;
  const labels = refreshSynergies(b.playerUnits, false);
  ['front','back'].forEach(row=>{
    const before = b.synLabels[row], after = labels[row];
    if(before !== after){
      if(after) logMsg(`✨ ${row.toUpperCase()} line locks in: ${after}!`);
      else logMsg(`💢 ${row.toUpperCase()} line synergy broken.`);
    }
  });
  b.synLabels = labels;
}

/* ---- mentor bonds ----
   Pair the highest- and lowest-level deployed units, working inward, and any
   pair that clears the level gap becomes a bond: the rookie earns bonus EXP
   from the fight, the veteran gets a small permanent-for-the-battle ATK edge
   from having to fight carefully around a partner who can't yet. A unit is in
   at most one bond. Called from buildPlayerUnits before refreshSynergies runs,
   so the veteran's buff feeds the row-synergy math like any other base stat. */
const MENTOR_LEVEL_GAP = 8;          // minimum level gap to form a bond
const MENTOR_ROOKIE_EXP_BONUS = 0.5; // +50% EXP for the rookie half of a bond
const MENTOR_VETERAN_BUFF = 0.05;    // +5% ATK for the veteran half of a bond
function applyMentorBonds(units){
  const byLevel = units.slice().sort((a,b)=>a.level-b.level);
  let lo = 0, hi = byLevel.length-1;
  while(lo < hi){
    const rookie = byLevel[lo], veteran = byLevel[hi];
    if(veteran.level - rookie.level < MENTOR_LEVEL_GAP) break;   // sorted: no remaining pair can clear the gap either
    rookie.mentorRookie = true; rookie.mentorPartnerId = veteran.id;
    veteran.mentorVeteran = true; veteran.mentorPartnerId = rookie.id;
    veteran.bAtk = Math.round(veteran.bAtk * (1 + MENTOR_VETERAN_BUFF));
    lo++; hi--;
  }
}

/* ---- Battle-Forged Bonds ----
   Tracked by SPECIES pair, not individual monster uid — fusion and ascension
   both mint a brand new uid for their result (see doFuse()/newMonster()), so
   two individual monsters can never reliably be "the same pair" across a
   whole campaign. A species pair can: an emberling+aqualing bond keeps
   counting no matter which individual emberling and aqualing currently fill
   those roster slots, survives either one evolving into a Prime or an
   Ascended form (tier changes, speciesId doesn't), and only genuinely breaks
   if one half splices into a hybrid (a deliberate, rare transformation that
   changes its speciesId outright).
   Counted once per WIN for every pair of player units that were both
   deployed and both still standing when the fight ended — see endBattle().
   A loss can never contribute: checkBattleEnd()'s lose condition is every
   player unit fainted, so there are never two survivors to pair up. Once a
   pair has fought and survived together BOND_FORGE_THRESHOLD times, the
   passive is live: both units get a small ATK/DEF edge any time they're
   deployed together, applied here (before refreshSynergies, like the mentor
   veteran buff) so it's already baked into the row-synergy math. Deliberately
   quiet — no progress bar, just a small badge once a bond is actually live,
   mirroring the existing mentor-bond icons. */
const BOND_FORGE_THRESHOLD = 5;     // battles fought together & survived, to forge a bond
const BOND_FORGE_ATK_BONUS = 0.04;  // +4% ATK to both, per active forged pairing
const BOND_FORGE_DEF_BONUS = 0.04;  // +4% DEF to both, per active forged pairing
function bondPairKey(idA, idB){ return idA < idB ? idA+'|'+idB : idB+'|'+idA; }
function bondCountFor(speciesA, speciesB){
  return (state.bondCounts && state.bondCounts[bondPairKey(speciesA, speciesB)]) || 0;
}
function applyBattleBonds(units){
  const withSpecies = units.filter(u=>u.speciesId);
  for(let i=0;i<withSpecies.length;i++){
    for(let j=i+1;j<withSpecies.length;j++){
      const a = withSpecies[i], b = withSpecies[j];
      if(bondCountFor(a.speciesId, b.speciesId) < BOND_FORGE_THRESHOLD) continue;
      a.bAtk = Math.round(a.bAtk * (1+BOND_FORGE_ATK_BONUS)); a.bDef = Math.round(a.bDef * (1+BOND_FORGE_DEF_BONUS));
      b.bAtk = Math.round(b.bAtk * (1+BOND_FORGE_ATK_BONUS)); b.bDef = Math.round(b.bDef * (1+BOND_FORGE_DEF_BONUS));
      a.battleBond = true; b.battleBond = true;
    }
  }
}
/* Called once from endBattle()'s win branch: every pair of player units that
   survived to see the win shares one more fight together. */
function recordBattleBonds(survivors){
  state.bondCounts = state.bondCounts || {};
  // A hired Mercenary never mints a permanent bond — see MERCENARY CONTRACT above.
  const withSpecies = survivors.filter(u=>u.speciesId && !u.isMercenary);
  for(let i=0;i<withSpecies.length;i++){
    for(let j=i+1;j<withSpecies.length;j++){
      const key = bondPairKey(withSpecies[i].speciesId, withSpecies[j].speciesId);
      state.bondCounts[key] = (state.bondCounts[key]||0) + 1;
    }
  }
}
function buildPlayerUnits(terrain){
  const units = [];
  const councilOpt = councilLeadingOption();
  const bossFight = !!bossForStage(state.stage);
  const gambitId = (state.gambit && state.gambit.picked) || null;
  ['front','back'].forEach(row=>{
    state.formation[row].forEach(u=>{
      if(!u) return;
      const m = findMonster(u); if(!m) return;
      const st = computeStats(m);
      const tier = corrTier(st.corruption);
      const unit = Object.assign(baseUnitDefaults(), {
        id:'p_'+m.uid, side:'player', row, monsterUid:m.uid, level:m.level, speciesId:m.speciesId,
        name:st.name, emoji:st.emoji, sprite:st.sprite, element:st.element, elements:st.elements.slice(),
        attackElements:st.innate.slice(), hybrid:st.hybrid, skillName:st.skill,
        bHp:st.hp, bAtk:st.atk, bDef:st.def, bSpd:st.spd,
        maxHp:st.hp, hp:st.hp, atk:st.atk, def:st.def, spd:st.spd,
        skillCd:0, skillMaxCd:3, fainted:false,
        corruption: st.corruption, glitchChance: tier.glitch, defectChance: tier.defect,
        trait: st.trait,
      });
      if(hasPerk('might')){ unit.bAtk = Math.round(unit.bAtk*1.06); unit.bDef = Math.round(unit.bDef*1.06); }
      if(councilOpt==='atk') unit.bAtk = Math.round(unit.bAtk*1.08);
      if(councilOpt==='def') unit.bDef = Math.round(unit.bDef*1.08);
      if(bossFight && codexBonusActive('bosses')){ unit.bAtk = Math.round(unit.bAtk*1.06); unit.bDef = Math.round(unit.bDef*1.06); }
      if(codexBonusActive('traits')) unit.bSpd = Math.round(unit.bSpd*1.03);
      if(rebirthCount()>0){
        const rm = rebirthMultiplier();
        unit.bAtk = Math.round(unit.bAtk*rm); unit.bDef = Math.round(unit.bDef*rm);
        unit.bHp  = Math.round(unit.bHp *rm); unit.bSpd = Math.round(unit.bSpd*rm);
      }
      const bless = activeBlessing();
      if(bless==='fire')   unit.bAtk = Math.round(unit.bAtk*1.10);
      if(bless==='earth')  unit.bDef = Math.round(unit.bDef*1.12);
      if(bless==='volt')   unit.bSpd = Math.round(unit.bSpd*1.10);
      if(bless==='nature') unit.traitRegen = Math.max(unit.traitRegen, 0.02);
      if(bless==='wind')   unit.traitDodge = Math.max(unit.traitDodge, 0.08);
      if(bless==='water' && unit.row==='front') unit.shield = true;
      if(hasMod('corrosion')) applyRust(unit, 20);
      /* Loadout Gambit: a one-battle, self-chosen edge (see rollGambitChoices/
         GAMBITS). Stat tweaks land on the b* base fields so refreshSynergies
         (called below) folds them into the row-synergy math correctly. */
      if(gambitId==='opening_strike' && row==='front') unit.gambitFirstCrit = true;
      if(gambitId==='bulwark') unit.bDef = Math.round(unit.bDef*1.10);
      if(gambitId==='adrenaline'){ unit.bSpd = Math.round(unit.bSpd*1.15); unit.critVulnerability = (unit.critVulnerability||0) + 0.05; }
      if(st.trait){
        if(st.trait.key==='keen') unit.critBonus = 0.08;
        if(st.trait.key==='bane') unit.baneElem = st.trait.elem;
        if(st.trait.key==='resilient') unit.resilient = true;
        if(st.trait.key==='quickstart') unit.skillMaxCd = Math.max(1, unit.skillMaxCd-1);
      }
      if(st.hybrid){
        st.innate.forEach(e=>{
          const t = ELEM_TRAIT[e]; if(!t) return;
          if(t.burnImmune) unit.burnImmune = true;
          if(t.slowImmune) unit.traitSlowImmune = true;
          if(t.stunImmune) unit.stunImmune = true;
          if(t.regen) unit.traitRegen = Math.max(unit.traitRegen, t.regen);
          if(t.dodge) unit.traitDodge = Math.max(unit.traitDodge, t.dodge);
          if(t.bulwark) unit.shield = true;
        });
      }
      /* Draft Augments: permanent, per-legion, chosen picks (see
         rollAugmentChoices/AUGMENTS above). Applied last, after every trait
         and Gambit modifier above, so a plain assignment earlier in this
         function (like the keen trait's unit.critBonus=0.08) can never
         clobber it — these only ever add on top of whatever's already there. */
      if(hasAugment('first_strike')) unit.gambitFirstCrit = true;
      if(hasAugment('pre_charged')) unit.skillMaxCd = Math.max(1, unit.skillMaxCd-1);
      if(hasAugment('hardened_line')) unit.bDef = Math.round(unit.bDef*1.08);
      if(hasAugment('keen_edge')) unit.critBonus = (unit.critBonus||0) + 0.06;
      applyTerrainToUnit(unit, terrain);
      units.push(unit);
    });
  });
  if(hasMod('vanguard')) units.forEach(u=>{ u.row='front'; });
  applyMentorBonds(units);
  applyBattleBonds(units);
  refreshSynergies(units, true);
  return units;
}

function pickEnemySpecies(adapted){
  const lockedElem = doctrineElement();
  const weights = ENEMY_IDS.map(id=>{
    const e = ENEMY_SPECIES[id].element;
    let w = 1;
    if(adapted){
      if(ELEM_BEATS[e]===adapted) w = 5;         // hard-counters the player's recent favourite
      else if(ELEM_BEATS[adapted]===e) w = 0.3;  // food for the player's recent favourite
    }
    return w * doctrineWeight(e, lockedElem);    // and a slower, permanent nudge from Doctrine
  });
  const total = weights.reduce((s,w)=>s+w,0);
  let r = Math.random()*total;
  for(let i=0;i<ENEMY_IDS.length;i++){ r -= weights[i]; if(r<=0) return ENEMY_IDS[i]; }
  return ENEMY_IDS[ENEMY_IDS.length-1];
}

function buildEnemyUnits(stage, terrain, adapted, usePlating, platingElem){
  platingElem = platingElem || adapted;
  if(tutorialActive()) return buildTutorialEnemies(terrain);
  const boss = bossForStage(stage);
  if(boss) return buildBossUnits(stage, terrain, adapted, usePlating, boss, platingElem);
  const count = Math.min(3 + Math.floor((stage-1)/2), 6);
  let mult = 1 + (stage-1)*0.14;
  if(isEliteStage(stage)) mult *= 1.25;
  if(state.detour) mult *= DETOUR_STAT_MULT;
  if(state.undercroft) mult *= UNDERCROFT_STAT_MULT;
  const units = [];
  for(let i=0;i<count;i++){
    const id = pickEnemySpecies(adapted);
    const sd = ENEMY_SPECIES[id];
    const row = i<3 ? 'front' : 'back';
    const hp = Math.round(sd.base.hp*mult);
    const unit = Object.assign(baseUnitDefaults(), {
      id:'e_'+i+'_'+id, side:'enemy', row, speciesKey:id,
      name:sd.name, emoji:sd.emoji, sprite:sd.sprite, element:sd.element, elements:[sd.element], attackElements:[sd.element], skillName:sd.skill,
      bHp:hp, bAtk:Math.round(sd.base.atk*mult), bDef:Math.round(sd.base.def*mult), bSpd:Math.round(sd.base.spd*mult),
      maxHp:hp, hp:hp,
      atk:Math.round(sd.base.atk*mult), def:Math.round(sd.base.def*mult), spd:Math.round(sd.base.spd*mult),
      skillCd:0, skillMaxCd:3, fainted:false,
    });
    if(usePlating && platingElem){ unit.plating = platingElem; unit.platingPct = platingPct(); }
    applyTerrainToUnit(unit, terrain);
    if(hasMod('blitz')) unit.bSpd = Math.round(unit.bSpd*2);
    unit.atk = unit.bAtk; unit.def = unit.bDef; unit.spd = unit.bSpd;
    unit.maxHp = unit.bHp; unit.hp = unit.bHp;
    units.push(unit);
  }
  applyAceRoll(units, stage);
  applyVanguardRoll(units, stage);
  return units;
}

/* ---- Rustbound Aces: a rare, named elite that can appear embedded in an
   otherwise ordinary (non-elite, non-boss) wave — noticeably tougher than
   its squadmates, but not a full commander fight (no shield, no pylons).
   Picks one already-built unit and scales it up in place so headcount and
   pacing stay exactly what the stage would normally throw at you; the only
   thing that changes is one member of the wave is suddenly a real threat.
   Guaranteed to drop its own species' part on death (grantAceDrop, wired
   through onEnemyFainted — see applyDamage/tickStatusStart below) whether
   or not the battle is ultimately won. */
const ACE_MIN_STAGE = 3;      // keep the first couple of onboarding stages calm
const ACE_CHANCE = 0.18;      // per eligible wave
const ACE_MULT = { hp:1.7, atk:1.35, def:1.3, spd:1.1 };
const ACE_TITLES = ['Ironclad','Voltbound','Cinderborn','Frostmarked','Thornlord','Galeshear','Rustking','Scraplord','Bloodwire','Ashwarden'];
function applyAceRoll(units, stage){
  if(stage < ACE_MIN_STAGE || isEliteStage(stage) || units.length < 2) return;
  if(Math.random() >= ACE_CHANCE) return;
  const u = units[Math.floor(Math.random()*units.length)];
  u.isAce = true;
  u.name = ACE_TITLES[Math.floor(Math.random()*ACE_TITLES.length)] + ' ' + u.name;
  u.bHp = Math.round(u.bHp*ACE_MULT.hp); u.bAtk = Math.round(u.bAtk*ACE_MULT.atk);
  u.bDef = Math.round(u.bDef*ACE_MULT.def); u.bSpd = Math.round(u.bSpd*ACE_MULT.spd);
  u.maxHp = u.bHp; u.hp = u.bHp; u.atk = u.bAtk; u.def = u.bDef; u.spd = u.bSpd;
}
/* Guaranteed drop when an Ace falls: its own species' part, marked with the
   "_ace" suffix (see partInfo/isAceKey) so it shows a distinct badge and
   name everywhere a normal part would — same 14-part bay cap as any other
   drop, so a full bay still quietly denies it rather than special-casing
   around the limit. */
function grantAceDrop(unit){
  if(!unit || !unit.isAce || unit.aceLootGiven || !unit.speciesKey) return;
  unit.aceLootGiven = true;
  if(state.parts.length>=14){ logMsg(`⭐ ${unit.name} falls, but the salvage bay is full — its part is lost.`); return; }
  const drop = { uid: uid(), key: unit.speciesKey+ACE_SUFFIX };
  state.parts.push(drop);
  logMsg(`⭐ ${unit.name} falls and leaves behind ${partInfo(drop.key).name}!`);
  noteTrophy('trophyAce', unit);
}
/* Rolled specifically on Elite Waves (see buildEnemyUnits) — Aces skip elite
   stages entirely, so this never competes with one for the same wave. Marks
   one unit as the escort's Vanguard: noticeably tougher, and clearly named
   so it can be read and planned around before the fight even starts (Threat
   Preview will surface it if it happens to be the fastest on the field). */
const VANGUARD_CHANCE = 0.35;
const VANGUARD_MULT = { hp:1.5, atk:1.25, def:1.2, spd:1.05 };
function applyVanguardRoll(units, stage){
  if(!isEliteStage(stage) || units.length < 2) return;
  if(units.some(u=>u.isAce)) return;   // belt-and-suspenders; Aces already never roll on elite stages
  if(Math.random() >= VANGUARD_CHANCE) return;
  const u = units[Math.floor(Math.random()*units.length)];
  u.isVanguard = true;
  u.name = 'Vanguard ' + u.name;
  u.bHp = Math.round(u.bHp*VANGUARD_MULT.hp); u.bAtk = Math.round(u.bAtk*VANGUARD_MULT.atk);
  u.bDef = Math.round(u.bDef*VANGUARD_MULT.def); u.bSpd = Math.round(u.bSpd*VANGUARD_MULT.spd);
  u.maxHp = u.bHp; u.hp = u.bHp; u.atk = u.bAtk; u.def = u.bDef; u.spd = u.bSpd;
}
/* The Vanguard Bounty: unlike an Ace, this is NOT guaranteed. It only pays
   out if the Vanguard is the very last enemy left standing on its side at
   the moment it falls — checked live against the battle's current state, so
   it correctly resolves however the kill actually happened. Dying first or
   mid-pack while escorts remain gives nothing at all. */
function grantVanguardBounty(unit){
  if(!unit || !unit.speciesKey) return;
  if(state.parts.length>=14){ logMsg(`🛡️ ${unit.name} falls at last — but the salvage bay is full and the trophy is lost.`); return; }
  const drop = { uid: uid(), key: unit.speciesKey+VANGUARD_SUFFIX };
  state.parts.push(drop);
  logMsg(`🛡️ ${unit.name} falls — the very last of its escort — you claim ${partInfo(drop.key).name}!`);
  noteTrophy('trophyVanguard', unit);
}
function checkVanguardBounty(unit){
  if(!unit.isVanguard || unit.vanguardBountyGiven) return;
  const b = state.battle; if(!b) return;
  const stillStanding = b.enemyUnits.some(u=>u.id!==unit.id && !u.fainted);
  unit.vanguardBountyGiven = true;   // one-shot check either way: a fainted unit can never re-trigger it
  if(stillStanding) return;
  grantVanguardBounty(unit);
}
/* Every enemy-fainted site (a normal hit via applyDamage, a burn tick via
   tickStatusStart, a Cascade Overkill splash) routes through here so the
   shield check and the Ace/Vanguard payouts never need duplicating. */
function onEnemyFainted(unit){
  updateBossShield();
  if(unit.isAce) grantAceDrop(unit);
  checkVanguardBounty(unit);
}

/* ============ TROPHY CASE ============
   A pure-fluff Hub screen — nothing here changes how anyone plays. Deepest
   Reach and the Archive already keep their own permanent record (bestDepth,
   state.archive); this just gives them a second, more celebratory home.
   Win streak and the two named-elite kills did NOT already keep a permanent
   record — state.streak resets to 0 on a single loss, and an Ace/Vanguard's
   part is an ordinary, purgeable/forgeable salvage-bay item with no memory
   of its own — so those three get one small high-water-mark field apiece,
   updated at the exact same spot the ordinary version of the event already
   fires (grantAceDrop/grantVanguardBounty above; the streak tail below). */
function noteTrophy(field, unit){
  const cur = state[field];
  if(!cur || state.stage > cur.stage){
    state[field] = { name: unit.name, speciesKey: unit.speciesKey||null, stage: state.stage };
  }
}
function goTrophyCase(){ state.screen='trophycase'; sfx('click'); render(); }
function renderTrophyCase(){

    { emoji:'🔥', label:'Longest Win Streak', value: streak>0?(streak+' in a row'):'—',
      note: streak>0?'The best run of consecutive stage wins this legion has ever put together.':'Win a couple of stages back to back to get this started.' },
    { emoji:'⭐', label:'Toughest Ace Felled', value: ace?ace.name:'—',
      note: ace?('Brought down at Stage '+ace.stage+'.'):'Rare named elites start turning up a few stages in — none felled yet.' },
    { emoji:'🛡️', label:'Toughest Vanguard Felled', value: vanguard?vanguard.name:'—',

      <div class="dim" style="font-size:13px; margin-top:2px;">${escapeHtml(c.note)}</div>
    </div>`).join('');
  const tally = archiveTheoryTally();

  }).join('');
  return `

  <div class="panel">

    ${theoryLines}
    <button class="btn small" style="margin-top:8px;" onclick="goArchive()">📜 Open the full Archive</button>
  </div>
  <div class="panel">
